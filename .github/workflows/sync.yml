# ob63: de pins bijhouden is werk dat niemand op zijn lijstje heeft staan.
#
# Gemeten op 8 september 2026: de arch-pin van de site liep 14 registryversies
# achter en de Obeya-pin 14 commits, inclusief een complete inhoudsronde. De
# driftpoorten deden hun werk, maar een poort die alleen rood wordt, verplaatst
# het werk; hij doet het niet.
#
# Deze workflow draait de sync en opent er een PR van. Bewust GEEN automatische
# merge: wat er binnenkomt is inhoud die bij de klant terechtkomt, en dat hoort
# iemand te zien. Wel automatisch aangemaakt, want dat is het deel dat blijft
# liggen.
#
# Geen cross-repo token nodig: elke repo werkt zichzelf bij met de ingebouwde
# GITHUB_TOKEN. Arch hoeft dus niets te weten van zijn consumenten.
name: sync

on:
  schedule:
    # Ná de eigen driftpoort, zodat een rode poort en de bijbehorende PR niet
    # door elkaar heen lopen.
    - cron: '58 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Allebei in een eigen submap: actions/checkout kan niet buiten de
      # workspace schrijven, en een zusterrepo binnen de repo zou door
      # `git add -A` meegecommit worden.
      - name: Check out het dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: eigen

      - name: Secret aanwezig? (anders harde failure)
        env:
          TOKEN: ${{ secrets.AGENT_ARCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Sync kan niet draaien — repo-secret AGENT_ARCH_TOKEN ontbreekt (leesrechten op AgenticTeamAI/agent-architecture)."
            exit 1
          fi

      - name: Check out agent-architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AgenticTeamAI/agent-architecture
          token: ${{ secrets.AGENT_ARCH_TOKEN }}
          path: arch
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"


      - name: Pin bijwerken
        working-directory: eigen
        env:
          ARCH_PATH: ${{ github.workspace }}/arch
        run: |
          set -euo pipefail
          python3 scripts/sync-schema.py
          python3 scripts/build.py

      # Alleen een PR als er iets veranderd is. Een lege PR is ruis, en ruis
      # zorgt ervoor dat de volgende niet meer gelezen wordt.
      - name: PR openen als er iets veranderd is
        working-directory: eigen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "✅ de pin is actueel — niets te doen"
            exit 0
          fi

          VERSIE=$(jq -er .registryVersion agent-architecture.lock.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAK="sync/registry-$VERSIE"
          git checkout -b "${TAK}"
          git add -A
          # -s: de DCO-poort eist een Signed-off-by op élke commit in een PR
          # (dco.yml). Zonder die vlag kwam elke sync-PR met een rode check
          # binnen — en een poort die altijd rood staat, leest niemand meer.
          # Naam en adres komen uit de git-config hierboven, dus de regel
          # noemt github-actions[bot] en dat is precies wie het ondertekent.
          git commit -s -m "chore(sync): registry $VERSIE" \
                     -m "Automatisch bijgewerkt door .github/workflows/sync.yml. De diff is inhoud die bij de klant terechtkomt — lees hem."

          # De tak heet naar de registryVERSIE, maar de pin bevat ook een
          # arch-COMMIT die vaker wijzigt. Twee syncs voor dezelfde versie zijn
          # dus normaal — en elke tweede liep stuk:
          #
          #   ! [rejected] sync/registry-1.89.0 (stale info)
          #
          # `--force-with-lease` zonder waarde zoekt de lease bij de UPSTREAM
          # van de tak, en `git checkout -b` zet die niet. Dan weigert git,
          # óók als de tak gewoon bestaat en niemand eraan heeft gezeten. De
          # sync faalde daardoor elke dag opnieuw tot de versie een keer
          # opsprong — hij herstelde zichzelf schijnbaar, en juist dat maakte
          # het onzichtbaar (9 en 10 september 2026, gevonden via
          # /intern/infra).
          #
          # Daarom de expliciete vorm: haal de tak op en zeg wélke waarde we
          # verwachten. Bestaat hij niet, dan is de verwachting "afwezig" en
          # klopt dat ook. Bewust geen `--force`: heeft iemand er met de hand
          # op gecommit, dan hoort deze push te weigeren — nagemeten, dat doet
          # hij nog steeds.
          git fetch origin "+refs/heads/${TAK}:refs/remotes/origin/${TAK}" 2>/dev/null || true
          BASIS=$(git rev-parse --quiet --verify "refs/remotes/origin/${TAK}" || true)
          git push -u origin "${TAK}" --force-with-lease="${TAK}:${BASIS}"

          # Staat er al een PR op DEZE tak, dan is die door de push hierboven
          # bijgewerkt en zijn we klaar. Dit stond eerst als een zoekopdracht
          # op de titel — en die gaf altijd 0, omdat de haakjes in
          # "chore(sync)" de zoekparser van GitHub breken. Gevolg: de guard
          # sloeg nooit aan, `gh pr create` liep daarna tegen "a pull request
          # for branch ... already exists", en de run werd rood ná een
          # geslaagde push. Nagemeten op 11-09-2026: zoekvorm 0, `--head` 1.
          # `--head` is exact en heeft geen zoeksyntaxis nodig.
          if [ "$(gh pr list --state open --head "${TAK}" --json number --jq 'length')" != "0" ]; then
            echo "::notice::De open PR voor ${TAK} is bijgewerkt door deze push."
            exit 0
          fi

          # Een ándere sync-PR open laten staan: twee open sync-PR's zijn
          # verwarrend en dan wordt de oudste genegeerd. Op de takname
          # filteren, niet op de titel — zelfde reden als hierboven.
          ANDERE=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/"))] | length')
          if [ "$ANDERE" != "0" ]; then
            echo "::notice::Er staat al een andere sync-PR open; tak ${TAK} is gepusht maar er is geen tweede PR geopend."
            exit 0
          fi
          gh pr create --title "chore(sync): registry $VERSIE" --body "$(printf '%s\n' \
            'De pin liep achter. Deze PR is automatisch gemaakt door `.github/workflows/sync.yml`.' \
            '' \
            '**Lees de diff.** Wat hier binnenkomt is inhoud die bij de klant terechtkomt.' \
            'Daarom wordt deze PR wel automatisch aangemaakt maar nooit automatisch gemerged.')"
