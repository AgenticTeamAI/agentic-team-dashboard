/* f55 — "Beschikbaar voor jouw team": de vaste taken die bij je modules horen,
 * met "Zet aan".
 *
 * De werkruimte-instantie kent de templates van je licentie (dezelfde bron als
 * get_werkronde en ritmetaak_herstel) en levert ze via
 *   GET  /dashboard/ritmetaken/catalogus   (lezen, ook met de daglink)
 *   POST /dashboard/ritmetaken/activeer    { sleutel }  (schrijven)
 * Aanzetten maakt de rij precies zoals de Coördinator dat doet, met de juiste
 * instructie; staat hij er al, dan gaat alleen Actief aan. Geen dubbele taken.
 *
 * Eén keer ophalen per sessie, bij het openen van Vaste taken — geen polling.
 * Kent de instantie de route (nog) niet, dan verschijnt het blok gewoon niet. */

let vtCatalogus = { sleutel: null, belofte: null, data: null };

function laadCatalogus(ctx) {
  const bron = ctx && ctx.bron;
  if (!bron || !bron.instantieUrl || typeof fetchWerkruimte !== "function") return Promise.resolve(null);
  const sleutel = bron.instantieUrl;
  if (vtCatalogus.sleutel === sleutel) return vtCatalogus.belofte || Promise.resolve(vtCatalogus.data);
  vtCatalogus = { sleutel, data: null, belofte: null };
  vtCatalogus.belofte = fetchWerkruimte(bron, "/dashboard/ritmetaken/catalogus")
    .then((b) => { vtCatalogus.data = b && Array.isArray(b.templates) ? b.templates : null; return vtCatalogus.data; })
    .catch(() => { vtCatalogus.data = null; return null; })
    .finally(() => { vtCatalogus.belofte = null; });
  return vtCatalogus.belofte;
}

function _resetCatalogus() { vtCatalogus = { sleutel: null, belofte: null, data: null }; }

function catalogusHtml(ctx, templates) {
  const kan = magDomeinBewerken(ctx, "ritmetaken").ok;
  const open = templates.filter(t => t && t.sleutel && !t.actief);
  if (!open.length) {
    return templates.length ? `<section class="vt-vak vt-catalogus"><h2>Beschikbaar voor jouw team</h2>
      <p class="footnote">Alle vaste taken die bij jouw modules horen, staan aan.</p></section>` : "";
  }
  const rij = (t) => {
    const wie = t.specialist && (t.specialist.naam || t.specialist.slug);
    const meta = [wie, t.ritme_advies ? ritmeLabelVan(t.ritme_advies) : ""].filter(Boolean).join(" · ");
    const knop = kan
      ? `<button type="button" class="knop-mini bedien-knop vt-zet-aan" data-vt-zet-aan="${esc(t.sleutel)}">${t.bestaat ? "Zet weer aan" : "Zet aan"}</button>`
      : "";
    return `<li class="vt-catalogus-rij" data-vt-sleutel="${esc(t.sleutel)}"><div>
      <p class="vt-titel">${esc(t.klantnaam || t.sleutel)}</p>
      ${t.beschrijving ? `<p class="footnote">${esc(t.beschrijving)}</p>` : ""}
      ${meta ? `<p class="vt-meta">${esc(meta)}</p>` : ""}</div>${knop}</li>`;
  };
  return `<section class="vt-vak vt-catalogus"><h2>Beschikbaar voor jouw team</h2>
    <p class="footnote">Vaste taken die bij jouw modules horen en nog niet aanstaan.${kan ? " Aanzetten kan hier; je team pakt ze op bij het volgende werkmoment." : " Aanzetten kan na inloggen."}</p>
    <ul class="vt-catalogus-lijst">${open.map(rij).join("")}</ul></section>`;
}

function ritmeLabelVan(ritme) {
  if (typeof ritmeLabel === "function") return ritmeLabel(ritme);
  return (typeof RITME_KLANTTAAL !== "undefined" && RITME_KLANTTAAL[ritme]) || ritme;
}

/* Tekent het blok in `slot` zodra de catalogus er is, en handelt "Zet aan" af. */
function wireCatalogus(slot, ctx) {
  if (!slot) return;
  laadCatalogus(ctx).then((templates) => {
    if (!templates || !slot.isConnected) return;
    slot.innerHTML = catalogusHtml(ctx, templates);
  });
  slot.addEventListener("click", async (e) => {
    const knop = e.target.closest && e.target.closest("[data-vt-zet-aan]");
    if (!knop) return;
    const sleutel = knop.getAttribute("data-vt-zet-aan");
    const t = (vtCatalogus.data || []).find(x => x.sleutel === sleutel);
    if (!t) return;
    knop.disabled = true;
    const li = knop.closest("li");
    if (li) li.setAttribute("aria-busy", "true");
    try {
      const antwoord = await schrijfWerkruimte(ctx.bron, "POST", "/dashboard/ritmetaken/activeer", { sleutel });
      const id = antwoord && antwoord.entry && antwoord.entry.entryId;
      const wasEr = !!t.bestaat;
      t.bestaat = true; t.actief = true;
      await verwerkAntwoord(ctx, "ritmetaken", antwoord, { focus: "[data-vt-zet-aan], .vt-catalogus h2" });
      const naam = t.klantnaam || sleutel;
      const ritme = t.ritme_advies ? ritmeLabelVan(t.ritme_advies).toLowerCase() : "";
      meld(`‘${naam}’ staat aan${ritme ? `, ${ritme}` : ""}. Je team pakt hem op bij het volgende werkmoment.`, id ? {
        actie: wasEr
          ? ongedaanPatch(ctx, "ritmetaken", id, { Actief: false })
          : { label: "Ongedaan maken", doe: async () => {
            await ongedaanNieuw(ctx, "ritmetaken", id).doe();
            t.bestaat = false; t.actief = false;
          } },
      } : {});
    } catch (fout) {
      knop.disabled = false;
      if (li) li.removeAttribute("aria-busy");
      meld("Aanzetten lukte niet: " + ((fout && fout.message) || "probeer het opnieuw."), { fout: true });
    }
  });
}

if (typeof module !== "undefined") {
  module.exports = { laadCatalogus, catalogusHtml, wireCatalogus, _resetCatalogus };
}

/* #/hulp → { sectie: null }, #/hulp/daglink → { sectie: "daglink" }, anders null. */
function hulpDoel(hash) {
  const m = /^#\/hulp(?:\/([a-z-]+))?\/?$/.exec(String(hash || ""));
  return m ? { sectie: m[1] || null } : null;
}

/* Een "Hoe werkt dit?"-link voor bovenaan een scherm. */
function hoeWerktDitHtml(sectie, tekst = "Hoe werkt dit?") {
  return `<a class="hoe-werkt-dit" href="#/hulp/${sectie}"><span aria-hidden="true">?</span> ${esc(tekst)}</a>`;
}

function hulpZoekTekst(el) { return (el.textContent || "").replace(/\s+/g, " ").toLowerCase(); }

/* ctx mag null zijn: dan is dit de lege staat (geen daglink, geen login). */
function renderHulp(el, ctx, { sectie = null } = {}) {
  const secties = hulpSecties(ctx);
  const klaar = ctx && typeof klaarRegelHtml === "function" && ctx.bundle ? klaarRegelHtml(ctx) : "";
  el.innerHTML = `<div class="hulp">
    <h2 class="hulp-titel" tabindex="-1">Hoe werkt je team?</h2>
    <label class="hulp-zoek"><span class="sr-only">Zoek in de hulp</span>
      <input type="search" data-hulp-zoek placeholder="Zoek in de hulp, bijvoorbeeld ‘daglink’" autocomplete="off"></label>
    ${klaar}
    <section class="hulp-plaat-vak" data-hulp-intro>${HULP_PLAAT}</section>
    ${secties.map(([id, titel, html]) => `<details class="hulp-sectie" id="hulp-${id}" data-hulp-sectie="${id}"${id === sectie ? " open" : ""}>
      <summary>${esc(titel)}</summary><div class="hulp-binnen">${html()}</div></details>`).join("")}
    <p class="hulp-niets" data-hulp-niets hidden>Niets gevonden. Probeer een ander woord.</p>
    <p class="hulp-slot">Kom je er niet uit? Zeg in Claude: <strong>‘Help me mijn team gebruiken.’</strong> Of mail <span class="hulp-adres">support@agentic-team.ai</span>.</p>
  </div>`;

  // Zoeken filtert ter plekke: de open/dicht-stand van wat je al las blijft staan.
  const zoek = el.querySelector("[data-hulp-zoek]");
  zoek.addEventListener("input", () => {
    const z = zoek.value.trim().toLowerCase();
    let raak = 0;
    for (const d of el.querySelectorAll("[data-hulp-sectie]")) {
      const past = !z || hulpZoekTekst(d).includes(z);
      d.hidden = !past;
      if (past) raak++;
      if (z && past) d.open = true;
    }
    for (const x of el.querySelectorAll("[data-hulp-intro], .kc-samenvatting")) x.hidden = !!z;
    el.querySelector("[data-hulp-niets]").hidden = raak > 0;
  });

  el.onclick = async (e) => {
    const t = e.target.closest ? e.target : null;
    if (!t) return;
    const vb = t.closest("[data-hulp-vb]");
    const stap = t.closest("[data-hulp-stap]");
    const alles = t.closest("[data-hulp-alles]");
    if (vb || stap || alles) {
      if (vb) { hulpVoorbeeld = vb.getAttribute("data-hulp-vb"); hulpStap = -1; }
      if (stap) { const n = HULP_VOORBEELDEN[hulpVoorbeeld].stappen.length; hulpStap = hulpStap < n - 1 ? hulpStap + 1 : 0; }
      if (alles) hulpStap = -1;
      const blok = el.querySelector("[data-hulp-vb-blok]");
      blok.innerHTML = hulpVoorbeeldHtml();
      const terug = blok.querySelector(vb ? `[data-hulp-vb="${hulpVoorbeeld}"]` : "[data-hulp-stap]");
      if (terug) terug.focus({ preventScroll: true });
      // De knoppen plakken bovenaan; de stap die nu aan de beurt is, komt in beeld.
      const nu = blok.querySelector("li.nu");
      if (nu && nu.scrollIntoView) nu.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    const k = t.closest("[data-vt-kopieer]");
    if (k) {
      const gelukt = await kopieerTekst(k.getAttribute("data-vt-kopieer"));
      meld(gelukt ? "Gekopieerd. Plak het in Claude." : "Kopiëren lukte niet. Selecteer de tekst en kopieer hem zelf.");
    }
  };

  if (sectie) {
    const doel = el.querySelector(`#hulp-${sectie}`);
    if (doel) {
      const kop = doel.querySelector("summary");
      if (doel.scrollIntoView) doel.scrollIntoView({ block: "start" });
      if (kop) kop.focus({ preventScroll: true });
      return;
    }
  }
  const titel = el.querySelector(".hulp-titel");
  if (titel) titel.focus({ preventScroll: true });
}

if (typeof module !== "undefined") {
  module.exports = { renderHulp, hulpDoel, hulpSecties, hoeWerktDitHtml, HULP_KETENS };
}


/* f50 — Opdracht geven in drie vragen (#/opdracht, #/opdracht/<specialist>).
 *
 * Vervangt voor acties het formulier van 21 velden: wat, wie, wanneer, en
 * optioneel waar het bij hoort. De rest zijn vaste waarden, zodat een
 * werkmoment de opdracht ook echt oppakt: werkronde.md stap 0 zoekt Status
 * Open met een agent als Eigenaar — en Eigenaar + Agent gaan altijd samen
 * (b61). Aangemaakt door is jouw naam, nooit een agent: anders telt het
 * verhaal "je team zette klaar" jouw opdracht mee.
 *
 * Alleen specialisten die al in dit team voorkomen (in je acties, vaste taken,
 * teamfeed of activatietelling), plus de Management Assistent. Een specialist
 * buiten je licentie zou de opdracht nooit oppakken, en het dashboard kent je
 * licentie verder niet. */

const OPDRACHT_NOOIT = ["orchestrator", "quality-control", "gids"];
const OPDRACHT_ALTIJD = ["management-assistent"];
const OPDRACHT_TITEL_MAX = 120;

/* {slug, naam, n} — vaakst gezien eerst. */
function beschikbareSpecialisten(ctx) {
  const schema = ctx.schema;
  const tel = new Map();
  const zag = (agent, n = 1) => { if (agent && OPDRACHT_NOOIT.indexOf(agent.slug) === -1) tel.set(agent.slug, (tel.get(agent.slug) || 0) + n); };
  const opNaam = (w) => { const naam = agentWeergaveNaam(schema, w); return naam ? schema.agents.find(a => a.displayName === naam) : null; };
  for (const r of rows(ctx.bundle, "acties") || []) {
    for (const veld of ["Agent", "Eigenaar", "Aangemaakt door", "Afgerond door"]) zag(opNaam(getField(r, veld)));
  }
  for (const t of dataRijenVan(ctx, "ritmetaken") || []) zag(opNaam(getField(t, "Agent")));
  const feed = ctx.bundle && ctx.bundle.teamfeed;
  for (const e of (feed && Array.isArray(feed.entries) ? feed.entries : [])) {
    const slug = String((e && e.data && getField(e.data, "Agent")) || "");
    zag(schema.agents.find(a => a.slug === slug) || opNaam(slug));
  }
  const act = ctx.bundle && ctx.bundle.activaties;
  for (const w of (act && Array.isArray(act.weken) ? act.weken : [])) {
    for (const [slug, n] of Object.entries(w.per_agent || {})) zag(schema.agents.find(a => a.slug === slug), Number(n) || 0);
  }
  for (const slug of OPDRACHT_ALTIJD) if (!tel.has(slug)) tel.set(slug, 0);
  return [...tel.entries()]
    .map(([slug, n]) => { const a = schema.agents.find(x => x.slug === slug); return a ? { slug, naam: a.displayName, emoji: a.emoji || "", n } : null; })
    .filter(Boolean)
    .sort((a, b) => b.n - a.n || a.naam.localeCompare(b.naam, "nl"));
}

/* Collega's: wie al eigenaar is van een actie, zonder agents en zonder jou. */
function opdrachtCollegas(ctx, ik) {
  const namen = agentNamen(ctx.schema);
  const gezien = new Map();
  for (const r of rows(ctx.bundle, "acties") || []) {
    const e = String(getField(r, "Eigenaar") || "").trim();
    if (!e || (namen && isAgentNaam(e, namen)) || (ik && naamGelijk(e, ik))) continue;
    const k = e.toLowerCase();
    if (!gezien.has(k)) gezien.set(k, e);
  }
  return [...gezien.values()].sort((a, b) => a.localeCompare(b, "nl")).slice(0, 20);
}

/* Wat er weggeschreven wordt. `wie` is {agent: naam} of {mens: naam}. */
function opdrachtData({ wat, uitleg, wie, deadline, hoortBij, ik, nu }) {
  const tekst = String(wat || "").trim();
  const eersteRegel = tekst.split("\n")[0].trim();
  const titel = eersteRegel.length > OPDRACHT_TITEL_MAX ? eersteRegel.slice(0, OPDRACHT_TITEL_MAX - 1) + "…" : eersteRegel;
  const toelichting = [tekst, String(uitleg || "").trim()].filter(Boolean).join("\n\n");
  const data = { Actie: titel.charAt(0).toUpperCase() + titel.slice(1), Status: VJ_OPEN, Type: "Taak", Prioriteit: "Normaal" };
  if (toelichting && toelichting !== titel) data.Toelichting = toelichting;
  if (wie.agent) { data.Eigenaar = wie.agent; data.Agent = wie.agent; } else if (wie.mens) data.Eigenaar = wie.mens;
  if (ik) data["Aangemaakt door"] = ik;
  if (deadline) {
    data.Deadline = deadline;
    // Het werkmoment pakt Hoog eerst. Moet het binnen twee werkdagen af, dan gaat het voor.
    if (wie.agent && werkdagenNa(nu, parseDateField(deadline)) <= 2) data.Prioriteit = "Hoog";
  }
  if (hoortBij) data.Organisatie = hoortBij;
  return data;
}

/* De regel onder "wie": wat er nu gaat gebeuren — eerlijk, ook als het blijft liggen. */
function opdrachtVerwachting(ctx, wie) {
  if (wie.mens) {
    const ik = vjIk(ctx);
    return { k: "mens", tekst: ik && naamGelijk(wie.mens, ik) ? "Het komt op je eigen lijst." : `Het komt op de lijst van ${wie.mens}.` };
  }
  if (!wie.agent) return null;
  const kc = klaarCheck(ctx);
  if (kc.stil) return { k: "let", klaar: true, tekst: `Let op: je team werkt nu niet vanzelf. Dit blijft liggen tot je team weer werkt.` };
  if (kc.wachten) return { k: "let", tekst: `Je werkmoment is net aangezet. Na de eerste nacht pakt ${wie.agent} dit op.` };
  const sporen = werkmomentSporen(ctx);
  const laatst = sporen.length ? new Date(Math.max(...sporen)) : null;
  const nu = ctx.today || new Date();
  const namen = agentNamen(ctx.schema);
  const klaar = (rows(ctx.bundle, "acties") || []).filter(r => vjTekst(r, "Status") === VJ_OPEN && namen && isAgentNaam(getField(r, "Eigenaar"), namen) && !wachtInToekomst(r, nu)).length;
  const rij = klaar >= 3 ? ` Er staan al ${klaar} opdrachten klaar; je team doet er 3 per werkmoment, Hoog eerst.` : "";
  return { k: "ok", tekst: `${wie.agent} pakt dit op bij het volgende werkmoment${laatst ? ` (laatst: ${vtWanneer(laatst, nu)})` : ""}. Het resultaat zie je bij Voor jou.${rij}` };
}

function opdrachtDoel(hash) {
  const m = /^#\/opdracht(?:\/([a-z-]+))?\/?$/.exec(String(hash || ""));
  return m ? { voor: m[1] || null } : null;
}

function opdrachtKnopHtml(ctx, { tekst = "Geef je team een opdracht", voor = null } = {}) {
  if (!ctx || !rows(ctx.bundle, "acties") || !magDomeinBewerken(ctx, "acties").ok) return "";
  return `<a class="knop blad-knop blad-knop-teamvol opdracht-knop" href="#/opdracht${voor ? "/" + voor : ""}">＋ ${esc(tekst)}</a>`;
}

/* Het concept blijft staan zolang dit tabblad open is: wie even wegklikt, is
 * zijn tekst niet kwijt. Alleen in het geheugen, geen opslag. */
let opdrachtStaat = null;

/* Een opdracht vooraf invullen en erheen gaan (f49: "Laat je team de gegevens
 * aanvullen", "Opdracht voor je team" op een organisatiepagina). */
function startOpdracht({ wat = "", uitleg = "", voor = null, hoortBij = "" } = {}, ctx) {
  const agent = voor && ctx ? ctx.schema.agents.find(a => a.slug === voor) : null;
  opdrachtStaat = { wat, uitleg, wie: agent ? { agent: agent.displayName } : {}, deadline: "", hoortBij, voorSlug: agent ? voor : null };
  window.location.hash = agent ? `#/opdracht/${voor}` : "#/opdracht";
}

function renderOpdracht(el, ctx, doel) {
  const bewerk = magDomeinBewerken(ctx, "acties");
  const kop = `<p><a class="detail-link" href="#/acties">← Acties</a></p><h2 class="opdracht-titel" tabindex="-1">Geef je team een opdracht</h2>`;
  if (!rows(ctx.bundle, "acties") || !bewerk.ok) {
    // Elders (Notion), of meekijken met de daglink: dan zeggen we waarom, en
    // wat wél kan. Het formulier tekenen zou een knop geven die niets doet.
    const waarom = !rows(ctx.bundle, "acties") ? "Je acties staan niet in je werkruimte."
      : bewerk.reden || "Met je daglink kun je meekijken, niet doorgeven.";
    const login = !bewerk.reden && rows(ctx.bundle, "acties") && typeof oauthMogelijk === "function" && oauthMogelijk()
      ? `<p><button type="button" class="knop blad-knop blad-knop-prim" data-login>Log in om door te geven</button></p>` : "";
    el.innerHTML = `${kop}<p>${esc(waarom)}</p>${login}<p>Of zeg het in Claude, bijvoorbeeld:</p>
      ${vtKopieerHtml("Zet een actie klaar voor de Researcher: zoek tien installatiebedrijven in Utrecht die groeien.")}`;
    return wireOpdrachtKopieer(el);
  }
  const specialisten = beschikbareSpecialisten(ctx);
  const voor = doel && doel.voor ? specialisten.find(s => s.slug === doel.voor) : null;
  if (!opdrachtStaat || (voor && opdrachtStaat.voorSlug !== voor.slug)) {
    opdrachtStaat = { wat: "", uitleg: "", wie: voor ? { agent: voor.naam } : {}, deadline: "", hoortBij: "", voorSlug: voor ? voor.slug : null };
  }
  const s = opdrachtStaat;
  const ik = vjIk(ctx);
  const top = specialisten.slice(0, 3);
  const rest = specialisten.slice(3);
  const collegas = opdrachtCollegas(ctx, ik);
  const nu = ctx.today || new Date();
  const orgs = dataRijenVan(ctx, "organisaties") || [];
  const orgTitelVeld = ctx.schema.datadomeinen.organisaties && ctx.schema.datadomeinen.organisaties.velden[0].naam;
  const gekozenAgent = (naam) => s.wie.agent && naamGelijk(s.wie.agent, naam);
  const knopWie = (label, waarde, soort, gekozen) =>
    `<button type="button" class="opdracht-keuze${soort === "mens" ? " mens" : ""}" data-opdracht-wie="${soort}:${esc(waarde)}" aria-pressed="${gekozen}">${label}</button>`;
  const ikKnop = ik ? knopWie("Ikzelf", ik, "mens", !!s.wie.mens && naamGelijk(s.wie.mens, ik)) : "";
  const anders = [...rest.map(x => [`agent:${x.naam}`, x.naam, gekozenAgent(x.naam)]), ...collegas.map(c => [`mens:${c}`, c, !!s.wie.mens && naamGelijk(s.wie.mens, c)])];
  const datum = [{ label: "Geen haast", datum: "" }].concat(datumKeuzes(nu).slice(0, 3));
  const eigenDatum = s.deadline && !datum.some(d => d.datum === s.deadline);
  const ontvanger = s.wie.agent ? `Geef aan ${s.wie.agent}` : s.wie.mens ? (ik && naamGelijk(s.wie.mens, ik) ? "Zet op mijn lijst" : `Zet bij ${s.wie.mens}`) : "Kies eerst wie het oppakt";
  const v = opdrachtVerwachting(ctx, s.wie);
  el.innerHTML = `${kop}
    <form class="opdracht" data-opdracht novalidate>
      <label class="opdracht-veld"><span>Wat moet er gebeuren?</span>
        <textarea data-opdracht-wat rows="3" maxlength="4000" placeholder="Bijvoorbeeld: zoek tien installatiebedrijven in Utrecht die groeien">${esc(s.wat)}</textarea></label>
      <fieldset class="opdracht-groep"><legend>Wie pakt het op?</legend>
        <div class="opdracht-keuzes">${top.map(x => knopWie(`${x.emoji ? `<span aria-hidden="true">${esc(x.emoji)}</span> ` : ""}${esc(x.naam)}`, x.naam, "agent", gekozenAgent(x.naam))).join("")}${ikKnop}
        ${anders.length ? `<select data-opdracht-anders aria-label="Iemand anders"><option value="">Iemand anders…</option>${anders.map(([w, l, g]) => `<option value="${esc(w)}"${g ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>` : ""}</div>
        ${v ? `<p class="opdracht-verwachting ${v.k}" data-opdracht-verwachting>${esc(v.tekst)}${v.klaar ? ` <a href="#/klaar">Zo regel je dat →</a>` : ""}</p>` : ""}
      </fieldset>
      <fieldset class="opdracht-groep"><legend>Voor wanneer?</legend>
        <div class="opdracht-keuzes">${datum.map(d => `<button type="button" class="opdracht-keuze datum" data-opdracht-datum="${d.datum}" aria-pressed="${s.deadline === d.datum}">${esc(d.label)}</button>`).join("")}
        <label class="opdracht-datum"><span class="sr-only">Andere datum</span><input type="date" data-opdracht-eigen-datum value="${eigenDatum ? esc(s.deadline) : ""}"></label></div>
      </fieldset>
      ${orgs.length && orgTitelVeld ? `<label class="opdracht-veld"><span>Hoort bij <small>(mag leeg)</small></span>
        <select data-opdracht-hoort><option value="">Niets</option>${orgs.filter(o => o.__entryId).map(o => `<option value="${esc(o.__entryId)}"${s.hoortBij === o.__entryId ? " selected" : ""}>${esc(dataCelTekst(getField(o, orgTitelVeld)) || o.__entryId)}</option>`).join("")}</select></label>` : ""}
      <details class="opdracht-meer"${s.uitleg ? " open" : ""}><summary>Meer uitleg voor je team</summary>
        <label class="opdracht-veld"><span class="sr-only">Uitleg voor je team</span><textarea data-opdracht-uitleg rows="4" maxlength="4000">${esc(s.uitleg)}</textarea></label>
        <p class="footnote">Schrijf wat je een nieuwe collega zou appen. Tijdens het werkmoment kan je team niets navragen.</p></details>
      <div data-naam-slot="opdracht"></div>
      <p class="opdracht-fout" data-opdracht-fout role="alert"></p>
      <button type="submit" class="knop blad-knop ${s.wie.mens ? "blad-knop-prim" : "blad-knop-teamvol"}" data-opdracht-ok${s.wie.agent || s.wie.mens ? "" : " disabled"}>${esc(ontvanger)}</button>
    </form>`;
  wireOpdracht(el, ctx, doel);
}

function wireOpdrachtKopieer(el) {
  el.onclick = async (e) => {
    const k = e.target.closest && e.target.closest("[data-vt-kopieer]");
    if (!k) return;
    const gelukt = await kopieerTekst(k.getAttribute("data-vt-kopieer"));
    meld(gelukt ? "Gekopieerd. Plak het in Claude." : "Kopiëren lukte niet. Selecteer de tekst en kopieer hem zelf.");
  };
}

function wireOpdracht(el, ctx, doel) {
  const s = opdrachtStaat;
  const form = el.querySelector("[data-opdracht]");
  const opnieuw = (focus) => { renderOpdracht(el, ctx, doel); if (focus) { const f = el.querySelector(focus); if (f) f.focus(); } };
  form.querySelector("[data-opdracht-wat]").addEventListener("input", (e) => { s.wat = e.target.value; });
  const uitleg = form.querySelector("[data-opdracht-uitleg]");
  if (uitleg) uitleg.addEventListener("input", (e) => { s.uitleg = e.target.value; });
  const zetWie = (waarde) => {
    const i = waarde.indexOf(":");
    const soort = waarde.slice(0, i); const naam = waarde.slice(i + 1);
    s.wie = soort === "agent" ? { agent: naam } : soort === "mens" ? { mens: naam } : {};
  };
  form.addEventListener("click", (e) => {
    const wie = e.target.closest("[data-opdracht-wie]");
    if (wie) { zetWie(wie.getAttribute("data-opdracht-wie")); return opnieuw(`[data-opdracht-wie="${cssWaarde(wie.getAttribute("data-opdracht-wie"))}"]`); }
    const d = e.target.closest("[data-opdracht-datum]");
    if (d) { s.deadline = d.getAttribute("data-opdracht-datum"); return opnieuw(`[data-opdracht-datum="${cssWaarde(s.deadline)}"]`); }
  });
  const anders = form.querySelector("[data-opdracht-anders]");
  if (anders) anders.addEventListener("change", () => { if (anders.value) { zetWie(anders.value); opnieuw("[data-opdracht-anders]"); } });
  const eigen = form.querySelector("[data-opdracht-eigen-datum]");
  eigen.addEventListener("change", () => { s.deadline = eigen.value || ""; opnieuw("[data-opdracht-eigen-datum]"); });
  const hoort = form.querySelector("[data-opdracht-hoort]");
  if (hoort) hoort.addEventListener("change", () => { s.hoortBij = hoort.value; });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fout = form.querySelector("[data-opdracht-fout]");
    const knop = form.querySelector("[data-opdracht-ok]");
    fout.textContent = "";
    if (!s.wat.trim()) { fout.textContent = "Schrijf eerst wat er moet gebeuren."; form.querySelector("[data-opdracht-wat]").focus(); return; }
    if (!s.wie.agent && !s.wie.mens) { fout.textContent = "Kies eerst wie het oppakt."; return; }
    // Aangemaakt door is jouw naam; wil je die niet geven, dan blijft het veld leeg.
    const ik = await naamVoorSchrijfactieIn(form.querySelector('[data-naam-slot="opdracht"]'), ctx.bron, { overslaan: true });
    const nu = ctx.today || new Date();
    const data = opdrachtData({ wat: s.wat, uitleg: s.uitleg, wie: s.wie, deadline: s.deadline, hoortBij: s.hoortBij, ik, nu });
    knop.disabled = true; form.setAttribute("aria-busy", "true");
    try {
      const antwoord = await schrijfWerkruimte(ctx.bron, "POST", "/dashboard/entries", { domein: "acties", data });
      const nieuwId = antwoord && antwoord.entry && antwoord.entry.entryId;
      if (nieuwId && ctx.werkBij) ctx.werkBij("acties", { entry: antwoord.entry });
      const melding = s.wie.agent
        ? (klaarCheck(ctx).stil ? `Doorgegeven aan ${s.wie.agent}. Het blijft liggen tot je team weer vanzelf werkt.` : `Doorgegeven aan ${s.wie.agent}. Die pakt het op bij het volgende werkmoment.`)
        : ik && naamGelijk(s.wie.mens, ik) ? "Op je eigen lijst gezet." : `Bij ${s.wie.mens} gezet.`;
      opdrachtStaat = null;
      window.location.hash = "#/acties";
      meld(melding, nieuwId ? { actie: ongedaanNieuw(ctx, "acties", nieuwId) } : {});
    } catch (err) {
      knop.disabled = false; form.removeAttribute("aria-busy");
      const t = (err && err.message) || "Dat is niet gelukt.";
      fout.textContent = t + " Je tekst staat er nog; probeer het opnieuw.";
    }
  });
}

if (typeof module !== "undefined") {
  module.exports = { renderOpdracht, opdrachtData, opdrachtDoel, opdrachtVerwachting, beschikbareSpecialisten, opdrachtCollegas, opdrachtKnopHtml, startOpdracht };
}


/* f49 — één rij als pagina (#/data/<domein>/<id>), te beginnen bij organisaties.
 *
 * Gegevens één niveau dieper: alles over deze organisatie op één plek. De
 * velden komen uit de registry, en wat eraan hangt uit de verwijzingen in de
 * bundel (terugverwijzingen) — niets is per domein hardgecodeerd, dus
 * contactpersonen, deals en projecten krijgen vanzelf dezelfde opbouw.
 *
 * Rechten (besluit 30-09): wie ingelogd is, mag toevoegen, wijzigen en
 * verwijderen. Op de daglink of bij een extern CRM: alleen lezen, met uitleg.
 *
 * Naamswijziging: koppelingen lopen via het id. Een verwijzing draagt ook de
 * titel van toen hij gelegd werd; dataCelHtml toont daarom de naam van de rij
 * zoals hij nú heet, als die rij geladen is. Zo verhuist de naam mee. */

/* Waar kun je vanaf deze rij iets aan toevoegen? Elk domein met een
 * verwijzing naar dit domein (niet polymorf), dat je mag bewerken. Acties gaan
 * via de opdracht (f50), notities via hun eigen draad. */
function rpToevoegDomeinen(ctx, key) {
  const uit = [];
  const bekend = ctx.bundle && ctx.bundle.instantieDomeinen;
  for (const [slug, dom] of Object.entries(ctx.schema.datadomeinen || {})) {
    if (slug === "acties" || slug === "notities" || slug === key) continue;
    if (Array.isArray(bekend) && bekend.indexOf(slug) === -1) continue;
    if (!Array.isArray(bekend) && !(ctx.bundle.domains && ctx.bundle.domains[slug])) continue;
    const veld = dataVelden(dom).find(v => v.type === "relatie" && v.naar === key && !v.meervoud);
    const titelVeld = dataVelden(dom).find(v => v.type === "titel");
    if (!veld || !titelVeld || !magDomeinBewerken(ctx, slug).ok) continue;
    uit.push({ slug, dom, veld, titelVeld });
  }
  return uit;
}

function rpChips(domein, rij) {
  return dataVelden(domein).filter(v => v.type === "select" && dataCelTekst(getField(rij, v.naam)))
    .slice(0, 3).map(v => `<span class="rp-chip" title="${esc(v.naam)}">${esc(dataCelTekst(getField(rij, v.naam)))}</span>`).join("");
}

function rpVeldenHtml(ctx, key, domein, rij, kan) {
  const kort = [], lang = [];
  for (const v of dataVelden(domein)) {
    const tekst = dataCelTekst(getField(rij, v.naam));
    const wijzig = kan ? `<button type="button" class="filter-wis rp-wijzig" data-rp-wijzig="${esc(v.naam)}" aria-label="${esc(v.naam)} wijzigen">wijzig</button>` : "";
    if (tekst && isLangeTekst(v, tekst)) {
      lang.push(`<div class="detail-lang" data-rp-veld="${esc(v.naam)}"><p class="detail-veld detail-lang-kop">${esc(v.naam)} ${wijzig}</p>
        <div class="prosa">${langeTekstHtml(tekst)}</div><div data-rp-slot></div></div>`);
    } else {
      kort.push(`<div class="detail-regel" data-rp-veld="${esc(v.naam)}"><span class="detail-veld">${esc(v.naam)}</span>
        <span class="detail-waarde">${tekst ? dataCelHtml(getField(rij, v.naam), v) : `<span class="rp-leeg">—</span>`} ${wijzig}</span><div data-rp-slot></div></div>`);
    }
  }
  return `<section class="rp-vak"><h3>Gegevens</h3>${kort.join("")}${lang.join("")}</section>`;
}

function rpSectiesHtml(ctx, key, rij) {
  const terug = terugverwijzingen(ctx, key, rij.__entryId).filter(t => t.slug !== "notities");
  // Acties bovenaan: daar staat wat je team voor deze rij deed of nog doet.
  terug.sort((a, b) => (a.slug === "acties" ? -1 : 0) - (b.slug === "acties" ? -1 : 0));
  if (!terug.length) return `<section class="rp-vak"><h3>Wat hieraan hangt</h3><p class="footnote">Nog niets in je werkruimte verwijst naar deze rij.</p></section>`;
  return terug.map(t => {
    const actie = t.slug === "acties";
    const rijen = actie
      ? t.treffers.slice().sort((a, b) => (vjTekst(a, "Status") === VJ_KLAAR) - (vjTekst(b, "Status") === VJ_KLAAR))
      : t.treffers;
    const sub = (r) => {
      if (actie) return [vjTekst(r, "Status"), dataCelTekst(getField(r, "Eigenaar"))].filter(Boolean).join(" · ");
      const s = dataVelden(t.dom).find(v => v.type === "select" && dataCelTekst(getField(r, v.naam)));
      const d = dataDatumVeld(t.dom);
      return [s ? dataCelTekst(getField(r, s.naam)) : "", d ? dataCelTekst(getField(r, d)) : ""].filter(Boolean).join(" · ");
    };
    const items = rijen.slice(0, 25).map(r => `<li>${r.__entryId ? `<a href="${rijPaginaPad(t.slug, r.__entryId)}">${esc(detailTitel(t.dom, r))}</a>` : esc(detailTitel(t.dom, r))}
      ${sub(r) ? `<span class="footnote">${esc(sub(r))}</span>` : ""}</li>`).join("");
    const rest = rijen.length > 25 ? `<li class="footnote">… en nog ${rijen.length - 25}</li>` : "";
    const kop = actie ? "Acties en werk van je team" : (t.dom.naam || t.slug);
    return `<section class="rp-vak"><h3>${esc(t.dom.emoji || "🗂️")} ${esc(kop)} <span class="footnote">${t.treffers.length}${t.veld.naam !== "Organisatie" ? ` · via ${esc(t.veld.naam)}` : ""}</span></h3>
      <ul class="rp-lijst">${items}${rest}</ul></section>`;
  }).join("");
}

function rpToevoegHtml(ctx, key, rij) {
  const doelen = rpToevoegDomeinen(ctx, key);
  const opdracht = key === "organisaties" && typeof opdrachtKnopHtml === "function" && opdrachtKnopHtml(ctx)
    ? `<button type="button" class="knop" data-rp-opdracht>＋ Opdracht voor je team</button>` : "";
  if (!doelen.length && !opdracht) return "";
  return `<section class="rp-vak rp-toevoegen"><h3>Toevoegen</h3>
    ${doelen.length ? `<form class="rp-toevoeg" data-rp-toevoeg>
      <label><span class="sr-only">Wat voeg je toe?</span><select data-rp-toevoeg-domein>${doelen.map(d => `<option value="${esc(d.slug)}">${esc(d.dom.emoji || "")} ${esc(d.dom.naam || d.slug)}</option>`).join("")}</select></label>
      <label class="rp-toevoeg-naam"><span class="sr-only">Naam</span><input type="text" data-rp-toevoeg-naam maxlength="200" placeholder="Naam"></label>
      <button type="submit" class="knop">Toevoegen</button>
      <p class="bewerk-fout" data-rp-toevoeg-fout role="alert"></p></form>
      <p class="footnote">Het komt meteen bij ${esc(detailTitel(ctx.schema.datadomeinen[key], rij))} te staan; de rest vul je daarna in op zijn eigen pagina.</p>` : ""}
    ${opdracht}</section>`;
}

/* "Laat je team de gegevens aanvullen": een opdracht voor de Researcher, met
 * de lege velden erin en de eis dat elk gegeven een bron krijgt. Alleen als de
 * Researcher in dit team voorkomt. */
function rpAanvullenHtml(ctx, key, domein, rij) {
  if (key !== "organisaties" || typeof beschikbareSpecialisten !== "function" || !opdrachtKnopHtml(ctx)) return "";
  if (!beschikbareSpecialisten(ctx).some(s => s.slug === "researcher")) return "";
  const leeg = dataVelden(domein).filter(v => !dataCelTekst(getField(rij, v.naam)) && v.type !== "relatie").map(v => v.naam);
  if (!leeg.length) return "";
  return `<button type="button" class="knop knop-secundair" data-rp-aanvullen>Laat je team de gegevens aanvullen</button>`;
}

function renderRijPagina(el, key, id, ctx) {
  const domein = ctx.schema.datadomeinen[key];
  const terugLink = `<p><a class="detail-link" href="#/data/${esc(key)}">← ${esc((domein && domein.naam) || "Gegevens")}</a></p>`;
  const rij = domein ? (dataRijenVan(ctx, key) || []).find(r => r.__entryId === id) : null;
  if (!domein || !rij) {
    el.innerHTML = `${terugLink}<h2 class="rp-titel" tabindex="-1">Niet gevonden</h2><p>Deze rij staat niet (meer) in je werkruimte.</p>`;
    return;
  }
  const bewerk = magDomeinBewerken(ctx, key);
  const titel = detailTitel(domein, rij);
  document.title = `${titel} — Agentic Team Dashboard`;
  el.innerHTML = `${terugLink}
    <div class="rp-kop"><h2 class="rp-titel" tabindex="-1">${esc(domein.emoji || "🗂️")} ${esc(titel)}</h2><div class="rp-chips">${rpChips(domein, rij)}</div></div>
    ${bewerk.reden ? `<p class="footnote">${esc(bewerk.reden)}</p>` : ""}
    <div class="rp-acties">${rpAanvullenHtml(ctx, key, domein, rij)}
      ${bewerk.ok ? `<button type="button" class="knop knop-secundair" data-rp-verwijder>🗑 Verwijderen</button>` : ""}</div>
    <div data-rp-bevestig></div>
    <div class="rp-raster">
      <div class="rp-links">${rpVeldenHtml(ctx, key, domein, rij, bewerk.ok)}</div>
      <div class="rp-rechts">${rpSectiesHtml(ctx, key, rij)}
        <section class="rp-vak">${notitiedraadHtml(ctx, key, rij) || ""}</section>
        ${rpToevoegHtml(ctx, key, rij)}</div>
    </div>`;
  wireRijPagina(el, key, rij, ctx);
}

function wireRijPagina(el, key, rij, ctx) {
  const domein = ctx.schema.datadomeinen[key];
  const titel = detailTitel(domein, rij);

  el.addEventListener("click", async (e) => {
    const t = e.target;
    const wijzig = t.closest && t.closest("[data-rp-wijzig]");
    if (wijzig) {
      const naam = wijzig.getAttribute("data-rp-wijzig");
      const veld = dataVelden(domein).find(v => v.naam === naam);
      const slot = wijzig.closest("[data-rp-veld]").querySelector("[data-rp-slot]");
      for (const s of el.querySelectorAll("[data-rp-slot]")) s.innerHTML = "";
      slot.innerHTML = `<form class="bewerk-formulier rp-veldform" data-rp-veldform>
        <label class="bewerk-veld"><span class="sr-only">${esc(naam)}</span>${veldInvoerHtml(veld, getField(rij, naam), ctx)}</label>
        <p class="bewerk-fout" data-bewerk-fout role="alert"></p>
        <div class="bewerk-knoppen"><button type="submit" class="knop">Opslaan</button>
          <button type="button" class="knop knop-secundair" data-rp-annuleer>Annuleren</button></div></form>`;
      const form = slot.querySelector("form");
      const voor = leesFormulier(form);
      const invoer = form.querySelector("[data-veldtype]");
      if (invoer) invoer.focus();
      form.addEventListener("keydown", (k) => { if (k.key === "Escape") { slot.innerHTML = ""; wijzig.focus(); } });
      form.addEventListener("submit", async (s) => {
        s.preventDefault();
        const patch = formulierPatch(domein, voor, leesFormulier(form));
        if (!Object.keys(patch).length) { slot.innerHTML = ""; meld("Niets gewijzigd."); wijzig.focus(); return; }
        const knop = form.querySelector('button[type="submit"]');
        knop.disabled = true; form.setAttribute("aria-busy", "true");
        try {
          const vorige = vorigeWaarden(rij, patch);
          const antwoord = await snelWijzig(ctx, key, rij.__entryId, patch);
          await verwerkAntwoord(ctx, key, antwoord, { focus: `[data-rp-wijzig="${cssWaarde(naam)}"]` });
          meld(wijzigingTekst(patch), { actie: ongedaanPatch(ctx, key, rij.__entryId, vorige) });
        } catch (fout) {
          form.querySelector("[data-bewerk-fout]").textContent = ((fout && fout.message) || "Het opslaan is niet gelukt.") + " Probeer het opnieuw.";
          knop.disabled = false; form.removeAttribute("aria-busy");
        }
      });
      return;
    }
    if (t.closest && t.closest("[data-rp-annuleer]")) { t.closest("[data-rp-slot]").innerHTML = ""; return; }

    if (t.closest && t.closest("[data-rp-verwijder]")) {
      const vak = el.querySelector("[data-rp-bevestig]");
      const aantal = terugverwijzingen(ctx, key, rij.__entryId).reduce((n, x) => n + x.treffers.length, 0);
      vak.innerHTML = verwijderBevestigingHtml(titel)
        + (aantal ? `<p class="footnote">Wat eraan hangt (${aantal}), blijft bestaan; de koppeling ernaar verdwijnt.</p>` : "");
      vak.querySelector("[data-verwijder-ja]").focus();
      return;
    }
    if (t.closest && t.closest("[data-bewerk-annuleer]")) { el.querySelector("[data-rp-bevestig]").innerHTML = ""; return; }
    const ja = t.closest && t.closest("[data-verwijder-ja]");
    if (ja) {
      ja.disabled = true;
      try {
        await verwijderEntry(ctx, key, rij.__entryId);
        window.location.hash = `#/data/${key}`;
        if (ctx.werkBij) ctx.werkBij(key, { weg: rij.__entryId });
        meld(`‘${titel}’ is verwijderd.`);
      } catch (fout) {
        ja.disabled = false;
        const f = el.querySelector("[data-rp-bevestig] [data-bewerk-fout]");
        if (f) f.textContent = ((fout && fout.message) || "Verwijderen is niet gelukt.") + " Probeer het opnieuw.";
      }
      return;
    }

    if (t.closest && t.closest("[data-rp-aanvullen]")) {
      const leeg = dataVelden(domein).filter(v => !dataCelTekst(getField(rij, v.naam)) && v.type !== "relatie").map(v => v.naam);
      startOpdracht({ voor: "researcher", hoortBij: key === "organisaties" ? rij.__entryId : "",
        wat: `Vul de gegevens van ${titel} aan: ${leeg.join(", ")}.`,
        uitleg: "Zet bij elk gegeven waar je het vond (de bron). Vind je iets niet, laat het veld dan leeg en zeg dat." }, ctx);
      return;
    }
    if (t.closest && t.closest("[data-rp-opdracht]")) { startOpdracht({ hoortBij: rij.__entryId }, ctx); }
  });

  el.addEventListener("submit", async (e) => {
    const toevoeg = e.target.closest && e.target.closest("[data-rp-toevoeg]");
    const notitie = e.target.closest && e.target.closest("[data-notitie-form]");
    if (!toevoeg && !notitie) return;
    e.preventDefault();
    if (toevoeg) {
      const doel = rpToevoegDomeinen(ctx, key).find(d => d.slug === toevoeg.querySelector("[data-rp-toevoeg-domein]").value);
      const naam = toevoeg.querySelector("[data-rp-toevoeg-naam]").value.trim();
      const fout = toevoeg.querySelector("[data-rp-toevoeg-fout]");
      if (!doel) return;
      if (!naam) { fout.textContent = "Geef het eerst een naam."; toevoeg.querySelector("[data-rp-toevoeg-naam]").focus(); return; }
      const knop = toevoeg.querySelector('button[type="submit"]');
      knop.disabled = true;
      try {
        const antwoord = await schrijfWerkruimte(ctx.bron, "POST", "/dashboard/entries", { domein: doel.slug, data: { [doel.titelVeld.naam]: naam, [doel.veld.naam]: rij.__entryId } });
        const nieuwId = antwoord && antwoord.entry && antwoord.entry.entryId;
        await verwerkAntwoord(ctx, doel.slug, antwoord, { focus: "[data-rp-toevoeg-naam]" });
        meld(`${naam} toegevoegd aan ${doel.dom.naam || doel.slug}.`, nieuwId ? { actie: ongedaanNieuw(ctx, doel.slug, nieuwId) } : {});
      } catch (err) {
        knop.disabled = false;
        fout.textContent = ((err && err.message) || "Toevoegen is niet gelukt.") + " Je invoer staat er nog; probeer het opnieuw.";
      }
      return;
    }
    // Notitie: dezelfde vorm als in de detailkaart (databrowser.js).
    const onderwerp = notitie.querySelector("[data-notitie-onderwerp]").value.trim();
    const tekst = notitie.querySelector("[data-notitie-tekst]").value.trim();
    if (!onderwerp && !tekst) return;
    const info = notitieVeldVan(ctx);
    const knop = notitie.querySelector("[data-notitie-knop]");
    const naam = await naamVoorSchrijfactieIn(notitie.querySelector('[data-naam-slot="notitie"]'), ctx.bron, { overslaan: true });
    const data = { Onderwerp: onderwerp || tekst.slice(0, 60), Datum: new Date().toISOString().slice(0, 10), Soort: "Mens", [info.veld.naam]: { domein: key, id: rij.__entryId } };
    if (tekst) data.Notitie = tekst;
    if (naam) data.Auteur = naam;
    knop.disabled = true;
    try {
      const antwoord = await schrijfWerkruimte(ctx.bron, "POST", "/dashboard/entries", { domein: "notities", data });
      await verwerkAntwoord(ctx, "notities", antwoord, { focus: "[data-notitie-onderwerp]" });
      meld("Notitie toegevoegd.");
    } catch (err) {
      knop.disabled = false;
      const f = notitie.querySelector("[data-notitie-fout]");
      if (f) f.textContent = ((err && err.message) || "Toevoegen is niet gelukt.") + " Je tekst staat er nog; probeer het opnieuw.";
    }
  });
}

if (typeof module !== "undefined") {
  module.exports = { renderRijPagina, rpToevoegDomeinen };
}


/* f54 — metrics v3: de werkbak en de vaste taken voor Notion-klanten.
 *
 * Staan je acties en vaste taken in Notion (of een ander CRM), dan ziet het
 * dashboard ze niet rechtstreeks. De dagstart schrijft ze daarom mee in het
 * metricsbestand: een voor_jou-blok (in de volgorde en nummering van "Ter
 * goedkeuring", dus nummer 3 is overal hetzelfde) en een ritmetaken-blok. Dat
 * is een momentopname van de dagstart: lezen, en afhandelen in Notion.
 *
 * Alleen als het werk níet in de werkruimte staat; zijn er rijen, dan winnen
 * die altijd (die zijn live). */

function metricsVoorJou(ctx) {
  if (!ctx || !ctx.bundle || rows(ctx.bundle, "acties")) return null;
  const w = ctx.metricsWerk;
  return w && Array.isArray(w.voorJou) ? w.voorJou : null;
}

/* De ritmetaken uit het metricsbestand, in de vorm van rijen — zodat de
 * week, de statusregels en de klaar-check er gewoon mee rekenen. */
function metricsRitmeRijen(ctx) {
  if (!ctx || !ctx.bundle || dataRijenVan(ctx, "ritmetaken")) return null;
  const w = ctx.metricsWerk;
  if (!w || !Array.isArray(w.ritmetaken)) return null;
  return w.ritmetaken.map((t, i) => ({
    __entryId: `metrics-${i}`, __url: t.url || null,
    Taak: t.taak, Agent: t.agent || "", Ritme: t.ritme, Actief: t.actief === true,
    "Laatst gedraaid": t.laatst_gedraaid || null, Volgorde: t.volgorde,
  }));
}

function notionVoorJouHtml(ctx, items) {
  const nu = ctx.today || new Date();
  const w = ctx.metricsWerk || {};
  const stand = w.gegenereerdOp ? vtWanneer(parseDateField(w.gegenereerdOp), nu) : null;
  const kaart = (it) => {
    const sinds = it.sinds ? parseDateField(it.sinds) : null;
    const dagen = sinds ? Math.floor((nu - sinds) / 86400000) : null;
    const meta = [`<span class="soort-pil">${esc(SOORT_LABEL[it.soort] || "")}</span>`];
    if (it.te_laat) meta.push(`<span class="pil-laat">te laat</span>`);
    if (it.specialist) meta.push(`<span>van ${esc(it.specialist)}</span>`);
    if (dagen !== null && dagen >= 1) meta.push(`<span>${dagen === 1 ? "1 dag" : dagen + " dagen"}</span>`);
    if (it.deadline) meta.push(`<span>deadline ${esc(vjDatumKort(it.deadline))}</span>`);
    return `<li class="vj-kaart"><span class="vj-nr" aria-hidden="true">${it.nr}</span>
      <div class="vj-kaart-inhoud"><p class="vj-titel"><span class="visueel-verborgen">Nummer ${it.nr}: </span>${esc(it.titel)}</p>
        <p class="baan-meta">${meta.join("")}</p>
        ${it.url ? `<p><a class="detail-link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Open in Notion ↗</a></p>` : ""}</div></li>`;
  };
  return `${typeof stilKaartHtml === "function" ? stilKaartHtml(ctx) : ""}
    <div class="vj-kop"><h2>Voor jou <span class="vj-teller">${items.length}</span></h2>
      ${stand ? `<span class="footnote">stand van je dagstart, ${esc(stand)}</span>` : ""}
      ${typeof hoeWerktDitHtml === "function" ? hoeWerktDitHtml("notion", "Waarom staat dit in Notion?") : ""}</div>
    <p class="footnote">Je acties staan in Notion: afhandelen doe je daar, of vraag het je team in Claude. De nummers zijn dezelfde als in je dagstart.</p>
    ${items.length ? `<ol class="vj-lijst notion-werkbak">${items.map(kaart).join("")}</ol>`
      : `<p class="vj-leeg">Niets voor jou in je dagstart van vanochtend.</p>`}`;
}

/* De vaste taken uit het metricsbestand, alleen lezen: dezelfde statusregels
 * als in de werkruimte, met een link naar Notion. */
function notionTakenHtml(ctx, rijen) {
  const nu = ctx.today || new Date();
  const rij = (t) => {
    const s = taakStatus(t, nu);
    return `<li class="vt-rij${t.Actief ? "" : " uit"}"><div class="vt-rij-kop"><span class="vt-titel">${esc(t.Taak)}</span>
      <span class="footnote">${esc([agentWeergaveNaam(ctx.schema, t.Agent) || t.Agent, (typeof ritmeLabel === "function" ? ritmeLabel(t.Ritme) : RITME_KLANTTAAL[t.Ritme] || t.Ritme), t.Actief ? "" : "uit"].filter(Boolean).join(" · "))}</span></div>
      <p class="vt-status vt-${s.k}">${esc(s.tekst)}</p>
      ${t.__url ? `<a class="detail-link" href="${esc(t.__url)}" target="_blank" rel="noopener noreferrer">Open in Notion ↗</a>` : ""}</li>`;
  };
  return `<section class="vt-vak"><h2>Je vaste taken · ${rijen.filter(t => t.Actief).length} aan</h2>
    <p class="footnote">Stand van je dagstart. Aanpassen doe je in Notion, of zeg het je team in Claude.</p>
    <ul class="vt-lijst">${rijen.map(rij).join("")}</ul></section>`;
}

if (typeof module !== "undefined") {
  module.exports = { metricsVoorJou, metricsRitmeRijen, notionVoorJouHtml, notionTakenHtml };
}


/* f34 — "Jouw modules": overzicht (fase 0) + schakelen en opzeggen (fase 1).
 *
 * De site rekent, dit dashboard toont: overzicht, voorstellen (nieuw
 * maandbedrag, ingangsmoment, btw) en uitkomsten komen allemaal kant-en-klaar
 * van de site-API en worden hier nooit nagerekend — bedragen op twee plekken
 * drijven uit elkaar. Alleen bereikbaar met een ingelogde p10-sessie (de
 * daglink kan dit niet) en een licentie in de allowlist van de site; in alle
 * andere gevallen antwoordt de site niet-200 en blijven tegel én detailpagina
 * gewoon weg — afwezig is geen fout. Tegel en detailpagina zijn bovendien
 * alleen voor de licentiebeheerder (zie moduleOverzichtBeschikbaar).
 *
 * Schakelen/opzeggen verschijnt alleen als de site `magSchakelen: true`
 * meegeeft (schakel-vlag aan én dit is de seat van het aankoopadres); de
 * server handhaaft dat zelf opnieuw per request. Zonder die vlag valt de
 * pagina terug op fase 0: een wijzigingsverzoek dat bij support landt.
 *
 * Alle site-verkeer loopt door één fetch-plek (modulesFetch) — de
 * telemetrie-guard telt aanroepen met naam, en dit houdt de inventaris op
 * precies vier: lezen, schrijven, token-uitwisseling, modules-API. */

const MODULES_SITE_ORIGIN = "https://www.agentic-team.ai";

/* Versieaanduiding van de bevestigingsteksten hieronder. Gaat mee met elke
 * bevestigings-POST en wordt server-side in de mutatieadministratie gelegd —
 * zo is later te bewijzen wélke schermtekst er bij een klik stond
 * (juristoordeel 02-09-2026, onderdeel b). Bump bij elke tekstwijziging in
 * de voorstel-/opzegblokken. */
const MODULES_SCHERMTEKST_VERSIE = "f34-scherm 2026-09-03.1";

let moduleOverzicht = null; // laatste geslaagde site-antwoord
let moduleOverzichtVoorToken = null; // token waarvoor (al) geladen is/wordt

/* Tegel, detail-nav en detailpagina zijn er alleen voor de licentiebeheerder
 * (het aankoopadres, PV 3.9 lid 2). Een ander teamlid krijgt van de site
 * alleen welke modules er aan staan — genoeg voor de agentsuggesties, niet
 * voor pakket en bedragen — en hoort dus ook geen tegel te zien.
 *
 * Een site van vóór dit onderscheid stuurt het veld `beheerder` niet mee. Dan
 * beslist de vorm: een volledig overzicht (met maandbedrag) tonen we zoals
 * voorheen, zodat dit dashboard niet stukgaat als het eerder live staat dan de
 * site. */
function moduleOverzichtBeschikbaar() {
  if (!moduleOverzicht) return false;
  if (typeof moduleOverzicht.beheerder === "boolean") return moduleOverzicht.beheerder;
  return moduleOverzicht.maandbedragExclBtw !== undefined && moduleOverzicht.maandbedragExclBtw !== null;
}

/* i71: welke modules heeft deze klant écht? Geeft null als we het niet weten
 * (geen ingelogde sessie, of een licentie buiten de allowlist) — en dat is
 * wat anders dan "geen enkele". De aanroeper hoort dat verschil te maken:
 * een suggestie voor een module die iemand niet heeft, is een verkooppraatje
 * op de verkeerde plek. Werkt voor élk teamlid: het beperkte antwoord voor
 * niet-beheerders draagt de module-keys ook. */
function actieveModuleKeys() {
  if (!moduleOverzicht || !Array.isArray(moduleOverzicht.modules)) return null;
  return moduleOverzicht.modules.filter((m) => m && m.actief).map((m) => m.key);
}

/* De enige plek die de site aanroept: GET zonder body, POST mét. Geeft
 * {status, body} terug en gooit alleen op netwerkfouten. */
async function modulesFetch(pad, body, tokenOverride) {
  const token = tokenOverride !== undefined
    ? tokenOverride
    : (huidigeBron && huidigeBron.token ? huidigeBron.token : "");
  const res = await fetch(`${MODULES_SITE_ORIGIN}${pad}`, {
    method: body === undefined ? "GET" : "POST",
    headers: {
      Authorization: `Bearer ${token}`,
      ...(body === undefined ? {} : { "Content-Type": "application/json" }),
    },
    ...(body === undefined ? {} : { body: JSON.stringify(body) }),
  });
  let json = null;
  try { json = await res.json(); } catch (e) { /* leeg of geen JSON — status zegt genoeg */ }
  return { status: res.status, ok: res.ok, body: json };
}

/* Eén poging per token: een 404 (geen allowlist) of 401 (verlopen) hoeft
 * niet elke render opnieuw geprobeerd — na een login/refresh wijzigt het
 * token en laden we vanzelf opnieuw. */
async function laadModuleOverzicht(bron) {
  if (!bron || !bron.oauth || !bron.token) {
    moduleOverzicht = null;
    // Ook de token-cache weg (zelfde patroon als laadTeam): wie na een daglink
    // terugwisselt naar dezelfde ingelogde sessie, krijgt het overzicht opnieuw
    // in plaats van de null van de daglink.
    moduleOverzichtVoorToken = null;
    return null;
  }
  if (moduleOverzichtVoorToken === bron.token) return moduleOverzicht;
  moduleOverzichtVoorToken = bron.token;
  moduleOverzicht = null;
  try {
    const uit = await modulesFetch("/api/dashboard/modules", undefined, bron.token);
    if (uit.ok) moduleOverzicht = uit.body;
  } catch (e) { /* site onbereikbaar — dan geen tegel, geen foutbanner */ }
  return moduleOverzicht;
}

/* Na een geslaagde wijziging/opzegging: overzicht opnieuw ophalen en de
 * openstaande views bijtekenen. */
async function verversModuleOverzicht() {
  moduleOverzichtVoorToken = null;
  await laadModuleOverzicht(huidigeBron);
  const paneel = document.getElementById("panel-modules");
  if (paneel) renderModulesPanel(paneel);
  route();
}

/* Compact paneel op de Vandaag-tab; doorklik naar de detailpagina. */
function renderModulesPanel(sectieEl) {
  if (!sectieEl) return;
  if (!moduleOverzichtBeschikbaar()) {
    sectieEl.style.display = "none";
    return;
  }
  const o = moduleOverzicht;
  const actief = o.modules.filter((m) => m.actief);
  sectieEl.style.display = "";
  sectieEl.querySelector("#panel-modules-body").innerHTML = `
    <p class="modules-samenvatting">${esc(o.pakket)} — <strong>€ ${nlGetal(o.maandbedragExclBtw)}/mnd</strong> excl. btw</p>
    <p class="footnote">${actief.map((m) => esc(m.naam)).join(" · ")}</p>
    <a class="detail-link" data-goto="modules">Bekijk je modules →</a>`;
}

function moduleKaartHtml(m) {
  return `<div class="card${m.actief ? "" : " signaal-grijs"}">
    <div class="kop">${esc(m.naam)} ${m.actief ? "✓ actief" : "— niet actief"}</div>
    <div class="getal">€ ${nlGetal(m.prijs)}/mnd</div>
    <div class="detail">${esc(m.belofte)}${m.altijdInbegrepen ? " (altijd inbegrepen)" : ""}<br>
      <strong>Agents:</strong> ${m.agents.map((a) => esc(a.naam)).join(", ") || "—"}<br>
      <strong>Datadomeinen:</strong> ${m.datadomeinen.map(esc).join(", ") || "—"}</div>
  </div>`;
}

/* ── Fase 1 · schakelen ────────────────────────────────────────────── */

function schakelBlokHtml(o) {
  const keuzes = o.modules
    .filter((m) => !m.altijdInbegrepen)
    .map((m) => `<label class="modules-keuze"><input type="checkbox" data-module-keuze value="${esc(m.key)}"${m.actief ? " checked" : ""}> ${esc(m.naam)} (€ ${nlGetal(m.prijs)}/mnd)</label>`)
    .join("");
  return `<div class="modules-verzoek" id="modules-schakelblok">
    <h3>Samenstelling wijzigen</h3>
    <p class="footnote">Core is altijd inbegrepen. Bijschakelen werkt per direct; afschakelen sluit de module per
    direct af zonder creditering — het nieuwe bedrag geldt vanaf je eerstvolgende factuur.</p>
    ${keuzes}
    <button type="button" id="modules-bereken-knop">Bereken nieuw maandbedrag</button>
    <div id="modules-voorstel"></div>
    <p class="footnote" id="modules-schakel-status" role="status"></p>
  </div>
  <div class="modules-verzoek" id="modules-opzegblok">
    <h3>Opzeggen</h3>
    <p class="footnote">Helemaal stoppen? Je team blijft werken tot het einde van je betaalde termijn; er wordt
    niets gecrediteerd.</p>
    <button type="button" id="modules-opzeg-knop">Abonnement opzeggen</button>
    <div id="modules-opzeg-voorstel"></div>
    <p class="footnote" id="modules-opzeg-status" role="status"></p>
  </div>`;
}

function gekozenModules(el) {
  return Array.from(el.querySelectorAll("[data-module-keuze]:checked")).map((c) => c.value);
}

async function berekenWijziging(el) {
  const status = el.querySelector("#modules-schakel-status");
  const doel = el.querySelector("#modules-voorstel");
  doel.innerHTML = "";
  status.textContent = "Berekenen…";
  try {
    const uit = await modulesFetch("/api/dashboard/modules/wijzig", { modules: gekozenModules(el) });
    if (!uit.ok) {
      status.textContent = (uit.body && uit.body.fout) || "Berekenen lukte niet. Probeer het later nog eens.";
      return;
    }
    status.textContent = "";
    const v = uit.body.voorstel;
    // 3.9 lid 3: excl. én incl. btw, beide ingangsmomenten. Het na-ijleffect
    // staat er concreet ("je betaalt nog € X tot en met <datum>"), niet als
    // regel — en de gratis-terugdraaienzin expliciet (lid 5); dat zijn de twee
    // mitigaties uit het juristoordeel. Alle bedragen uit het site-antwoord.
    const afRegels = (v.afgeschakeld || [])
      .map((m) => `${esc(m.naam)} stopt per direct. Je betaalt er nog € ${nlGetal(m.prijs)} voor tot en met ${esc(v.betaaldTotEnMet)} — dat wordt niet gecrediteerd. Tot die datum zet je ${esc(m.naam)} kosteloos weer aan.`)
      .join("<br>");
    const bijRegels = (v.bijgeschakeld || [])
      .map((m) => `${esc(m.naam)} is per direct beschikbaar; € ${nlGetal(m.prijs)}/mnd erbij vanaf je eerstvolgende factuur (${esc(v.ingangsdatum)}).`)
      .join("<br>");
    doel.innerHTML = `<div class="grijs-blok">
      <div class="grijs-kop">Je nieuwe samenstelling</div>
      <div class="grijs-tekst">Van € ${nlGetal(v.maandbedragOud)}/mnd naar <strong>€ ${nlGetal(v.maandbedragNieuw)}/mnd</strong>
      excl. btw (€ ${nlGetal(v.maandbedragOudInclBtw, 2)} → € ${nlGetal(v.maandbedragNieuwInclBtw, 2)} incl. ${esc(String(v.btwPercentage))}% btw).
      Het nieuwe bedrag staat voor het eerst op je factuur van ${esc(v.ingangsdatum)}.${afRegels ? `<br><br>${afRegels}` : ""}${bijRegels ? `<br><br>${bijRegels}` : ""}</div>
      <button type="button" id="modules-bevestig-knop">Bevestig wijziging</button>
    </div>`;
    doel.querySelector("#modules-bevestig-knop").addEventListener("click", () => {
      void bevestigWijziging(el);
    });
  } catch (e) {
    status.textContent = "Berekenen lukte niet. Probeer het later nog eens.";
  }
}

async function bevestigWijziging(el) {
  const status = el.querySelector("#modules-schakel-status");
  const knop = el.querySelector("#modules-bevestig-knop");
  if (knop) knop.disabled = true;
  status.textContent = "Doorvoeren…";
  try {
    const uit = await modulesFetch("/api/dashboard/modules/wijzig", { modules: gekozenModules(el), bevestigd: true, schermversie: MODULES_SCHERMTEKST_VERSIE });
    if (!uit.ok) {
      const fout = (uit.body && uit.body.fout) || "Doorvoeren lukte niet. Probeer het later nog eens.";
      const link = uit.body && uit.body.machtigingUrl
        ? ` <a href="${esc(uit.body.machtigingUrl)}" target="_blank" rel="noopener">Geef je machtiging af →</a>`
        : "";
      status.innerHTML = `${esc(fout)}${link}`;
      if (knop) knop.disabled = false;
      return;
    }
    status.textContent = "Gelukt — je samenstelling is aangepast. Je krijgt een bevestiging per mail.";
    await verversModuleOverzicht();
  } catch (e) {
    status.textContent = "Doorvoeren lukte niet. Probeer het later nog eens.";
    if (knop) knop.disabled = false;
  }
}

async function startOpzeggen(el) {
  const status = el.querySelector("#modules-opzeg-status");
  const doel = el.querySelector("#modules-opzeg-voorstel");
  doel.innerHTML = "";
  status.textContent = "Ophalen…";
  try {
    const uit = await modulesFetch("/api/dashboard/modules/opzeggen", {});
    if (!uit.ok) {
      status.textContent = (uit.body && uit.body.fout) || "Ophalen lukte niet. Probeer het later nog eens.";
      return;
    }
    status.textContent = "";

      <div class="grijs-kop">${proef ? "Kosteloos opzeggen (proefperiode)" : "Opzeggen per einde termijn"}</div>
      <div class="grijs-tekst">${proef
        ? "Je zit nog in de proefperiode: er wordt niets gefactureerd en er volgt geen incasso."
        : "Er volgt geen nieuwe factuur; wat al gefactureerd is wordt niet gecrediteerd."}
      Je team blijft werken tot ${esc(uit.body.eindeToegang)}.</div>
      <button type="button" id="modules-opzeg-bevestig">Bevestig opzegging</button>
    </div>`;
    doel.querySelector("#modules-opzeg-bevestig").addEventListener("click", () => {

    });
