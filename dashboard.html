}

async function bevestigOpzeggen(el) {
  const status = el.querySelector("#modules-opzeg-status");
  const knop = el.querySelector("#modules-opzeg-bevestig");
  if (knop) knop.disabled = true;
  status.textContent = "Opzeggen…";
  try {
    const uit = await modulesFetch("/api/dashboard/modules/opzeggen", { bevestigd: true, schermversie: MODULES_SCHERMTEKST_VERSIE });
    if (!uit.ok) {
      status.textContent = (uit.body && uit.body.fout) || "Opzeggen lukte niet. Probeer het later nog eens.";
      if (knop) knop.disabled = false;
      return;
    }
    status.textContent = `Opgezegd. Je team blijft werken tot ${uit.body.eindeToegang}. Je krijgt een bevestiging per mail.`;
    const doel = el.querySelector("#modules-opzeg-voorstel");
    if (doel) doel.innerHTML = "";
  } catch (e) {
    status.textContent = "Opzeggen lukte niet. Probeer het later nog eens.";
    if (knop) knop.disabled = false;
  }
}

/* ── Fase 0 · wijzigingsverzoek (fallback zonder magSchakelen) ─────── */

function verzoekBlokHtml() {
  return `<div class="modules-verzoek">
    <h3>Iets wijzigen?</h3>
    <p class="footnote">Zelf bij- en afschakelen komt eraan. Tot die tijd: beschrijf hieronder wat je
    wilt (bv. "Sales erbij" of "Backoffice eraf per volgende maand") — wij regelen het en je krijgt
    een bevestiging per mail.</p>
    <textarea id="modules-wens" maxlength="500" rows="3" placeholder="Wat wil je wijzigen?"></textarea>
    <button type="button" id="modules-verzoek-knop">Verstuur wijzigingsverzoek</button>
    <p class="footnote" id="modules-verzoek-status" role="status"></p>
  </div>`;
}

async function verstuurModuleVerzoek(el) {
  const veld = el.querySelector("#modules-wens");
  const knop = el.querySelector("#modules-verzoek-knop");
  const status = el.querySelector("#modules-verzoek-status");
  const wens = (veld.value || "").trim();
  if (!wens) {
    status.textContent = "Beschrijf eerst kort wat je wilt wijzigen.";
    return;
  }
  knop.disabled = true;
  status.textContent = "Versturen…";
  try {
    const uit = await modulesFetch("/api/dashboard/modules/verzoek", { wens });
    if (uit.ok) {
      veld.value = "";
      status.textContent = "Verzonden — we nemen het op en je hoort van ons.";
    } else {
      status.textContent = (uit.body && uit.body.fout) || "Versturen lukte niet. Probeer het later nog eens.";
      knop.disabled = false;
    }
  } catch (e) {
    status.textContent = "Versturen lukte niet. Probeer het later nog eens.";
    knop.disabled = false;
  }
}

/* ── Detailpagina ──────────────────────────────────────────────────── */

function renderDetailModules(el) {
  if (!moduleOverzichtBeschikbaar()) {
    el.innerHTML = `<p>Je moduleoverzicht is niet beschikbaar. Log opnieuw in en probeer het nog eens.</p>`;
    return;
  }
  const o = moduleOverzicht;
  el.innerHTML = `
    <p>Je pakket: <strong>${esc(o.pakket)}</strong> — <strong>€ ${nlGetal(o.maandbedragExclBtw)}/mnd</strong> excl. ${esc(String(o.btwPercentage))}% btw. Een jaarcontract geeft ${esc(String(o.jaarGratisMaanden))} maanden gratis.</p>
    <div class="grid-9">${o.modules.map(moduleKaartHtml).join("")}</div>
    ${o.magSchakelen === true ? schakelBlokHtml(o) : verzoekBlokHtml()}
    <p class="footnote">Bedragen en samenstelling komen live van agentic-team.ai — dit dashboard rekent
    er zelf niet aan. Klopt er iets niet, mail support@agentic-team.ai.</p>`;

  if (o.magSchakelen === true) {
    el.querySelector("#modules-bereken-knop").addEventListener("click", () => {
      void berekenWijziging(el);
    });
    el.querySelector("#modules-opzeg-knop").addEventListener("click", () => {
      void startOpzeggen(el);
    });
  } else {
    el.querySelector("#modules-verzoek-knop").addEventListener("click", () => {
      void verstuurModuleVerzoek(el);
    });
  }
}


/* i77 — wie werkt er mee, en onder welke naam.
 *
 * De weergavenaam stond tot nu toe per browser in localStorage. Dat werkte voor
 * één persoon op één apparaat en verder nergens: een tweede laptop vroeg het
 * opnieuw, en bij meerdere mensen op één licentie kon niemand corrigeren dat
 * dezelfde persoon in drie spellingen in dezelfde kolom stond. Sinds i77 hoort
 * de naam bij de seat en staat hij bij de licentie; dit paneel is de plek waar
 * de beheerder hem ziet en rechtzet.
 *
 * Dat is geen cosmetiek: `Eigenaar` is een gedeelde kolom in de werkdata, en het
 * statuscontract van de werkronde leunt erop ("Wacht op review is altijd een
 * mens"). Drie spellingen van één persoon maken filters, de dagstart en de
 * correctievrij-meting onbetrouwbaar.
 *
 * Daarnaast nodigt de beheerder hier mensen uit en haalt hij ze weg. De site doet
 * het echte werk — de uitnodigingsmail met weigerlink (art. 14 AVG) en het
 * afsluiten van sessies — via dezelfde code als de MCP-tools; dit paneel stuurt
 * alleen een adres of een seat en toont wat terugkomt.
 *
 * Alle site-verkeer loopt door modulesFetch — de enige aanroepplek naar het
 * eigen domein. Zo blijft de telemetrie-inventaris op precies vier fetches.
 */

let teamLijst = null; // laatste geslaagde antwoord; null = niet (voor ons) beschikbaar
let teamVoorToken = null;
let teamBevestigSeat = null; // seat waarvan de verwijderbevestiging openstaat
let teamBezigSeat = null; // seat waarvan de verwijdering nu onderweg is

/* Alleen voor tests: deze cache leeft per paginalading, wat in een browser
 * precies goed is. Een testbestand draait alle gevallen in één context, dus
 * daar moet hij tussendoor leeg. Zelfde patroon als _resetNaamvoorstel. */
function _resetTeam() {
  teamLijst = null;
  teamVoorToken = null;
  teamBevestigSeat = null;
  teamBezigSeat = null;
}

async function laadTeam(bron) {
  // Daglinksessie: geen ingelogde seat, dus geen beheerderschap — en het
  // daglink-token hoort onze server sowieso nooit te bereiken. Zelfde poort als
  // het modulepaneel.
  if (!bron || !bron.oauth || !bron.token) {
    teamLijst = null;
    // Ook de token-cache weg: wie daarna terugwisselt naar dezelfde ingelogde
    // sessie, moet het team opnieuw krijgen en niet de null van de daglink.
    teamVoorToken = null;
    teamBevestigSeat = null;
    return null;
  }
  const token = bron.token;
  if (teamVoorToken === token) return teamLijst;
  teamVoorToken = token;
  try {
    const uit = await modulesFetch("/api/dashboard/team", undefined, token);
    // 404 = geen beheerder, of deze licentie doet niet mee. Afwezig is geen
    // fout: het paneel blijft dan gewoon weg.
    teamLijst = uit && uit.status === 200 && uit.body && Array.isArray(uit.body.team)
      ? uit.body.team
      : null;
  } catch (e) {
    teamLijst = null;
  }
  return teamLijst;
}

/* Het token voor een schrijfactie — alleen uit een ingelogde sessie. Wisselt
 * iemand in hetzelfde tabblad naar een daglink terwijl dit paneel nog
 * openstaat, dan krijgt modulesFetch anders stilzwijgend het daglink-token mee
 * naar onze server. Daarom geven we het token expliciet mee, en is er geen
 * ingelogde sessie meer, dan gaat er niets weg. */
function teamSessieToken() {
  const bron = typeof huidigeBron === "undefined" ? null : huidigeBron;
  return bron && bron.oauth && bron.token ? bron.token : null;
}

/* Geen ingelogde sessie meer: paneel dicht in plaats van een knop die niets doet. */
function teamSluitZonderSessie(sectieEl) {
  teamLijst = null;
  teamBevestigSeat = null;
  renderTeamPanel(sectieEl);
}

/* Kan de site uitnodigen en verwijderen? Een site van vóór die routes zet geen
 * `eigenaar` op de rijen; dan tonen we alleen de namen, zoals voorheen, in
 * plaats van knoppen die op een 404 stuklopen. Een lege lijst zegt niets over
 * de site — en juist dan wil de beheerder iemand kunnen uitnodigen (het
 * aankoopadres zelf staat er meestal niet op). */
function teamBeheerMogelijk() {
  return Array.isArray(teamLijst)
    && (teamLijst.length === 0 || teamLijst.some((r) => r && typeof r.eigenaar === "boolean"));
}

function teamActieHtml(r) {
  // "licentiehouder" en niet "eigenaar": `Eigenaar` is in de uitleg erboven de
  // werkdatakolom, en daar kan iedereen op deze lijst in staan.
  if (r.eigenaar === true) {
    return `<span class="footnote" title="De eigenaar van de licentie kun je niet verwijderen.">licentiehouder</span>`;
  }
  // Onbekend of dit de eigenaar is (oude site): liever geen knop dan een die
  // de server toch weigert.
  if (r.eigenaar !== false) return "";
  // Eén verwijdering tegelijk. De knoppen gaan uit in de html zelf, niet op de
  // elementen: een hertekening tijdens de aanvraag (Ververs, periodekeuze) zou
  // anders een actieve "Ja, verwijderen" terugzetten en een tweede POST mogelijk
  // maken — waarvan de 404 dan het geslaagde verwijderen overschrijft.
  const uit = teamBezigSeat !== null ? " disabled" : "";
  if (teamBevestigSeat === r.seat) {
    // Eerst de uitleg, dan de knoppen: zo staat "Ja, verwijderen" niet op de
    // plek waar net "Verwijderen" stond, en doet een dubbelklik niets onomkeerbaars.
    return `<div class="team-bevestig" role="group" aria-label="Verwijderen van ${esc(r.adres)} bevestigen">
      <span>${esc(r.adres)} kan daarna niet meer inloggen. Een sessie die nog open staat, stopt binnen een uur.</span>
      <button type="button" class="team-verwijder" data-team-verwijder-ja="${esc(r.seat)}"${uit}>Ja, verwijderen</button>
      <button type="button" class="knop-secundair" data-team-verwijder-nee="${esc(r.seat)}"${uit}>Annuleren</button>
    </div>`;
  }
  return `<button type="button" class="team-verwijder" data-team-verwijder="${esc(r.seat)}"
      aria-label="${esc(r.adres)} verwijderen"${uit}>Verwijderen</button>`;
}

function teamRijHtml(r, beheer) {
  const wachtNog = !r.aanvaardOp;
  return `<tr>
    <td><input class="team-naam" type="text" maxlength="80" value="${esc(r.naam || "")}"
        data-team-seat="${esc(r.seat)}" aria-label="Weergavenaam van ${esc(r.adres)}"></td>
    <td class="footnote">${esc(r.adres)}</td>
    <td class="footnote">${wachtNog ? "uitgenodigd, nog niet ingelogd" : "actief"}</td>
    ${beheer ? `<td class="team-actie">${teamActieHtml(r)}</td>` : ""}
  </tr>`;
}

function teamTabelHtml(beheer) {
  if (!teamLijst.length) {
    // Het aankoopadres staat meestal niet op de uitnodigingenlijst, maar logt
    // wel in — "er staat niemand op" zou dus niet kloppen met de vraag erboven.
    return `<p class="footnote">Je hebt nog niemand uitgenodigd. Zelf log je in met het aankoopadres; nodig hierboven je collega's uit.</p>`;
  }
  return `<p class="footnote">De naam komt in <strong>Eigenaar</strong> en <strong>Afgerond door</strong>
      te staan. Pas hem aan en klik ernaast om op te slaan.</p>
    <div class="tabel-scroll">
      <table class="detail-table team-tabel">
        <thead><tr><th>Naam</th><th>E-mailadres</th><th>Status</th>${beheer ? "<th>Toegang</th>" : ""}</tr></thead>
        <tbody>${teamLijst.map((r) => teamRijHtml(r, beheer)).join("")}</tbody>
      </table>
    </div>`;
}

/* Dashboard v2 (besluit 30-09): uitnodigen vraagt ook de naam. Die wordt de
 * naam van je collega in de werkdata (Eigenaar) en in "Voor jou", op elk
 * apparaat en hoe hij ook inlogt — één bron, gekozen door een mens. */
function teamUitnodigHtml() {
  return `<form class="team-uitnodigen" data-team-uitnodigen novalidate>
      <p class="team-uitnodigen-kop"><strong>Iemand uitnodigen</strong></p>
      <div class="team-uitnodigen-rij">
        <label class="bedien-veld"><span>Naam</span>
          <input id="team-uitnodig-naam" type="text" autocomplete="off" maxlength="80"
            placeholder="Voornaam Achternaam" data-team-uitnodig-naam></label>
        <label class="bedien-veld"><span>E-mailadres</span>
          <input id="team-uitnodig-adres" type="email" autocomplete="off" maxlength="254"
            placeholder="naam@bedrijf.nl" data-team-uitnodig-adres></label>
        <button type="submit">Uitnodigen</button>
      </div>
      <p class="footnote">Diegene krijgt een mail met uitleg en kan daarna inloggen met dit adres. De naam zie je terug bij wat je collega oppakt.</p>
    </form>`;
}

function renderTeamPanel(sectieEl) {
  if (!sectieEl) return;
  const beheer = teamBeheerMogelijk();
  if (!teamLijst || (!teamLijst.length && !beheer)) {
    sectieEl.style.display = "none";
    return;
  }
  sectieEl.style.display = "";
  const body = sectieEl.querySelector("#panel-team-namen-body");
  // Het geraamte (formulier, meldingen) blijft staan bij een hertekening; alleen
  // de lijst wordt vervangen. Anders verdwijnt een half getypt adres of de
  // melding "uitnodiging verstuurd" zodra het dashboard opnieuw tekent.
  if (!body.querySelector("[data-team-lijst]") || body.dataset.teamBeheer !== String(beheer)) {
    body.dataset.teamBeheer = String(beheer);
    body.innerHTML = `
      ${beheer ? teamUitnodigHtml() : ""}
      <p class="footnote team-melding" data-team-melding aria-live="polite"></p>
      <p class="footnote warn team-melding" data-team-let-op aria-live="polite"></p>
      <p class="bewerk-fout team-melding" data-team-fout role="alert"></p>
      <div data-team-lijst></div>`;
  }
  body.querySelector("[data-team-lijst]").innerHTML = teamTabelHtml(beheer);
  wireTeamPanel(sectieEl);
}

function teamZet(sectieEl, attr, tekst) {
  const el = sectieEl.querySelector(`[${attr}]`);
  if (el) el.textContent = tekst || "";
}

/* De plekkenwaarschuwing (letOp) krijgt een eigen, oranje regel: het is een
 * melding met licentiegevolgen, geen bijzin achter "uitnodiging verstuurd". */
function teamMeld(sectieEl, tekst, letOp) {
  teamZet(sectieEl, "data-team-melding", tekst);
  teamZet(sectieEl, "data-team-let-op", letOp);
  teamZet(sectieEl, "data-team-fout", "");
}

function teamFout(sectieEl, tekst) {
  teamZet(sectieEl, "data-team-melding", "");
  teamZet(sectieEl, "data-team-let-op", "");
  teamZet(sectieEl, "data-team-fout", tekst);
}

function teamFoutTekst(uit, standaard) {
  return (uit && uit.body && typeof uit.body.fout === "string" && uit.body.fout) || standaard;
}

async function nodigTeamlidUit(sectieEl, form) {
  const naamVeld = form.querySelector("[data-team-uitnodig-naam]");
  const veld = form.querySelector("[data-team-uitnodig-adres]");
  const knop = form.querySelector('button[type="submit"]');
  const naam = naamVeld ? (naamVeld.value || "").trim() : "";
  const adres = (veld.value || "").trim();
  if (naamVeld && !naam) {
    teamFout(sectieEl, "Vul eerst de naam in waaronder je collega werkt.");
    naamVeld.focus();
    return;
  }
  if (!adres) {
    teamFout(sectieEl, "Vul eerst een e-mailadres in.");
    veld.focus();
    return;
  }
  const token = teamSessieToken();
  if (!token) {
    teamSluitZonderSessie(sectieEl);
    return;
  }
  teamMeld(sectieEl, "Uitnodigen…");
  veld.disabled = true;
  if (naamVeld) naamVeld.disabled = true;
  if (knop) knop.disabled = true;
  const wie = naam ? `${naam} (${adres})` : adres;
  try {
    const uit = await modulesFetch("/api/dashboard/team/uitnodigen", { adres, naam }, token);
    if (uit && uit.status === 200 && uit.body && Array.isArray(uit.body.team)) {
      // Intussen naar een daglink gewisseld? Dan hoort het paneel niet terug.
      if (!teamSessieToken()) {
        teamSluitZonderSessie(sectieEl);
        return;
      }
      teamLijst = uit.body.team;
      const u = uit.body.uitgenodigd || {};
      let tekst;
      if (!u.nieuw) tekst = `${wie} stond al op de lijst — er is geen nieuwe mail verstuurd.`;
      else if (u.mailVerstuurd) tekst = `Uitnodiging verstuurd naar ${wie}.`;
      else tekst = `${wie} staat op de lijst, maar de uitnodigingsmail kwam niet weg. Laat het diegene zelf even weten.`;
      const letOp = typeof uit.body.letOp === "string" ? uit.body.letOp : "";
      veld.value = "";
      if (naamVeld) naamVeld.value = "";
      renderTeamPanel(sectieEl);
      teamMeld(sectieEl, tekst, letOp);
    } else if (uit && uit.status === 404 && !(uit.body && typeof uit.body.fout === "string")) {
      // Een site van vóór deze route kent hem niet (een kale 404, geen
      // fout-veld). Het dashboard kan eerder live staan dan de site, en bij een
      // lege lijst toont het het formulier al — zeg dan wat wél kan.
      teamFout(sectieEl, "Uitnodigen kan hier nog niet. Vraag je team in Claude om iemand uit te nodigen.");
    } else {
      teamFout(sectieEl, teamFoutTekst(uit, "Uitnodigen lukte niet. Probeer het zo opnieuw."));
    }
  } catch (err) {
    teamFout(sectieEl, "Uitnodigen lukte niet — geen verbinding.");
  } finally {
    veld.disabled = false;
    if (naamVeld) naamVeld.disabled = false;
    if (knop) knop.disabled = false;
    // Een uitgeschakeld veld verliest in de browser zijn focus, die dan op
    // <body> belandt. Terug naar het formulier: bij een fout wil je verbeteren,
    // na succes meteen de volgende uitnodigen (dan begint het bij de naam).
    const terug = naamVeld && !naamVeld.value ? naamVeld : veld;
    if (terug.isConnected && sectieEl.style.display !== "none") terug.focus();
  }
}

async function verwijderTeamlid(sectieEl, seat) {
  if (teamBezigSeat !== null) return;
  const token = teamSessieToken();
  if (!token) {
    teamSluitZonderSessie(sectieEl);
    return;
  }
  const rij = (teamLijst || []).find((r) => r && r.seat === seat);
  const adres = rij ? rij.adres : "Dit teamlid";
  teamBezigSeat = seat;
  renderTeamPanel(sectieEl); // tekent de knoppen uitgeschakeld
  teamMeld(sectieEl, "Verwijderen…");
  let gelukt = false;
  try {
    const uit = await modulesFetch("/api/dashboard/team/verwijderen", { seat }, token);
    if (uit && uit.status === 200 && uit.body && Array.isArray(uit.body.team)) {
      teamLijst = uit.body.team;
      if (teamBevestigSeat === seat) teamBevestigSeat = null;
      gelukt = true;
    } else {
      teamFout(sectieEl, teamFoutTekst(uit, "Verwijderen lukte niet. Probeer het zo opnieuw."));
    }
  } catch (err) {
    teamFout(sectieEl, "Verwijderen lukte niet — geen verbinding.");
  } finally {
    teamBezigSeat = null;
  }
  // Intussen naar een daglink gewisseld? Dan hoort het paneel niet terug.
  if (!teamSessieToken()) {
    teamSluitZonderSessie(sectieEl);
    return;
  }
  renderTeamPanel(sectieEl);
  // De knop waar de focus stond is weg (vervangen of uitgeschakeld). Geef hem
  // een vaste plek in plaats van <body>: na succes het adresveld bovenaan, na
  // een fout de veilige keuze in de bevestiging die openblijft.
  if (gelukt) {
    teamMeld(sectieEl, `${adres} is verwijderd en kan niet meer inloggen.`);
    const veld = sectieEl.querySelector("[data-team-uitnodig-adres]");
    if (veld) veld.focus();
  } else {
    const annuleer = teamKnopVoor(sectieEl, "data-team-verwijder-nee", seat);
    if (annuleer) annuleer.focus();
  }
}

/* Knop of veld bij een seat terugvinden zonder de seat in een selector te plakken: hij
 * komt van de site, en een aanhalingsteken erin breekt anders de selector. */
function teamKnopVoor(sectieEl, attr, seat) {
  return Array.from(sectieEl.querySelectorAll(`[${attr}]`)).find((k) => k.getAttribute(attr) === seat) || null;
}

/* Eén keer binden, niet per hertekening. De listeners hangen aan de vaste
 * <section> — die blijft bestaan terwijl alleen het lichaam wordt vervangen —
 * dus zonder deze vlag stapelt elke render een extra listener op en stuurt één
 * naamwijziging, uitnodiging of verwijdering er net zoveel identieke POSTs uit. */
function wireTeamPanel(sectieEl) {
  if (sectieEl.dataset.bedraad === "1") return;
  sectieEl.dataset.bedraad = "1";
  sectieEl.addEventListener("change", async (e) => {
    const melding = sectieEl.querySelector("[data-team-melding]");
    const veld = e.target.closest && e.target.closest("[data-team-seat]");
    if (!veld) return;
    const seat = veld.getAttribute("data-team-seat");
    const naam = veld.value.trim().slice(0, 80);
    const token = teamSessieToken();
    if (!token) {
      teamSluitZonderSessie(sectieEl);
      return;
    }
    veld.disabled = true;
    try {
      const uit = await modulesFetch("/api/dashboard/team", { seat, naam }, token);
      if (uit && uit.status === 200 && uit.body && Array.isArray(uit.body.team)) {
        teamLijst = uit.body.team;
        // Is de lijst tijdens het opslaan hertekend — bijvoorbeeld door een klik
        // op Verwijderen bij iemand anders — dan staat in het nieuwe veld nog de
        // oude naam, terwijl hieronder "Opgeslagen." verschijnt. Zet daar neer wat
        // de site opsloeg, tenzij iemand er alweer in typt.
        const nu = teamKnopVoor(sectieEl, "data-team-seat", seat);
        const opgeslagen = teamLijst.find((r) => r && r.seat === seat);
        if (nu && nu !== veld && opgeslagen && nu !== document.activeElement) nu.value = opgeslagen.naam || "";
        if (melding) melding.textContent = "Opgeslagen.";
      } else if (melding) {
        melding.textContent = "Niet opgeslagen — probeer het opnieuw.";
      }
    } catch (err) {
      if (melding) melding.textContent = "Niet opgeslagen — geen verbinding.";
    } finally {
      veld.disabled = false;
    }
  });

  sectieEl.addEventListener("submit", (e) => {
    const form = e.target.closest && e.target.closest("[data-team-uitnodigen]");
    if (!form) return;
    e.preventDefault();
    void nodigTeamlidUit(sectieEl, form);
  });

  sectieEl.addEventListener("click", (e) => {
    const doel = e.target;
    if (!doel || !doel.closest) return;

    // Stap 1: nog niets versturen, alleen de bevestiging openen. Focus op
    // Annuleren — de veilige keuze voor wie met Enter doorklikt.
    const vraag = doel.closest("[data-team-verwijder]");
    // Loopt er al een verwijdering, dan doen de knoppen niets — ook niet als
    // een klik een knop bereikt die net nog actief getekend stond.
    const verwijderKnop = vraag || doel.closest("[data-team-verwijder-nee], [data-team-verwijder-ja]");
    if (verwijderKnop && (teamBezigSeat !== null || verwijderKnop.disabled)) return;
    if (vraag) {
      teamBevestigSeat = vraag.getAttribute("data-team-verwijder");
      teamMeld(sectieEl, "");
      renderTeamPanel(sectieEl);
      const annuleer = teamKnopVoor(sectieEl, "data-team-verwijder-nee", teamBevestigSeat);
      if (annuleer) annuleer.focus();
      return;
    }

    const nee = doel.closest("[data-team-verwijder-nee]");
    if (nee) {
      const seat = nee.getAttribute("data-team-verwijder-nee");
      teamBevestigSeat = null;
      renderTeamPanel(sectieEl);
      const terug = teamKnopVoor(sectieEl, "data-team-verwijder", seat);
      if (terug) terug.focus();
      return;
    }

    // Stap 2: pas hier gaat er iets naar de site.
    const ja = doel.closest("[data-team-verwijder-ja]");
    if (ja) void verwijderTeamlid(sectieEl, ja.getAttribute("data-team-verwijder-ja"));
  });
}


/* Dashboard v2 — de bedieningslaag (src/v2-begin.js t/m src/v2-eind.js) leeft
 * in één afgeschermde scope, zodat haar namen (soortVan, renderHulp, …) niet
 * botsen met de geteste logica eromheen. Waar ze een productiefunctie nodig
 * heeft die ze zelf ook zo noemt, haalt ze die hier op, vóór de scope begint.
 * Alles wat een knop schrijft of een lijst bepaalt, blijft zo in voor-jou.js,
 * vaste-taken.js en data-bewerken.js — daar is het getest. */
const V2_PROD = Object.freeze({
  soortVan, hoortBijMens, vanMij, isTeLaat, sindsVan, aanJouZet, bijCollegas, bijTeam, kloptNiet,
  datumKeuzes, klaarCheck, taakStatus, weekTelling, werkmomentSporen, werkdagenNa, naamGelijk, isAgentNaam,
});


/* ── Dashboard v2: begin van de afgeschermde scope (zie v2-prod.js) ── */
(function () {
"use strict";


/* Dashboard v2 — basis: tijd, kleine hulpfuncties, de toestand van het scherm
 * en de vertaling van je werkruimte naar wat de schermen tonen.
 *
 * De schermen komen uit het goedgekeurde klikbare ontwerp. Daar rekenden ze
 * met nepdata in eigen vorm; hier krijgen ze dezelfde vorm, maar dan
 * afgeleid van de echte rijen (`a.rij` blijft er altijd aan hangen). Wat iets
 * ís — aan jou, bij je team, te laat — beslist voor-jou.js; deze laag vertaalt
 * alleen. */

const P = V2_PROD;
let NU = new Date();
let CTX = null; // de context van app.js; null zolang er geen werkruimte is

const DAGEN = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const DAGEN_LANG = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

function dt(v) { if (!v) return null; if (v instanceof Date) return v; return parseDateField(v); }
function p2(n) { return String(n).padStart(2, "0"); }
function isoDag(d) { return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; }
function dagStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function zelfdeDag(a, b) { return !!a && !!b && dagStart(a).getTime() === dagStart(b).getTime(); }
function plusDagen(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function hhmm(d) { return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
function datumKort(d) { d = dt(d); return d ? DAGEN[d.getDay()] + " " + d.getDate() + " " + MAANDEN[d.getMonth()] : ""; }
function heeftTijd(v) { return typeof v === "string" ? /T\d|\s\d{1,2}:\d{2}/.test(v) : v instanceof Date; }
function wanneer(v) {
  const d = dt(v); if (!d) return "";
  if (!heeftTijd(v)) {
    if (zelfdeDag(d, NU)) return "vandaag";
    if (zelfdeDag(d, plusDagen(NU, -1))) return "gisteren";

    case "check": return knop("Goedkeuren", "doe", `data-f="goedkeuren" data-id="${id}"`, "prim") + (werkAgent(a) ? knop(ic("terug", "klein") + "Terug", "sheet", `data-type="terug" data-id="${id}"`, "team") : "");

function isNieuw(a) { const v = verhaalData(); const d = dt(a.aangemaakt); return isAgentSlug(a.door) && !!d && d > v.van; }
function voorproefTekst(a) { return (a.werk || "").replace(/\n\s*\n/g, "\n"); }

function compactItem(a, gekozen) {

function renderWerkbak(gekozenId) {
  const l = voorJouLijst(); const n = l.length; const kc = klaarCheck();
  const opdrachtKnop = isDesk() && kanSchrijven() ? `<button class="knop teamvol" data-act="sheet" data-type="opdracht">${ic("plus", "klein")}Opdracht geven</button>` : "";

    return `<section class="leeg" aria-label="Voor jou"><h3>Niets meer voor jou.</h3><p class="stil">${tekst}</p>
    <div class="rijtje">${kc.stil ? `<button class="knop prim" data-act="go" data-r="/team/klaar">Is je team klaar?</button>` : ""}${kanSchrijven() ? `<button class="knop teamvol" data-act="sheet" data-type="opdracht">${ic("plus", "klein")}Geef je team een opdracht</button>` : ""}${hoe("voor-jou")}</div></section>`;

  return `<section class="werkbak-kop" aria-label="Voor jou"><div class="tussen"><h2 class="vakkop"><b>Voor jou ${n}</b> · ${oud} · ±${min} ${min === 1 ? "minuut" : "minuten"}</h2><div class="rijtje">${hoe("voor-jou")}${opdrachtKnop}</div></div>

function renderAfgehandeld() {

/* De privacybelofte, woordelijk uit teksten.js (juridisch getoetst), met de

function renderVoorJou() {

function vraagVoorTeam(it) {
  const t = it.titel || "dit item";
  if (it.soort === "check") return `Laat me ‘${t}’ zien, dan kijk ik het na.`;
  if (it.soort === "voorstel") return `Laat me het voorstel ‘${t}’ zien.`;
  if (it.soort === "signaal") return `Laat mijn team ‘${t}’ opvolgen.`;

/* ---------- Item-blad ---------- */
function meerKnop(a) { return `<button class="knop stil" data-act="sheet" data-type="meer" data-id="${esc(a.id)}">${ic("meer", "klein")}Meer</button>`; }

/* ---------- Resultaat ----------
 * Afgerond per week, naar wie het deed: helemaal door je team (Afgerond door
 * een specialist), door jou met voorwerk van je team (een specialist zette het
 * klaar of werkte eraan), door jou alleen. "Niet doen" telt niet mee (i25). */
function resultaatWeken(n) {
  const ma = maandag(); const weken = [];
  for (let i = n - 1; i >= 0; i--) {
    const van = plusDagen(ma, -7 * i); const tot = plusDagen(van, 7);
    const af = S.data.acties.filter(a => a.status === "Klaar" && !/^niet doen/i.test(a.correctie) && dt(a.afgerondOp) && dt(a.afgerondOp) >= van && dt(a.afgerondOp) < tot);
    const team = af.filter(a => isAgentSlug(a.afgerondDoor)).length;
    const voor = af.filter(a => !isAgentSlug(a.afgerondDoor) && (isAgentSlug(a.door) || isAgentSlug(a.agent))).length;
    weken.push({ label: "wk " + isoWeek(van), van, team, voor, zelf: af.length - team - voor });
  }
  return weken;
}
function isoWeek(d) { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dag = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - dag); const j = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return Math.ceil(((x - j) / 86400000 + 1) / 7); }
function renderResultaat() {
  if (toegang() === "notion") return `<section class="leeg"><h3>Je resultaat staat in Notion</h3><p class="stil">Wat je team afrondde, telt je dagstart in Notion. Hier zie je het zodra je acties in je werkruimte staan.</p></section>`;
  const W = resultaatWeken(4); const tot = W.reduce((s, w) => s + w.team + w.voor + w.zelf, 0);
  if (!tot) return `<section class="leeg"><h3>Nog geen resultaat</h3><p class="stil">Zodra je team vanzelf werkt, zie je hier wat het voor je deed: helemaal zelf, met voorwerk voor jou, en wat je zelf deed.</p><button class="knop" data-act="go" data-r="/team/klaar">Is je team klaar?</button></section>`;
  const som = (k) => W.reduce((s, w) => s + w[k], 0);
  const piek = Math.max(...W.map(w => w.team + w.voor + w.zelf));
  const stap = Math.max(1, Math.ceil(piek / 4)); const max = stap * 4;
  const h = 150, x0 = 34, bw = 46, gap = 34, top = 14;
  const y = v => top + h - v / max * h;
  let svg = `<svg class="grafiek" viewBox="0 0 ${x0 + W.length * (bw + gap)} ${top + h + 26}" role="img" aria-label="Afgerond per week, opgesplitst naar wie het deed">`;
  [0, 1, 2, 3, 4].map(i => i * stap).forEach(v => { svg += `<line class="rast" x1="${x0}" x2="${x0 + W.length * (bw + gap) - gap + 6}" y1="${y(v)}" y2="${y(v)}"/><text x="${x0 - 8}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
  W.forEach((w, i) => {
    const x = x0 + 10 + i * (bw + gap); let acc = 0;
    [["s-team", w.team], ["s-voor", w.voor], ["s-zelf", w.zelf]].forEach(([c, v]) => { if (v) svg += `<rect class="${c}" x="${x}" y="${y(acc + v)}" width="${bw}" height="${v / max * h}" rx="2"/>`; acc += v; });
    svg += `<text class="tot" x="${x + bw / 2}" y="${y(acc) - 5}" text-anchor="middle">${acc}</text><text x="${x + bw / 2}" y="${top + h + 16}" text-anchor="middle">${w.label}</text>`;
  });
  svg += "</svg>";
  const min = CTX.minutenPerActie || 25; const uren = Math.round((som("team") + som("voor")) * min / 60);
  const gebruik = (CTX.agentUsage && CTX.agentUsage.status === "ok" && Array.isArray(CTX.agentUsage.ranking) ? CTX.agentUsage.ranking : []).filter(x => x && x.slug && AGENTS[x.slug] && x.value > 0).slice(0, 5);
  const cv = CTX.intern && CTX.correctievrij;
  return `<section class="vak" style="display:flex;flex-direction:column;gap:12px"><h2 class="vakkop">De afgelopen 4 weken · ${telwoord(tot, "ding", "dingen")} afgerond</h2>
    <div class="cijfers"><div class="teller"><b>${som("team")}</b><span>helemaal door je team</span></div><div class="teller"><b>${som("voor")}</b><span>door jou, met voorwerk van je team</span></div><div class="teller"><b>${som("zelf")}</b><span>door jou alleen</span></div></div>
    <div class="grafiekrij">${svg}<div class="legenda2"><span><i class="l-team"></i>helemaal door je team (zelf afgerond)</span><span><i class="l-voor"></i>jij, met voorwerk van je team</span><span><i class="l-zelf"></i>jij alleen</span></div></div>
    <p class="klein stil">Rekenhulp: met ± <label class="sr" for="minuten">Minuten per stuk</label><select id="minuten" data-change="minuten" class="mono" style="min-height:32px;border:1px solid var(--veldrand);border-radius:6px;background:var(--surface)">${[10, 15, 25, 45, 60].concat([10, 15, 25, 45, 60].includes(min) ? [] : [min]).map(m => `<option value="${m}" ${m === min ? "selected" : ""}>${m}</option>`).join("")}</select> minuten per stuk scheelde je team je ongeveer <b>${telwoord(uren, "uur", "uur")}</b>.</p></section>
    ${cv && cv.aanwezig && typeof cv.pct === "number" ? `<section class="vak" style="display:flex;flex-direction:column;gap:8px"><h2 class="vakkop">Klopte het werk? · alleen intern</h2><p>Van de ${telwoord(cv.autonoom, "actie", "acties")} die je team de afgelopen ${cv.vensterDagen} dagen zelf afrondde, bleef ${Math.round(cv.pct)}% zonder correctie staan.</p></section>` : ""}
    ${gebruik.length ? `<section class="vak" style="display:flex;flex-direction:column;gap:6px"><h2 class="vakkop">Het meest ingezet · afgelopen ${telwoord(CTX.periodWeeks || 12, "week", "weken")}</h2>
      ${gebruik.map(x => `<div class="tussen">${agKnop(x.slug)}<span class="mono">${x.value}×</span></div>`).join("")}</section>` : ""}`;
}

/* Dashboard v2 — Gegevens: overzicht → lijst → één rij als pagina.

function domeinLabel(k) { const d = CTX && CTX.schema.datadomeinen[k]; return (DOMEIN_KLANTTAAL[k] || [])[0] || (d && d.naam) || k; }

    const t = dataCelTekst(getField(r, v.naam));

/* ---------- De lijst ---------- */

/* ---------- Eén rij als pagina ---------- */

  if (v.type === "datum") return esc(datumKort(t) || t);

  if (v.type === "relatie") return relatiesVanVeld(v, w).map(relatieKnop).join(" ") || esc(t);
  if (v.type === "getal" && /omzet|bedrag|waarde|tarief|prijs/i.test(v.naam)) return esc(euro(w));
  return esc(t);
}

const VELDEN_NIEUW = {

function nieuwVelden(k) {

/* Wiring: daglink of inloggen -> werkruimte laden -> berekenen -> tonen.
 *
 * Tonen doet de schermlaag van dashboard v2 (src/v2-*.js, via window.V2);
 * dit bestand bepaalt alleen wélke werkruimte, met welke rechten, en rekent
 * de context uit die de schermen lezen. Schrijft nooit iets terug behalve,
 * optioneel en lokaal, wanneer je de laatste keer laadde en welke
 * minuten-per-actie-instelling je koos (geen bundelinhoud) — zie
 * rememberChoice()/rememberMinuten(). */

const LS_KEY = "agentic-team-dashboard:laatst-gebruikt";
const LS_MINUTEN_KEY = "agentic-team-dashboard:minuten-per-actie";

let currentBundle = null;
let currentPeriodWeeks = 12;
let currentMinutenPerActie = 25;

function rememberChoice(route, label) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ route, label, when: new Date().toISOString() }));
  } catch (e) { /* privémodus of quota — dan onthouden we het gewoon niet */ }
}

function rememberMinuten(v) {
  try { localStorage.setItem(LS_MINUTEN_KEY, String(v)); } catch (e) { /* zie hierboven */ }
}

function restoreMinuten() {
  try {
    const raw = localStorage.getItem(LS_MINUTEN_KEY);
    if (raw) {
      const n = parseInt(raw, 10);
      if (!isNaN(n) && n > 0) currentMinutenPerActie = n;
    }
  } catch (e) { /* zie hierboven */ }
}

async function handleBundle(bundle, route, label, { behoudRoute = false, naarRoute = null } = {}) {
  currentBundle = bundle;
  rememberChoice(route, label);
  // Een nieuw geladen werkruimte begint op Voor jou. Na verversen of een
  // schrijfactie blijf je waar je was (behoudRoute); na inloggen kom je uit
  // waar je naartoe wilde (f44, naarRoute).
  if (naarRoute) window.location.hash = naarRoute;
  else if (!behoudRoute && window.location.hash && window.location.hash !== "#/") {
    // Een route die al in de adresbalk stond (een deeplink) blijft staan.
    if (!bedoeldeRoute(window.location.hash)) window.location.hash = "#/";
  }
  renderAll();
}

/* i81: één rij bijwerken na een schrijfactie, zonder de bundel opnieuw op te
 * halen. `wijziging` is { entry } (het antwoord op PATCH/POST: de rij zoals de
 * instantie hem opsloeg) of { weg: entryId } (na DELETE). Daarna rekent
 * renderAll alles opnieuw uit, zodat tellers, Voor jou en Gegevens dezelfde
 * rijen tonen. Geeft false als er niets bij te werken viel; de aanroeper valt
 * dan terug op herladen. */
function werkRijBij(key, wijziging) {
  const bundle = currentBundle;
  const w = wijziging || {};
  if (!bundle || !bundle.domains || !key) return false;
  let dom = bundle.domains[key];
  if (w.weg) {
    if (!dom || !Array.isArray(dom.rows)) return false;
    dom.rows = dom.rows.filter(r => r.__entryId !== w.weg);
  } else if (w.entry && w.entry.entryId) {
    // Een domein dat bij het laden leeg was, staat niet in de bundel.
    if (!dom || !Array.isArray(dom.rows)) {
      dom = bundle.domains[key] = { aanwezig: true, rows: [], staleAt: null,
        herkomstLabel: `werkruimte — ${key} (0 entries, live opgehaald)` };
    }
    const rij = rijVanEntry(w.entry);
    const plek = dom.rows.findIndex(r => r.__entryId === rij.__entryId);
    dom.rows = plek === -1 ? [rij].concat(dom.rows) : dom.rows.map((r, i) => (i === plek ? rij : r));
    const dt = w.entry.bijgewerkt ? new Date(w.entry.bijgewerkt) : null;
    if (dt && !isNaN(dt.getTime()) && (!dom.staleAt || dt > dom.staleAt)) dom.staleAt = dt;

  if (typeof dom.herkomstLabel === "string") {
    dom.herkomstLabel = dom.herkomstLabel.replace(/\(\d+ entries/, `(${dom.rows.length} entries`);
  }
  renderAll();
  return true;
}

      sporenTotaal: m.sporenTotaal, metricsMeta: m.meta, correctievrij: m.correctievrij,
      relaties: m.relaties || null,
      metricsWerk: m.werk || null,
      minutenPerActie: currentMinutenPerActie,
      intern: bundle.intern === true,
      bundelWaarschuwingen: (bundle.waarschuwingen || []).slice(),
      veldWaarschuwingen: (m.waarschuwingen || []).slice(),
      waarschuwingen: (bundle.waarschuwingen || []).concat(m.waarschuwingen || []),
      // b62: ook naast een metricsbestand komen de rijen uit je werkruimte, en
      // wie ingelogd is mag die bijwerken (per domein, zie magDomeinBewerken).
      ...schrijfHaken(),
    };
  }

  const periodWeeks = currentPeriodWeeks;
  const m = buildMetricsFromRowsBundle(bundle, schema, agentLookup, today, periodWeeks, currentMinutenPerActie);
  return {
    bundle, schema, agentLookup, today, periodWeeks: m.periodWeeks, periodDays: m.periodDays,
    z1: voegTeamOogstToeAanAandacht(m.z1, bundle, schema),
    z2: m.z2, z3: m.z3, z4: m.z4, z5: m.z5,
    activiteit: m.activiteit, adopt: m.adopt, tijdwinst: m.tijdwinst,
    agentUsage: kiesAgentGebruik(m.agentUsage, feedItemsVoorTelling(bundle, schema, agentLookup), schema, today, m.periodDays, bundle.activaties),
    sporenTotaal: m.sporenTotaal, metricsMeta: m.meta, correctievrij: m.correctievrij,
    bundelWaarschuwingen: (m.waarschuwingen || []).slice(),
    veldWaarschuwingen: [],
    waarschuwingen: m.waarschuwingen,
    minutenPerActie: currentMinutenPerActie,
    intern: bundle.intern === true,
    ...schrijfHaken(),
  };
}

/* Wat een scherm nodig heeft om te schrijven: de bron, of die mag schrijven,
 * en de drie manieren om daarna bij te tekenen. Op beide routes hetzelfde. */
function schrijfHaken() {
  return {
    bron: huidigeBron,
    kanSchrijven: bronKanSchrijven(huidigeBron),
    // Na een schrijfactie blijf je waar je was — zie handleBundle().
    herlaad: () => laadWerkruimte(huidigeBron, { behoudRoute: true }),
    // i81: normaal hoeft dat niet eens: de instantie stuurt de opgeslagen rij
    // terug, en die vervangt de rij hier ter plekke.
    werkBij: (key, wijziging) => werkRijBij(key, wijziging),
    hertekenAlles: () => renderAll(),
  };
}

/* b62: wie ben je? Met een ingelogde sessie één keer bij het laden. Alleen een
 * GEKOZEN naam telt: dan tellen Voor jou en Acties per persoon. */
let naamBijLadenGedaan = null;
function naamBijLaden(ctx) {
  const bron = ctx.bron;
  if (!bron || !bron.oauth || mijnNaam(bron)) return;
  if (naamBijLadenGedaan === bron.token) return;
  naamBijLadenGedaan = bron.token;
  void haalNaamvoorstel(bron).then((r) => {
    if (r && r.gezet && mijnNaam(bron)) renderAll();
  }).catch(() => { /* geen naam: dan telt alles, en vraagt de eerste knop erom */ });
}

/* Modules en teamleden (Beheer, en wie er in je team zit): eenmalig ophalen
 * voor dit token; komt er iets binnen, dan opnieuw tekenen. */
function laadBeheer() {
  const hadModules = moduleOverzichtBeschikbaar();
  void laadModuleOverzicht(huidigeBron).then((overzicht) => { if (overzicht || hadModules) route(); });
  void laadTeam(huidigeBron).then((t) => { if (t) route(); });
}

function renderAll() {
  const bundle = currentBundle;
  if (!bundle) { window.__dashboardCtx = undefined; return; }
  const ctx = buildContext();
  if (ctx.versionError) {
    // Geen dashboard tekenen op een bestand dat dit dashboard niet herkent —
    // wel duidelijk zeggen wat er aan de hand is en wat je eraan kunt doen.
    window.__dashboardCtx = undefined;
    const fout = ctx.versionError;
    V2.versieFout({
      titel: "Deze cijfers kan dit dashboard nog niet lezen",
      tekst: fout && fout.tekst ? String(fout.tekst) : "Het metricsbestand heeft een vorm die dit dashboard niet kent. Vraag je Coördinator om een nieuwe dagstart.",
    });
    return;
  }
  window.__dashboardCtx = ctx; // alleen al-berekende resultaten, geen nieuwe databron
  naamBijLaden(ctx);
  V2.toon(ctx);
}

/* Teken opnieuw zonder iets opnieuw uit te rekenen (bv. het moduleoverzicht
 * kwam binnen). Oudere modules roepen deze naam aan. */
function route() { V2.render(); }

/* f30 — de download. Een volle werkruimte kan tientallen megabytes zijn; de
 * melding zegt dus eerst dat er iets gebeurt. */
async function startExport(formaat) {
  if (!huidigeBron) { meld("Je werkruimte is nog niet geladen. Probeer het zo nog eens."); return; }
  meld("Je export wordt klaargemaakt…");
  try {
    await downloadExport(huidigeBron, formaat);
    meld("Klaar — je download staat in je downloadmap.");
  } catch (err) {
    console.error(err);
    meld(err.message || "Het downloaden is niet gelukt.", { fout: true });
  }
}

/* Uitloggen: de sessie weg. Staat er nog een daglink in dit tabblad, dan kijk
 * je daarmee verder mee; anders terug naar het begin. */
function uitloggen() {
  vergeetOauthSessie();
  resetOauthVernieuwing();
  naamBijLadenGedaan = null;
  const daglink = restoreDaglink();
  if (daglink) { laadWerkruimte(daglink, { behoudRoute: true }); return; }
  currentBundle = null;
  huidigeBron = null;
  toonLegeStaat("Je bent uitgelogd", "Log opnieuw in, of open je dashboard via de daglink in je dagstart.", { login: true });
}

function startLogin() {
  startOauthLogin().catch((err) => {
    console.error(err);
    meld((err && err.message) || "Inloggen kon niet starten.", { fout: true });
  });
}

function wireNavigatie() {
  window.addEventListener("hashchange", () => {
    // Een daglink aanklikken terwijl deze pagina al openstaat wijzigt alleen
    // het #fragment — de browser herlaadt dan niet. Zonder dit pad zou een
    // verse daglink op een open tabblad stilletjes niets doen.
    const daglink = parseDaglinkFragment(window.location.hash);
    if (daglink) {
      try { sessionStorage.setItem(DAGLINK_SS_KEY, JSON.stringify(daglink)); } catch (e) { /* privémodus */ }
      history.replaceState(null, "", window.location.pathname + window.location.search + "#/");
      laadWerkruimte(daglink);
      return;
    }
    V2.hashGewijzigd();
  });
}

/* Zolang er geen werkruimte is: wat er aan de hand is, met inloggen erbij als
 * dat kan. Daaronder staat de Hulp — die werkt zonder login en zonder data. */
let eindToestand = false; // er staat al een melding met inlogknop (bv. een mislukte login)
function toonLegeStaat(titel, tekst, { login = null } = {}) {
  if (currentBundle) return;
  eindToestand = login === true;
  V2.leeg({ titel, tekst, bezig: login === false, fout: /niet|verlopen|onvolledig/i.test(titel) && login === true });
}

/* f30: de exportknop heeft dezelfde bron nodig als de bundel. Bewaren in
 * plaats van opnieuw afleiden — bij OAuth is dit object gedeeld en draagt het
 * een eventueel vernieuwd token. */
let huidigeBron = null;

async function laadWerkruimte(bron, { behoudRoute = false, naarRoute = null } = {}) {
  huidigeBron = bron;
  if (!currentBundle || !behoudRoute) {
    currentBundle = null;
    toonLegeStaat("Je team wordt geladen…", "Live uit je werkruimte.", { login: false });
  }
  try {
    const bundle = await loadWerkruimteBundle(bron);
    await handleBundle(bundle, "werkruimte", bundle.sourceLabel, { behoudRoute, naarRoute });
    laadBeheer();
  } catch (err) {
    console.error(err);
    currentBundle = null;
    if (err.oauthVerlopen) {
      // De sessie is op; opnieuw inloggen is de enige uitweg, dus staat de
      // knop er meteen bij in plaats van een doodlopende melding.
      vergeetOauthSessie();
      resetOauthVernieuwing();
      toonLegeStaat("Kon je werkruimte niet laden", err.message, { login: true });
      return;
    }
    if (err.daglinkVerlopen) {
      vergeetDaglink();
      const extra = /verlopen/i.test(err.message) ? " Daglinks zijn 24 uur geldig." : "";
      toonLegeStaat("Deze daglink werkt niet meer", err.message + extra, { login: true });
      return;
    }
    const heeftAdvies = /Coördinator/.test(err.message);
    toonLegeStaat("Kon je werkruimte niet laden",
      heeftAdvies ? err.message : err.message + " Vraag je Coördinator om een nieuwe daglink.",
      { login: true });
  }
}

/* p10: de terugkomst van het consentscherm. Staat er een `code` in het
 * fragment, dan wisselen we die in vóórdat we een bron kiezen — de adresbalk
 * is daarna leeg en de sessie staat in sessionStorage. */
async function verwerkOauthRedirect() {
  const redirect = parseOauthRedirect(window.location.hash);
  if (!redirect) return null;
  toonLegeStaat("Je wordt ingelogd…", "", { login: false });
  try {
    const sessie = await voltooiOauthLogin(redirect);
    resetOauthVernieuwing();
    return oauthBron(sessie);
  } catch (err) {
    console.error(err);
    toonLegeStaat("Inloggen is niet gelukt", err.message, { login: true });
    return null;
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  restoreMinuten();
  V2.start({
    login: startLogin,
    uitloggen,
    ververs: () => { if (huidigeBron) laadWerkruimte(huidigeBron, { behoudRoute: true }); },
    exporteer: (formaat) => startExport(formaat),
    // De rekenhulp op Resultaat: hoeveel minuten scheelt één stuk werk je?
    minuten: (v) => { if (v > 0) { currentMinutenPerActie = v; rememberMinuten(v); if (currentBundle) renderAll(); } },
  });
  wireNavigatie();
  const uitRedirect = await verwerkOauthRedirect();
  const bron = uitRedirect || restoreBron();
  // Alleen ná een geslaagde login is er een bedoelde route om naar terug te
  // keren; bij een gewone daglink staat de route al in de adresbalk.
  let naarRoute = uitRedirect ? neemBedoeldeRoute() : null;
  if (!naarRoute && bron && bedoeldeRoute(window.location.hash)) naarRoute = window.location.hash;
  // f48: de kale link uit het slotbericht van de werkronde wees naar de
  // actietabel. Wat daar op je wachtte, staat nu in Voor jou.
  if (naarRoute === "#/data/acties") naarRoute = "#/";
  if (bron) { laadWerkruimte(bron, { naarRoute }); return; }
  // Een eindtoestand (een mislukte login bv.) blijft staan, met de Hulp eronder.
  if (eindToestand) return;
  // f53: de Hulp werkt zonder login — daar hoort geen inlogpoort voor.
  const deeplink = bedoeldeRoute(window.location.hash) && !/^#\/?$/.test(window.location.hash);
  if (!hulpDoel(window.location.hash) && deeplink && oauthMogelijk()) {
    toonLegeStaat("Log in om deze pagina te openen",
      "Deze link wijst naar een pagina in je eigen dashboard. Log in met je licentie — je komt daarna precies op die pagina uit.",
      { login: true });
    return;
  }
  // Er stond wél iets achter het #-teken, maar er kwam geen bruikbare bron uit.
  if (hashLijktOpDaglink(window.location.hash)) {
    toonLegeStaat("Deze link is onvolledig",
      "Er staat wel iets achter het #-teken van deze link, maar geen bruikbaar daglink-token — meestal is de link afgekapt bij het kopiëren of doorsturen. Vraag je Coördinator om een nieuwe.",
      { login: true });
    return;
  }
  // Geen link en geen sessie: de Hulp is de lege staat, met inloggen bovenaan.
  toonLegeStaat(oauthMogelijk() ? "Log in om je team te zien" : "Open je dashboard via de daglink in je dagstart",
    oauthMogelijk() ? "Of open dit dashboard via de daglink in je dagstart. Hieronder lees je hoe je team werkt." : "Vraag je Coördinator in Claude om een daglink. Hieronder lees je hoe je team werkt.",
    { login: true });
});

</script>
