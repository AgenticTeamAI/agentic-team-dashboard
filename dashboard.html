// ── Correctievrij (i25) — tekstjes voor de KPI-tegel ─────────────────
function correctievrijKpi(cv) {
  if (!cv || !cv.aanwezig) {
    return { getal: "n.v.t.", label: cv && cv.reden ? cv.reden : "Niet beschikbaar in deze bundel.", gate: "Gate f19: niet te bepalen" };
  }
  const berekenbaar = cv.pct !== null;
  const getal = berekenbaar ? `${Math.round(cv.pct)}%` : "n.v.t.";
  const label = berekenbaar
    ? `${cv.autonoom - cv.gecorrigeerd} van ${cv.autonoom} autonoom afgeronde acties zonder correctie · laatste ${cv.vensterDagen} dagen`
    : (cv.reden || "niet te berekenen");
  const g = cv.gate;
  const gate = g.gehaald
    ? `Gate f19: gehaald ✓ (${g.wekenGehaald}/${g.wekenVereist} weken ≥ ${cv.drempel}%)`
    : `Gate f19: nog niet — ${g.wekenGehaald}/${g.wekenVereist} weken ≥ ${cv.drempel}%`;
  return { getal, label, gate };
}

function renderDetailCorrectievrij(el, cv) {
  if (!cv || !cv.aanwezig) {
    el.innerHTML = `<div class="card signaal-grijs"><div class="kop">Correctievrij</div><div class="getal">n.v.t.</div><div class="detail">${esc(cv && cv.reden ? cv.reden : "Niet beschikbaar in deze bundel.")}</div></div>
      <p class="footnote">Vanaf registry 1.34.0 krijgt het domein Acties de velden <em>Afgerond door</em>, <em>Afgerond op</em>, <em>Gecorrigeerd</em> en <em>Correctie</em>. Zodra die gevuld zijn (rijenroute) of de Coördinator het correctievrij-blok meelevert (metricsroute), verschijnt dit percentage vanzelf.</p>`;
    return;
  }
  const kpi = correctievrijKpi(cv);
  const g = cv.gate;
  const gateKlasse = g.gehaald ? "signaal-groen" : "signaal-oranje";
  const gateTekst = g.gehaald
    ? `De laatste ${g.wekenVereist} afgesloten weken zaten elk op of boven ${cv.drempel}% met minstens één autonoom afgeronde actie.`
    : `Nog niet gehaald: ${g.reden || "onbekende reden"}. Nodig: ${g.wekenVereist} aaneengesloten afgesloten weken, elk met autonoom werk én ≥ ${cv.drempel}%.`;

  const rijen = cv.weken.map(w => `<tr>
      <td>${esc(w.label)}</td>
      <td>${esc(w.autonoom)}</td>
      <td>${esc(w.gecorrigeerd)}</td>
      <td>${w.pct === null ? "—" : esc(Math.round(w.pct)) + "%"}</td>
      <td>${w.afgesloten ? "afgesloten" : "lopend"}</td>
    </tr>`).join("");

  el.innerHTML = `
    <p>Het <strong>correctievrij-percentage</strong> is de succesmaat van f9 en de gate voor f19: het aandeel acties dat een agent <strong>autonoom</strong> heeft afgerond (werkronde + kwaliteitscontrole, daarna zelf op "Klaar" gezet) en dat daarna <strong>niet door een mens is gecorrigeerd</strong>.</p>
    <div class="grid-9">
      <div class="card"><div class="kop">Correctievrij</div><div class="getal">${esc(kpi.getal)}</div><div class="detail">${esc(kpi.label)}</div></div>
      <div class="card"><div class="kop">Autonoom afgerond</div><div class="getal">${esc(cv.autonoom)}</div><div class="detail">acties met "Afgerond door" gevuld en "Afgerond op" in de laatste ${esc(cv.vensterDagen)} dagen</div></div>
      <div class="card"><div class="kop">Gecorrigeerd</div><div class="getal">${esc(cv.gecorrigeerd)}</div><div class="detail">waarvan ${esc(cv.heropend)} heropend (status niet meer "Klaar")</div></div>
      <div class="card ${gateKlasse}"><div class="kop">Gate f19</div><div class="getal">${g.gehaald ? "gehaald ✓" : "nog niet"}</div><div class="detail">${esc(g.wekenGehaald)}/${esc(g.wekenVereist)} weken ≥ ${esc(cv.drempel)}% · ${esc(gateTekst)}</div></div>
    </div>
    <h3>Per kalenderweek (maandag = weekstart)</h3>
    <div class="tabel-scroll"><table class="detail-table">
      <thead><tr><th>Week van</th><th>Autonoom afgerond</th><th>Gecorrigeerd</th><th>Correctievrij</th><th>Status</th></tr></thead>
      <tbody>${rijen || `<tr><td colspan="5">Geen weekgegevens in deze bundel.</td></tr>`}</tbody>
    </table></div>
    <p class="footnote"><strong>Definities.</strong> <em>Autonoom afgerond</em> = een agent zette de actie zelf op "Klaar" nadat de kwaliteitscontrole akkoord gaf; het veld <em>Afgerond door</em> draagt dan de agentnaam en <em>Afgerond op</em> de datum. <em>Gecorrigeerd</em> = een mens vinkte daarna <em>Gecorrigeerd</em> aan (met de reden in <em>Correctie</em>) óf heropende de actie (status niet meer "Klaar"). Een afkeuring door de kwaliteitscontrole vóór de afronding telt <strong>niet</strong> als correctie — dat is het normale werkproces. Het venster is de laatste ${esc(cv.vensterDagen)} dagen tot en met vandaag; de weektabel telt alle autonoom afgeronde acties per kalenderweek.</p>
    <p class="footnote"><strong>Gate f19</strong> (fase 1 en verder): ${esc(g.wekenVereist)} aaneengesloten <em>afgesloten</em> kalenderweken (weekstart + 7 dagen ≤ vandaag), elk met minstens één autonoom afgeronde actie en een weekpercentage ≥ ${esc(cv.drempel)}%. De lopende week telt nog niet mee.</p>
    ${cv.opmerking ? `<p class="footnote">Opmerking van de Coördinator: ${esc(cv.opmerking)}</p>` : ""}
    <p class="footnote">Met de hand na te rekenen: (a − g) / a — hier (${esc(cv.autonoom)} − ${esc(cv.gecorrigeerd)}) / ${esc(cv.autonoom)}${cv.pct === null ? " (geen noemer)" : ` = ${esc(Math.round(cv.pct))}%`}.</p>`;
}

function renderDetailGebruik(el, z3, schema, today, periodDays, agentUsage, ctx) {

/* i68 — dezelfde indeling per module als de sporenweergave (renderZone3),
 * maar met de inzet die de werkruimte telde. Bewust niet náást de sporen:
 * twee tellingen van "gebruik" die elkaar tegenspreken kosten meer vertrouwen
 * dan ze uitleggen. */
function renderGebruikUitActivaties(el, usage, schema, today, periodDays) {
  const perSlug = {};
  for (const r of usage.ranking) perSlug[r.slug] = r;
  const sinds = usage.sinds ? fmtDate(parseDateField(usage.sinds)) : null;
  const perModule = {};
  for (const a of schema.agents) (perModule[a.module] = perModule[a.module] || []).push(a);
  const blokken = Object.entries(perModule).map(([modKey, agents]) => {
    const modNaam = (schema.modules[modKey] && schema.modules[modKey].naam) || modKey;
    const rijen = agents.map(a => {
      const r = perSlug[a.slug] || { value: 0, totaal: 0 };
      const inzet = r.totaal === 0
        ? `<span class="spoor geen">nog niet ingezet${sinds ? ` sinds ${esc(sinds)}` : ""}</span>`
        : `<span class="spoor actief">${r.value}× ingezet in ${periodDays}d · ${r.totaal}× ${sinds ? `sinds ${esc(sinds)}` : "totaal"}</span>`;
      return `<div class="agent-row klikbaar" data-goto="agent/${esc(a.slug)}" role="link" tabindex="0"><span class="emoji">${a.emoji}</span><span class="naam">${esc(a.displayName)}</span>${inzet}<span class="pijl">→</span></div>`;
    }).join("");
    return `<div class="module-block"><h3>${esc(modNaam)}</h3>${rijen}</div>`;
  }).join("");
  const weken = (usage.perWeek || []).map(w =>
    `<tr><td>week van ${esc(fmtDate(parseDateField(w.week_start)))}</td><td>${w.totaal}</td></tr>`).join("");
  el.innerHTML = blokken + (weken
    ? `<h3>Inzet per week</h3><div class="tabel-scroll"><table class="detail-table"><thead><tr><th>Week</th><th>Keer ingezet</th></tr></thead><tbody>${weken}</tbody></table></div>`
    : "") + `
    <p class="footnote">Inzet telt elke keer dat een agent in een gesprek aan de slag ging, ook als hij daarna niets wegschreef. Je werkruimte houdt dat zelf bij, per week en per agent; er gaat geen gesprek of inhoud mee. "Nog niet ingezet" gaat alleen over de periode sinds de telling begon.</p>
    <p class="footnote warn">Dit dashboard kan niet zien welke modules je hebt aangeschaft. Is een agent nooit ingezet, dan kan dat betekenen dat hij niet gebruikt wordt — of dat je die module niet hebt.</p>`;
}

// ── Detail per agent (f4: doorklik per agent) ─────────────────────────
function renderDetailAgent(el, slug, ctx) {
  const agent = ctx.schema.agents.find(a => a.slug === slug);
  if (!agent) { el.innerHTML = `<p>Onbekende agent.</p>`; return; }
  const perMod = (ctx.z3.perModule && ctx.z3.perModule[agent.module]) || [];
  const t = perMod.find(a => a.slug === slug) || { geenSpoor: true, aantalPeriode: 0, aantalTotaal: 0, laatst: null };
  const modNaam = (ctx.schema.modules[agent.module] && ctx.schema.modules[agent.module].naam) || agent.module;

  // i68: de inzet uit de werkruimte bovenaan. De kaarten eronder gaan over
  // sporen (rijen met deze agentnaam) en heten ook zo.
  const usage = ctx.agentUsage;
  const inzetRij = usage && usage.bron === "activaties" ? usage.ranking.find(r => r.slug === slug) : null;
  const inzet = inzetRij
    ? `<p class="footnote">Ingezet: <strong>${inzetRij.value}×</strong> in de laatste ${ctx.periodDays} dagen, ${inzetRij.totaal}× ${usage.sinds ? `sinds ${esc(fmtDate(parseDateField(usage.sinds)))}` : "totaal"}. Sporen hieronder zijn wat deze agent daarbij wegschreef.</p>`
    : "";
  const cards = `${inzet}<div class="grid-9">
    <div class="card"><div class="kop">Sporen in de periode</div><div class="getal">${t.aantalPeriode}</div><div class="detail">laatste ${ctx.periodDays} dagen</div></div>
    <div class="card"><div class="kop">Sporen totaal</div><div class="getal">${t.aantalTotaal}</div><div class="detail">in de hele bundel</div></div>
    <div class="card${t.laatst ? "" : " signaal-grijs"}"><div class="kop">Laatste spoor</div><div class="getal">${t.laatst ? fmtDate(t.laatst) : "—"}</div><div class="detail">${t.laatst ? relAge(t.laatst, ctx.today) : "geen spoor met datum gevonden"}</div></div>
  </div>`;

  // Bij een rijenroute kunnen we de onderliggende rijen van deze agent laten
  // zien; het metricsbestand draagt alleen totalen — dat zeggen we er dan bij.
  let lijsten = "";
  const bundle = ctx.bundle;
  if (bundle && bundle.kind !== "metrics") {
    const MAX = 15;
    function rijenVan(domeinKey, veldDatum, veldTitel) {
      const dom = bundle.domains && bundle.domains[domeinKey];
      if (!dom) return null;
      return dom.rows
        .filter(r => matchAgentValue(getField(r, "Agent"), ctx.agentLookup) === slug)
        .map(r => ({ titel: String(getField(r, veldTitel) || "(zonder titel)"), datum: parseDateField(getField(r, veldDatum)), status: getField(r, "Status") }))
        .sort((a, b) => (b.datum ? b.datum.getTime() : 0) - (a.datum ? a.datum.getTime() : 0));
    }
    const acties = rijenVan("acties", "Deadline", "Actie");
    const lessen = rijenVan("lessen_inzichten", "Datum", "Les");
    function lijstHtml(kop, items, datumLabel) {
      if (items === null) return "";
      if (!items.length) return `<h3>${kop}</h3><p class="footnote">Geen rijen van deze agent in dit domein.</p>`;
      const rows = items.slice(0, MAX).map(i =>
        `<tr><td>${esc(i.titel)}</td><td>${i.status ? esc(String(i.status)) : ""}</td><td>${i.datum ? fmtDate(i.datum) : "—"}</td></tr>`).join("");
      const rest = items.length > MAX ? `<p class="footnote">… en nog ${items.length - MAX} — zie de bron zelf.</p>` : "";
      return `<h3>${kop} (${items.length})</h3>
        <div class="tabel-scroll"><table class="detail-table"><thead><tr><th>Titel</th><th>Status</th><th>${datumLabel}</th></tr></thead><tbody>${rows}</tbody></table></div>${rest}`;
    }
    lijsten = lijstHtml("Acties van deze agent", acties, "Deadline") + lijstHtml("Lessen van deze agent", lessen, "Datum");
  } else {
    lijsten = `<p class="footnote">Deze bundel is een kant-en-klaar metricsbestand: het draagt per agent alleen de totalen hierboven, geen losse rijen. Wil je de onderliggende acties en lessen van deze agent zien, dan moeten de werkdata-rijen in je werkruimte staan (in plaats van alleen een dagelijks metricsbestand).</p>`;
  }

  el.innerHTML = `
    <p><strong>${agent.emoji} ${esc(agent.displayName)}</strong> · module ${esc(modNaam)}</p>
    ${typeof opdrachtKnopHtml === "function" && beschikbareSpecialisten(ctx).some(s => s.slug === slug) ? `<p>${opdrachtKnopHtml(ctx, { tekst: `Geef ${agent.displayName} een opdracht`, voor: slug })}</p>` : ""}
    ${cards}
    ${lijsten}
    <p class="footnote">Sporen komen uit Acties (veld Agent, tijdstip via Deadline) en Lessen &amp; Inzichten (veld Agent, veld Datum). "Geen spoor" ≠ "nooit ingezet": een agent die wél draaide maar niets wegschreef, is hiermee niet te onderscheiden van een agent die stilstond.</p>
    <a class="detail-link" data-goto="gebruik">← Alle agents, per module</a>`;
}

// ── Router ────────────────────────────────────────────────────────────
// Vier top-level tabs plus de bestaande detailroutes, die ongewijzigd
// blijven: elke bestaande #/detail/…-link (en de f4-agentdoorklik) werkt
// precies zoals hij werkte. Geeft altijd {soort, …} terug.
//   {soort:"tab", tab}                 #/ · #/team · #/data · #/prestaties
//   {soort:"data", domein}             #/data/<domein>
//   {soort:"detail", key, tab}         #/detail/<key> · #/detail/agent/<slug>
function bepaalActieveView() {
  const hash = window.location.hash || "";

  const ag = hash.match(/^#\/?detail\/agent\/([a-z0-9-]+)/);
  if (ag) return { soort: "detail", key: "agent/" + ag[1], tab: "prestaties" };

  const m = hash.match(/^#\/?detail\/([a-z]+)/);
  if (m && DETAIL_VOLGORDE.some(d => d.key === m[1])) {
    return { soort: "detail", key: m[1], tab: DETAIL_TAB[m[1]] || "vandaag" };
  }

  // f49: één rij als pagina.
  const rp = hash.match(/^#\/data\/([a-z0-9_]+)\/([^/?#]+)/);
  if (rp) {
    let id = rp[2];
    try { id = decodeURIComponent(id); } catch (e) { /* laat hem zoals hij is */ }
    return { soort: "rij", domein: rp[1], id, tab: "data" };
  }

  const dom = hash.match(/^#\/data\/([a-z0-9_]+)/);
  if (dom) return { soort: "data", domein: dom[1], tab: "data" };

  // f47: één actie als blad, met een eigen adres. Kale #/acties is de lijst
  // (tot de Acties-tab er is, f48, woont die onder Gegevens).
  const item = hash.match(/^#\/acties\/([^/?#]+)/);
  if (item) {
    let id = item[1];
    try { id = decodeURIComponent(id); } catch (e) { /* laat hem zoals hij is */ }
    return { soort: "item", domein: "acties", id, tab: "acties" };
  }

  const tab = hash.match(/^#\/([a-z-]+)/);
  if (tab && TAB_ROUTES.indexOf(tab[1]) !== -1) return { soort: "tab", tab: tab[1] };

  return { soort: "tab", tab: "vandaag" };
}


/* f25 — Data-tab: een alleen-lezen blik op de werkdata die al in de bundel

const DATA_MAX_RIJEN = 200;
const DATA_MAX_KOLOMMEN = 6;
/* f44: velden die altijd in beeld horen, ook als ze buiten de eerste kolommen

const HERKOMST_VELDEN = ["Aangemaakt door", "Afgerond door"];

// Domeinen die per opzet nooit als rijen in de bundel zitten. We laten ze

const DATA_NIET_IN_BUNDEL = {

/* i72 — waar woont een domein? Eén afleiding, vier antwoorden.
 *
 * `bundle.systeemPerDomein` komt uit het domein `bronkoppeling` en werd tot nu
 * toe alleen gebruikt om bewerken te blokkeren. De gebruiker kreeg het dus pas
 * te zien als straf, nádat hij iets probeerde — terwijl hij het nodig heeft
 * vóórdat hij zoekt.
 *
 * "Onbekend" is een eigen antwoord, geen synoniem voor "werkruimte". De kaart
 * is leeg in drie verschillende situaties: er is geen bronkoppeling, hij was
 * onleesbaar (de loader slikt die fout), of dit domein staat er niet in.
 * Zolang de UI niets beweerde was dat onschuldig; zodra we per domein gaan
 * zéggen waar het woont, wordt samenvouwen een onwaarheid.

 * De regels spiegelen die van de instantie, want die beslist uiteindelijk of
 * een schrijfactie doorgaat: agentic-team-werkruimte/src/werkruimte.ts:51-54
 * (ALTIJD_WERKRUIMTE, EXTERNE_SYSTEMEN) en :213-217 (trim().toLowerCase()).
 * Liepen die uit de pas, dan verbiedt of belooft het dashboard iets anders dan
 * de server doet. */
const ALTIJD_WERKRUIMTE = ["logboek", "bedrijfscontext", "bronkoppeling", "notities"];

/* Klanttaal per systeem. Een onbekende waarde wordt getoond zoals hij er staat
 * (geëscaped) — verzinnen is erger dan citeren. Bewust niet in src/teksten.js:
 * dat bestand is woordelijk juridisch getoetst en elke toevoeging daar vraagt
 * een nieuwe toets. */
const BRONSYSTEEM_NAMEN = {
  notion: "Notion",
  crm: "je CRM",
  hubspot: "HubSpot",
  werkboek: "een werkboek buiten je werkruimte",
  lokaal: "bestanden op een eigen computer",
  werkruimte: "je werkruimte",
};

function bronVan(ctx, key) {
  if (ALTIJD_WERKRUIMTE.indexOf(key) !== -1) {
    return { toestand: "hier", systeem: "werkruimte", naam: BRONSYSTEEM_NAMEN.werkruimte };
  }
  const kaart = (ctx && ctx.bundle && ctx.bundle.systeemPerDomein) || null;
  // Is er helemáál geen koppeling, dan weten we van geen enkel domein iets —
  // dan is er ook niets zinnigs per domein te zeggen. Is er wél een koppeling
  // maar staat dit domein er niet in, dan is dát een gat dat de gebruiker mag
  // zien. Twee verschillende soorten "onbekend", twee verschillende antwoorden.
  const geenKoppeling = !kaart || Object.keys(kaart).length === 0;
  if (geenKoppeling || !(key in kaart)) return { toestand: "onbekend", systeem: null, naam: null, geenKoppeling };
  const systeem = String(kaart[key] || "").trim().toLowerCase();
  if (!systeem) return { toestand: "onbekend", systeem: null, naam: null, geenKoppeling: false };
  if (systeem === "werkruimte") return { toestand: "hier", systeem, naam: BRONSYSTEEM_NAMEN.werkruimte };
  if (systeem === "geen") return { toestand: "nergens", systeem, naam: null };
  return { toestand: "elders", systeem, naam: BRONSYSTEEM_NAMEN[systeem] || systeem };
}

/* i72 — de Data-tab was 27 gelijkwaardige regels in registryvolgorde. Zelfs de

/* i71 — statusfilter. "Als het klaar is, wil ik het niet meer zien" was de

/* f44 — "Van je team": hetzelfde filter als het aandachtsitem op Vandaag, maar

let dataVanTeam = false;

function dataVelden(domein) {

/* Een cel kan een string, getal, checkbox, een lijst (multi_select) of sinds
 * f28 een verwijzing zijn. Alles wordt tekst; leeg blijft leeg (nooit
 * "undefined" op het scherm). */
function dataCelTekst(waarde) {
  if (waarde === null || waarde === undefined || waarde === "") return "";
  if (Array.isArray(waarde)) return waarde.map(dataCelTekst).filter(Boolean).join(", ");
  if (typeof waarde === "boolean") return waarde ? "ja" : "nee";
  if (typeof waarde === "object") {
    // f28: een verwijzing is {id, titel}. Zonder deze tak viel hij in de
    // objectregel hieronder en bleef de cel leeg — een lege cel leest als
    // "niet ingevuld", terwijl er wel degelijk een koppeling staat.
    if (typeof waarde.titel === "string") return waarde.titel;
    return "";
  }
  return String(waarde);
}

/* f23/f29 fase A — een relatiecel wordt een sprong naar het doeldomein.
 * De opgeslagen vorm is {id, titel} (of een lijst daarvan, bij meervoud);
 * de titel is server-side gezet en dus betrouwbaar genoeg als zoekterm.
 * Zonder titel (of naar een domein dat niet in de bundel zit) blijft het
 * gewoon tekst — een dode link is erger dan geen link. */
/* f49: waar een rij woont — een actie als blad, de rest als eigen pagina. */
function rijPaginaPad(domein, id) {
  return domein === "acties" ? `#/acties/${encodeURIComponent(id)}` : `#/data/${domein}/${encodeURIComponent(id)}`;
}

function rpHuidigeTitel(domein, id) {
  const ctx = typeof window !== "undefined" ? window.__dashboardCtx : null;
  const dom = ctx && ctx.schema && ctx.schema.datadomeinen[domein];
  const rij = dom && (dataRijenVan(ctx, domein) || []).find(r => r.__entryId === id);
  return rij ? detailTitel(dom, rij) : null;
}

function dataCelHtml(waarde, veld) {
  if (veld && veld.type === "relatie" && veld.naar) {
    const lijst = Array.isArray(waarde) ? waarde : (waarde === null || waarde === undefined || waarde === "" ? [] : [waarde]);
    const stukken = lijst.map(w => {
      const titel = w && typeof w === "object" && typeof w.titel === "string" ? w.titel : "";
      // f33: bij een polymorfe verwijzing (naar "*") staat het doeldomein in de
      // waarde. Zonder deze tak werd de link "#/data/*" — dood, en dood is
      // erger dan geen link.
      const doel = veld.naar === "*" ? (w && typeof w === "object" ? w.domein : "") : veld.naar;
      if (!titel || !doel || (doel in DATA_NIET_IN_BUNDEL)) return esc(dataCelTekst(w));
      const id = w && typeof w === "object" && typeof w.id === "string" ? w.id : "";
      // f49: de koppeling loopt via het id; de titel in de verwijzing is die van
      // toen hij gelegd werd. Staat de rij in de bundel, dan zijn naam van nu.
      const nu = id ? rpHuidigeTitel(doel, id) : null;
      const naam = nu || titel;
      if (!id) return `<a href="#/data/${esc(doel)}" class="relatie-link" data-relatie-zoek="${esc(titel)}">${esc(naam)}</a>`;
      return `<a href="${esc(rijPaginaPad(doel, id))}" class="relatie-link">${esc(naam)}</a>`;
    }).filter(Boolean);
    if (stukken.length) return stukken.join(", ");
  }
  return esc(dataCelTekst(waarde));
}

/* ── f33 fase A: één rij openklappen ─────────────────────────────────
 *
 * De tabel toont zes kolommen; een rij heeft er vaak twintig. Wat er dan
 * werkelijk over een organisatie, deal of actie bekend is, was nergens te
 * zien — en de verbanden al helemaal niet: verwijzingen wijzen één kant op,
 * terwijl je bij een organisatie juist wil weten wélke acties eraan hangen.
 *
 * Alles hier komt uit de al geladen bundel. Geen fetch, geen scope, geen
 * nieuw endpoint — en dus werkt het ook op de daglink, alleen-lezen. */
let dataDetail = null;  // { domein, entryId }
function zetDataDetail(domein, entryId) { dataDetail = domein && entryId ? { domein, entryId } : null; }
function wisDataDetail() { dataDetail = null; }

/* Wijst deze celwaarde naar (domein, id)? Dekt de enkelvoudige en meervoudige
 * vorm, en de polymorfe vorm die het doeldomein zelf meedraagt. */
function verwijstNaar(waarde, veld, domein, entryId) {
  const lijst = Array.isArray(waarde) ? waarde : [waarde];
  return lijst.some(w => {
    if (!w || typeof w !== "object" || w.id !== entryId) return false;
    return veld.naar === "*" ? w.domein === domein : veld.naar === domein;
  });
}

/* Welke rijen in de hele bundel wijzen naar deze rij? Gegroepeerd per
 * domein+veld, zodat "Acties · Organisatie (3)" leesbaar blijft. */
function terugverwijzingen(ctx, domein, entryId) {
  const uit = [];
  for (const [slug, dom] of Object.entries(ctx.schema.datadomeinen || {})) {
    const rijen = dataRijenVan(ctx, slug);
    if (!rijen || !rijen.length) continue;
    for (const veld of dataVelden(dom)) {
      if (veld.type !== "relatie") continue;
      const treffers = rijen.filter(r => verwijstNaar(getField(r, veld.naam), veld, domein, entryId));
      if (treffers.length) uit.push({ slug, dom, veld, treffers });
    }
  }
  return uit;
}

/* i75: welke velden verdienen de volle breedte? Niet op veldnaam — die
 * verschilt per domein en per registryversie — maar op wat er in staat. Een
 * regelovergang betekent dat de schrijver structuur bedoelde; boven de 180
 * tekens past het sowieso niet meer in een tabelcel. Verwijzingen en links
 * blijven uit deze tak: die worden al als klikbare titel gerenderd. */
const LANGE_TEKST_VANAF = 180;
function isLangeTekst(veld, tekst) {
  if (veld && (veld.type === "relatie" || veld.type === "url")) return false;
  return tekst.indexOf("\n") !== -1 || tekst.length > LANGE_TEKST_VANAF;
}

function detailTitel(domein, rij) {
  const titelVeld = dataVelden(domein).find(v => v.type === "titel");
  return (titelVeld && dataCelTekst(getField(rij, titelVeld.naam))) || "(zonder titel)";
}

function dataDetailHtml(ctx, key, rij) {
  const domein = ctx.schema.datadomeinen[key];
  const velden = dataVelden(domein);
  const gevuld = velden.filter(v => dataCelTekst(getField(rij, v.naam)) !== "");
  const leeg = velden.filter(v => dataCelTekst(getField(rij, v.naam)) === "").map(v => v.naam);

  // i75: een veld als Toelichting draagt het hele werkstuk van een agent. In de
  // smalle waardekolom werd dat één blok van duizenden tekens op regels van
  // honderdtwintig aanslagen, en de metadata eronder (Aangemaakt door, Afgerond
  // op) verdween twee schermen naar beneden. Lange tekst krijgt daarom de volle
  // breedte, zijn eigen opmaak, en staat ná de korte velden.
  const kort = [], lang = [];
  for (const v of gevuld) {
    const tekst = dataCelTekst(getField(rij, v.naam));
    (isLangeTekst(v, tekst) ? lang : kort).push({ veld: v, tekst });
  }
  const regels = kort.map(({ veld: v }) =>
    `<div class="detail-regel"><span class="detail-veld">${esc(v.naam)}</span>
      <span class="detail-waarde">${dataCelHtml(getField(rij, v.naam), v)}</span></div>`).join("");
  const langeRegels = lang.map(({ veld: v, tekst }) =>
    `<div class="detail-lang"><p class="detail-veld detail-lang-kop">${esc(v.naam)}</p>
      <div class="prosa">${langeTekstHtml(tekst)}</div></div>`).join("");

  // i75: staat de notitiedraad hierboven al uitgeschreven — mét tekst, auteur
  // en datum — dan is dezelfde notitie hieronder als kale titel een tweede,
  // armere melding van hetzelfde. Alleen weglaten als die draad er ook echt
  // is: draagt deze registry of instantie geen notities, dan is de
  // terugverwijzing de énige plek waar je ze ziet.
  const draad = notitiedraadHtml(ctx, key, rij);
  const terug = terugverwijzingen(ctx, key, rij.__entryId)
    .filter(t => !(draad && t.slug === "notities"));
  const terugHtml = terug.length
    ? terug.map(t => {
        const items = t.treffers.slice(0, 25).map(r => {
          const titel = detailTitel(t.dom, r);
          return r.__entryId ? `<li><a href="${esc(rijPaginaPad(t.slug, r.__entryId))}" class="relatie-link">${esc(titel)}</a></li>`
            : `<li><a href="#/data/${esc(t.slug)}" class="relatie-link" data-relatie-zoek="${esc(titel)}">${esc(titel)}</a></li>`;
        }).join("");
        const rest = t.treffers.length > 25 ? `<li class="footnote">… en nog ${t.treffers.length - 25}</li>` : "";
        return `<div class="detail-terug"><p><strong>${esc(t.dom.emoji || "🗂️")} ${esc(t.dom.naam || t.slug)}</strong>
          <span class="footnote">via ${esc(t.veld.naam)} · ${t.treffers.length}</span></p><ul>${items}${rest}</ul></div>`;
      }).join("")
    : `<p class="footnote">Niets in je werkruimte verwijst naar deze rij.</p>`;

  const bewerk = magDomeinBewerken(ctx, key);
  const knoppen = bewerk.ok && rij.__entryId
    ? `<button type="button" class="knop" data-bewerk-rij="${esc(rij.__entryId)}">✏️ Bewerken</button>
       <button type="button" class="knop knop-secundair" data-verwijder-rij="${esc(rij.__entryId)}">🗑 Verwijderen</button>`
    : "";

  return `<div class="detail-kaart" data-detail-kaart data-detail-id="${esc(rij.__entryId || "")}">
    <div class="detail-kop">
      <p><strong>${esc(domein.emoji || "🗂️")} ${esc(detailTitel(domein, rij))}</strong>
        ${key === "acties" && rij.__entryId ? `<a class="relatie-link blad-link" href="#/acties/${encodeURIComponent(rij.__entryId)}">Open als blad →</a>` : ""}
        ${key !== "acties" && rij.__entryId ? `<a class="relatie-link blad-link" href="${esc(rijPaginaPad(key, rij.__entryId))}">Open als pagina →</a>` : ""}</p>
      <button type="button" class="filter-wis" data-detail-sluit aria-label="Sluiten">✕</button>
    </div>
    ${bedienHtml(ctx, key, domein, rij)}
    <p class="bewerk-fout" data-snel-fout></p>
    ${regels}
    ${langeRegels}
    ${leeg.length ? `<p class="footnote">Niet ingevuld: ${esc(leeg.join(", "))}.</p>` : ""}
    ${draad}
    <p class="detail-kop-terug"><strong>Wat hieraan hangt</strong></p>
    ${terugHtml}
    <div class="bewerk-knoppen">${knoppen}</div>
    <div data-kaart-paneel></div>
  </div>`;
}

/* ── f33 fase F: bedienen zonder formulier ────────────────────────────
 *
 * Status wisselen en toewijzen zijn de twee dingen die je op een dag tien keer
 * doet; daar hoort geen formulier met twintig velden bij. Beide schrijven via
 * PATCH, zodat velden die dit dashboard niet kent blijven staan.
 *
 * Alleen zichtbaar in een schrijfsessie op een werkruimte-domein — op de
 * daglink en bij een extern CRM blijft alles lezen, net als de rest. */
function bedienHtml(ctx, key, domein, rij) {
  const bewerk = magDomeinBewerken(ctx, key);
  if (!bewerk.ok || !rij.__entryId) return "";
  const statusVeld = statusVeldVan(domein);
  const velden = dataVelden(domein);
  const eigenaarVeld = velden.find(v => v.naam === "Eigenaar");
  const agentVeld = velden.find(v => v.naam === "Agent" && v.type === "select");
  if (!statusVeld && !eigenaarVeld && !agentVeld) return "";

  const huidig = statusVeld ? dataCelTekst(getField(rij, statusVeld.naam)) : "";
  const naam = mijnNaam(ctx.bron);
  // Zelfde lijst als waartegen de instantie valideert (b60).
  const agenten = agentOpties(ctx.schema);

  // b61: met een Eigenaar-veld is er één kiezer voor mensen én specialisten
  // (zie toewijsPatch). Alleen een domein zónder Eigenaar houdt de losse
  // agentkiezer.
  const losseAgent = !eigenaarVeld && agentVeld && agenten.length
    ? `<label class="bedien-veld"><span>Agent</span>
      <select data-snel-agent><option value=""></option>
        ${agenten.map(a => `<option value="${esc(a)}"${a === dataCelTekst(getField(rij, "Agent")) ? " selected" : ""}>${esc(a)}</option>`).join("")}
      </select></label>`
    : "";

  return `<div class="bedien-balk">
    ${statusVeld ? `<label class="bedien-veld"><span>Status</span>
      <select data-snel-status>
        <option value=""></option>
        ${statusVeld.opties.map(o => `<option value="${esc(o)}"${o === huidig ? " selected" : ""}>${esc(o)}</option>`).join("")}
      </select></label>` : ""}
    ${eigenaarVeld ? wieKiezerHtml(ctx, key, rij, naam, agentVeld ? agenten : []) : ""}
    ${eigenaarVeld ? `<button type="button" class="knop-mini bedien-knop" data-snel-mij title="Aan mijzelf toewijzen">🙋 Aan mij</button>` : ""}
    ${losseAgent}
    ${naam ? `<span class="footnote">Je werkt als ${esc(naam)} · <button type="button" class="filter-wis" data-naam-wijzig>wijzig</button></span>` : ""}
  </div>
  <div class="naam-vraag" data-snel-anders hidden>
    <label class="bedien-veld"><span>Wie pakt het op?</span>
      <input type="text" data-snel-anders-naam maxlength="80" placeholder="naam"></label>
    <button type="button" class="knop" data-snel-anders-ok>Toewijzen</button>
    <button type="button" class="knop knop-secundair" data-snel-anders-niet>Annuleren</button>
  </div>
  <div data-naam-slot="bedien"></div>`;
}

/* b61: "Wie pakt het op?" — mensen en specialisten in één lijst. De mensen
 * zijn wie er nu al eigenaar is in dit domein (geen aparte ledenlijst: die is
 * er alleen voor de beheerder), plus jij. Wat er nu staat, staat altijd in de
 * lijst, ook als het nergens anders voorkomt. */
function wieKiezerHtml(ctx, key, rij, ikNaam, agenten) {
  const nu = dataCelTekst(getField(rij, "Eigenaar"));
  const nuSpecialist = specialistVan(ctx, nu);
  const mensen = new Set();
  for (const r of dataRijenVan(ctx, key) || []) {
    const e = dataCelTekst(getField(r, "Eigenaar")).trim();
    if (e && !specialistVan(ctx, e)) mensen.add(e);
  }
  if (ikNaam) mensen.delete(ikNaam);
  const gekozen = !nu ? "" : nuSpecialist ? "specialist:" + nuSpecialist : "mens:" + nu;
  const optie = (waarde, label) =>
    `<option value="${esc(waarde)}"${waarde === gekozen ? " selected" : ""}>${esc(label)}</option>`;
  const mensOpties = (ikNaam ? optie("mens:" + ikNaam, `${ikNaam} (jij)`) : optie("ik:", "Ik"))
    + Array.from(mensen).sort((a, b) => a.localeCompare(b, "nl")).slice(0, 25).map(m => optie("mens:" + m, m)).join("")
    + optie("anders:", "Iemand anders…");
  // Een specialist die niet (meer) in de registry staat, blijft zichtbaar.
  const namen = nuSpecialist && agenten.indexOf(nuSpecialist) === -1 ? [nuSpecialist].concat(agenten) : agenten;
  const teamOpties = namen.map(a => optie("specialist:" + a, a)).join("");
  return `<label class="bedien-veld"><span>Wie pakt het op?</span>
      <select data-snel-wie>
        ${optie("", "Niemand")}
        <optgroup label="Mensen">${mensOpties}</optgroup>
        ${teamOpties ? `<optgroup label="Je team">${teamOpties}</optgroup>` : ""}
      </select></label>`;
}

/* ── f33 fase E: de notitiedraad ──────────────────────────────────────
 *
 * Meerdere notities per entiteit, met datum en auteur, nieuwste boven. Een
 * notitie is een eigen rij in het domein 'notities' met een polymorfe
 * verwijzing naar de rij die je bekijkt — daarom werkt hetzelfde blok onder
 * élke entiteit, zonder per domein een veld toe te voegen.
 *
 * Draait de werkruimte nog een registry zonder 'notities', dan is dit blok er
 * simpelweg niet; dat is geen fout, alleen een oudere instantie. */
function notitieVeldVan(ctx) {
  const dom = ctx.schema.datadomeinen.notities;
  if (!dom) return null;
  // De instantie moet het domein ook kennen. Weet het dashboard dat niet
  // (oudere bundel zonder deze lijst), dan geldt het oude gedrag.
  const bekend = ctx.bundle && ctx.bundle.instantieDomeinen;
  if (Array.isArray(bekend) && bekend.indexOf("notities") === -1) return null;
  const veld = dataVelden(dom).find(v => v.type === "relatie" && v.naar === "*");
  return veld ? { dom, veld } : null;
}

function notitiesBij(ctx, key, entryId) {
  const info = notitieVeldVan(ctx);
  if (!info || !entryId) return [];
  return (dataRijenVan(ctx, "notities") || [])
    .filter(r => verwijstNaar(getField(r, info.veld.naam), info.veld, key, entryId))
    .sort((a, b) => String(getField(b, "Datum") || "").localeCompare(String(getField(a, "Datum") || "")));
}

function notitiedraadHtml(ctx, key, rij) {
  const info = notitieVeldVan(ctx);
  if (!info || key === "notities") return "";
  const bewerk = magDomeinBewerken(ctx, "notities");
  const eigenBewerk = magDomeinBewerken(ctx, key);
  const lijst = notitiesBij(ctx, key, rij.__entryId);
  const items = lijst.map(n => {
    const wie = dataCelTekst(getField(n, "Auteur"));
    const wanneer = dataCelTekst(getField(n, "Datum"));
    const soort = dataCelTekst(getField(n, "Soort"));
    return `<li class="notitie">
      <p class="notitie-kop"><strong>${esc(dataCelTekst(getField(n, "Onderwerp")) || "Notitie")}</strong>
        <span class="footnote">${esc([wie, soort, wanneer].filter(Boolean).join(" · "))}</span></p>
      <div class="notitie-tekst prosa">${langeTekstHtml(dataCelTekst(getField(n, "Notitie")))}</div>
    </li>`;
  }).join("");

  // Bij een domein dat elders woont hoort de notitie daar ook te staan; dat
  // zeggen we, in plaats van stil geen knop te tonen.
  const uitleg = !eigenBewerk.ok && eigenBewerk.reden
    ? `<p class="footnote">${esc(eigenBewerk.reden)} Notities horen dan bij die rij, in dat systeem.</p>`
    : "";

  const formulier = bewerk.ok && rij.__entryId
    ? `<form class="notitie-nieuw" data-notitie-form>
        <input type="text" data-notitie-onderwerp placeholder="Onderwerp" maxlength="120">
        <textarea data-notitie-tekst rows="2" placeholder="Wat is er gebeurd of afgesproken?"></textarea>
        <div data-naam-slot="notitie"></div>
        <p class="bewerk-fout" data-notitie-fout></p>
        <button type="submit" class="knop" data-notitie-knop>Notitie toevoegen</button>
      </form>`
    : uitleg;

  return `<p class="detail-kop-terug"><strong>Notities</strong> <span class="footnote">${lijst.length}</span></p>
    ${lijst.length ? `<ul class="notitie-lijst">${items}</ul>` : `<p class="footnote">Nog geen notities bij deze rij.</p>`}
    ${formulier}`;
}

/* De lijst die je kunt openen: alle datadomeinen uit de registry, behalve de
 * domeinen die per opzet niet als rijen worden opgehaald. */
function dataBrowsbareDomeinen(schema) {
  return Object.keys(schema.datadomeinen)
    .filter(k => !(k in DATA_NIET_IN_BUNDEL))
    .map(k => ({ key: k, ...schema.datadomeinen[k] }));
}

function dataRijenVan(ctx, key) {
  const dom = ctx.bundle && ctx.bundle.domains ? ctx.bundle.domains[key] : null;
  return dom && Array.isArray(dom.rows) ? dom.rows : null;
}

/* Metricsbestand: de Coördinator levert dan alleen totalen aan, geen rijen.
 * Zelfde eerlijke uitleg als op de agentdetailpagina — nooit een lege tabel
 * die suggereert dat de werkruimte leeg is.
 *
 * De tekst stond hier eerder in onze eigen woorden ("deze bundel draagt geen
 * rijen", "vraag waar je werkdata woont — dat staat in de bronkoppeling") en
 * gaf de lezer daarmee een opdracht in termen die hij nergens anders
 * tegenkomt. Zelfde feit, nu in zijn taal, en zonder huiswerk. */
function dataMetricsUitleg() {
  return `<div class="grijs-blok">
    <div class="grijs-kop">❔ Je gegevens staan in een ander systeem</div>
    <div class="grijs-tekst">Je dagstart zet hier de cijfers van je team neer en, als je acties en vaste taken in je
    eigen bron staan, de openstaande items met een link naar die bron. De volledige regels erachter staan in het
    systeem waarin je ze bijhoudt — je Coördinator weet welk. Wil je ze hier kunnen doorbladeren, vraag hem dan om je
    werkgegevens naar je werkruimte te verplaatsen.</div>
  </div>`;
}

/* f29 (metricscontract v2): ook zonder rijen zijn de verbánden te tonen —
 * de Coördinator telt ze bij de bron en levert ze als aggregaten aan.
 * `key` = alleen de kaarten waar dit domein aan meedoet; null = allemaal. */
function dataRelatieKaarten(ctx, key) {
  const rels = Array.isArray(ctx.relaties) ? ctx.relaties : [];
  const items = key ? rels.filter(r => r.van === key || r.naar === key) : rels;
  if (!items.length) return "";
  const naam = slug => {
    const d = ctx.schema.datadomeinen[slug];
    return d ? `${d.emoji ? d.emoji + " " : ""}${d.naam || slug}` : slug;
  };
  const kaarten = items.map(r => {
    const totaal = Number(r.totaal) || 0;
    const gekoppeld = Number(r.gekoppeld) || 0;
    const doelen = Number(r.doelen) || 0;
    const top = Array.isArray(r.top) && r.top.length
      ? `<div class="relatie-top">Meest gekoppeld: ${r.top.map(t => `${esc(t.titel)} (${Number(t.aantal) || 0})`).join(" · ")}</div>`
      : "";
    return `<div class="relatie-kaart">
      <div class="relatie-kop">${esc(naam(r.van))} <span class="relatie-pijl">→</span> ${esc(naam(r.naar))}</div>
      <div class="relatie-tekst">${gekoppeld} van de ${totaal} ${esc(String(r.veld || "").toLowerCase() || "rijen")}-verwijzingen gevuld${doelen ? `, naar ${doelen} verschillende` : ""}.</div>
      ${top}
    </div>`;
  }).join("");
  return `<div class="relatie-blok">
    <p><strong>🔗 Verbanden</strong></p>
    <p class="footnote">Geteld bij de bron door je Coördinator — de onderliggende rijen wonen in je eigen werkdata-systeem.</p>
    ${kaarten}
  </div>`;
}

// ── Overzicht (#/data) ────────────────────────────────────────────────
/* Draagt deze bundel überhaupt rijen? Sinds f33 haalt de loader ze ook op naast
 * een vers metricsbestand — juist omdat de Data-tab ze moet kunnen tonen. Deze
 * twee renderers keerden alleen nog steeds meteen om bij kind === "metrics",
 * dus dat ophalen was werk voor niets: detail, bord en notities bleven
 * onzichtbaar op precies de omgevingen waar 's ochtends een dagstart draait.
 * De uitleg hoort bij "geen rijen", niet bij "metricsroute". */
function bundelHeeftRijen(ctx) {
  const domains = (ctx && ctx.bundle && ctx.bundle.domains) || {};
  return Object.keys(domains).some(k => domains[k] && Array.isArray(domains[k].rows) && domains[k].rows.length > 0);
}

function renderDataOverzicht(el, ctx) {
  if (ctx.bundle && ctx.bundle.kind === "metrics" && !bundelHeeftRijen(ctx)) {
    el.innerHTML = dataMetricsUitleg() + dataRelatieKaarten(ctx, null);
    return;
  }

  const domeinen = dataBrowsbareDomeinen(ctx.schema);

  // Drie emmers, in deze volgorde van beslissen: heb je er rijen in, dan
  // gebruik je het (ook als het elders woont — die losse rijen bestaan echt).
  // Anders: weten we waar het wél woont, dan is dat het antwoord. Pas als we
  // niets weten, is het "nog niet in gebruik".
  const inGebruik = [], elders = [], nogNiet = [];
  for (const d of domeinen) {
    const rows = dataRijenVan(ctx, d.key);
    const item = { d, aantal: rows ? rows.length : 0, bron: bronVan(ctx, d.key) };
    if (item.aantal > 0) inGebruik.push(item);
    else if (item.bron.toestand === "elders" || item.bron.toestand === "nergens") elders.push(item);
    else nogNiet.push(item);
  }

  function spoorHtml({ aantal, bron }) {
    const telling = aantal > 0 ? `${aantal} ${aantal === 1 ? "rij" : "rijen"}` : null;
    if (bron.toestand === "elders") {
      // Een kale telling is bij een extern domein een onwaarheid in
      // cijfervorm: "1 rij" leest als "mijn team heeft één actie", terwijl
      // het er één is die hier is blijven liggen.
      return telling
        ? `<span class="spoor elders">🔗 woont in ${esc(bron.naam)} · ${aantal} ${aantal === 1 ? "losse rij" : "losse rijen"} hier</span>`
        : `<span class="spoor elders">🔗 woont in ${esc(bron.naam)}</span>`;
    }
    if (bron.toestand === "nergens") {
      return telling
        ? `<span class="spoor elders">${telling} · aangemerkt als: wordt niet bijgehouden</span>`
        : `<span class="spoor geen">wordt niet bijgehouden</span>`;
    }
    return telling
      ? `<span class="spoor actief">${telling}</span>`
      : `<span class="spoor geen">nog niets</span>`;
  }

  function rijHtml(item) {
    const { d, aantal, bron } = item;
    // Klikbaar zodra er iets te halen valt: rijen om te lezen, een "nieuwe
    // rij"-knop als je mag schrijven, of het antwoord op "waar dan wel?".
    // Alleen leeg-én-onbekend blijft dood — daar is echt niets te zeggen.
    const klikbaar = aantal > 0 || magDomeinBewerken(ctx, d.key).ok
      || bron.toestand === "elders" || bron.toestand === "nergens";
    const attrs = klikbaar ? ` data-data-domein="${esc(d.key)}" role="link" tabindex="0"` : "";
    return `<div class="agent-row${klikbaar ? " klikbaar" : ""}"${attrs}>
      <span class="emoji">${esc(d.emoji || "🗂️")}</span>
      <span class="naam">${esc(d.naam || d.key)}</span>
      ${spoorHtml(item)}${klikbaar ? `<span class="pijl">→</span>` : ""}
    </div>`;
  }

  // Binnen een groep ligt de volgorde vast in DATA_GROEPEN — nooit op aantal,
  // anders schuift de lijst tussen twee bezoeken.
  const groepenHtml = [...DATA_GROEPEN, DATA_GROEP_OVERIG].map(g => {
    const leden = inGebruik.filter(i => groepVan(i.d.key) === g);
    if (!leden.length) return "";
    leden.sort((a, b) => g.domeinen.indexOf(a.d.key) - g.domeinen.indexOf(b.d.key));
    return `<h3 class="data-groepkop">${g.emoji} ${esc(g.naam)}</h3>${leden.map(rijHtml).join("")}`;
  }).join("");

  const eldersHtml = elders.length
    ? `<h3 class="data-groepkop">🔗 Woont niet in je werkruimte <span class="data-groeptelling">${elders.length}</span></h3>
       ${elders.map(rijHtml).join("")}`
    : "";

  // Dichtgeklapt, mét telling in de samenvatting. Niet verborgen: dit is de
  // lijst van wat je team nog voor je kán bijhouden, en dit dashboard laat
  // nooit stil iets weg. Een schakelaar "toon lege domeinen" zou hetzelfde
  // doen als verbergen — die zet niemand aan.
  const nogNietHtml = nogNiet.length
    ? `<details class="data-leeg">
        <summary>Nog niet in gebruik <span class="data-groeptelling">${nogNiet.length}</span></summary>
        ${nogNiet.map(rijHtml).join("")}
      </details>`
    : "";

  const nietOpgehaald = Object.entries(DATA_NIET_IN_BUNDEL)
    .filter(([k]) => ctx.schema.datadomeinen[k])
    .map(([k, waarom]) => `${esc(ctx.schema.datadomeinen[k].naam || k)} (${esc(waarom)})`)
    .join(" · ");

  // b62: zeg waaróm het alleen-lezen is. "Opgehaald met je daglink" stond er
  // ook bij wie gewoon ingelogd was.
  const leesregel = ctx.kanSchrijven
    ? `Je bent ingelogd: open een soort gegevens om iets toe te voegen, te bewerken of te verwijderen.`
    : ctx.bron && ctx.bron.oauth
      ? `Je sessie mag alleen lezen. Log opnieuw in om ook te kunnen bijwerken.`
      : `Opgehaald met je daglink: alleen lezen. Log in om ook te kunnen bijwerken.`;

  el.innerHTML = `<p class="footnote data-telregel">In gebruik: ${inGebruik.length} van de ${domeinen.length} soorten gegevens die je team kan bijhouden.</p>
    ${groepenHtml}${eldersHtml}${nogNietHtml}
    ${dataRelatieKaarten(ctx, null)}
    <p class="footnote">${leesregel}</p>
    ${nietOpgehaald ? `<p class="footnote">Niet opgehaald: ${nietOpgehaald}.</p>` : ""}
    ${exportBlok()}`;
}

/* f30 — je hele werkruimte meenemen, wanneer je maar wilt.
 *
 * De export is een recht dat je op elk moment kunt uitoefenen, geen
 * noodprocedure bij vertrek. Daarom staat hij hier gewoon onderaan je
 * gegevens, en niet weggestopt bij "opzeggen".
 *
 * Dit haalt méér op dan de tabellen erboven: die tonen alleen wat in de bundel
 * zit, de export bevat alles wat er in je werkruimte staat. Dat verschil hoort
 * er expliciet bij te staan, anders lijkt de knop overbodig.
 */
function exportBlok() {
  return `<div class="export-blok">
    <p class="footnote"><strong>Alles meenemen.</strong> Een volledige export van je werkruimte —
    ook de domeinen die hierboven niet worden opgehaald. Van jou, wanneer je maar wilt.</p>
    <div class="export-knoppen">
      <button type="button" class="knop" data-export="markdown">Download als Markdown</button>
      <button type="button" class="knop" data-export="json">Download als JSON</button>
    </div>
    <p class="footnote" id="export-status" role="status" aria-live="polite"></p>
  </div>`;
}

/* ── f33 fase B: het bord ─────────────────────────────────────────────
 *
 * Acties met een status zijn werk, en werk kijk je liever in kolommen aan dan
 * in een tabel: je ziet in één blik waar het stilstaat. "Wacht op review" is
 * daarbij de belangrijkste kolom — dat is de stapel waar een mens aan zet is,
 * en precies de lus die dit dashboard hoort te sluiten.
 *
 * Generiek op het eerste select-veld dat 'Status' heet, dus hetzelfde scherm
 * werkt later voor content_kalender en productbacklog. Kolommen komen uit het
 * registryschema — nooit hardcoden, anders loopt het bord stil uit de pas met
 * de statussen die de agents schrijven. */
function statusVeldVan(domein) {
  return dataVelden(domein).find(v => v.type === "select" && v.naam === "Status"
    && Array.isArray(v.opties) && v.opties.length) || null;
}

const BORD_AANDACHT = "Wacht op review";

/* i71 — een kaart is te verplaatsen. De eerste klant probeerde meteen te
 * slepen ("Oh, kan ik slepen? Nee, ik kan niet slepen"), en dat was ook de
 * enige manier waarop ze het verwachtte.
 *
 * Slepen is hier de tweede route, niet de eerste: de statuskiezer op de kaart
 * doet exact hetzelfde en werkt met een toetsenbord, op een telefoon en met
 * een schermlezer. Allebei lopen ze door dezelfde schrijfactie, dus er is één
 * plek waar een statuswissel gebeurt. Zonder schrijfrechten (een daglink is
 * alleen-lezen) is het bord precies wat het was. */
function bordKaartHtml(ctx, key, domein, rij) {
  const titel = detailTitel(domein, rij);
  const velden = dataVelden(domein);
  const toon = ["Eigenaar", "Agent", "Deadline", "Prioriteit", "Aangemaakt door"]
    .map(naam => ({ naam, veld: velden.find(v => v.naam === naam) }))
    .filter(x => x.veld && dataCelTekst(getField(rij, x.naam)) !== "")
    .map(x => `<span class="bord-meta">${dataCelHtml(getField(rij, x.naam), x.veld)}</span>`)
    .join("");
  const kinderen = subacties(ctx, key, rij.__entryId);
  const statusVeld = statusVeldVan(domein);
  const magBedienen = magDomeinBewerken(ctx, key).ok && !!rij.__entryId && !!statusVeld;
  const nu = statusVeld ? dataCelTekst(getField(rij, statusVeld.naam)) : "";
  const kiezer = magBedienen
    ? `<label class="bord-verplaats"><span class="visueel-verborgen">Verplaats naar</span>
        <select data-bord-status="${esc(rij.__entryId)}">
          ${statusVeld.opties.map(o => `<option value="${esc(o)}"${o === nu ? " selected" : ""}>${esc(o)}</option>`).join("")}
        </select></label>`
    : "";
  return `<article class="bord-kaart"${rij.__entryId ? ` data-open-rij="${esc(key)}|${esc(rij.__entryId)}"` : ""} tabindex="0"${magBedienen ? ` draggable="true" data-sleep-id="${esc(rij.__entryId)}"` : ""}>
    <p class="bord-titel">${esc(titel)}</p>
    ${toon ? `<p class="bord-regels">${toon}</p>` : ""}
    ${kinderen.length ? `<p class="footnote">↳ ${kinderen.length} ${kinderen.length === 1 ? "subactie" : "subacties"}</p>` : ""}
    ${kiezer}
  </article>`;
}

/* f33: kinderen van een rij via een self-relatie ('Bovenliggende actie').
 * Alleen tellen — de lijst zelf staat in de detailkaart bij de
 * terugverwijzingen, en twee plekken met dezelfde lijst is ruis. */
function subacties(ctx, key, entryId) {
  if (!entryId) return [];
  const domein = ctx.schema.datadomeinen[key];
  const zelf = dataVelden(domein).filter(v => v.type === "relatie" && v.naar === key);
  if (!zelf.length) return [];
  return (dataRijenVan(ctx, key) || []).filter(r =>
    zelf.some(v => verwijstNaar(getField(r, v.naam), v, key, entryId)));
}

function bordHtml(ctx, key, domein, rijen) {
  const statusVeld = statusVeldVan(domein);
  if (!statusVeld) return "";
  const kolommen = statusVeld.opties.slice();
  const zonder = rijen.filter(r => kolommen.indexOf(dataCelTekst(getField(r, statusVeld.naam))) === -1);
  const kolomHtml = kolommen.map(status => {
    const inKolom = rijen.filter(r => dataCelTekst(getField(r, statusVeld.naam)) === status);
    const kaarten = inKolom.map(r => bordKaartHtml(ctx, key, domein, r)).join("")
      || `<p class="footnote">Leeg.</p>`;
    return `<section class="bord-kolom${status === BORD_AANDACHT ? " bord-kolom-aandacht" : ""}" data-bord-kolom="${esc(status)}" data-bord-dropzone>
      <h3>${esc(status)} <span class="bord-telling">${inKolom.length}</span></h3>
      ${kaarten}
    </section>`;
  }).join("");
  // Een rij met een lege of onbekende status hoort niet stil te verdwijnen:
  // dat is precies het werk dat niemand meer ziet.
  const restHtml = zonder.length
    ? `<section class="bord-kolom bord-kolom-rest"><h3>Zonder status <span class="bord-telling">${zonder.length}</span></h3>
       ${zonder.map(r => bordKaartHtml(ctx, key, domein, r)).join("")}</section>`
    : "";
  return `<div class="bord-scroll"><div class="bord">${kolomHtml}${restHtml}</div></div>`;
}

/* i72 — de herkomststrook: waar woont dit, en wat betekent dat hier?
 *
 * Stond dit eerder ergens? Alleen als voetnoot onder de tabel, en alleen voor
 * wie kon schrijven — via de foutmelding van magDomeinBewerken(). Dat is de
 * verkeerde volgorde en de verkeerde plek: de vraag "waar bewerk ik dit dan?"
 * komt op vóórdat je zoekt, en hij komt op bij iedereen.
 *
 * Bewust géén sync-belofte. Dit dashboard leest niet mee in Notion, en dat
 * hoort er te staan — anders leest een oud aantal als een actueel aantal. */
function herkomstStrookHtml(ctx, key, domein, aantal) {
  const bron = bronVan(ctx, key);
  const naam = esc(domein.naam || key);
  if (bron.toestand === "elders") {
    const waar = esc(bron.naam);
    return `<div class="herkomst-strook">
      <p><strong>Je team houdt ${naam} bij in ${waar}.</strong></p>
      <p>Hier kun je meekijken, niet wijzigen — dat doe je in ${waar}.</p>
      <p>${aantal > 0
        ? `De ${aantal} ${aantal === 1 ? "rij" : "rijen"} hieronder ${aantal === 1 ? "staat" : "staan"} in je werkruimte en ${aantal === 1 ? "is" : "zijn"} geen kopie van ${waar}. Het volledige beeld staat daar.`
        : `Er staat hier niets van dit soort gegevens — dat hoort ook zo.`}</p>
      <p class="footnote">Dit dashboard leest niet mee in ${waar}; het toont wat er in je eigen werkruimte staat.</p>
    </div>`;
  }
  if (bron.toestand === "nergens") {
    return `<div class="herkomst-strook">
      <p><strong>${naam} wordt bewust niet bijgehouden.</strong></p>
      <p>Je team heeft vastgelegd dat dit soort gegevens nergens wordt bijgehouden.${aantal > 0 ? ` Toch staan er hier ${aantal} ${aantal === 1 ? "rij" : "rijen"} — die ${aantal === 1 ? "is" : "zijn"} waarschijnlijk blijven liggen.` : ""}</p>
    </div>`;
  }
  // "Onbekend" met een bestaande koppeling is een gat dat je mag zien. Zonder
  // koppeling weten we van niets iets, en dan zeggen we ook niets — anders
  // staat dezelfde hedge zevenentwintig keer op zevenentwintig pagina's.
  if (bron.toestand === "onbekend" && bron.geenKoppeling === false) {
    return `<div class="herkomst-strook zacht">
      <p>Waar ${naam} thuishoort is niet vastgelegd. Wat je hier ziet staat in je werkruimte — of dat alles is, weten we niet.</p>
    </div>`;
  }
  return "";
}

// ── Eén domein (#/data/<domein>) ──────────────────────────────────────
function renderDataDomein(el, key, ctx) {
  const domein = ctx.schema.datadomeinen[key];
  if (!domein) { el.innerHTML = `<p>Onbekend domein.</p><a class="detail-link" href="#/data">← Alle gegevens</a>`; return; }
  // Zie bundelHeeftRijen(): alleen als er écht geen rijen zijn is de
  // metricsuitleg het juiste antwoord.
  if (ctx.bundle && ctx.bundle.kind === "metrics" && !(dataRijenVan(ctx, key) || []).length) {
    el.innerHTML = dataMetricsUitleg() + dataRelatieKaarten(ctx, key) + `<a class="detail-link" href="#/data">← Alle gegevens</a>`;
    return;
  }

  const rows = dataRijenVan(ctx, key);
  const kop = `<p><strong>${esc(domein.emoji || "🗂️")} ${esc(domein.naam || key)}</strong></p>`;
  // f23 fase D: bewerken alleen bij een schrijfsessie op een werkruimte-domein.
  const bewerk = magDomeinBewerken(ctx, key);
  // f50: een nieuwe actie is een opdracht — drie vragen in plaats van 21 velden.
  const nieuwKnop = !bewerk.ok ? "" : key === "acties" ? `<a class="knop" href="#/opdracht">➕ Nieuwe opdracht</a>`
    : `<button type="button" class="knop" data-bewerk-nieuw>➕ Nieuw</button>`;
  const bewerkUitleg = bewerk.reden ? `<p class="footnote">${esc(bewerk.reden)}</p>` : "";
  if (!rows || !rows.length) {
    // De oude tekst hedgede ("leeg, óf het woont ergens anders") terwijl het
    // antwoord in de bundel zat. Weet de strook het, dan zegt hij het; weet
    // hij het niet, dan blijft alleen de eerlijke helft over.
    const strook = herkomstStrookHtml(ctx, key, domein, 0);
    el.innerHTML = `${kop}${strook}
      ${strook ? "" : `<div class="grijs-blok"><div class="grijs-tekst">Hier staat nog niets van dit soort gegevens.</div></div>`}
      ${bewerkUitleg}${nieuwKnop}<div data-bewerk-paneel></div>
      <a class="detail-link" href="#/data">← Alle gegevens</a>`;
    if (bewerk.ok) wireDataBewerken(el, key, ctx, ctx.herlaad || (() => {}));
    return;
  }

  // Fase A: verwijzingsvelden horen altijd in beeld — dat is waar de
  // verbanden zitten — ook als ze buiten de eerste kolommen vallen. De
  // tabel scrolt horizontaal, dus extra kolommen kosten geen leesbaarheid.
  const basisVelden = dataVelden(domein).slice(0, DATA_MAX_KOLOMMEN);
  const relatieVelden = dataVelden(domein)
    .slice(DATA_MAX_KOLOMMEN)
    .filter(v => v.type === "relatie");
  // f44: "Aangemaakt door" is veld 9 op acties en viel dus buiten de eerste zes
  // kolommen — precies het veld dat de vraag "kwam dit van mijn team?"
  // beantwoordt. Zelfde uitzondering als de verwijzingen hierboven: de tabel
  // scrolt horizontaal, dus een kolom erbij kost geen leesbaarheid.
  const herkomstVelden = dataVelden(domein)
    .slice(DATA_MAX_KOLOMMEN)
    .filter(v => HERKOMST_VELDEN.indexOf(v.naam) !== -1 && relatieVelden.indexOf(v) === -1);
  const velden = basisVelden.concat(relatieVelden, herkomstVelden);
  const datumVeld = dataDatumVeld(domein);

  function zichtbareRijen() {
    const q = dataZoek.trim().toLowerCase();
    const vs = dataVoorselectie && dataVoorselectie.domein === key ? dataVoorselectie : null;
    let uit = vs ? rows.filter(r => vs.ids.indexOf(r.__entryId) !== -1) : rows;
    if (q) {
      // Bewust op `uit`, niet op `rows`: zoeken werkt bínnen de voorselectie.
      uit = uit.filter(r => velden.some(v => dataCelTekst(getField(r, v.naam)).toLowerCase().includes(q)));
    }
    // f44: "van je team" gaat vóór alles — het is een selectie, geen zoekactie.
    if (dataVanTeam) {
      const oogst = teamOogstRijen(ctx.bundle, ctx.schema) || [];
      const ids = oogst.map(r => r && r.__entryId).filter(Boolean);
      uit = uit.filter(r => ids.indexOf(r.__entryId) !== -1);
    }
    // i71: het statusfilter zit vóór het zoeken in de keten, zodat zoeken
    // binnen de zichtbare selectie blijft werken zoals het al deed.
    const verborgen = statusVeld ? statusVerborgen(key) : [];
    if (verborgen.length) {
      uit = uit.filter(r => verborgen.indexOf(dataCelTekst(getField(r, statusVeld.naam))) === -1);
    }
    if (datumVeld) {
      uit = uit.slice().sort((a, b) => {
        const da = parseDateField(getField(a, datumVeld));
        const db = parseDateField(getField(b, datumVeld));
        return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
      });
    }
    return uit;
  }

  function tabelHtml() {
    const zicht = zichtbareRijen();
    if (!zicht.length) {
      return `<p class="footnote">${dataZoek.trim() ? `Geen rij in dit domein bevat "${esc(dataZoek)}".` : "Geen rijen in deze selectie."}</p>`;
    }
    const koppen = velden.map(v => `<th>${esc(v.naam)}</th>`).join("")
      + (bewerk.ok ? `<th class="bewerk-kolom" aria-label="acties"></th>` : "");
    const body = zicht.slice(0, DATA_MAX_RIJEN).map(r => {
      // f33: de eerste cel (het titelveld) is de knop om de rij open te klappen.
      // Bewust geen extra kolom: dat verschuift de hele tabel voor iets wat de
      // titel zelf al aankondigt. Openklappen mag altijd — ook op de daglink,
      // want het is lezen.
      const cellen = velden.map((v, i) => {
        const cel = dataCelHtml(getField(r, v.naam), v);
        if (i !== 0 || !r.__entryId) return `<td>${cel}</td>`;
        // De knop blijft (toetsenbordroute en toegankelijk label), maar zonder
        // tooltip: de hele rij is klikbaar, dus "Rij openen" bij élke titel is
        // dezelfde mededeling dertig keer.
        return `<td><button type="button" class="rij-open-knop" data-open-rij="${esc(key)}|${esc(r.__entryId)}" aria-label="Rij openen: ${esc(dataCelTekst(getField(r, v.naam)) || "zonder titel")}">${cel || "(zonder titel)"}</button></td>`;
      }).join("");
      const acties = bewerk.ok && r.__entryId
        ? `<td class="bewerk-kolom"><button type="button" class="knop-mini" data-bewerk-rij="${esc(r.__entryId)}" title="Bewerken">✏️</button><button type="button" class="knop-mini" data-verwijder-rij="${esc(r.__entryId)}" title="Verwijderen">🗑</button></td>`
        : (bewerk.ok ? `<td class="bewerk-kolom"></td>` : "");
      // i71: de hele rij opent, niet alleen de titelcel. De knop in kolom 1
      // blijft staan — die draagt de toetsenbordroute en het toegankelijke
      // label. Een rij zonder entryId krijgt géén klikbaarheid: liever geen
      // affordance dan een klik die niets doet, want precies dat was de
      // klacht ("ik kan er heel leuk op klikken, maar hij doet niks").
      const open = dataDetail && dataDetail.domein === key && dataDetail.entryId === r.__entryId;
      const klik = r.__entryId ? ` class="rij-klikbaar${open ? " rij-open" : ""}" data-open-rij="${esc(key)}|${esc(r.__entryId)}"` : (open ? ' class="rij-open"' : "");
      return `<tr${klik}>${cellen}${acties}</tr>`;
    }).join("");
    const rest = zicht.length > DATA_MAX_RIJEN
      ? `<p class="footnote">… en nog ${zicht.length - DATA_MAX_RIJEN} — zoek hierboven of open de bron zelf.</p>`
      : "";
    return `<div class="tabel-scroll"><table class="detail-table">
      <thead><tr>${koppen}</tr></thead><tbody>${body}</tbody></table></div>${rest}`;
  }

  function tellingHtml() {
    const zicht = zichtbareRijen().length;
    return zicht === rows.length
      ? `${rows.length} ${rows.length === 1 ? "rij" : "rijen"}`
      : `${zicht} van ${rows.length} rijen`;
  }

  const vs = dataVoorselectie && dataVoorselectie.domein === key ? dataVoorselectie : null;
  const statusVeld = statusVeldVan(domein);

  /* De detailkaart hoort bóven de lijst: je klikt een rij open en leest verder
   * op de plek waar je al keek. Staat de geopende rij niet (meer) in dit
   * domein, dan is er gewoon geen kaart — geen foutmelding voor iets wat de
   * gebruiker niet gedaan heeft. */
  function detailHtml() {
    if (!dataDetail || dataDetail.domein !== key) return "";
    const rij = rows.find(r => r.__entryId === dataDetail.entryId);
    return rij ? dataDetailHtml(ctx, key, rij) : "";
  }

  function inhoudHtml() {
    if (dataWeergave === "bord" && statusVeld) return bordHtml(ctx, key, domein, zichtbareRijen());
    return tabelHtml();
  }

  el.innerHTML = `${kop}
    ${herkomstStrookHtml(ctx, key, domein, rows.length)}
    <div class="data-toolbar">
      <input type="search" id="data-zoek" placeholder="Zoeken in dit domein…" value="${esc(dataZoek)}" aria-label="Zoeken in dit domein">
      ${vs ? `<span class="filter-chip">🔎 ${esc(vs.label)} <button type="button" class="filter-wis" data-filter-wis aria-label="Filter wissen">✕</button></span>` : ""}
      ${statusVeld ? `<span class="weergave-schakelaar" role="group" aria-label="Weergave">
        <button type="button" class="knop-mini${dataWeergave === "tabel" ? " actief" : ""}" data-weergave="tabel">Tabel</button>
        <button type="button" class="knop-mini${dataWeergave === "bord" ? " actief" : ""}" data-weergave="bord">Bord</button>
      </span>` : ""}
      ${(teamOogstRijen(ctx.bundle, ctx.schema) || []).length ? `<button type="button" class="status-chip van-team${dataVanTeam ? " actief" : ""}" data-van-team aria-pressed="${dataVanTeam}">🤝 Van je team</button>` : ""}
      ${statusVeld ? `<span class="status-chips" role="group" aria-label="Tonen op status">${statusVeld.opties.map(o =>
        `<button type="button" class="status-chip${statusVerborgen(key).indexOf(o) !== -1 ? " uit" : ""}" data-status-chip="${esc(o)}" aria-pressed="${statusVerborgen(key).indexOf(o) === -1}">${esc(o)}</button>`
      ).join("")}</span>` : ""}
      <span class="data-telling" data-data-telling>${tellingHtml()}</span>
    </div>
    <div data-data-detail>${detailHtml()}</div>
    <div data-data-tabel>${inhoudHtml()}</div>
    <p class="footnote">Eerste ${basisVelden.length} velden${relatieVelden.length ? " plus de verwijzingen" : ""}${herkomstVelden.length ? " plus wie het aanmaakte" : ""} uit het registryschema${datumVeld ? `, nieuwste ${esc(datumVeld)} boven` : ""}.
    ${bewerk.ok ? "Bewerken schrijft rechtstreeks naar je eigen werkruimte." : "Alleen lezen — dit dashboard schrijft nooit terug."} Herkomst: ${esc((ctx.bundle.domains[key] || {}).herkomstLabel || "je werkruimte")}.</p>
    ${bewerkUitleg}${nieuwKnop ? `<div class="data-toolbar">${nieuwKnop}</div>` : ""}<div data-bewerk-paneel></div>
    <a class="detail-link" href="#/data">← Alle gegevens</a>`;

  // Fase A: klik op een verwijzing → de zoekterm wordt de titel, en de
  // href (#/data/<doeldomein>) doet de navigatie. renderDataDomein van het
  // doeldomein leest dataZoek en toont zo direct de gekoppelde rij.
  function herteken() {
    el.querySelector("[data-data-detail]").innerHTML = detailHtml();
    el.querySelector("[data-data-tabel]").innerHTML = inhoudHtml();
    el.querySelector("[data-data-telling]").textContent = tellingHtml();
  }

  el.addEventListener("click", (e) => {
    // f33: een rij openen. Wijst het naar een ánder domein, dan doet de href
    // de navigatie en onthoudt de detailstand welke rij daar open moet.
    const openEl = e.target.closest && e.target.closest("[data-open-rij]");
    // i71: nu de hele rij klikbaar is, moeten de knoppen en links ín die rij
    // hun eigen werk houden. Alleen het element dat de klik zelf draagt (de
    // relatielink) en de expliciete open-knop mogen hierdoorheen.
    const inZicht = openEl && e.target.closest && e.target.closest("button, a, input, select, textarea, label");
    const doorKnopBinnenRij = inZicht && inZicht !== openEl
      && !(inZicht.classList && inZicht.classList.contains("rij-open-knop"))
      && openEl.contains(inZicht);
    if (openEl && !doorKnopBinnenRij) {
      // Splitsen op de EERSTE pipe, niet op elke. Een domeinslug bestaat uit
      // [a-z0-9_] en kan er nooit een bevatten; een entry-id wél — de
      // instantie valideert de tekens daarvan niet. Met split("|") viel zo'n
      // rij stil uit elkaar en werd hij onklikbaar in tabel én bord, zonder
      // enige melding.
      const ruw = openEl.getAttribute("data-open-rij") || "";
      const scheiding = ruw.indexOf("|");
      const dom = scheiding === -1 ? ruw : ruw.slice(0, scheiding);
      const id = scheiding === -1 ? "" : ruw.slice(scheiding + 1);
      if (dom === key && dataDetail && dataDetail.entryId === id) wisDataDetail();
      else zetDataDetail(dom, id);
      if (dom === key) {
        e.preventDefault();
        herteken();
        // De detailkaart staat bóven de lijst. Klik je een rij aan die verder
        // naar beneden staat, dan opent hij dus buiten je scherm — en omdat
        // de browser de ingevoegde hoogte zelf compenseert (scroll-anchoring)
        // beweegt er niet eens iets. Dat is precies wat de eerste klant zag:
        // "ik kan er heel leuk op klikken, maar hij doet niks."
        // block: "nearest" scrollt het kortste stukje en doet niets als de
        // kaart al in beeld staat. De guard is niet optioneel: jsdom kent
        // scrollIntoView niet, en zonder guard gaan de tests eraan.
        const kaart = el.querySelector(".detail-kaart");
        if (kaart && kaart.scrollIntoView) kaart.scrollIntoView({ block: "nearest", behavior: "smooth" });
        return;
      }
    }
    const vanTeam = e.target.closest && e.target.closest("[data-van-team]");
    if (vanTeam) {
      dataVanTeam = !dataVanTeam;
      vanTeam.classList.toggle("actief", dataVanTeam);
      vanTeam.setAttribute("aria-pressed", String(dataVanTeam));
      herteken();
      return;
    }
    // i71: statuschips — één per statuswaarde uit het registryschema, nooit
    // hardgecodeerd. Aanklikken verbergt of toont die status.
    const chip = e.target.closest && e.target.closest("[data-status-chip]");
    if (chip) {
      wisselStatusFilter(key, chip.getAttribute("data-status-chip"));
      for (const c of el.querySelectorAll("[data-status-chip]")) {
        c.classList.toggle("uit", statusVerborgen(key).indexOf(c.getAttribute("data-status-chip")) !== -1);
        c.setAttribute("aria-pressed", String(statusVerborgen(key).indexOf(c.getAttribute("data-status-chip")) === -1));
      }
      herteken();
      return;
    }
    const sluit = e.target.closest && e.target.closest("[data-detail-sluit]");
    if (sluit) { wisDataDetail(); herteken(); return; }
    const weergave = e.target.closest && e.target.closest("[data-weergave]");
    if (weergave) {
      // Bewust géén renderDataDomein(el, ...) hier: dat hangt een tweede
      // kliklistener aan hetzelfde element, en dan verwerken twee handlers
      // dezelfde klik — het bord opende een rij die daarna meteen weer
      // dichtklapte. Alleen de inhoud verversen is genoeg.
      dataWeergave = weergave.getAttribute("data-weergave") === "bord" ? "bord" : "tabel";
      for (const knop of el.querySelectorAll("[data-weergave]")) {
        knop.classList.toggle("actief", knop.getAttribute("data-weergave") === dataWeergave);
      }
      herteken();
      return;
    }
    if (bedienKlik(e)) return;
    const link = e.target.closest && e.target.closest("[data-relatie-zoek]");
    if (link) dataZoek = link.getAttribute("data-relatie-zoek") || "";
    const wisEl = e.target.closest && e.target.closest("[data-filter-wis]");
    if (wisEl) {
      wisDataVoorselectie();
      const chip = el.querySelector(".filter-chip");
      if (chip) chip.remove();
      herteken();
    }
  });

  /* f33 fase F — bedienen. Elke schrijfactie loopt via PATCH (of, voor een
   * notitie, POST). i81: het antwoord van de instantie vervangt daarna de rij
   * ter plekke (verwerkAntwoord) — geen herlaad, geen sprong naar boven. Het
   * dashboard verzint nog steeds niet zelf hoe de rij er na afloop uitziet: het
   * neemt over wat de instantie terugstuurt.
   *
   * `bediening` is het element dat de actie startte. Dat staat uit zolang de
   * actie loopt, zodat een tweede klik geen tweede schrijfactie wordt. Mislukt
   * het, dan tekent de kaart opnieuw vanuit de rijen — de kiezer staat dan weer
   * op wat er écht is opgeslagen — en de fout staat ernaast, met de knop om het
   * nog eens te proberen. */
  function foutmelder(o) { return el.querySelector((o && o.foutPlek) || "[data-snel-fout]"); }

  async function pasToe(actie, opties) {
    const o = opties || {};
    const fout = foutmelder(o);
    if (fout) fout.textContent = "";
    const kaart = el.querySelector("[data-detail-kaart]");
    if (o.bediening) o.bediening.disabled = true;
    if (kaart) kaart.setAttribute("aria-busy", "true");
    try {
      const antwoord = await actie();
      await verwerkAntwoord(ctx, o.domein || key, antwoord, { focus: o.focus });
      if (o.melding) meld(o.melding, o.ongedaan ? { actie: o.ongedaan } : {});
      return true;
    } catch (f) {
      const tekst = (f && f.message) || "Dat is niet gelukt.";
      if (o.bediening) o.bediening.disabled = false;
      if (kaart) kaart.removeAttribute("aria-busy");
      if (o.herstel !== false) {
        herteken();
        const terug = o.focus ? el.querySelector(o.focus) : null;
        if (terug && terug.focus) terug.focus();
      }
      const plek = foutmelder(o);
      if (plek) plek.textContent = tekst;
      meld("Niet gelukt: " + tekst, { fout: true, actie: { label: "Opnieuw", doe: () => pasToe(actie, o) } });
      return false;
    }
  }

  /* Eén veldwijziging op een rij, met "ongedaan maken" in de meldingsregel.
   * Wat al zo stond, gaat niet nog eens naar de instantie: een kaart naar zijn
   * eigen kolom slepen of een naam ongewijzigd bevestigen is geen wijziging,
   * en hoort ook geen melding op te leveren. */
  function wijzigRij(rij, patch, bediening, melding) {
    const leeg = (v) => (v === undefined || v === "" ? null : v);
    if ("Status" in patch && leeg(rij.Status) === leeg(patch.Status)) return Promise.resolve(false);
    for (const k of Object.keys(patch)) {
      if (JSON.stringify(leeg(rij[k])) === JSON.stringify(leeg(patch[k]))) delete patch[k];
    }
    if (!Object.keys(patch).length) return Promise.resolve(false);
    const vorige = vorigeWaarden(rij, patch);
    return pasToe(() => snelWijzig(ctx, key, rij.__entryId, patch), {
      bediening,
      focus: bediening ? focusSelector(bediening) : null,
      melding: melding || wijzigingTekst(patch),
      ongedaan: ongedaanPatch(ctx, key, rij.__entryId, vorige),
    });
  }

  /* b61: toewijzen aan een mens of een specialist — altijd via toewijsPatch,
   * zodat Eigenaar, Agent en (zo nodig) Status samen kloppen. */
  function wijsToe(keuze, bediening) {
    const rij = huidigeRij();
    if (!rij) return Promise.resolve(false);
    const patch = toewijsPatch(domein, rij, keuze);
    return wijzigRij(rij, patch, bediening, toewijsTekst(rij, patch, keuze, mijnNaam(ctx.bron)));
  }

  function toonAnders(tonen) {
    const vak = el.querySelector("[data-snel-anders]");
    if (!vak) return;
    vak.hidden = !tonen;
    const invoer = vak.querySelector("[data-snel-anders-naam]");
    if (tonen && invoer) { invoer.value = ""; invoer.focus(); }
  }

  function bevestigAnders() {
    const invoer = el.querySelector("[data-snel-anders-naam]");
    const naam = invoer ? invoer.value.trim().slice(0, 80) : "";
    if (!naam) { if (invoer) invoer.focus(); return; }
    const soort = specialistVan(ctx, naam) ? "specialist" : "mens";
    toonAnders(false);
    wijsToe({ soort, naam: soort === "specialist" ? specialistVan(ctx, naam) : naam },
      el.querySelector("[data-snel-wie]"));
  }

  function huidigeRij() {
    if (!dataDetail || dataDetail.domein !== key) return null;
    return rows.find(r => r.__entryId === dataDetail.entryId) || null;
  }

  /* i77 + i81: de naamvraag staat in de pagina, niet in window.prompt. Hij komt
   * voorgevuld met wat de site over deze seat weet en blijft een vraag — stil
   * invullen zou een persoonsgegeven in de werkdata van de klant zetten zonder
   * dat iemand het zag. Geeft de gekozen naam, of null als je afziet. */
  function vraagNaam(plek, opties) {
    return vraagNaamIn(el.querySelector(`[data-naam-slot="${plek}"]`), ctx.bron, opties);
  }

  /* Alleen een GEKOZEN naam mag zonder vragen de werkdata in — dat is wat
   * `gezet` betekent. Een afleiding uit je adres (het deel vóór de @) vult de
   * vraag voor maar vervangt hem niet. */
  function naamVoorSchrijfactie(plek, opties) {
    return haalNaamvoorstel(ctx.bron).then((r) => (r.gezet ? r.voorstel : vraagNaam(plek, opties)));
  }

  function bedienKlik(e) {
    const rij = huidigeRij();
    const mij = e.target.closest && e.target.closest("[data-snel-mij]");
    if (mij && rij) {
      naamVoorSchrijfactie("bedien").then((naam) => {
        if (!naam) { mij.focus(); return; }
        wijsToe({ soort: "mens", naam }, mij);
      });
      return true;
    }
    if (e.target.closest && e.target.closest("[data-snel-anders-ok]")) { bevestigAnders(); return true; }
    if (e.target.closest && e.target.closest("[data-snel-anders-niet]")) {
      toonAnders(false);
      herteken(); // de kiezer weer op wat er echt staat
      const wie = el.querySelector("[data-snel-wie]");
      if (wie) wie.focus();
      return true;
    }
    const wijzig = e.target.closest && e.target.closest("[data-naam-wijzig]");
    if (wijzig) {
      vraagNaam("bedien").then((naam) => {
        if (!naam) { wijzig.focus(); return; }
        herteken();
        meld(`Je werkt nu als ${naam}.`);
      });
      return true;
    }
    return false;
  }

  /* i71: één plek waar een statuswissel gebeurt, of hij nu uit de kiezer op
   * de kaart komt of uit een sleepbeweging. */
  function verplaatsNaar(entryId, status, bediening) {
    if (!entryId || !status) return;
    const rij = rows.find(r => r.__entryId === entryId);
    if (!rij) return;
    wijzigRij(rij, statusPatch(domein, status), bediening);
  }

  el.addEventListener("change", (e) => {
    // Op het bord staat er geen rij open: de kaart draagt zijn eigen id.
    const bord = e.target.closest && e.target.closest("[data-bord-status]");
    if (bord) { verplaatsNaar(bord.getAttribute("data-bord-status"), bord.value, bord); return; }

    const rij = huidigeRij();
    if (!rij) return;
    const status = e.target.closest && e.target.closest("[data-snel-status]");
    if (status) {
      const gekozen = status.value;
      if (!gekozen) return;
      wijzigRij(rij, statusPatch(domein, gekozen), status);
      return;
    }
    const wie = e.target.closest && e.target.closest("[data-snel-wie]");
    if (wie) {
      const waarde = wie.value;
      const scheiding = waarde.indexOf(":");
      const soort = scheiding === -1 ? "" : waarde.slice(0, scheiding);
      const naam = scheiding === -1 ? "" : waarde.slice(scheiding + 1);
      if (!waarde) { wijsToe({ soort: "niemand" }, wie); return; }
      if (soort === "anders") { toonAnders(true); return; }
      if (soort === "ik") {
        naamVoorSchrijfactie("bedien").then((mijn) => {
          if (mijn) wijsToe({ soort: "mens", naam: mijn }, wie);
          else { herteken(); const w = el.querySelector("[data-snel-wie]"); if (w) w.focus(); }
        });
        return;
      }
      wijsToe({ soort, naam }, wie);
      return;
    }
    const agent = e.target.closest && e.target.closest("[data-snel-agent]");
    if (agent) wijzigRij(rij, { Agent: agent.value || null }, agent);
  });

  /* Slepen tussen kolommen. Bewust bovenop de kiezer op de kaart en niet
   * ervoor in de plaats: zonder muis (toetsenbord, telefoon, schermlezer) is
   * slepen geen route, en een bord dat alleen met de muis te bedienen is, is
   * voor een deel van de gebruikers geen bord. Beide eindigen in
   * verplaatsNaar(). */
  let sleepId = null;
  el.addEventListener("dragstart", (e) => {
    const kaart = e.target.closest && e.target.closest("[data-sleep-id]");
    if (!kaart) return;
    sleepId = kaart.getAttribute("data-sleep-id");
    kaart.classList.add("sleept");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      // Sommige browsers starten geen sleep zonder payload; de waarde zelf
      // gebruiken we niet, sleepId is de bron van waarheid.
      try { e.dataTransfer.setData("text/plain", sleepId); } catch (f) { /* niet erg */ }
    }
  });
  el.addEventListener("dragend", () => {
    sleepId = null;
    for (const k of el.querySelectorAll(".sleept")) k.classList.remove("sleept");
    for (const z of el.querySelectorAll(".sleep-over")) z.classList.remove("sleep-over");
  });
  el.addEventListener("dragover", (e) => {
    const zone = e.target.closest && e.target.closest("[data-bord-dropzone]");
    if (!zone || !sleepId) return;
    e.preventDefault(); // pas hierdoor accepteert de browser een drop
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    zone.classList.add("sleep-over");
  });
  el.addEventListener("dragleave", (e) => {
    const zone = e.target.closest && e.target.closest("[data-bord-dropzone]");
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("sleep-over");
  });
  el.addEventListener("drop", (e) => {
    const zone = e.target.closest && e.target.closest("[data-bord-dropzone]");
    if (!zone) return;
    e.preventDefault();
    const id = sleepId || (e.dataTransfer ? e.dataTransfer.getData("text/plain") : "");
    zone.classList.remove("sleep-over");
    sleepId = null;
    verplaatsNaar(id, zone.getAttribute("data-bord-kolom"));
  });

  el.addEventListener("submit", (e) => {
    const form = e.target.closest && e.target.closest("[data-notitie-form]");
    if (!form) return;
    e.preventDefault();
    const rij = huidigeRij();
    if (!rij) return;
    const onderwerp = form.querySelector("[data-notitie-onderwerp]").value.trim();
    const tekst = form.querySelector("[data-notitie-tekst]").value.trim();
    if (!onderwerp && !tekst) return;
    const info = notitieVeldVan(ctx);
    const knop = form.querySelector("[data-notitie-knop]");
    naamVoorSchrijfactie("notitie", { overslaan: true }).then((naam) => {
      const data = {
        Onderwerp: onderwerp || tekst.slice(0, 60),
        Datum: new Date().toISOString().slice(0, 10),
        Soort: "Mens",
        [info.veld.naam]: { domein: key, id: rij.__entryId },
      };
      if (tekst) data.Notitie = tekst;
      if (naam) data.Auteur = naam;
      // Mislukt het, dan blijft je tekst staan: niet opnieuw tekenen.
      pasToe(() => schrijfWerkruimte(ctx.bron, "POST", "/dashboard/entries", { domein: "notities", data }), {
        domein: "notities", bediening: knop, herstel: false, melding: "Notitie toegevoegd.", foutPlek: "[data-notitie-fout]",
        focus: "[data-notitie-onderwerp]",
      });
    });
  });

  // Een kaart is klikbaar, dus hij hoort ook met Enter/spatie te openen.
  el.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("[data-snel-anders-naam]")) {
      if (e.key === "Enter") { e.preventDefault(); bevestigAnders(); }
      if (e.key === "Escape") {
        e.preventDefault();
        toonAnders(false);
        herteken();
        const wie = el.querySelector("[data-snel-wie]");
        if (wie) wie.focus();
      }
    }
  });

  el.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const kaart = e.target.closest && e.target.closest(".bord-kaart[data-open-rij]");
    if (!kaart) return;
    e.preventDefault();
    kaart.click();
  });

  const invoer = el.querySelector("#data-zoek");
  if (invoer) {
    invoer.addEventListener("input", () => {
      dataZoek = invoer.value;
      herteken();
    });
  }

  // f23 fase D: nieuwe rij / bewerken / verwijderen — alleen in een schrijfsessie.
  if (bewerk.ok) wireDataBewerken(el, key, ctx, ctx.herlaad || (() => {}));
}
