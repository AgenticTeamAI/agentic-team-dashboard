  module.exports = {
    bronKanSchrijven, magDomeinBewerken, dataFormulierHtml, leesFormulier,
    veldInvoerHtml, wireDataBewerken, tokenScopes,
    mijnNaam, zetMijnNaam, snelWijzig, statusPatch, tokenSeat,
    agentOpties, veldOpties, wijzigingenVan, formulierPatch, vorigeWaarden, verwerkAntwoord,
    meld, ongedaanPatch, wijzigingTekst, cssWaarde, focusSelector,
    specialistVan, toewijsPatch, toewijsTekst, vraagNaamIn, naamVoorSchrijfactieIn,
  };
}


/* f47 — het item-blad: één actie, met een eigen adres (#/acties/<id>).
 *
 * Eerst stond een actie als detailkaart bóven de lijst, met een formulier van
 * twintig velden eronder en een statuskiezer die je moest kennen. Janine:
 * "ik kan klikken maar hij doet niks". Het blad zet voorop wat je team maakte
 * en geeft de knoppen die de uitkomst noemen — goedkeuren, terugsturen met een
 * opmerking, ja/nee, laat je team opvolgen, later. De velden zelf staan achter
 * "Alle gegevens"; bewerken kan daar nog steeds, via de Gegevens-tab.
 *
 * Wat elke knop schrijft, staat in voor-jou.js (AFHANDEL) en is daar getest.
 * Hier woont alleen het tonen en het uitvoeren: PATCH (of POST voor een
 * opvolging), de rij ter plekke bijwerken (i81) en ongedaan maken.
 *
 * Op de daglink en bij een extern systeem is het blad alleen-lezen, met een
 * knop om in te loggen: je komt daarna precies hier terug (f44-deeplink). */

const BEURT_TEKST = {
  check: "● jij bent aan zet", voorstel: "● jij bent aan zet", signaal: "● jij bent aan zet",
  taak: "● jij bent aan zet", weer: "● jij bent aan zet", team: "◐ je team is aan zet",
  wacht: "○ wacht", klaar: "✓ afgerond", "klopt-niet": "? niemand aan zet",
};

function itemHerkomstHtml(rij, schema) {
  const door = agentWeergaveNaam(schema, getField(rij, "Aangemaakt door"));
  const stempel = rij.__stempels && rij.__stempels.aangemaakt;
  const wanneer = stempel ? vjDatumKort(parseDateField(stempel)) : "";
  if (door) return `${esc(door)} zette dit klaar${wanneer ? ", " + esc(wanneer) : ""}.`;
  const mens = dataCelTekst(getField(rij, "Aangemaakt door"));
  if (mens) return `${esc(mens)} zette dit op de lijst${wanneer ? ", " + esc(wanneer) : ""}.`;
  return wanneer ? `Op de lijst sinds ${esc(wanneer)}.` : "";
}

function itemHoortBijHtml(ctx, rij) {
  const delen = [];
  for (const veld of ["Organisatie", "Deal", "Project", "Contactpersoon"]) {
    const w = getField(rij, veld);
    const lijst = Array.isArray(w) ? w : (w ? [w] : []);
    for (const v of lijst) {
      const titel = v && typeof v === "object" ? v.titel : v;
      if (titel) delen.push(`<span class="relatie-pil">${esc(String(titel))}</span>`);
    }
  }
  return delen.length ? `<p class="blad-hoortbij">Hoort bij: ${delen.join(" ")}</p>` : "";
}

function itemVeldenHtml(ctx, key, rij) {
  const domein = ctx.schema.datadomeinen[key];
  const regels = dataVelden(domein)
    .filter(v => dataCelTekst(getField(rij, v.naam)) !== "")
    .map(v => `<dt>${esc(v.naam)}</dt><dd>${dataCelHtml(getField(rij, v.naam), v)}</dd>`).join("");
  return `<dl class="blad-velden">${regels}</dl>`;
}

/* `opties.kop` vervangt de terugregel bovenaan (de ronde zet daar zijn eigen
 * voortgang en knoppen neer). */
function itemBladHtml(ctx, key, rij, opties) {
  const o = opties || {};
  const schema = ctx.schema;
  const nu = ctx.today || new Date();
  const knoppen = afhandelKnoppen(rij, schema, nu);
  const titel = detailTitel(ctx.schema.datadomeinen[key], rij);
  const toelichting = dataCelTekst(getField(rij, "Toelichting"));
  const werk = toelichting.replace(OPMERKING_KOP, "");
  // Teruggestuurd: je eigen opmerking staat als citaat bovenaan de Toelichting.
  // Die hoort niet in "wat je team maakte", maar je wilt hem wel terugzien.
  const opmerking = (toelichting.match(OPMERKING_KOP) || [""])[0].replace(/^— |—\n\n$|\s*—\s*$/g, "").trim();
  const vanTeam = !!agentWeergaveNaam(schema, getField(rij, "Aangemaakt door"));
  const namen = agentNamen(schema);
  const teLaat = namen && isTeLaat(rij, namen, nu);
  const bewerk = magDomeinBewerken(ctx, key);
  const subs = subacties(ctx, key, rij.__entryId);
  const notities = notitiesBij(ctx, key, rij.__entryId);

  const knop = (k) => `<button type="button" class="knop blad-knop ${k.stijl ? "blad-knop-" + k.stijl : ""}" data-afhandel="${esc(k.f)}">${esc(k.label)}</button>`;
  let balk;
  if (bewerk.ok) {
    balk = `${knoppen.regel ? `<p class="blad-regel">${esc(knoppen.regel)}</p>` : ""}
      ${knoppen.hoofd ? knop(knoppen.hoofd) : ""}
      ${knoppen.rest.length ? `<div class="blad-knoprij">${knoppen.rest.map(knop).join("")}</div>` : ""}
      <div data-vraag-slot></div>
      <div data-naam-slot="blad"></div>
      <p class="bewerk-fout" data-blad-fout></p>`;
  } else if (bewerk.reden) {
    balk = `<p class="blad-regel">${esc(bewerk.reden)}</p>`;
  } else {
    const kanInloggen = typeof oauthMogelijk === "function" && oauthMogelijk();
    balk = `<p class="blad-regel">${knoppen.regel ? esc(knoppen.regel) + " " : ""}Je kijkt mee. Om dit af te handelen log je in met je licentie; je komt daarna precies hier terug.</p>
      ${kanInloggen ? `<button type="button" class="knop blad-knop blad-knop-prim" data-login>Inloggen en afhandelen</button>` : ""}`;
  }

  return `<article class="blad" data-blad data-blad-id="${esc(rij.__entryId)}">
    ${o.kop || `<a class="detail-link" href="#/acties">← Alle acties</a>`}
    <h2 class="blad-titel" tabindex="-1">${esc(titel)}</h2>
    <p class="blad-meta"><span class="soort-pil">${esc(SOORT_LABEL[knoppen.soort] || "")}</span>
      <span class="beurt beurt-${esc(knoppen.soort)}">${esc(BEURT_TEKST[knoppen.soort] || "")}</span>
      ${teLaat ? `<span class="pil-laat">te laat</span>` : ""}</p>
    ${itemHerkomstHtml(rij, schema) ? `<p class="blad-herkomst">${itemHerkomstHtml(rij, schema)}</p>` : ""}
    ${itemHoortBijHtml(ctx, rij)}
    ${opmerking && knoppen.soort === "team" ? `<p class="blad-citaat">${esc(opmerking)}</p>` : ""}
    ${werk ? `<section class="papier" aria-label="${vanTeam ? "Wat je team maakte" : "Toelichting"}">
      <div class="papier-kop"><h3>${vanTeam ? "Wat je team maakte" : "Toelichting"}</h3>
        <button type="button" class="knop-mini bedien-knop" data-kopieer>Kopieer alles</button></div>
      <div class="prosa" data-werk>${langeTekstHtml(werk, { regeleinden: true })}</div>
    </section>` : ""}
    <div class="beslisbalk">${balk}</div>
    <details class="blad-uitklap"><summary>Notities (${notities.length})</summary>
      ${notities.length ? `<ul class="notitie-lijst">${notities.map(n => `<li class="notitie"><p class="notitie-kop"><strong>${esc(dataCelTekst(getField(n, "Onderwerp")) || "Notitie")}</strong>
        <span class="footnote">${esc([dataCelTekst(getField(n, "Auteur")), dataCelTekst(getField(n, "Datum"))].filter(Boolean).join(" · "))}</span></p>
        <div class="notitie-tekst prosa">${langeTekstHtml(dataCelTekst(getField(n, "Notitie")))}</div></li>`).join("")}</ul>` : `<p class="footnote">Nog geen notities.</p>`}
      <p class="footnote">Notities zijn voor jou en je collega's; je team leest ze niet. Wil je dat je team iets anders doet, gebruik dan de knoppen hierboven.</p>
    </details>
    <details class="blad-uitklap"><summary>Wat hieraan hangt (${subs.length})</summary>
      ${subs.length ? `<ul class="blad-subs">${subs.map(r => `<li><a href="#/acties/${encodeURIComponent(r.__entryId)}">${esc(detailTitel(ctx.schema.datadomeinen[key], r))}</a>
        <span class="footnote">${esc(SOORT_LABEL[soortVan(r, namen, nu)] || "")}</span></li>`).join("")}</ul>` : `<p class="footnote">Nog niets.</p>`}
    </details>
    <details class="blad-uitklap"><summary>Alle gegevens</summary>
      ${itemVeldenHtml(ctx, key, rij)}
      <p><a class="detail-link" href="#/data/${esc(key)}" data-detail-open="${esc(key)}|${esc(rij.__entryId)}">Bewerken in Gegevens →</a></p>
    </details>
  </article>`;
}

function itemVraagHtml(f, rij, ctx) {
  const vraag = AFHANDEL_VRAAGT[f] || {};
  const nu = ctx.today || new Date();
  const delen = [];
  if (vraag.specialist) {
    const standaard = specialistVanRij(rij, ctx.schema);
    const opties = agentOpties(ctx.schema);
    delen.push(`<label class="bedien-veld"><span>Wie van je team?</span>
      <select data-vraag-specialist>${opties.map(a => `<option value="${esc(a)}"${a === standaard ? " selected" : ""}>${esc(a)}</option>`).join("")}</select></label>`);
  }
  if (vraag.tekst) {
    const voorstel = f === "opvolgen" ? `Pak de volgende stap op: ${detailTitel(ctx.schema.datadomeinen.acties, rij)}` : "";
    delen.push(`<label class="bedien-veld blad-vraag-tekst"><span>${esc(vraag.label)}</span>
      <textarea data-vraag-tekst rows="3" placeholder="${esc(vraag.plaats || "")}">${esc(voorstel)}</textarea></label>`);
  }
  if (vraag.datum) {
    const keuzes = (vraag.vandaag ? [{ label: "Vandaag", datum: vjIsoDag(nu) }] : []).concat(datumKeuzes(nu));
    delen.push(`<div class="blad-datums" role="group" aria-label="Kies een dag">${keuzes.map(k =>
      `<button type="button" class="knop-mini bedien-knop" data-vraag-datum="${esc(k.datum)}">${esc(k.label)} <span class="footnote">${esc(vjDatumKort(k.datum))}</span></button>`).join("")}
      <label class="bedien-veld"><span>Andere dag</span><input type="date" data-vraag-eigen-datum min="${esc(vjIsoDag(nu))}"></label></div>`);
  }
  const knopLabel = { terug: "Terugsturen", nee: "Nee, niet doen", zelf: "Afronden", opvolgen: "Laat opvolgen", geefAan: "Doorgeven" }[f];
  return `<div class="naam-vraag blad-vraag" data-vraag="${esc(f)}" role="group">
    ${delen.join("")}
    ${knopLabel ? `<button type="button" class="knop" data-vraag-ok>${esc(knopLabel)}</button>` : ""}
    <button type="button" class="knop knop-secundair" data-vraag-niet>Annuleren</button>
    <p class="bewerk-fout" data-vraag-fout></p>
  </div>`;
}

async function kopieerTekst(tekst) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(tekst); return true; }
  } catch (e) { /* valt terug op de oude weg */ }
  const vak = document.createElement("textarea");
  vak.value = tekst;
  vak.setAttribute("readonly", "");
  vak.style.position = "fixed";
  vak.style.opacity = "0";
  document.body.appendChild(vak);
  vak.select();
  let gelukt = false;
  try { gelukt = document.execCommand("copy"); } catch (e) { gelukt = false; }
  vak.remove();
  return gelukt;
}

function renderItemBlad(el, key, id, ctx) {
  const rijen = dataRijenVan(ctx, key) || [];
  const rij = rijen.find(r => r.__entryId === id);
  if (!rij) {
    el.innerHTML = `<div class="blad"><a class="detail-link" href="#/acties">← Alle acties</a>
      <h2 class="blad-titel">Dit item is er niet (meer)</h2>
      <p>Misschien is het verwijderd, of hoort de link bij een andere werkruimte.</p></div>`;
    return;
  }
  el.innerHTML = itemBladHtml(ctx, key, rij);
  document.title = `${detailTitel(ctx.schema.datadomeinen[key], rij)} — Agentic Team Dashboard`;
  wireItemBlad(el, key, rij, ctx);
}

/* Eén afhandeling uitvoeren: naam vragen als dat moet, PATCH (of voor een
 * opvolging POST + PATCH), de rij ter plekke bijwerken en de meldingsregel
 * met ongedaan maken. Gedeeld door het blad en de kaarten in Voor jou (f46),
 * zodat een knop overal precies hetzelfde doet.
 *
 * `plek` zegt waar het in de pagina gebeurt: {naamSlot, foutEl, bezig (het
 * element dat aria-busy krijgt), knoppen (die uit gaan zolang het loopt),
 * focus (selector voor na afloop)}. */
async function voerAfhandelingUit(ctx, key, rij, f, invoer, plek) {
  const i = invoer || {};
  const p = plek || {};
  const zetFout = (t) => { if (p.foutEl) p.foutEl.textContent = t || ""; };
  zetFout("");
  const metNaam = AFHANDEL_MET_NAAM.indexOf(f) !== -1;
  const ik = metNaam
    ? await naamVoorSchrijfactieIn(p.naamSlot, ctx.bron, { overslaan: f === "terug" || f === "ja" })
    : (mijnNaam(ctx.bron) || null);
  if (metNaam && !ik && f !== "terug" && f !== "ja") return false;
  const c = { ik, schema: ctx.schema, nu: ctx.today || new Date(), tekst: i.tekst, datum: i.datum, specialist: i.specialist };
  const knoppen = p.knoppen || [];
  knoppen.forEach((b) => { b.disabled = true; });
  if (p.bezig) p.bezig.setAttribute("aria-busy", "true");
  try {
    if (f === "opvolgen") {
      const plan = opvolgActie(rij, c);
      const nieuw = await schrijfWerkruimte(ctx.bron, "POST", "/dashboard/entries", { domein: key, data: plan.data });
      const nieuwId = nieuw && nieuw.entry && nieuw.entry.entryId;
      const vorige = vorigeWaarden(rij, plan.ouder);
      const antwoord = await snelWijzig(ctx, key, rij.__entryId, plan.ouder);
      if (nieuwId && ctx.werkBij) ctx.werkBij(key, { entry: nieuw.entry });
      await verwerkAntwoord(ctx, key, antwoord, { focus: p.focus });
      meld(plan.melding, { actie: { label: "Ongedaan maken", doe: async () => {
        if (nieuwId) {
          await schrijfWerkruimte(ctx.bron, "DELETE", "/dashboard/entries/" + encodeURIComponent(key) + "/" + encodeURIComponent(nieuwId));
          if (ctx.werkBij) ctx.werkBij(key, { weg: nieuwId });
        }
        await verwerkAntwoord(ctx, key, await snelWijzig(ctx, key, rij.__entryId, vorige));
        meld("Teruggezet.");
      } } });
      return true;
    }
    const { patch, melding } = afhandelPatch(f, rij, c);
    const vorige = vorigeWaarden(rij, patch);
    const antwoord = await snelWijzig(ctx, key, rij.__entryId, patch);
    await verwerkAntwoord(ctx, key, antwoord, { focus: p.focus });
    meld(melding, { actie: ongedaanPatch(ctx, key, rij.__entryId, vorige) });
    return true;
  } catch (e) {
    knoppen.forEach((b) => { b.disabled = false; });
    if (p.bezig) p.bezig.removeAttribute("aria-busy");
    const tekst = (e && e.message) || "Dat is niet gelukt.";
    zetFout(tekst + " Probeer het opnieuw.");
    meld("Niet gelukt: " + tekst, { fout: true });
    return false;
  }
}

function wireItemBlad(el, key, rij, ctx) {
  function voerUit(f, invoer) {
    return voerAfhandelingUit(ctx, key, rij, f, invoer, {
      naamSlot: el.querySelector('[data-naam-slot="blad"]'),
      foutEl: el.querySelector("[data-vraag-fout]") || el.querySelector("[data-blad-fout]"),
      bezig: el.querySelector("[data-blad]"),
      knoppen: Array.from(el.querySelectorAll("[data-afhandel], [data-vraag-ok]")),
      focus: ".blad-titel",
    });
  }

  function toonVraag(f) {
    const slot = el.querySelector("[data-vraag-slot]");
    if (!slot) return;
    slot.innerHTML = itemVraagHtml(f, rij, ctx);
    const vak = slot.querySelector("[data-vraag]");
    const eerste = vak.querySelector("textarea, select, [data-vraag-datum]");
    if (eerste) eerste.focus();
    const sluit = () => { slot.innerHTML = ""; const k = el.querySelector(`[data-afhandel="${f}"]`); if (k) k.focus(); };
    vak.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); sluit(); } });
    vak.addEventListener("click", (e) => {
      if (e.target.closest("[data-vraag-niet]")) { sluit(); return; }
      const dag = e.target.closest("[data-vraag-datum]");
      if (dag) { voerUit(f, { datum: dag.getAttribute("data-vraag-datum") }); return; }
      if (!e.target.closest("[data-vraag-ok]")) return;
      const tekstVak = vak.querySelector("[data-vraag-tekst]");
      const tekst = tekstVak ? tekstVak.value.trim() : "";
      const regel = AFHANDEL_VRAAGT[f] || {};
      if (regel.tekst === "verplicht" && !tekst) {
        vak.querySelector("[data-vraag-fout]").textContent = "Schrijf in een paar woorden wat er moet gebeuren.";
        tekstVak.focus();
        return;
      }
      const sp = vak.querySelector("[data-vraag-specialist]");
      voerUit(f, { tekst, specialist: sp ? sp.value : undefined });
    });
    const eigen = vak.querySelector("[data-vraag-eigen-datum]");
    if (eigen) eigen.addEventListener("change", () => { if (eigen.value) voerUit(f, { datum: eigen.value }); });
  }

  el.addEventListener("click", async (e) => {
    const knop = e.target.closest && e.target.closest("[data-afhandel]");
    if (knop) {
      const f = knop.getAttribute("data-afhandel");
      if (AFHANDEL_VRAAGT[f]) toonVraag(f);
      else voerUit(f);
      return;
    }
    if (e.target.closest && e.target.closest("[data-kopieer]")) {
      const werk = dataCelTekst(getField(rij, "Toelichting")).replace(OPMERKING_KOP, "");
      meld((await kopieerTekst(werk)) ? "Gekopieerd." : "Kopiëren lukte niet. Selecteer de tekst en kopieer hem zelf.", {});
      return;
    }
  });
}

if (typeof module !== "undefined") {
  module.exports = { renderItemBlad, itemBladHtml, itemVraagHtml, kopieerTekst, voerAfhandelingUit, BEURT_TEKST };
}


/* f46 deel 2 — de tab Voor jou.
 *
 * "De klanten moeten ervaren hoe het team ze helpt." Bovenaan staat daarom
 * eerst wat je team deed (de verhaalkop), en dan wat er op jou wacht: een
 * genummerde werkbak die je met één tik afhandelt. Wat er in de werkbak staat
 * komt uit aanJouZet() (voor-jou.js) — dezelfde functie als de badge op de
 * tab, zodat die twee nooit verschillend tellen. De knoppen zijn die van het
 * item-blad (voerAfhandelingUit); wat een vraag nodig heeft (een opmerking, een
 * dag) opent het blad.
 *
 * De verhaalkop gaat over "sinds gisteren", niet over "sinds je laatste
 * bezoek": dat zou het onthouden tijdstip van je vorige bezoek hergebruiken,
 * en dat is een eigen juridisch restpunt (i87).
 *
 * Nummers blijven staan tot je ververst: wie in de chat "nummer 3" hoort, moet
 * op het scherm hetzelfde nummer 3 vinden, ook nadat je 1 en 2 afhandelde. */

let vjNummering = { bundle: null, map: new Map(), volgende: 1 };

function vjGenummerd(bundle, lijst) {
  if (vjNummering.bundle !== bundle) vjNummering = { bundle, map: new Map(), volgende: 1 };
  for (const r of lijst) {
    if (r.__entryId && !vjNummering.map.has(r.__entryId)) vjNummering.map.set(r.__entryId, vjNummering.volgende++);
  }
  return lijst.slice().sort((a, b) => (vjNummering.map.get(a.__entryId) || 0) - (vjNummering.map.get(b.__entryId) || 0));
}

function _resetVoorJouNummers() { vjNummering = { bundle: null, map: new Map(), volgende: 1 }; }

/* Wie ben ik, voor "per persoon"? Alleen een gekozen naam; op de daglink of
 * zonder naam is dat onbekend, en dan verstopt aanJouZet niets. */
function vjIk(ctx) {
  return (ctx.bron && ctx.bron.oauth && mijnNaam(ctx.bron)) || undefined;
}

function voorJouLijst(ctx) {
  // b62: ook op de metricsroute, zolang de acties-rijen er zijn.
  if (!ctx || !ctx.bundle || !rows(ctx.bundle, "acties")) return null;
  return aanJouZet(ctx.bundle, ctx.schema, { ik: vjIk(ctx), nu: ctx.today || new Date() });
}

function vjTelwoord(n, enkel, meer) { return `${n} ${n === 1 ? enkel : meer}`; }

function vjVerhaal(ctx, lijst) {
  const acties = rows(ctx.bundle, "acties") || [];
  const namen = agentNamen(ctx.schema);
  if (!namen) return null;
  const nu = ctx.today || new Date();
  const van = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() - 1);
  const sinds = (v) => { const d = parseDateField(v); return !!d && d >= van; };
  const stempel = (r, k) => r.__stempels && r.__stempels[k];
  const zelf = acties.filter(r => getField(r, "Status") === "Klaar"
    && isAgentNaam(getField(r, "Afgerond door"), namen) && sinds(getField(r, "Afgerond op")));
  const klaar = lijst.filter(r => isAgentNaam(getField(r, "Aangemaakt door"), namen) && sinds(stempel(r, "aangemaakt")));
  const begon = acties.filter(r => getField(r, "Status") === "Bezig"
    && isAgentNaam(getField(r, "Eigenaar"), namen) && sinds(stempel(r, "bijgewerkt")));
  const wie = new Set();
  for (const r of zelf) wie.add(agentWeergaveNaam(ctx.schema, getField(r, "Afgerond door")));
  for (const r of klaar) wie.add(agentWeergaveNaam(ctx.schema, getField(r, "Aangemaakt door")));
  for (const r of begon) wie.add(agentWeergaveNaam(ctx.schema, getField(r, "Eigenaar")));
  wie.delete(null);

  const delen = [];
  if (zelf.length) delen.push(`rondde ${vjTelwoord(zelf.length, "ding", "dingen")} zelf af`);
  if (klaar.length) delen.push(`zette er ${klaar.length} voor je klaar`);
  if (begon.length) delen.push(`begon aan ${begon.length}`);
  const zin = delen.length
    ? "Sinds gisteren " + delen[0].replace(/^(\S+)/, "$1 je team")
      + (delen.length > 1 ? (delen.length > 2 ? ", " + delen.slice(1, -1).join(", ") : "") + " en " + delen[delen.length - 1] : "") + "."
    : "Sinds gisteren zette je team niets nieuws voor je klaar.";
  return { zin, wie: Array.from(wie) };
}

function vjSindsTekst(rij, namen, nu) {
  if (isTeLaat(rij, namen, nu)) {
    const dl = parseDateField(getField(rij, "Deadline"));
    const dagen = dl ? Math.max(1, Math.round((new Date(nu.getFullYear(), nu.getMonth(), nu.getDate()) - new Date(dl.getFullYear(), dl.getMonth(), dl.getDate())) / 86400000)) : 0;
    return { tekst: dagen ? `${dagen} ${dagen === 1 ? "dag" : "dgn"} te laat` : "te laat", laat: true };
  }
  if (soortVan(rij, namen, nu) === "weer") return { tekst: "weer aan de beurt", laat: false };
  const s = sindsVan(rij);
  return { tekst: s ? "sinds " + vjDatumKort(s) : "", laat: false };
}

function vjVoorproef(rij) {
  const tekst = dataCelTekst(getField(rij, "Toelichting")).replace(OPMERKING_KOP, "").replace(/\s+/g, " ").trim();
  return tekst.length > 160 ? tekst.slice(0, 157) + "…" : tekst;
}

function vjKaartHtml(ctx, rij, nr, kanAfhandelen) {
  const nu = ctx.today || new Date();
  const namen = agentNamen(ctx.schema);
  const k = afhandelKnoppen(rij, ctx.schema, nu);
  const id = rij.__entryId;
  const href = `#/acties/${encodeURIComponent(id)}`;
  const titel = detailTitel(ctx.schema.datadomeinen.acties, rij);
  const sinds = vjSindsTekst(rij, namen, nu);
  const van = agentWeergaveNaam(ctx.schema, getField(rij, "Aangemaakt door"));
  const voorproef = vjVoorproef(rij);
  let hoofd = "";
  if (kanAfhandelen && k.hoofd) {
    hoofd = AFHANDEL_VRAAGT[k.hoofd.f]
      ? `<a class="knop blad-knop blad-knop-${esc(k.hoofd.stijl)}" href="${href}">${esc(k.hoofd.label)}</a>`
      : `<button type="button" class="knop blad-knop blad-knop-${esc(k.hoofd.stijl)}" data-vj-afhandel="${esc(k.hoofd.f)}">${esc(k.hoofd.label)}</button>`;
  }
  return `<li class="vj-kaart" data-vj-id="${esc(id)}">
    <span class="vj-nr" aria-hidden="true">${nr}</span>
    <div class="vj-inhoud">
      <a class="vj-titel" href="${href}"><span class="visueel-verborgen">Nummer ${nr}: </span>${esc(titel)}</a>
      <p class="vj-meta"><span class="soort-pil">${esc(SOORT_LABEL[k.soort] || "")}</span>
        ${sinds.tekst ? `<span class="${sinds.laat ? "pil-laat" : "vj-sinds"}">${esc(sinds.tekst)}</span>` : ""}
        ${van ? `<span class="vj-van">van ${esc(van)}</span>` : ""}</p>
      ${voorproef ? `<p class="vj-voorproef">${esc(voorproef)}</p>` : ""}
      <div class="vj-knoppen">${hoofd}<a class="knop blad-knop" href="${href}">Bekijk</a></div>
      <div data-naam-slot="kaart"></div>
      <p class="bewerk-fout" data-kaart-fout></p>
    </div>
  </li>`;
}

function vjOnderregelsHtml(ctx) {
  const o = { ik: vjIk(ctx), nu: ctx.today || new Date() };
  const team = bijTeam(ctx.bundle, ctx.schema, o);
  const bezig = team.filter(r => getField(r, "Status") === "Bezig").length;
  const collegas = bijCollegas(ctx.bundle, ctx.schema, o).length;
  const regels = [];
  if (team.length) {
    const delen = [bezig ? `${bezig} bezig` : "", team.length - bezig ? `${team.length - bezig} bij het volgende werkmoment` : ""].filter(Boolean);
    regels.push(`<a class="vj-onder" href="#/acties">◐ Bij je team: ${esc(delen.join(" · "))} →</a>`);
  }
  if (collegas) regels.push(`<a class="vj-onder" href="#/acties">Bij collega's: ${collegas} →</a>`);
  return regels.length ? `<div class="vj-onderregels">${regels.join("")}</div>` : "";
}

function renderVoorJou(paneel, ctx) {
  if (!paneel) return;
  const body = paneel.querySelector("#panel-voor-jou-body") || paneel;
  const lijst = voorJouLijst(ctx);
  if (!lijst) {
    // f54: Notion-klanten krijgen de werkbak uit hun dagstart, alleen lezen.
    const uitDagstart = typeof metricsVoorJou === "function" ? metricsVoorJou(ctx) : null;
    if (uitDagstart) { paneel.style.display = ""; body.innerHTML = notionVoorJouHtml(ctx, uitDagstart); return; }
    paneel.style.display = "none"; body.innerHTML = ""; return;
  }
  paneel.style.display = "";
  const genummerd = vjGenummerd(ctx.bundle, lijst);
  const kanAfhandelen = magDomeinBewerken(ctx, "acties").ok;
  const verhaal = vjVerhaal(ctx, lijst);
  const nu = ctx.today || new Date();
  const oudste = lijst.reduce((min, r) => { const s = sindsVan(r); return s && (!min || s < min) ? s : min; }, null);
  const oudsteDagen = oudste ? Math.floor((nu - oudste) / 86400000) : 0;
  // Op de daglink staat de inlogknop in de balk bovenaan (b62), niet ook nog hier.
  const inlogRegel = "";

  body.innerHTML = `
    ${typeof stilKaartHtml === "function" ? stilKaartHtml(ctx) : ""}
    ${verhaal ? `<div class="vj-verhaal"><p class="vj-verhaal-zin">${esc(verhaal.zin)}</p>
      ${verhaal.wie.length ? `<p class="footnote">${esc(verhaal.wie.join(" · "))} · <a href="#/team">Wat deden ze? →</a></p>` : ""}</div>` : ""}
    <div class="vj-kop"><h2>Voor jou <span class="vj-teller">${lijst.length}</span></h2>
      ${vjIk(ctx) ? `<span class="footnote">als ${esc(vjIk(ctx))} · <button type="button" class="filter-wis" data-vj-naam-wijzig>wijzig</button></span>` : ""}
      ${oudsteDagen >= 1 ? `<span class="footnote">oudste ligt er ${oudsteDagen} ${oudsteDagen === 1 ? "dag" : "dagen"}</span>` : ""}
      ${typeof hoeWerktDitHtml === "function" ? hoeWerktDitHtml("voor-jou") : ""}</div>
    ${inlogRegel}
    ${vjNaamRegelHtml(ctx)}
    ${lijst.length >= 2 ? `<a class="knop blad-knop vj-ronde-start" href="#/ronde">Loop ze één voor één door ›</a>` : ""}
    ${lijst.length
      ? `<ol class="vj-lijst">${genummerd.map(r => vjKaartHtml(ctx, r, vjNummering.map.get(r.__entryId), kanAfhandelen)).join("")}</ol>`
      : `<p class="vj-leeg">Niets voor jou op dit moment. Je team werkt door; wat het voor je klaarzet, verschijnt hier.</p>`}
    ${typeof opdrachtKnopHtml === "function" ? `<p class="vj-opdracht">${opdrachtKnopHtml(ctx)}</p>` : ""}
    ${vjOnderregelsHtml(ctx)}`;

  wireVjNaam(body, ctx);
  // Eén handler per paneel, vervangen bij elke render (renderAll tekent dit
  // paneel na elke schrijfactie opnieuw).
  body.onclick = (e) => {
    const knop = e.target.closest && e.target.closest("[data-vj-afhandel]");
    if (!knop) return;
    const kaart = knop.closest("[data-vj-id]");
    const id = kaart.getAttribute("data-vj-id");
    const rij = (dataRijenVan(ctx, "acties") || []).find(r => r.__entryId === id);
    if (!rij) return;
    // Na afloop de focus op de volgende kaart, zodat je met het toetsenbord
    // gewoon doorwerkt; zonder volgende op de kop.
    const volgende = kaart.nextElementSibling && kaart.nextElementSibling.getAttribute("data-vj-id");
    voerAfhandelingUit(ctx, "acties", rij, knop.getAttribute("data-vj-afhandel"), {}, {
      naamSlot: kaart.querySelector("[data-naam-slot]"),
      foutEl: kaart.querySelector("[data-kaart-fout]"),
      bezig: kaart,
      knoppen: Array.from(kaart.querySelectorAll("button")),
      focus: volgende ? `[data-vj-id="${cssWaarde(volgende)}"] .vj-titel` : ".vj-kop h2",
    });
  };
}

/* Weet het dashboard niet wie je bent, dan telt alles van een mens mee —
 * ook wat op naam van een collega staat. Werken er meerdere mensen aan de
 * acties, dan zeggen we dat, met een knop om je naam te kiezen. Bewust pas
 * op een klik: de naam opzoeken bij de site gebeurt alleen als jij erom vraagt
 * (i77 — wie nooit iets doet, laat ons nooit een adres opzoeken). */
function vjNaamRegelHtml(ctx) {
  if (vjIk(ctx) || !magDomeinBewerken(ctx, "acties").ok) return "";
  const namen = agentNamen(ctx.schema);
  const mensen = new Set();
  for (const r of rows(ctx.bundle, "acties") || []) {
    const e = dataCelTekst(getField(r, "Eigenaar")).trim();
    if (e && !isAgentNaam(e, namen) && getField(r, "Status") !== "Klaar") mensen.add(normAgentNaam(e));
  }
  if (mensen.size < 2) return "";
  return `<p class="vj-inlog">Werk je met meer mensen aan deze acties?
      <button type="button" class="knop blad-knop" data-vj-naam>Zeg wie je bent</button>
      dan zie je hier alleen wat van jou is.</p>
    <div data-naam-slot="vj"></div>`;
}

function wireVjNaam(el, ctx) {
  const wijzig = el.querySelector("[data-vj-naam-wijzig]");
  if (wijzig) {
    wijzig.addEventListener("click", () => {
      let slot = el.querySelector('[data-naam-slot="vj"]');
      if (!slot) { slot = document.createElement("div"); slot.setAttribute("data-naam-slot", "vj"); wijzig.closest(".vj-kop").after(slot); }
      vraagNaamIn(slot, ctx.bron).then((naam) => {
        if (!naam) { wijzig.focus(); return; }
        meld(`Je werkt nu als ${naam}.`);
        if (ctx.hertekenAlles) ctx.hertekenAlles();
      });
    });
  }
  const knop = el.querySelector("[data-vj-naam]");
  if (!knop) return;
  knop.addEventListener("click", () => {
    vraagNaamIn(el.querySelector('[data-naam-slot="vj"]'), ctx.bron).then((naam) => {
      if (!naam) { knop.focus(); return; }
      meld(`Je werkt nu als ${naam}.`);
      if (ctx.hertekenAlles) ctx.hertekenAlles();
    });
  });
}

/* ── f46: één voor één ─────────────────────────────────────────────────
 *
 * "Loop ze één voor één door": het item-blad van elk stuk in de werkbak,
 * in dezelfde volgorde en met dezelfde nummers. Handel je er een af, dan
 * verdwijnt het uit de werkbak (aanJouZet) en staat vanzelf het volgende er;
 * de ronde zelf onthoudt alleen welke stukken erin zaten, waar je bent en wat
 * je oversloeg. Aan het eind een slotkaart: wat je deed, en wat nu bij je team
 * ligt. De ronde leeft per bundel, net als de nummers: Ververs begint opnieuw. */
let vjRonde = null;

function _resetRonde() { vjRonde = null; }

function rondeVoor(ctx) {
  const lijst = voorJouLijst(ctx);
  if (!lijst) return null;
  if (!vjRonde || vjRonde.bundle !== ctx.bundle) {
    vjRonde = { bundle: ctx.bundle, ids: vjGenummerd(ctx.bundle, lijst).map(r => r.__entryId), pos: 0, over: new Set() };
  }
  const nog = new Set(lijst.map(r => r.__entryId));
  let i = vjRonde.pos;
  while (i < vjRonde.ids.length && (!nog.has(vjRonde.ids[i]) || vjRonde.over.has(vjRonde.ids[i]))) i++;
  vjRonde.pos = i;
  const afgehandeld = vjRonde.ids.filter(id => !nog.has(id)).length;
  return { ronde: vjRonde, huidig: vjRonde.ids[i] || null, nog, afgehandeld, totaal: vjRonde.ids.length };
}

function rondeKopHtml(nr, positie, totaal, heeftVorige) {
  return `<div class="ronde-kop">
      <span class="ronde-voortgang">Nr ${nr} · ${positie} van ${totaal}</span>
      <span class="ronde-knoppen">
        <button type="button" class="knop-mini bedien-knop" data-ronde="vorige" aria-keyshortcuts="K"${heeftVorige ? "" : " disabled"}>‹ Vorige</button>
        <button type="button" class="knop-mini bedien-knop" data-ronde="over" aria-keyshortcuts="J">Sla over ›</button>
        <a class="knop-mini bedien-knop" href="#/" data-ronde="stop" aria-keyshortcuts="Escape">Stoppen</a>
      </span>
    </div>`;
}

function renderRonde(buiten, ctx) {
  // Elke tekening in een vers vak: zo nemen de klik-handlers van het vorige
  // blad niet mee naar het volgende (anders deed een knop het twee keer).
  const el = document.createElement("div");
  buiten.replaceChildren(el);
  const opnieuw = () => {
    renderRonde(buiten, ctx);
    const t = buiten.querySelector(".blad-titel"); if (t) t.focus();
  };
  const stand = rondeVoor(ctx);
  if (!stand) { el.innerHTML = `<p>Er is niets om door te lopen.</p><a class="detail-link" href="#/">← Voor jou</a>`; return; }
  const { ronde, huidig, totaal, afgehandeld } = stand;
  if (!huidig) {
    const over = ronde.over.size;
    const team = bijTeam(ctx.bundle, ctx.schema, { nu: ctx.today || new Date() }).length;
    el.innerHTML = `<div class="blad ronde-slot">
      <h2 class="blad-titel" tabindex="-1">Klaar voor nu</h2>
      <p>Je handelde er ${afgehandeld} af${over ? `, ${over} sloeg je over` : ""}.</p>
      ${team ? `<p class="footnote">Bij je team: ${team}. Wat het oppakt, zie je terug in Voor jou.</p>` : ""}
      <p><a class="knop blad-knop blad-knop-prim" href="#/">Terug naar Voor jou</a>
        ${over ? `<button type="button" class="knop blad-knop" data-ronde="opnieuw">Loop de overgeslagen nog eens door</button>` : ""}</p>
    </div>`;
    el.addEventListener("click", (e) => {
      if (e.target.closest && e.target.closest('[data-ronde="opnieuw"]')) {
        ronde.over.clear();
        ronde.pos = 0;
        opnieuw();
      }
    });
    return;
  }
  const rij = (dataRijenVan(ctx, "acties") || []).find(r => r.__entryId === huidig);
  const nr = vjNummering.map.get(huidig);
  const heeftVorige = ronde.ids.slice(0, ronde.pos).some(id => stand.nog.has(id));
  el.innerHTML = itemBladHtml(ctx, "acties", rij, { kop: rondeKopHtml(nr, ronde.pos + 1, totaal, heeftVorige) });
  wireItemBlad(el, "acties", rij, ctx);
  el.addEventListener("click", (e) => {
    const knop = e.target.closest && e.target.closest("[data-ronde]");
    if (!knop) return;
    const wat = knop.getAttribute("data-ronde");
    if (wat === "over") { ronde.over.add(huidig); ronde.pos += 1; }
    else if (wat === "vorige") {
      // Terug naar het vorige stuk dat nog openstaat, ook als je het oversloeg.
      let i = ronde.pos - 1;
      while (i >= 0 && !stand.nog.has(ronde.ids[i])) i--;
      if (i < 0) return;
      ronde.over.delete(ronde.ids[i]);
      ronde.pos = i;
    } else return;
    opnieuw();
  });
}

/* ── f46: sneltoetsen op een toetsenbord ────────────────────────────────
 * Nooit terwijl je typt, en nooit met Ctrl/Cmd/Alt erbij (die zijn van de
 * browser). Op Voor jou opent 1–9 dat nummer; in de ronde bladeren J/K (of de
 * pijltjes), doet G de hoofdknop en stopt Esc. Op een los blad gaat Esc terug
 * naar Acties. Alleen toetsen die nu ergens heen kunnen, doen iets. */
function vjToetsIsTypen(doel) {
  if (!doel || !doel.tagName) return false;
  const t = doel.tagName.toLowerCase();
  return t === "input" || t === "textarea" || t === "select" || doel.isContentEditable;
}

function vjSneltoets(e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || vjToetsIsTypen(e.target)) return;
  const hash = window.location.hash || "";
  const klik = (sel) => { const k = document.querySelector(sel); if (k) { e.preventDefault(); k.click(); } return !!k; };
  if (hash === "#/ronde") {
    if (e.key === "j" || e.key === "ArrowRight") return void klik('[data-ronde="over"]');
    if (e.key === "k" || e.key === "ArrowLeft") return void klik('[data-ronde="vorige"]');
    if (e.key === "g") return void klik("[data-afhandel].blad-knop-prim, [data-afhandel].blad-knop-teamvol");
    if (e.key === "Escape") { e.preventDefault(); window.location.hash = "#/"; }
    return;
  }
  if (/^#\/acties\/./.test(hash)) {
    if (e.key === "Escape" && !document.querySelector("[data-vraag], .naam-vraag")) { e.preventDefault(); window.location.hash = "#/acties"; }
    return;
  }
  if ((hash === "" || hash === "#" || hash === "#/") && /^[1-9]$/.test(e.key)) {
    const nr = Number(e.key);
    for (const [id, n] of vjNummering.map) {
      if (n === nr && document.querySelector(`[data-vj-id="${cssWaarde(id)}"]`)) {
        e.preventDefault();
        window.location.hash = `#/acties/${encodeURIComponent(id)}`;
        return;
      }
    }
  }
}

let vjToetsenAan = false;
function zetSneltoetsenAan() {
  if (vjToetsenAan || typeof document === "undefined") return;
  vjToetsenAan = true;
  document.addEventListener("keydown", vjSneltoets);
}

/* Voor de badge op de tab: hetzelfde getal als de kop van de werkbak. */
function voorJouAantal(ctx) {
  const lijst = voorJouLijst(ctx);
  if (lijst) return lijst.length;
  const uitDagstart = typeof metricsVoorJou === "function" ? metricsVoorJou(ctx) : null;
  return uitDagstart ? uitDagstart.length : null;
}

if (typeof module !== "undefined") {
  module.exports = { renderVoorJou, voorJouLijst, voorJouAantal, vjVerhaal, vjGenummerd, _resetVoorJouNummers,
    renderRonde, rondeVoor, _resetRonde, vjSneltoets, zetSneltoetsenAan };
}


/* f48 — de Acties-tab: wie is aan zet?
 *
 * Acties zaten tussen zevenentwintig domeinen in de Data-tab, als tabel of
 * statusbord. Maar de vraag die een klant stelt is niet "welke status", het is
 * "ligt dit bij mij of bij mijn team?". Daarom vier banen — Jij · Je team ·
 * Wacht · Afgerond — met daaronder wat bij een collega ligt, wat van niemand
 * is, en wat niet helemaal klopt. De indeling komt uit baanVan() (voor-jou.js):
 * elke actie staat in precies één baan, en de baan Jij is exact de werkbak van
 * Voor jou, met dezelfde nummers.
 *
 * Elke rij opent het item-blad (#/acties/<id>). Zoeken gaat ook door wat je
 * team schreef (de Toelichting); de chip "Klaargezet door je team" is het
 * archief van alles wat een agent voor je klaarzette (f44, terugvindbaar). De
 * gewone tabel met alle velden en het statusbord staan nog steeds onder
 * Gegevens › Acties.
 *
 * Op de telefoon zie je één baan tegelijk, met een keuze erboven; op een breed
 * scherm staan ze naast elkaar.
 *
 * Verplaatsen: slepen naar een andere baan, of "Verplaats" op de rij (voor
 * toetsenbord en telefoon — slepen alleen is geen bediening). Naar Je team
 * vraagt "aan wie?", naar Wacht "tot wanneer?"; naar Jij en Afgerond gebeurt
 * het meteen, met ongedaan maken. De patches zijn die van de afhandelknoppen
 * (AFHANDEL), zodat i25 hier precies zo geldt: afronden laat Afgerond door
 * leeg, heropenen laat Afgerond op staan. */

let actiesZoek = "";
let actiesArchief = false;
let actiesBaan = "jij";

const BAAN_KOP = {
  jij: { teken: "●", titel: "Jij", leeg: "Niets dat op jou wacht." },
  team: { teken: "◐", titel: "Je team", leeg: "Je team heeft nu niets onder handen." },
  wacht: { teken: "○", titel: "Wacht", leeg: "Er wacht niets." },
  afgerond: { teken: "✓", titel: "Afgerond", leeg: "Nog niets afgerond." },
};
const AFGEROND_TONEN = 15;
const VERPLAATS_BANEN = ["jij", "team", "wacht", "afgerond"];
const VERPLAATS_LABEL = { jij: "Naar mij", team: "Naar je team", wacht: "Laten wachten", afgerond: "Afgerond" };

/* Wat er verandert als je een actie naar een baan verplaatst. `c` zoals bij
 * AFHANDEL: {ik, schema, nu, specialist, datum}. null = kan zo niet. */
function verplaatsPatch(rij, van, naar, c) {
  if (naar === "afgerond") return AFHANDEL.klaar(rij, c);
  if (naar === "team") return c.specialist ? AFHANDEL.geefAan(rij, c) : null;
  if (naar === "jij") {
    if (!c.ik) return null;
    if (van === "afgerond") return AFHANDEL.heropen(rij, c);
    const patch = { Eigenaar: c.ik, Status: VJ_OPEN };
    if (getField(rij, "Wachten tot")) patch["Wachten tot"] = null;
    return { patch, melding: "Staat nu bij jou." };
  }
  if (naar === "wacht") {
    return { patch: { Status: VJ_WACHT, "Wachten tot": c.datum || null },
      melding: c.datum ? `Wacht tot ${vjDatumKort(c.datum)}. Daarna komt het vanzelf terug.` : "Wacht, zonder datum." };
  }
  return null;
}

/* De vervolgvraag, onder de rij. Zonder `naar`: eerst kiezen waarheen. */
function verplaatsPaneelHtml(ctx, rij, van, naar) {
  const annuleer = `<button type="button" class="knop-mini" data-verplaats-annuleer>Annuleren</button>`;
  if (!naar) {
    return `<div class="verplaats-paneel" role="group" aria-label="Verplaats naar"><p class="footnote">Verplaats naar:</p>
      <div class="verplaats-keuzes">${VERPLAATS_BANEN.filter(b => b !== van).map(b =>
        `<button type="button" class="knop-mini bedien-knop" data-verplaats-naar="${b}">${esc(VERPLAATS_LABEL[b])}</button>`).join("")}${annuleer}</div></div>`;
  }
  if (naar === "team") {
    const sp = typeof beschikbareSpecialisten === "function" ? beschikbareSpecialisten(ctx) : [];
    // De drie die het vaakst werken als knop, de rest in een lijst: een smalle baan is geen menu.
    const rest = sp.slice(3);
    return `<div class="verplaats-paneel" role="group" aria-label="Aan wie?"><p class="footnote">Naar je team: aan wie?</p>
      <div class="verplaats-keuzes">${sp.slice(0, 3).map(s => `<button type="button" class="knop-mini bedien-knop" data-verplaats-specialist="${esc(s.naam)}">${esc(s.naam)}</button>`).join("")}
      ${rest.length ? `<select data-verplaats-ander aria-label="Iemand anders"><option value="">Iemand anders…</option>${rest.map(s => `<option value="${esc(s.naam)}">${esc(s.naam)}</option>`).join("")}</select>` : ""}${annuleer}</div></div>`;
  }
  if (naar === "wacht") {
    return `<div class="verplaats-paneel" role="group" aria-label="Tot wanneer?"><p class="footnote">Laten wachten: tot wanneer? Daarna komt het vanzelf terug.</p>
      <div class="verplaats-keuzes">${datumKeuzes(ctx.today || new Date()).map(d => `<button type="button" class="knop-mini bedien-knop" data-verplaats-datum="${d.datum}">${esc(d.label)}</button>`).join("")}
      <button type="button" class="knop-mini bedien-knop" data-verplaats-datum="">Zonder datum</button>${annuleer}</div></div>`;
  }
  return "";
}

function actiesTabBeschikbaar(ctx) {
  return !!(ctx && ctx.bundle && rows(ctx.bundle, "acties"));
}

function actieZoekTekst(rij) {
  return ["Actie", "Toelichting", "Eigenaar", "Agent", "Aangemaakt door", "Correctie"]
    .map(v => dataCelTekst(getField(rij, v))).join(" ").toLowerCase();
}

function actiesFilter(ctx) {
  const q = actiesZoek.trim().toLowerCase();
  return (rij) => {
    if (actiesArchief && !agentWeergaveNaam(ctx.schema, getField(rij, "Aangemaakt door"))) return false;
    return !q || actieZoekTekst(rij).includes(q);
  };
}

function baanRijHtml(ctx, rij, nr, baan) {
  const nu = ctx.today || new Date();
  const namen = agentNamen(ctx.schema);
  const soort = soortVan(rij, namen, nu);
  const titel = detailTitel(ctx.schema.datadomeinen.acties, rij);
  const eigenaar = dataCelTekst(getField(rij, "Eigenaar"));
  const meta = [];
  meta.push(`<span class="soort-pil">${esc(SOORT_LABEL[soort] || "")}</span>`);
  if (isTeLaat(rij, namen, nu)) meta.push(`<span class="pil-laat">te laat</span>`);
  if (soort === "wacht" || (getField(rij, "Wachten tot") && wachtInToekomst(rij, nu))) {
    meta.push(`<span>tot ${esc(vjDatumKort(getField(rij, "Wachten tot")))}</span>`);
  } else if (soort === "klaar") {
    const op = getField(rij, "Afgerond op");
    if (op) meta.push(`<span>${esc(vjDatumKort(op))}</span>`);
    if (isNietDoen(rij)) meta.push(`<span>niet gedaan</span>`);
  } else if (getField(rij, "Deadline")) {
    meta.push(`<span>deadline ${esc(vjDatumKort(getField(rij, "Deadline")))}</span>`);
  }
  if (eigenaar) meta.push(`<span class="baan-wie">${esc(eigenaar)}</span>`);
  const kan = baan && rij.__entryId && magDomeinBewerken(ctx, "acties").ok;
  return `<li class="baan-rij${soort === "team" ? " baan-rij-team" : ""}"${kan ? ` draggable="true" data-sleep-actie="${esc(rij.__entryId)}" data-van-baan="${baan}"` : ""}>
    ${nr ? `<span class="vj-nr" aria-hidden="true">${nr}</span>` : ""}
    <div class="baan-rij-inhoud"><a class="baan-titel" href="#/acties/${encodeURIComponent(rij.__entryId)}">${nr ? `<span class="visueel-verborgen">Nummer ${nr}: </span>` : ""}${esc(titel)}</a>
    <p class="baan-meta">${meta.join("")}${kan ? `<button type="button" class="knop-mini verplaats-knop" data-verplaats="${esc(rij.__entryId)}" aria-label="Verplaats ${esc(titel)}">Verplaats</button>` : ""}</p>
    <div data-verplaats-slot></div></div>
  </li>`;
}

function baanHtml(ctx, sleutel, lijst, extra) {
  const kop = BAAN_KOP[sleutel];
  const nummers = sleutel === "jij" && typeof vjGenummerd === "function";
  const volgorde = nummers ? vjGenummerd(ctx.bundle, lijst) : lijst;
  const tonen = sleutel === "afgerond" && !extra.alles ? volgorde.slice(0, AFGEROND_TONEN) : volgorde;
  const nr = (r) => (nummers && typeof vjNummering !== "undefined" ? vjNummering.map.get(r.__entryId) : null);
  return `<section class="baan baan-${sleutel}" data-baan="${sleutel}" aria-labelledby="baan-kop-${sleutel}">
    <h3 id="baan-kop-${sleutel}"><span aria-hidden="true">${kop.teken}</span> ${kop.titel} <span class="baan-telling">${lijst.length}</span></h3>
    ${tonen.length ? `<ol class="baan-lijst">${tonen.map(r => baanRijHtml(ctx, r, nr(r), sleutel)).join("")}</ol>` : `<p class="footnote">${kop.leeg}</p>`}
    ${sleutel === "afgerond" && volgorde.length > tonen.length ? `<button type="button" class="knop-mini bedien-knop" data-afgerond-alles>Toon alle ${volgorde.length}</button>` : ""}
    ${extra.onder || ""}
  </section>`;
}

function vakHtml(ctx, titel, lijst, uitleg, metKnop) {
  if (!lijst.length) return "";
  const rijen = lijst.map(r => {
    const rij = baanRijHtml(ctx, r, null);
    return metKnop ? rij.replace("</li>", `<button type="button" class="knop-mini bedien-knop" data-zet-bij-mij="${esc(r.__entryId)}">Zet bij mij</button></li>`) : rij;
  }).join("");
  return `<details class="blad-uitklap acties-vak"><summary>${esc(titel)} (${lijst.length})</summary>
    <p class="footnote">${esc(uitleg)}</p><ol class="baan-lijst">${rijen}</ol></details>`;
}

function actiesBanenHtml(ctx, opties) {
  const banen = banenVan(ctx.bundle, ctx.schema, { ik: vjIk(ctx), nu: ctx.today || new Date() });
  if (!banen) return `<p class="footnote">Je acties zijn hier niet te tonen: de agentlijst ontbreekt in deze versie.</p>`;
  const f = actiesFilter(ctx);
  const b = {};
  for (const k of BANEN) b[k] = banen[k].filter(f);
  const later = b["jij-later"].length
    ? `<details class="blad-uitklap baan-later"><summary>Later op je lijst (${b["jij-later"].length})</summary>
        <ol class="baan-lijst">${b["jij-later"].map(r => baanRijHtml(ctx, r, null, "jij")).join("")}</ol></details>` : "";
  const afgerondDezeWeek = (() => {
    const nu = ctx.today || new Date();
    const maandag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() - ((nu.getDay() + 6) % 7));
    return b.afgerond.filter(r => { const d = parseDateField(getField(r, "Afgerond op")); return d && d >= maandag; }).length;
  })();
  const keuze = ["jij", "team", "wacht", "afgerond"].map(k =>
    `<button type="button" role="tab" aria-selected="${actiesBaan === k}" data-baan-kies="${k}">${BAAN_KOP[k].titel} <span class="baan-telling">${b[k].length}</span></button>`).join("");
  return `
    <div class="baan-keuze" role="tablist" aria-label="Kies een baan">${keuze}</div>
    <div class="banen" data-baan-actief="${actiesBaan}">
      ${baanHtml(ctx, "jij", b.jij, { onder: later })}
      ${baanHtml(ctx, "team", b.team, {})}
      ${baanHtml(ctx, "wacht", b.wacht, {})}
      ${baanHtml(ctx, "afgerond", b.afgerond, { alles: opties.alles,
        onder: afgerondDezeWeek ? `<p class="footnote">${afgerondDezeWeek} deze week</p>` : "" })}
    </div>
    <div class="acties-vakken">
      ${vakHtml(ctx, "Bij collega's", b.collega, "Op naam van een collega. Open er een om hem over te nemen of terug te geven.")}
      ${vakHtml(ctx, "Zonder eigenaar", b.zonder, "Van niemand. Geef het aan jezelf, een collega of je team via het blad.")}
      ${vakHtml(ctx, "Klopt niet helemaal", b["klopt-niet"], "Er is niemand echt aan zet, bijvoorbeeld een check op naam van een agent.", magDomeinBewerken(ctx, "acties").ok)}
    </div>`;
}

function renderActiesTab(el, ctx) {
  if (!actiesTabBeschikbaar(ctx)) {
    el.innerHTML = `<p>Je acties wonen niet in je werkruimte, of er zijn er nog geen.</p>
      <a class="detail-link" href="#/data">Naar je gegevens →</a>`;
    return;
  }
  let alles = false;
  el.innerHTML = `<div class="acties-kop">
      <input type="search" data-acties-zoek placeholder="Zoek, ook in wat je team schreef" aria-label="Zoek in je acties" value="${esc(actiesZoek)}">
      <button type="button" class="status-chip van-team${actiesArchief ? " actief" : ""}" data-acties-archief aria-pressed="${actiesArchief}">🤝 Klaargezet door je team</button>
      ${typeof opdrachtKnopHtml === "function" ? opdrachtKnopHtml(ctx, { tekst: "Opdracht geven" }) : ""}
      <a class="detail-link" href="#/data/acties">Tabel en bord →</a>
      ${typeof hoeWerktDitHtml === "function" ? hoeWerktDitHtml("wie-aan-zet", "Wie is aan zet?") : ""}
    </div>
    ${typeof vjNaamRegelHtml === "function" ? vjNaamRegelHtml(ctx) : ""}
    <div data-acties-banen>${actiesBanenHtml(ctx, { alles })}</div>`;
  if (typeof wireVjNaam === "function") wireVjNaam(el, ctx);
  const banenEl = el.querySelector("[data-acties-banen]");
  const herteken = () => { banenEl.innerHTML = actiesBanenHtml(ctx, { alles }); };

  el.querySelector("[data-acties-zoek]").addEventListener("input", (e) => { actiesZoek = e.target.value; herteken(); });

  // ── Verplaatsen: slepen, of de knop op de rij ──
  let verplaatsen = null; // { id, van, naar, li }
  const rijMet = (id) => (dataRijenVan(ctx, "acties") || []).find(r => r.__entryId === id) || null;
  const toonPaneel = (li, id, van, naar) => {
    for (const s of el.querySelectorAll("[data-verplaats-slot]")) s.innerHTML = "";
    const rij = rijMet(id);
    if (!rij) return;
    verplaatsen = { id, van, naar, li };
    const slot = li.querySelector("[data-verplaats-slot]");
    slot.innerHTML = verplaatsPaneelHtml(ctx, rij, van, naar);
    const eerste = slot.querySelector("button");
    if (eerste) eerste.focus();
    if (slot.scrollIntoView) slot.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  const voerUit = async (keuze) => {
    const v = verplaatsen;
    const rij = v && rijMet(v.id);
    if (!rij) return;
    const slot = v.li.querySelector("[data-verplaats-slot]");
    const ik = v.naar === "jij" ? await naamVoorSchrijfactieIn(slot, ctx.bron, {}) : (mijnNaam(ctx.bron) || null);
    const plan = verplaatsPatch(rij, v.van, v.naar, { ik, schema: ctx.schema, nu: ctx.today || new Date(), specialist: keuze.specialist, datum: keuze.datum });
    if (!plan) { slot.innerHTML = ""; return; }
    v.li.setAttribute("aria-busy", "true");
    try {
      const vorige = vorigeWaarden(rij, plan.patch);
      const antwoord = await snelWijzig(ctx, "acties", rij.__entryId, plan.patch);
      verplaatsen = null;
      await verwerkAntwoord(ctx, "acties", antwoord, { focus: "[data-acties-zoek]" });
      meld(plan.melding, { actie: ongedaanPatch(ctx, "acties", rij.__entryId, vorige) });
    } catch (fout) {
      v.li.removeAttribute("aria-busy");
      meld("Niet gelukt: " + ((fout && fout.message) || "probeer het opnieuw."), { fout: true });
    }
  };
  const naarBaan = (li, id, van, naar) => {
    if (!naar || naar === van) return;
    if (naar === "team" || naar === "wacht") { toonPaneel(li, id, van, naar); return; }
    verplaatsen = { id, van, naar, li };
    voerUit({});
  };
  function verplaatsKlik(e) {
    const t = e.target;
    const knop = t.closest("[data-verplaats]");
    if (knop) { const li = knop.closest("li"); toonPaneel(li, knop.getAttribute("data-verplaats"), li.getAttribute("data-van-baan"), null); return true; }

      if (terug) terug.focus();

    const naar = t.closest("[data-verplaats-naar]");
    if (naar && verplaatsen) { naarBaan(verplaatsen.li, verplaatsen.id, verplaatsen.van, naar.getAttribute("data-verplaats-naar")); return true; }
    const sp = t.closest("[data-verplaats-specialist]");
    if (sp && verplaatsen) { voerUit({ specialist: sp.getAttribute("data-verplaats-specialist") }); return true; }
    const dat = t.closest("[data-verplaats-datum]");
    if (dat && verplaatsen) { voerUit({ datum: dat.getAttribute("data-verplaats-datum") || null }); return true; }
    return false;
  }
  let sleepLi = null;
  el.addEventListener("change", (e) => {
    const ander = e.target.closest && e.target.closest("[data-verplaats-ander]");
    if (ander && ander.value && verplaatsen) voerUit({ specialist: ander.value });
  });
  el.addEventListener("dragstart", (e) => {
    const li = e.target.closest && e.target.closest("[data-sleep-actie]");
    if (!li) return;
    sleepLi = li;
    li.classList.add("sleept");
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", li.getAttribute("data-sleep-actie")); }

  el.addEventListener("dragend", () => {
    if (sleepLi) sleepLi.classList.remove("sleept");

  });
  el.addEventListener("dragover", (e) => {
    const baan = e.target.closest && e.target.closest("section[data-baan]");
    if (!baan || !sleepLi || baan.getAttribute("data-baan") === sleepLi.getAttribute("data-van-baan")) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    baan.classList.add("sleep-over");
  });
  el.addEventListener("dragleave", (e) => {
    const baan = e.target.closest && e.target.closest("section[data-baan]");
    if (baan && !baan.contains(e.relatedTarget)) baan.classList.remove("sleep-over");
  });
  el.addEventListener("drop", (e) => {
    const baan = e.target.closest && e.target.closest("section[data-baan]");
    if (!baan || !sleepLi) return;

    baan.classList.remove("sleep-over");

    li.classList.remove("sleept");

  el.addEventListener("click", (e) => {

    if (verplaatsKlik(e)) return;

/* f51 — vaste taken in Team: aan/uit, ritme, weekoverzicht.
 *
 * Een ritmetaak heet naar de klant een "vaste taak": werk dat je team steeds
 * opnieuw voor je doet, zonder dat je het hoeft te vragen. Barts klacht was
 * dat ze niet aanstonden en dat alles om 07:00 leek te gebeuren; de
 * teammeeting van 29-09 vroeg om een aantal per dag en per maand. Hier zie je
 * ze, zet je ze aan of uit en kies je het ritme — met een PATCH op de rij,
 * zonder reconnect, met ongedaan maken.
 *
 * Wat het werkmoment met die rijen doet, staat in core/served/werkronde.md en
 * is hier nagebouwd, niet verzonnen:
 * - een taak is aan de beurt volgens zijn Ritme en Laatst gedraaid;
 * - per werkmoment pakt het team er hooguit één, de laagste Volgorde eerst.
 * Hoe vaak het werkmoment draait, kan het dashboard niet zien. Het oordeelt
 * daarom alleen "kwam N werkdagen niet aan de beurt" — te laat volgens de
 * eigen regel van de taak — en gokt nooit een frequentie.
 *
 * Volgorde en Instructie blijven buiten bereik: Volgorde slepen breekt de
 * elk-uur-regel en maakt uithongering erger, en de Instructie hoort bij de
 * hersync van de template. */

/* i85: het klantlabel van een ritme komt uit de registry
 * (ritmetaken.Ritme.opties_meta[optie].klantlabel, vanaf registry 1.92.0);
 * tot de sync deze tabel. */
function ritmeLabel(ritme, schema) {
  const s = schema || (typeof AGENTIC_TEAM_SCHEMA !== "undefined" ? AGENTIC_TEAM_SCHEMA : null);
  const dom = s && s.datadomeinen && s.datadomeinen.ritmetaken;
  const veld = dom && Array.isArray(dom.velden) ? dom.velden.find(v => v.naam === "Ritme") : null;
  const meta = veld && veld.opties_meta && veld.opties_meta[ritme];
  return (meta && meta.klantlabel) || RITME_KLANTTAAL[ritme] || ritme || "";
}

const RITME_KLANTTAAL = {
  "elk-uur": "Elk uur",
  "elke-2-uur": "Om de 2 uur",
  "elke-4-uur": "Om de 4 uur",
  "dagelijks": "Elke dag",
  "wekelijks-ma": "Elke maandag",
  "wekelijks-di": "Elke dinsdag",
  "wekelijks-wo": "Elke woensdag",
  "wekelijks-do": "Elke donderdag",
  "wekelijks-vr": "Elke vrijdag",
  "maandelijks": "Elke 1e van de maand",
};
const WEEKDAGEN = [["ma", 1, "maandag"], ["di", 2, "dinsdag"], ["wo", 3, "woensdag"], ["do", 4, "donderdag"], ["vr", 5, "vrijdag"]];
const VAAK = ["elk-uur", "elke-2-uur", "elke-4-uur"];

function vtTekst(rij, veld) {
  const v = getField(rij, veld);
  return v === undefined || v === null ? "" : String(v).trim();
}
function vtActief(rij) { const v = getField(rij, "Actief"); return v === true || v === "true" || v === "__YES__"; }
function vtLaatst(rij) { return parseDateField(getField(rij, "Laatst gedraaid")); }

/* De ritmes die de registry kent, in klanttaal. Kent de registry een ritme
 * niet (vandaag: geen donderdag), dan staat hij uitgegrijsd in de lijst met
 * "kan nog niet" — zo zie je dat het een beperking is, geen vergeten optie. */
function ritmeKeuzes(schema) {
  const dom = schema && schema.datadomeinen && schema.datadomeinen.ritmetaken;
  const veld = dom && (dom.velden || []).find(v => v.naam === "Ritme");
  const kent = (veld && veld.opties) || Object.keys(RITME_KLANTTAAL);
  return Object.keys(RITME_KLANTTAAL).map(r => ({ waarde: r, label: ritmeLabel(r, schema), kan: kent.indexOf(r) !== -1 }))
    .concat(kent.filter(r => !RITME_KLANTTAAL[r]).map(r => ({ waarde: r, label: ritmeLabel(r, schema), kan: true })));
}

/* Werkdagen (ma–vr) ná `van`, tot en met `tot`. */
function werkdagenNa(van, tot) {
  if (!van || !tot) return 0;
  let n = 0;
  const d = new Date(van.getFullYear(), van.getMonth(), van.getDate() + 1);
  const eind = new Date(tot.getFullYear(), tot.getMonth(), tot.getDate());
  while (d <= eind) { const w = d.getDay(); if (w >= 1 && w <= 5) n++; d.setDate(d.getDate() + 1); }
  return n;
}

function vtWanneer(d, nu) {
  if (!d) return "";
  const dag = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const vandaag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
  const verschil = Math.round((vandaag - dag) / 86400000);
  const uur = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (verschil === 0) return d.getHours() < 6 ? `vannacht ${uur}` : `vandaag ${uur}`;
  if (verschil === 1) return `gisteren ${uur}`;
  return vjDatumKort(d);
}

/* Hoe staat deze taak ervoor, volgens zijn eigen ritme? */
function taakStatus(rij, nu) {
  if (!vtActief(rij)) return { k: "uit", tekst: "staat uit" };
  const l = vtLaatst(rij);
  if (!l) return { k: "onbekend", tekst: "nog niet gedraaid" };
  const ritme = vtTekst(rij, "Ritme");
  if (ritme === "dagelijks" || VAAK.indexOf(ritme) !== -1) {
    const n = werkdagenNa(l, nu);
    return n >= 2
      ? { k: "achter", n, tekst: `kwam ${n} werkdagen niet aan de beurt` }
      : { k: "ok", tekst: `laatst ${vtWanneer(l, nu)}` };
  }
  const week = WEEKDAGEN.find(([kort]) => ritme === "wekelijks-" + kort);
  if (week) {
    // De laatste keer dat die dag was (vandaag telt mee).
    const dag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
    while (dag.getDay() !== week[1]) dag.setDate(dag.getDate() - 1);
    // Aan de beurt vanaf 21:00 de avond ervoor (werkronde.md).
    const vanaf = new Date(dag.getTime() - 3 * 3600000);
    if (l >= vanaf) return { k: "ok", tekst: `laatst ${vtWanneer(l, nu)}` };
    const n = werkdagenNa(dag, nu);
    return n >= 1
      ? { k: "achter", n, tekst: `kwam ${n === 1 ? "1 werkdag" : n + " werkdagen"} niet aan de beurt` }
      : { k: "wacht", tekst: `vandaag nog niet · laatst ${vjDatumKort(l)}` };
  }
  if (ritme === "maandelijks") {
    const eerste = new Date(nu.getFullYear(), nu.getMonth(), 1);
    if (l >= new Date(eerste.getTime() - 3 * 3600000)) return { k: "ok", tekst: `laatst ${vjDatumKort(l)}` };
    const n = werkdagenNa(eerste, nu);
    return n >= 2 ? { k: "achter", n, tekst: "kwam deze maand nog niet aan de beurt" } : { k: "wacht", tekst: "deze maand nog niet" };
  }
  return { k: "onbekend", tekst: `laatst ${vjDatumKort(l)}` };
}

/* Hoeveel vaste taken staan er per werkdag, en hoeveel per maand? */
function weekTelling(rijen, nu) {
  const dagen = WEEKDAGEN.map(([kort, nr, lang]) => ({ kort, nr, lang, taken: [] }));
  const vaak = [], maand = [];
  for (const r of rijen.filter(vtActief)) {
    const ritme = vtTekst(r, "Ritme");
    if (ritme === "dagelijks") dagen.forEach(d => d.taken.push(r));
    else if (ritme.indexOf("wekelijks-") === 0) { const d = dagen.find(x => "wekelijks-" + x.kort === ritme); if (d) d.taken.push(r); }
    else if (ritme === "maandelijks") maand.push(r);
    else if (VAAK.indexOf(ritme) !== -1) vaak.push(r);
  }
  let perMaand = maand.length, werkdagen = 0;
  const d = new Date(nu.getFullYear(), nu.getMonth(), 1);
  while (d.getMonth() === nu.getMonth()) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) { werkdagen++; perMaand += dagen[w - 1].taken.length; }
    d.setDate(d.getDate() + 1);
  }
  const max = Math.max(0, ...dagen.map(x => x.taken.length));
  const drukste = max >= 2 ? dagen.filter(x => x.taken.length === max) : [];
  return { dagen, vaak, maand, perMaand, werkdagen, max, drukste };
}

function vtLijstZin(woorden) {
  return woorden.length < 2 ? woorden.join("") : woorden.slice(0, -1).join(", ") + " en " + woorden[woorden.length - 1];
}

function vtAgent(ctx, rij) {

function weekHtml(ctx, w) {
  const donderdagKan = ritmeKeuzes(ctx.schema).some(k => k.waarde === "wekelijks-do" && k.kan);
  const dagen = w.dagen.map(d => `<div class="vt-dag${w.drukste.indexOf(d) !== -1 ? " vt-druk" : ""}">

      Met één werkmoment per nacht doet je team er hooguit ${w.werkdagen} per maand.${donderdagKan ? "" : " Een wekelijkse taak kan nog niet op donderdag."}</p>
    ${w.drukste.length ? `<div class="vt-drukte"><strong>Op ${vtLijstZin(w.drukste.map(d => d.lang))} staan ${n} vaste taken.</strong>
      Je team doet er één per werkmoment. Werkt je team één keer per nacht, dan schuiven er ${n - 1} door.

function vasteTakenHtml(ctx) {
  const bron = bronVan(ctx, "ritmetaken");

  if (bron.toestand === "elders" || (!rijen && ctx.bundle && ctx.bundle.kind === "metrics")) {

    // f54: levert je dagstart de vaste taken mee, dan zie je ze hier — alleen lezen.

function vtMelding(titel, patch) {
  if ("Actief" in patch) {
    return patch.Actief ? `‘${titel}’ staat aan.` : `‘${titel}’ staat uit. Je team slaat hem over tot je hem weer aanzet.`;
  }
  return `‘${titel}’: ${(ritmeLabel(patch.Ritme) || "").toLowerCase()}.`;
}

function renderVasteTaken(el, ctx) {
  el.innerHTML = vasteTakenHtml(ctx);
  // f55: wat er nog meer bij je modules hoort, met "Zet aan" — alleen als de
  // vaste taken in je werkruimte wonen.
  const inWerkruimte = bronVan(ctx, "ritmetaken").toestand !== "elders"
    && !(ctx.bundle && ctx.bundle.kind === "metrics" && !dataRijenVan(ctx, "ritmetaken"));
  if (typeof wireCatalogus === "function" && inWerkruimte) {
    const slot = document.createElement("div");
    slot.setAttribute("data-vt-catalogus", "");
    el.appendChild(slot);
    wireCatalogus(slot, ctx);
  }
  const wijzig = (li, patch, bediening) => {
    const id = li.getAttribute("data-vt-id");
    const rij = (dataRijenVan(ctx, "ritmetaken") || []).find(r => r.__entryId === id);
    if (!rij) return;
    const vorige = vorigeWaarden(rij, patch);
    bediening.disabled = true;
    li.setAttribute("aria-busy", "true");
    snelWijzig(ctx, "ritmetaken", id, patch)
      .then((antwoord) => verwerkAntwoord(ctx, "ritmetaken", antwoord, {
        focus: `[data-vt-id="${cssWaarde(id)}"] ${bediening.hasAttribute("data-vt-actief") ? "[data-vt-actief]" : "[data-vt-ritme]"}`,
      }))
      .then(() => meld(vtMelding(vtTekst(rij, "Taak"), patch), { actie: ongedaanPatch(ctx, "ritmetaken", id, vorige) }))
      .catch((f) => {
        bediening.disabled = false;
        li.removeAttribute("aria-busy");
        renderVasteTaken(el, ctx); // terug naar wat er echt staat
        meld("Niet gelukt: " + ((f && f.message) || "probeer het opnieuw."), { fout: true });
      });
  };
  el.onchange = (e) => {
    const li = e.target.closest && e.target.closest("[data-vt-id]");
    if (!li) return;
    if (e.target.matches("[data-vt-actief]")) wijzig(li, { Actief: e.target.checked }, e.target);
    else if (e.target.matches("[data-vt-ritme]")) wijzig(li, { Ritme: e.target.value }, e.target);
  };
  el.onclick = async (e) => {
    const k = e.target.closest && e.target.closest("[data-vt-kopieer]");
    if (!k) return;
    const gelukt = await kopieerTekst(k.getAttribute("data-vt-kopieer"));
    meld(gelukt ? "Gekopieerd. Plak het in Claude." : "Kopiëren lukte niet. Selecteer de tekst en kopieer hem zelf.");
  };
}

/* ── f52: "Is je team klaar?" ─────────────────────────────────────────
 *
 * Zes regels uit echte gegevens. De belangrijkste is "Je team werkt vanzelf":
 * een register zonder geplande taak doet niets, en dat is precies de fout die
 * niemand opmerkt omdat er geen melding bij hoort (orchestrator-prompt, stap 4).
 * Het dashboard ziet de geplande taak zelf niet. Het ziet alleen de sporen die
 * een werkmoment achterlaat: Laatst gedraaid op een vaste taak, een actie die
 * een agent zelf afrondde, een actie die een agent 's nachts klaarzette. Wat
 * overdag op verzoek ontstond, telt niet — dat bewijst niets over vanzelf.
 *
 * Een werkmoment zonder werk laat geen spoor na (werkronde.md: "rond de sessie
 * direct af", en de feed zwijgt). Rood is dus alleen terecht als er werk aan
 * de beurt wás: een taak die achterloopt op zijn eigen ritme, of een die nog
 * nooit draaide. Na het aanzetten staat hij 36 uur op "nog even wachten": de
 * eerste nacht moet nog komen. Hoe vaak het werkmoment draait, raadt hij niet.
 * Notion-klanten: daar zien we alleen de teamfeed, en die zwijgt ook bij een
 * lege ronde — dus hooguit "let op", nooit rood. */
const WERKMOMENT_OPDRACHT = "Haal via de Agentic Team-connector met get_werkronde het actuele werkronde-playbook op en voer het exact uit.";
const WACHT_NA_AANZETTEN_MS = 36 * 3600000;
const DAGNAMEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];

/* "sinds maandag" binnen een week, daarna de datum: "sinds maandag" van drie weken terug leest als eergisteren. */
function kcSinds(d, nu) { return nu - d < 6 * 86400000 ? DAGNAMEN[d.getDay()] : vjDatumKort(d); }

function kcStempel(r, k) { return parseDateField(r && r.__stempels && r.__stempels[k]); }

/* De vaste taken: uit de werkruimte, of (f54, Notion-klanten) uit het
 * metricsbestand van de dagstart. */
function vtTaakRijen(ctx) {
  return dataRijenVan(ctx, "ritmetaken") || (typeof metricsRitmeRijen === "function" ? metricsRitmeRijen(ctx) : null);
}

function werkmomentSporen(ctx) {
  const namen = agentNamen(ctx.schema);
  const sporen = [];
  for (const t of (vtTaakRijen(ctx) || []).filter(vtActief)) { const l = vtLaatst(t); if (l) sporen.push(l); }
  for (const a of rows(ctx.bundle, "acties") || []) {
    if (namen && isAgentNaam(getField(a, "Afgerond door"), namen)) { const d = parseDateField(getField(a, "Afgerond op")); if (d) sporen.push(d); }
    if (namen && isAgentNaam(getField(a, "Aangemaakt door"), namen)) { const d = kcStempel(a, "aangemaakt"); if (d && d.getHours() < 6) sporen.push(d); }
  }
  return sporen.concat(feedSporen(ctx) || []);
}

/* Uit de teamfeed telt alleen wat een werkronde post: de start en het slot
 * (op elk uur, want een werkmoment kan ook overdag lopen), en alles wat
 * 's nachts verscheen. Een voorstel van 14:00 kwam uit een gesprek. */
function feedSporen(ctx) {
  const feed = ctx.bundle && ctx.bundle.teamfeed;
  if (!feed || !Array.isArray(feed.entries)) return null;
  const sporen = [];
  for (const e of feed.entries) {
    const d = e && parseDateField(e.aangemaakt || e.bijgewerkt);
    if (!d) continue;
    const soort = String(getField(e.data || {}, "Soort") || "").toLowerCase();
    if (soort === "rondestart" || soort === "afgerond" || d.getHours() < 6) sporen.push(d);
  }
  return sporen;
}

function kcActivatiesDezeWeek(ctx) {
  const a = ctx.bundle && ctx.bundle.activaties;
  if (!a || !Array.isArray(a.weken) || !a.weken.length) return null;
  const nu = ctx.today || new Date();
  const ma = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() - ((nu.getDay() + 6) % 7));
  const sleutel = vjIsoDag(ma);
  const week = a.weken.find(w => w.week_start === sleutel);
  return week ? Object.values(week.per_agent || {}).reduce((s, n) => s + n, 0) : 0;
}

function kcNotion(ctx) {
  if (bronVan(ctx, "ritmetaken").toestand === "elders" || bronVan(ctx, "acties").toestand === "elders") return true;
  return !!(ctx.bundle && ctx.bundle.kind === "metrics" && !rows(ctx.bundle, "acties"));
}

function klaarCheck(ctx) {
  const nu = ctx.today || new Date();
  const r = [];
  const notion = kcNotion(ctx);
  const act = kcActivatiesDezeWeek(ctx);
  r.push(act === null
    ? { id: "verbonden", k: "onbekend", titel: "Verbonden met Claude", tekst: "Hoe vaak je je team iets vroeg, telt je werkruimte nog niet." }
    : { id: "verbonden", k: act > 0 ? "ok" : "let", titel: "Verbonden met Claude",
      tekst: act > 0 ? `Je vroeg je team deze week ${act} keer iets.` : "Je vroeg je team deze week nog niets." });

  // f54: levert de dagstart de vaste taken mee, dan oordelen we er gewoon over.
  const metricsTaken = notion && typeof metricsRitmeRijen === "function" ? metricsRitmeRijen(ctx) : null;
  if (notion && !metricsTaken) {
    const fs = feedSporen(ctx);
    const lp = fs && fs.length ? new Date(Math.max(...fs)) : null;
    const nf = lp ? werkdagenNa(lp, nu) : 99;
    r.push({ id: "aan", k: "onbekend", titel: "Vaste taken staan aan", tekst: "Je vaste taken staan in Notion; dat kunnen we hier niet controleren." });
    r.push(!fs ? { id: "werkt", k: "onbekend", titel: "Je team werkt vanzelf", tekst: "Dat zien we aan je teamfeed, en die kent je werkruimte nog niet." }
      : nf <= 1 ? { id: "werkt", k: "ok", titel: "Je team werkt vanzelf", tekst: `Laatst in je teamfeed: ${vtWanneer(lp, nu)}.` }
        : nf < 5 ? { id: "werkt", k: "onbekend", titel: "Je team werkt vanzelf", tekst: `Laatst in je teamfeed: ${vtWanneer(lp, nu)}. Een werkmoment zonder werk meldt niets, dus dat kan kloppen.` }
          : { id: "werkt", k: "let", titel: "Werkt je team nog vanzelf?", actie: "start",
            tekst: `${lp ? `Je team meldde sinds ${kcSinds(lp, nu)} niets meer in je teamfeed.` : "Je team meldde nog niets in je teamfeed."} Kijk of je werkmoment in Claude nog aanstaat.` });
    r.push({ id: "beurt", k: "onbekend", titel: "Alle vaste taken komen aan de beurt", tekst: "Je vaste taken staan in Notion; dat kunnen we hier niet controleren." });
    r.push({ id: "wacht", k: "onbekend", titel: "Niets ligt te lang op je te wachten", tekst: "Je acties staan in Notion." });
    r.push({ id: "afhandelen", k: "onbekend", telt: false, titel: "Afhandelen doe je in Notion", tekst: "Hier zie je wat je team deed." });
  } else {
    const taken = vtTaakRijen(ctx) || [];
    const actief = taken.filter(vtActief);
    const uit = taken.length - actief.length;
    r.push(actief.length
      ? { id: "aan", k: "ok", titel: "Vaste taken staan aan", tekst: `${actief.length === 1 ? "1 taak" : actief.length + " taken"} aan${uit ? `, ${uit} uit` : ""}.` }
      : { id: "aan", k: "nee", titel: "Vaste taken staan aan", actie: "start",
        tekst: "Er staan nog geen vaste taken aan. Zonder vaste taken doet je team alleen iets als je het vraagt." });
    const sporen = werkmomentSporen(ctx);
    const recent = sporen.length ? new Date(Math.max(...sporen)) : null;
    // Was er werk aan de beurt dat bleef liggen? Alleen dán is stilte een fout.
    const bleefLiggen = actief.some(t => { const k = taakStatus(t, nu).k; return k === "achter" || k === "onbekend"; });
    const aanGezet = actief.map(t => kcStempel(t, "aangemaakt")).filter(Boolean);
    const laatstAan = aanGezet.length ? new Date(Math.max(...aanGezet)) : null;
    let werktNee = false, wachten = false;
    if (!actief.length) {
      werktNee = true;
      r.push({ id: "werkt", k: "nee", titel: "Je team werkt vanzelf", actie: "start", tekst: "We zagen je team nog niet vanzelf werken." });
    } else if ((!recent || (laatstAan && recent < laatstAan)) && laatstAan && nu - laatstAan < WACHT_NA_AANZETTEN_MS) {
      wachten = true;
      r.push({ id: "werkt", k: "onbekend", titel: "Je team werkt vanzelf", tekst: "Nog even wachten: na de eerste nacht weten we of je team vanzelf werkt." });
    } else if (recent && werkdagenNa(recent, nu) <= 1) {
      r.push({ id: "werkt", k: "ok", titel: "Je team werkt vanzelf", tekst: `Laatst: ${vtWanneer(recent, nu)}.` });
    } else if (recent && !bleefLiggen) {
      r.push({ id: "werkt", k: "ok", titel: "Je team werkt vanzelf", tekst: `Laatst: ${vtWanneer(recent, nu)}. Sindsdien kwam er geen vaste taak aan de beurt.` });
    } else {
      werktNee = true;
      r.push({ id: "werkt", k: "nee", titel: "Je team werkt vanzelf", actie: "start",
        tekst: `${recent ? `We zagen je team sinds ${kcSinds(recent, nu)} niet meer vanzelf werken.` : "We zagen je team nog niet vanzelf werken."} Zonder werkmoment doet je team niets vanzelf, en je krijgt daar geen melding van.` });
    }
    const achter = actief.filter(t => taakStatus(t, nu).k === "achter");
    r.push(!actief.length ? { id: "beurt", k: "onbekend", titel: "Alle vaste taken komen aan de beurt", tekst: "Nog geen vaste taken." }
      : werktNee ? { id: "beurt", k: "onbekend", titel: "Alle vaste taken komen aan de beurt", tekst: "Eerst moet je team weer vanzelf werken." }
        : wachten ? { id: "beurt", k: "onbekend", titel: "Alle vaste taken komen aan de beurt", tekst: "Dat zie je na de eerste werkdag." }
        : achter.length ? { id: "beurt", k: "let", titel: "Niet alles komt aan de beurt", actie: "vaker",
          tekst: achter.map(t => `‘${vtTekst(t, "Taak")}’ ${taakStatus(t, nu).tekst}`).join(". ") + ". Je team doet één vaste taak per werkmoment." }
          : { id: "beurt", k: "ok", titel: "Alle vaste taken komen aan de beurt", tekst: "Geen enkele taak loopt achter op zijn eigen ritme." });
    const mv = notion && typeof metricsVoorJou === "function" ? metricsVoorJou(ctx) : null;
    const lijst = mv ? mv.map(x => ({ __sinds: parseDateField(x.sinds) })) : (voorJouLijst(ctx) || []);
    const oudste = lijst.reduce((m, x) => { const s = mv ? x.__sinds : sindsVan(x); return s && (!m || s < m) ? s : m; }, null);
    const wd = oudste ? werkdagenNa(oudste, nu) : 0;
    const kd = oudste ? Math.floor((nu - oudste) / 86400000) : 0;
    r.push(wd < 5
      ? { id: "wacht", k: "ok", titel: "Niets ligt te lang op je te wachten",
        tekst: !oudste ? "Er wacht niets op je." : kd === 0 ? "Er wacht niets langer dan vandaag." : `Het oudste wacht ${kd === 1 ? "1 dag" : kd + " dagen"}.` }
      : { id: "wacht", k: "let", titel: "Er ligt werk te lang op je te wachten", actie: notion ? undefined : "ronde",
        tekst: `Het oudste wacht al ${kd} dagen. ${notion ? "Je vindt het bij Voor jou, met een link naar Notion." : "Het staat bovenaan in Voor jou."}` });
    // Geen oordeel over je team, dus telt niet mee — en alleen in beeld als er iets te doen is.
    if (notion) {
      r.push({ id: "afhandelen", k: "onbekend", telt: false, titel: "Afhandelen doe je in Notion", tekst: "Hier zie je de stand van je dagstart." });
    } else if (!magDomeinBewerken(ctx, "acties").ok) {
      r.push({ id: "afhandelen", k: "let", telt: false, titel: "Je kijkt alleen mee", actie: "login", tekst: "Met je daglink kun je lezen, niet afhandelen." });
    }
  }
  const geteld = r.filter(x => x.telt !== false && x.k !== "onbekend");
  const ok = geteld.filter(x => x.k === "ok").length;
  const stil = r.some(x => (x.id === "aan" || x.id === "werkt") && x.k === "nee");
  return { regels: r, ok, totaal: geteld.length, onbekend: r.filter(x => x.telt !== false && x.k === "onbekend").length, stil, notion,
    wachten: !notion && r.some(x => x.id === "werkt" && x.k === "onbekend") };
}

function klaarSamenvatting(kc) {
  const letop = kc.totaal - kc.ok;
  if (kc.notion && kc.onbekend) return { kop: `Is je team klaar? ${kc.ok} van ${kc.totaal} te controleren`, sub: `${kc.onbekend} ${kc.onbekend === 1 ? "punt staat" : "punten staan"} in Notion en kunnen we hier niet zien.` };
  if (!letop && kc.wachten) return { kop: "Is je team klaar? Bijna — nog even wachten", sub: "Na de eerste nacht weten we of je team vanzelf werkt." };
  if (!letop) return { kop: "Is je team klaar? Ja, alles in orde", sub: "Je team werkt vanzelf." };
  return { kop: `Is je team klaar? ${kc.ok} van ${kc.totaal} · ${letop} ${letop === 1 ? "punt vraagt" : "punten vragen"} aandacht`, sub: "Kijk wat er nodig is." };
}

const KC_VORM = { ok: ["✓", "in orde"], let: ["~", "let op"], nee: ["✗", "niet in orde"], onbekend: ["?", "onbekend"] };
const KC_ACTIE = {
  start: ["Zo regel je het in 2 minuten", "#/klaar"],
  vaker: ["Laat je team vaker werken", "#/klaar"],
  ronde: ["Loop ze één voor één door", "#/ronde"],
};

function klaarRegelsHtml(kc) {
  return `<ul class="kc-regels">${kc.regels.map(r => {
    const [vorm, label] = KC_VORM[r.k];
    const actie = r.actie === "login" ? `<button type="button" class="knop-mini bedien-knop" data-login>Inloggen</button>`
      : KC_ACTIE[r.actie] ? `<a class="kc-actie" href="${KC_ACTIE[r.actie][1]}">${KC_ACTIE[r.actie][0]} →</a>` : "";
    return `<li class="kc-regel kc-${r.k}"><span class="kc-vorm" aria-label="${label}">${vorm}</span>
      <div><strong>${esc(r.titel)}</strong><p>${esc(r.tekst)}</p>${actie}</div></li>`;
  }).join("")}</ul>`;
}

function stappenbladHtml(ctx, vaker, { volledig = false } = {}) {
  const naam = `Werkmoment — ${(ctx.bundle && ctx.bundle.klant) || "je bedrijf"}`;
  if (vaker) {
    return `<section class="vt-vak kc-stappen" id="stappen"><h2>Laat je team vaker werken</h2>
      <p>Je werkmoment bestaat al. Zet het vaker aan, dan komen al je vaste taken aan de beurt.</p>
      <ol class="kc-stappenlijst">
        <li><strong>Open in Claude: Scheduled.</strong> Zoek je werkmoment: de taak met get_werkronde in de opdracht.</li>
        <li><strong>Zet "Wanneer" op elke 4 uur.</strong> Je team doet dan tot zes vaste taken per dag in plaats van één. Een werkmoment zonder werk stopt meteen en kost vrijwel niets.</li>
        <li><strong>Klaar.</strong> Morgen zie je hier dat alle taken aan de beurt kwamen.</li>
      </ol></section>`;
  }
  const velden = `<dl class="kc-velden"><dt>Naam</dt><dd>${vtKopieerHtml(naam)}</dd>
          <dt>Wanneer</dt><dd>elke dag, buiten werktijd (bijvoorbeeld 02:00)</dd>
          <dt>Opdracht</dt><dd>${vtKopieerHtml(WERKMOMENT_OPDRACHT)}</dd></dl>
        <span class="footnote">Zet de Agentic Team-connector aan, en die van je werkdata als die ergens anders staat.</span>`;
  const klaar = `<li><strong>Klaar.</strong> Morgenochtend staat bij Voor jou wat je team deed, en wordt deze check vanzelf groen.</li>`;
  // Staan de vaste taken al aan, dan ontbreekt alleen het werkmoment. "Zet mijn
  // ritmetaken aan" maakt de starter-set opnieuw aan (orchestrator-prompt,
  // Activeren stap 3) — dan heb je elke taak dubbel.
  // De Hulp toont altijd de hele installatie (volledig): daar leest ook wie nog niets heeft.
  if (!volledig && vtTaakRijen(ctx) && vtTaakRijen(ctx).some(vtActief)) {
    return `<section class="vt-vak kc-stappen" id="stappen"><h2>Zet je werkmoment (weer) aan</h2>
      <p>Je vaste taken staan klaar. Wat ontbreekt, is het moment waarop je team ze oppakt.</p>
      <ol class="kc-stappenlijst">

          ${velden}</li>
        ${klaar}
      </ol></section>`;
  }
  return `<section class="vt-vak kc-stappen" id="stappen"><h2>Laat je team vanzelf werken</h2>
    <ol class="kc-stappenlijst">

      <li><strong>Je team stelt een geplande taak voor. Druk op Schedule.</strong>
        <span class="footnote">Zie je die knop niet? Ga in Claude naar Scheduled › New task en vul in:</span>
        ${velden}</li>
      ${klaar}
    </ol></section>`;
}

function renderKlaar(el, ctx) {
  const kc = klaarCheck(ctx);

}

/* De samenvattingsregel bovenaan Vaste taken: één tik naar de hele check. */
function klaarRegelHtml(ctx) {

/* Voor jou: staat je team stil, dan is dat het eerste wat je hoort te zien. */
function stilKaartHtml(ctx) {

if (typeof module !== "undefined") {
