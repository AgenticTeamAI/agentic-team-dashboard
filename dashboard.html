<title>Je team</title>
<style>
/* Dashboard v2 — "Voor jou: je team werkt, jij beslist".
 *
 * De visuele bron is het goedgekeurde klikbare ontwerp (dashboard-v2-prototype,
 * 29-09/30-09). Oranje = jij bent aan zet, teal = je team. Systeemfont, geen
 * externe bronnen. Het thema volgt de systeeminstelling (prefers-color-scheme)
 * en onthoudt niets: een eigen keuze die blijft staan vraagt een nieuwe
 * opslagsleutel (juridisch restpunt i87).
 *
 * Elke kleur loopt via de tokens hieronder; test/css-tokens.test.js bewaakt
 * dat er geen losse kleur bij komt en dat de tekst/vlak-paren in beide thema's
 * AA halen. Kleur is nooit de enige drager: er staat altijd een vorm of woord
 * naast (● jij, ◐ je team, ○ wacht, ✓ afgerond).
 *
 * Telefoon eerst. Vanaf 900px breed is het de desktopindeling: tabs in de kop,
 * twee kolommen op Voor jou, het bord op Acties en bladen als lade. */
:root {
  color-scheme: light;
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --surface-2: #F8F9F6;
  --ink: #16191D;
  --muted: #5B645E;
  --line: #DADDD6;
  --line-2: #C7CCC3;
  --veldrand: #858C84;
  --jij: #D97F12;
  --jij-tekst: #8F5409;
  --jij-zacht: #FBEBD5;
  --jij-mark: #B86A0C;
  --op-jij: #1B1206;
  --team: #2A6863;
  --team-tekst: #24605B;
  --team-zacht: #DCEDEA;
  --op-team: #FFFFFF;
  --rood: #A5421A;
  --rood-zacht: #F7E3DA;
  --klaar: #256B42;
  --klaar-zacht: #DCEFE2;
  --focus: #1F5FBF;
  --scrim: rgba(18, 21, 19, 0.38);
  --schaduw: 0 18px 40px rgba(22, 25, 29, 0.18);
  --schaduw-klein: 0 1px 2px rgba(0, 0, 0, 0.25);
  --toast-bg: #16191D;
  --toast-ink: #F3F4F1;
  --toast-accent: #F0A548;
  /* Alleen voor het vervagen van ingekorte tekst (mask-image): de kleur zelf is onzichtbaar. */
  --masker: #000000;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121513;
    --surface: #1A1E1B;
    --surface-2: #161A17;
    --ink: #ECEEE9;
    --muted: #9AA39C;
    --line: #2D332F;
    --line-2: #3A413C;
    --veldrand: #6A726C;
    --jij: #F0A548;
    --jij-tekst: #F2B461;
    --jij-zacht: #3A2C18;
    --jij-mark: #F0A548;
    --op-jij: #1B1206;
    --team: #62B5AC;
    --team-tekst: #7CC7BE;
    --team-zacht: #18302D;
    --op-team: #0C1917;
    --rood: #F08A62;
    --rood-zacht: #3A2018;
    --klaar: #5BD48A;
    --klaar-zacht: #16301F;
    --focus: #8AB4F8;
    --scrim: rgba(0, 0, 0, 0.55);
    --schaduw: 0 18px 40px rgba(0, 0, 0, 0.5);
    --schaduw-klein: 0 1px 2px rgba(0, 0, 0, 0.5);
    --toast-bg: #ECEEE9;
    --toast-ink: #121513;
    --toast-accent: #8F5409;
    --masker: #000000;
    --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --r-s: 8px;
    --r-m: 12px;
    --r-l: 16px;
  }
}

/* ---------- Basis ---------- */
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
::placeholder{color:var(--muted);opacity:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.klein{width:15px;height:15px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- App en kop ---------- */
.app{min-height:100vh;padding-bottom:96px}
.app.met-fab{padding-bottom:150px}
.akop{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top, 0px))}
.merk{display:flex;flex-direction:column;min-width:0;flex:1}
.merk b{font-size:17px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.merk span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopknoppen{display:flex;align-items:center;gap:4px;flex:none}
.ikknop{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--ink);flex:none}
.ikknop:hover{background:var(--surface);border-color:var(--line)}
.ikknop[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:inline-grid;place-items:center;margin-left:4px}
.inlogknop{border:1px solid var(--jij);background:var(--jij-zacht);color:var(--ink);font-weight:650;border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:36px}
.dtabs{display:none;gap:4px;margin-left:10px}
.dtab{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;min-height:40px;white-space:nowrap}
.dtab[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--jij);color:var(--op-jij);font-size:11.5px;font-weight:800;font-family:var(--mono)}

/* Onderbalk telefoon */
.tabbalk{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom, 0px))}
.ttab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12.5px;font-weight:600;min-height:52px;position:relative}
.ttab .tico{height:22px;display:grid;place-items:center}
.ttab[aria-current="page"]{color:var(--ink)}
.ttab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.ttab .badge{position:absolute;top:2px;left:calc(50% + 6px);height:18px;min-width:18px;font-size:11px}
.fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:6;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:12px 16px;font-weight:700;box-shadow:var(--schaduw);min-height:48px}

/* ---------- Inhoud ---------- */
.inhoud{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.twee{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.kol{display:flex;flex-direction:column;gap:14px;min-width:0}
.vak{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.vakkop{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.vakkop b{color:var(--ink);font-weight:700}
h2.titel{font-size:22px;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2,h3,h4{margin:0}
h3{font-size:16px;line-height:1.3;text-wrap:balance}
p{margin:0}
.stil{color:var(--muted)}
.klein{font-size:13px}
.rijtje{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tussen{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hoe{border:0;background:none;padding:0 2px;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:5px;align-items:center;min-height:40px}
.hoe.wijzig{min-width:40px;justify-content:center}
.hoe.breedhoe{min-width:40px;justify-content:center}
.hoe:hover{color:var(--ink)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:650;display:inline-flex;align-items:center;gap:4px;min-height:40px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;align-self:flex-start}
a.link{min-height:40px}

/* Knoppen */
.knop{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:650;font-size:14.5px;line-height:1.2;text-align:center;text-decoration:none}
.knop:hover{border-color:var(--ink)}
.knop.prim{background:var(--jij);border-color:var(--jij);color:var(--op-jij)}
.knop.prim:hover{filter:brightness(1.05)}
.knop.team{background:var(--surface);border-color:var(--team);color:var(--team-tekst)}
.knop.teamvol{background:var(--team);border-color:var(--team);color:var(--op-team)}
.knop.stil{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
.knop.gevaar{border-color:var(--rood);color:var(--rood)}
.knop.breed{width:100%}
.knop[disabled]{opacity:.5;cursor:not-allowed}
.knop[aria-disabled="true"]{opacity:.7;cursor:progress}
.knop.groot{min-height:52px;font-size:16px;justify-content:flex-start;padding-inline:16px}
.knop .draai{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:draai .7s linear infinite}
.klein-knop{min-height:40px!important;padding:6px 10px!important;font-size:13px!important}
.icoonknop{min-width:40px}
@keyframes draai{to{transform:rotate(360deg)}}

/* Agent-chip en pillen */
.ag{display:inline-flex;align-items:center;gap:6px;background:var(--team-zacht);color:var(--team-tekst);border-radius:999px;padding:2px 9px 2px 3px;font-size:12.5px;font-weight:650;white-space:nowrap;max-width:100%;text-decoration:none}
.ag .em{width:20px;height:20px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;line-height:1}
.ag.bezig{box-shadow:0 0 0 2px var(--team)}
.ag.alleen{padding:2px}
.agknop{border:0;min-height:40px;cursor:pointer}
.mens{display:inline-flex;align-items:center;gap:6px;background:var(--jij-zacht);color:var(--ink);border-radius:999px;padding:2px 9px 2px 3px;font-size:12.5px;font-weight:650;white-space:nowrap}
.mens .em{width:20px;height:20px;border-radius:50%;background:var(--jij);color:var(--op-jij);display:grid;place-items:center;font-size:10px;font-weight:800}
.pil{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:650;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pil.nieuw{background:var(--jij-zacht);border-color:transparent;color:var(--jij-tekst);font-family:var(--mono);letter-spacing:.06em;font-size:11px}
.pil.laat{background:var(--rood-zacht);border-color:transparent;color:var(--rood)}
.pil.jij{background:var(--jij-zacht);border-color:transparent;color:var(--jij-tekst)}
.pil.team{background:var(--team-zacht);border-color:transparent;color:var(--team-tekst)}
.pil.ok{background:var(--klaar-zacht);border-color:transparent;color:var(--klaar)}
.pil.status{font-family:var(--mono);font-size:11px;font-weight:500}
button.knoppil{cursor:pointer;min-height:32px}
.soort{font-size:12.5px;font-weight:700;color:var(--jij-tekst)}
.soort.teamk{color:var(--team-tekst)}
.soort.rood{color:var(--rood)}

/* Balken */
.balk{border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.balk.daglink{background:var(--jij-zacht);border:1px solid var(--jij)}
.balk.notion{background:var(--surface-2);border:1px solid var(--line)}
.balk.geen{background:var(--surface);border:1px solid var(--line)}
.balk.fout{background:var(--rood-zacht);border:1px solid var(--rood)}
.balk b{font-weight:700}

/* Verhaal */
.verhaal{display:flex;flex-direction:column;gap:10px}
.verhaal p.zin{font-size:18px;line-height:1.45;letter-spacing:-.005em;text-wrap:pretty}
.verhaal p.zin b{font-weight:700}
.verhaal p.detail{font-size:15px;line-height:1.5;color:var(--ink)}
.chiprij{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Bovenkaart */
.bovenkaart{border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface)}
.bovenkaart.stil-rood{border-color:var(--rood);background:var(--rood-zacht)}
.bovenkaart.welkom{border-color:var(--team);background:var(--team-zacht)}
.bovenkaart.nieuw{border-color:var(--jij);background:var(--jij-zacht)}
.bovenkaart .tussen h3{font-size:17px}
.drie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drie div{background:var(--surface);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.drie b{font-size:14px}
.drie span{font-size:12.5px;color:var(--muted)}
@media (max-width:380px){.drie{grid-template-columns:1fr}}

/* Werkbak */
.werkbak-kop{display:flex;flex-direction:column;gap:10px}
.stapel{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px;transition:opacity .18s ease,transform .18s ease,max-height .18s ease,padding .18s ease,margin .18s ease;max-height:600px;overflow:hidden}
.item.gekozen{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.item.weg{opacity:0;transform:translateX(18px);max-height:0;padding-block:0;border-width:0;margin-top:-10px}
.nr{width:30px;height:30px;border-radius:50%;background:var(--jij);color:var(--op-jij);font-family:var(--mono);font-weight:800;font-size:14px;display:grid;place-items:center;margin-top:1px}
.nr.team{background:var(--team-zacht);color:var(--team-tekst)}
.item-open{grid-column:2;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;color:inherit;text-decoration:none}
.item-open:hover .ititel{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.ititel{font-size:16px;font-weight:700;line-height:1.3;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.imeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.voorproef{border-left:3px solid var(--team);padding:2px 0 2px 10px;font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.iknoppen{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.iknoppen .knop{min-height:42px;font-size:14px;padding:8px 12px}
.opmregel{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.compact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;text-align:left;width:100%;min-height:52px}
.compact.gekozen{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.compact .nr{width:26px;height:26px;font-size:13px}
.compact .ct{min-width:0;display:flex;flex-direction:column}
.compact .ct b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact .ct span{font-size:12.5px;color:var(--muted)}
.regel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;width:100%;text-align:left;min-height:52px;color:inherit;text-decoration:none}
.regel .rl{display:flex;flex-direction:column;gap:2px;min-width:0}
.regel .rl span{font-size:13px;color:var(--muted)}
.regel.uitgegrijsd{opacity:.62;cursor:default}
.leeg{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:18px 16px;border:1px dashed var(--line-2);border-radius:var(--r-l)}
.leeg h3{font-size:18px}
.afgehandeld{border-top:1px solid var(--line);padding-top:10px}
.afgehandeld summary{cursor:pointer;font-weight:650;display:flex;gap:8px;align-items:center;min-height:40px;list-style:none}
.afgehandeld summary::-webkit-details-marker{display:none}
.afgehandeld ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.afgehandeld li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.privacy{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
details.privacy{display:block;border:0}
details.privacy > summary{justify-content:flex-start;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);min-height:40px;padding-top:8px;flex-wrap:nowrap}
details.privacy > summary .ic{margin-top:2px}
details.privacy .binnen p{font-size:13px;color:var(--muted);max-width:66ch}

/* Item-blad */
.blad{display:flex;flex-direction:column;gap:14px}
.blad-kop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.blad-kop .pos{font-family:var(--mono);font-size:12px;color:var(--muted)}
.beurt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.beurt.jij{background:var(--jij-zacht);color:var(--jij-tekst)}
.beurt.team{background:var(--team-zacht);color:var(--team-tekst)}
.beurt.niemand{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.herkomst{font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.herkomst .ag{flex:none}
.hoortbij{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.relatie{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--ink);min-height:36px;display:inline-flex;align-items:center}
button.relatie{min-height:40px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.papier{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--team);border-radius:4px var(--r-m) var(--r-m) 4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.papier .werk{font-size:15.5px;line-height:1.6;white-space:pre-line;color:var(--ink);max-width:62ch;overflow-wrap:anywhere}
.papier .werk.ingekort{max-height:14.5em;overflow:hidden;-webkit-mask-image:linear-gradient(var(--masker) 70%,transparent);mask-image:linear-gradient(var(--masker) 70%,transparent)}
.werk.kort8{max-height:12em;overflow:hidden;-webkit-mask-image:linear-gradient(var(--masker) 70%,transparent);mask-image:linear-gradient(var(--masker) 70%,transparent)}
.papier .knop.klein-knop{min-height:40px}
.citaat{border:1px solid var(--jij);background:var(--jij-zacht);border-radius:8px;padding:8px 10px;font-size:13.5px}
.uitklap{border-top:1px solid var(--line)}
.uitklap summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;min-height:46px;font-weight:650}
.uitklap summary::-webkit-details-marker{display:none}
.uitklap summary .ic{transition:transform .15s}
.uitklap[open] > summary .ic{transform:rotate(90deg)}
.uitklap .binnen{padding:0 0 12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.uitklap.kaal{border:0}
.uitklap.kaal > summary{min-height:40px;font-weight:500;font-size:13px;color:var(--muted)}
.velden{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:center;font-size:14px;margin:0}
.velden dt,.velden dd{min-height:40px;display:flex;align-items:center}
.velden dt{color:var(--muted)}
.velden dd{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere;min-width:0}
.velden dd.lang{white-space:pre-line;padding:8px 0}
dd.inline-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0}
dd.inline-edit input,dd.inline-edit select,dd.inline-edit textarea{flex:1 1 170px;width:auto;min-height:40px;border:1px solid var(--veldrand);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:15px}
.sheet form select,.sheet form input[type=number],.sheet form input[type=email],.sheet form input[type=url]{width:100%;border:1px solid var(--veldrand);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:15px;min-height:44px}
.contextregel{font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.beslisbalk{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 14px;display:flex;flex-direction:column;gap:8px;margin-top:4px;z-index:2}
.vak .beslisbalk{background:var(--surface);margin-bottom:-14px}
.beslisbalk .knop{min-height:46px}
.knoprij{display:flex;flex-wrap:wrap;gap:8px}
.knoprij .knop{flex:1 1 auto}
.knoprij .knop.stil{flex:0 0 auto}
.balkregel{font-size:12.5px;color:var(--muted);margin:0}
.balkregel .ic{vertical-align:-2px}
.opm{display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line);padding-bottom:8px}
.opm small{color:var(--muted);font-size:12.5px}
.opm p{white-space:pre-line}
.leeglabel{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.fout{color:var(--rood);font-size:13.5px;font-weight:650}

/* Bladen (sheets) en lade */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-height:94%;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:omhoog .2s ease;box-shadow:var(--schaduw);scroll-padding-bottom:170px;overscroll-behavior:contain}
.sheet.vol{height:calc(100% - 18px);max-height:none;padding-bottom:0}
.greep{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;margin-top:-4px;flex:none}
@keyframes omhoog{from{transform:translateY(24px);opacity:.4}}
@keyframes links{from{transform:translateX(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
textarea,input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=search],select.veld{width:100%;border:1px solid var(--veldrand);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:15px;min-height:44px}
textarea{min-height:84px;resize:vertical;line-height:1.45}
label.lb,.lb{font-weight:650;font-size:14.5px;display:block;margin-bottom:6px}
.keuzes{display:flex;flex-wrap:wrap;gap:6px}
.keuze{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;min-height:40px;display:inline-flex;gap:6px;align-items:center}
.keuze[aria-pressed="true"]{border-color:var(--team);background:var(--team-zacht);color:var(--team-tekst);font-weight:700}
.keuze.mensk[aria-pressed="true"]{border-color:var(--jij);background:var(--jij-zacht);color:var(--ink)}
.verwachting{font-size:13.5px;color:var(--team-tekst);background:var(--team-zacht);border-radius:10px;padding:9px 11px}
.verwachting.let{color:var(--ink);background:var(--rood-zacht)}
.verwachting.mens-v{background:var(--jij-zacht);color:var(--ink)}
.twee-velden{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.twee-velden{grid-template-columns:1fr}}

/* Toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:10px 12px 10px 14px;font-size:14px;box-shadow:var(--schaduw);animation:omhoog .18s ease}
.toast.fout{border-left:4px solid var(--rood)}
.toast button,.toast-inline button{border:0;background:transparent;color:var(--toast-accent);font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 6px;white-space:nowrap}
.toast-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:6px 8px 6px 12px;font-size:13.5px;margin-bottom:10px;animation:omhoog .18s ease}

/* Acties */
.werkbalk{display:flex;flex-direction:column;gap:10px}
.zoek{position:relative}
.zoek .ic{position:absolute;left:12px;top:13px;color:var(--muted)}
.zoek input{padding-left:38px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:650;font-size:13.5px;color:var(--muted);min-height:40px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.vol{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.seg.vol button{justify-content:center;padding-inline:4px}
.banen{display:flex;flex-direction:column;gap:14px}
.baan{display:flex;flex-direction:column;gap:8px;min-width:0}
.baan.bordk{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;min-height:220px}
.baan.bordk.over{outline:2px dashed var(--team);outline-offset:-4px}
.baan.uitklap{border-top:0}
.baan.uitklap > summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:0 12px}
.baankop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.baankop h3{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.baankop h3 .vorm{font-size:14px}
.baankop .ach{font-size:12.5px;color:var(--muted)}
.baan.jijb h3{color:var(--jij-tekst)}
.baan.teamb h3{color:var(--team-tekst)}
.rij{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;text-align:left;width:100%;min-height:54px;color:inherit;text-decoration:none}
.rij:hover{border-color:var(--line-2)}
.rij .ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.rij .ct b{font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.rij .ct > .rmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.rij .vorm{width:26px;text-align:center;font-size:15px;color:var(--muted)}
.rij .nr{width:26px;height:26px;font-size:12.5px}
.bordkaart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;display:flex;flex-direction:column;gap:6px}
.bordkaart[draggable="true"]{cursor:grab}
.bordkaart[draggable="true"]:active{cursor:grabbing}
.bordkaart .bk-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.bordkaart b{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.bordkaart .grip{color:var(--muted);flex:none}
.bordkaart .bk-meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.bordleeg{font-size:13px;color:var(--muted);padding:6px 2px}
.vakken{display:flex;flex-direction:column;gap:8px}
.vakken details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 12px}
.vakken summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:48px;font-weight:650}
.vakken summary::-webkit-details-marker{display:none}
.vakken .binnen{padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.fixregel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.uitkomst{font-family:var(--mono);font-size:11px;border-radius:6px;padding:2px 6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* Team */
.post{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:3px}
.post .pb{display:flex;flex-direction:column;gap:5px;min-width:0}
.post .pb p{font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere}
.dagkop{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.agentkop{display:flex;gap:12px;align-items:center}
.agentkop .groot-em{width:52px;height:52px;border-radius:50%;background:var(--team-zacht);display:grid;place-items:center;font-size:26px;flex:none}
.tellers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.teller{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;display:flex;flex-direction:column;gap:2px}
.teller b{font-size:24px;font-family:var(--mono);line-height:1.1}
.teller span{font-size:12.5px;color:var(--muted)}
.kopieerblok{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.kopieerblok code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.kopieerblok .knop{min-height:40px;padding:6px 10px;font-size:13px}

/* Vaste taken */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wdag{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:96px;position:relative}
.wdag .dn{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wdag .aantal{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.wdag .ems{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:13px}
.wdag.druk{border-color:var(--jij-mark);box-shadow:inset 0 0 0 1px var(--jij-mark)}
.donote{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.wnamen{display:none;flex-direction:column;gap:4px}
.wnamen span{font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--team);border-radius:6px;padding:3px 6px;line-height:1.25}
.taak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.taak:last-child{border-bottom:0}
.taak.uit .tnaam{color:var(--muted)}
.tnaam{font-weight:700;font-size:15px;line-height:1.3}
.tregel{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.tregel select{width:auto;min-height:40px;padding:6px 8px;font-size:13.5px;border-radius:8px;border:1px solid var(--veldrand);background:var(--surface)}
.schakel{width:48px;height:28px;border-radius:999px;border:1px solid var(--veldrand);background:var(--veldrand);position:relative;flex:none;margin-top:6px}
.schakel::before{content:"";position:absolute;inset:-7px -2px}
.schakel::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s ease;box-shadow:var(--schaduw-klein)}
.schakel[aria-checked="true"]{background:var(--team)}
.schakel[aria-checked="true"]::after{left:23px}
.schakel[disabled]{opacity:.55;cursor:not-allowed}
.achter{color:var(--jij-tekst);font-weight:650}
.okt{color:var(--klaar);font-weight:650}
.slotregel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}

/* Klaar-check */
.check{display:flex;flex-direction:column}
.cregel{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.cregel:last-child{border-bottom:0}
.cvorm{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--mono)}
.cvorm.ok{background:var(--klaar-zacht);color:var(--klaar)}
.cvorm.let{background:var(--jij-zacht);color:var(--jij-tekst)}
.cvorm.nee{background:var(--rood-zacht);color:var(--rood)}
.cvorm.onbekend{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.cregel b{font-size:14.5px}
.cregel p{font-size:13.5px;color:var(--muted)}
.stappen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.stappen li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;counter-increment:s}
.stappen li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--mono)}
.stappen li > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.velden2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13.5px;align-items:center;margin:0}
.velden2 dt{color:var(--muted)}
.velden2 dd{margin:0;min-width:0}

/* Resultaat */
.grafiek{width:100%;max-width:560px;height:auto;display:block;flex:1 1 340px}
.grafiekrij{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.grafiekrij .legenda2{flex-direction:column;flex:0 1 240px}
.grafiek text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.grafiek .rast{stroke:var(--line);stroke-width:1}
.grafiek .s-team{fill:var(--team)}
.grafiek .s-voor{fill:var(--team-zacht);stroke:var(--team);stroke-width:1}
.grafiek .s-zelf{fill:var(--line-2)}
.grafiek .tot{font-weight:700;fill:var(--ink);font-size:11px}
.legenda2{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--muted)}
.legenda2 i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legenda2 i.l-team{background:var(--team)}
.legenda2 i.l-voor{background:var(--team-zacht);border:1px solid var(--team)}
.legenda2 i.l-zelf{background:var(--line-2)}
.cijfers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.cijfers,.tellers{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Gegevens */
.groepen{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.orgkop{display:flex;gap:12px;align-items:center}
.orglogo{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:16px;color:var(--ink);flex:none}
.orglogo.klein{width:40px;height:40px;border-radius:10px;font-size:13px}
.regel.orgrij{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.orgrij .rechts{grid-column:2;display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:4px;text-align:left}
.orgrij .rechts:empty{display:none}
.lijstje{display:flex;flex-direction:column}
.lijstje > div,.lijstje > a{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:inherit;text-decoration:none}
.lijstje > a:hover b{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.lijstje > :last-child{border-bottom:0}
.tabelwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* Hulp */
.hulpplaat{width:100%;height:auto;display:block;max-width:560px}
.hulpplaat text{font-family:var(--f);fill:var(--ink)}
.hulpplaat .sub{fill:var(--muted);font-size:11px}
.hulpplaat .kj{fill:var(--jij-zacht);stroke:var(--jij);stroke-width:1.5}
.hulpplaat .kt{fill:var(--team-zacht);stroke:var(--team);stroke-width:1.5}
.hulpplaat .pijl{stroke:var(--line-2);stroke-width:2;fill:none}
.hulpplaat .pijlkop{fill:var(--line-2)}
.hsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 14px;scroll-margin-top:84px}
.hsec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;font-weight:700;font-size:15.5px}
.hsec summary::-webkit-details-marker{display:none}
.hsec[open] summary .ic{transform:rotate(90deg)}
.hsec .binnen{padding-bottom:14px;display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.55;max-width:66ch}
.hsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.banenuitleg{display:flex;flex-direction:column;gap:8px}
.bu{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.bu .vorm{font-size:18px;line-height:1.2;text-align:center}
.bu.j .vorm{color:var(--jij-mark)}
.bu.t .vorm{color:var(--team)}
.bu small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.kleur-jij{color:var(--jij-tekst)}
.kleur-team{color:var(--team-tekst)}
.tijdlijn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tijdlijn li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);transition:opacity .2s}
.tijdlijn li.dim{opacity:.35}
.tijdlijn li.cur{background:linear-gradient(90deg,var(--team-zacht),transparent 75%);border-radius:6px}
.tijdlijn .wn{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 0 0 6px}
.tijdlijn .wt b{display:block;font-size:14.5px}
.tijdlijn .wt span{font-size:13.5px;color:var(--muted)}
.tijdlijn .wt .pil{margin-top:4px}
@media (max-width:420px){.tijdlijn li{grid-template-columns:minmax(0,1fr)}.tijdlijn .wn{padding-left:0}}
.keten{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.station{border:1px solid var(--line);border-top:3px solid var(--team);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:650;background:var(--surface-2)}
.station.jijst{border-top-color:var(--jij-mark)}
.ruit{width:12px;height:12px;background:var(--jij-mark);transform:rotate(45deg);display:inline-block;margin:0 3px}
.pijltje{color:var(--muted)}
.woorden{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.woorden dt{font-weight:700}
.woorden dd{margin:0;color:var(--muted)}
.tabel2{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));gap:0;font-size:13.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabel2 > div{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabel2 > div.h{background:var(--surface-2);font-weight:700}

/* Beheer: de bestaande panelen voor modules en teamleden, in deze huisstijl */
.beheer h3{font-size:16px;margin:0 0 6px}
.beheer .footnote{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.beheer .footnote.warn{color:var(--jij-tekst)}
.beheer .grid-9{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:8px 0}
.beheer .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.beheer .card .kop{font-weight:700}
.beheer .card .getal{font-family:var(--mono);font-size:18px}
.beheer .grijs-blok{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.beheer .grijs-kop{font-weight:700}
.beheer .grijs-tekst{color:var(--muted);font-size:13.5px}
.beheer .modules-verzoek{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.beheer .modules-keuze{display:flex;gap:8px;align-items:center;min-height:40px}
.beheer table{margin:8px 0}
.beheer td{vertical-align:middle}
.beheer button:not(.knop):not(.link):not(.ikknop){display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:650;font-size:14px}
.beheer button.knop-gevaar,.beheer .team-verwijder{border-color:var(--rood);color:var(--rood)}
.beheer input[type=email],.beheer input[type=text],.beheer textarea{max-width:420px}
.beheer .team-uitnodigen{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.beheer .team-uitnodigen-rij{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.beheer .bewerk-fout{color:var(--rood);font-size:13.5px}
.beheer .detail-link{color:var(--ink);font-weight:650}
@media (max-width:640px){
  .beheer .team-tabel thead{display:none}
  .beheer .team-tabel,.beheer .team-tabel tbody,.beheer .team-tabel tr,.beheer .team-tabel td{display:block;width:100%}
  .beheer .team-tabel tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .beheer .team-tabel td{border-bottom:0;padding:2px 0}
}

/* De meldingsregel van de oudere schrijfpaden (catalogus, beheer) */
.melding{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:10px 12px 10px 14px;font-size:14px;box-shadow:var(--schaduw)}
.melding[hidden]{display:none}
.melding-fout{border-left:4px solid var(--rood)}
.melding-tekst{flex:1;overflow-wrap:anywhere}
.melding-knop{border:0;background:transparent;color:var(--toast-accent);font-weight:800;text-decoration:underline;min-height:40px;white-space:nowrap}
.melding-sluit{border:0;background:transparent;color:var(--toast-ink);min-height:40px;min-width:40px}

/* Laden en de versiefout */
.laden{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px 16px}
.laden .draai{width:22px;height:22px;border:3px solid var(--line-2);border-right-color:transparent;border-radius:50%;animation:draai .8s linear infinite}
.voet{font-size:12px;color:var(--muted);max-width:820px;margin:8px auto 0;padding:0 14px 14px}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  .app{padding-bottom:40px}
  .app.met-fab{padding-bottom:40px}
  .akop{padding-inline:20px}
  .merk{flex:0 1 auto;max-width:300px}
  .dtabs{display:flex;flex:1}
  .tabbalk,.fab{display:none}
  .inhoud{padding:20px}
  .twee{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .twee > .paneel-kolom{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto;border-radius:var(--r-l);scroll-padding-bottom:170px}
  .scrim.klein{align-items:center}
  .scrim.klein .sheet{width:min(520px,92%);border-radius:16px;max-height:86%}
  .scrim.lade{justify-content:flex-end;align-items:stretch}
  .scrim.lade .sheet{width:min(560px,56%);height:100%;max-height:none;border-radius:0;animation:links .2s ease}
  .greep{display:none}
  .toast,.melding{left:24px;right:auto;bottom:24px;width:min(460px,60%)}
  .banen.bord{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
  .wdag{align-items:stretch;min-height:150px}
  .wdag .dn,.wdag .aantal{text-align:center}
  .wdag .ems{display:none}
  .wnamen{display:flex}
  .groepen{grid-template-columns:repeat(2,minmax(0,1fr))}
  .regel.orgrij{grid-template-columns:auto minmax(0,1fr) auto auto}
  .orgrij .rechts{grid-column:auto;flex-direction:column;align-items:flex-end;text-align:right}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Hulpfuncties rond schema/schema.generated.js (window.AGENTIC_TEAM_SCHEMA).
 * Puur, geen DOM-afhankelijkheid — apart getest. */

function normKey(s) {
  return String(s ?? "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

function kebabKey(key) {
  return key.replace(/_/g, "-");
}

// Bekende oudere/alternatieve bestandsnamen die niet (meer) letterlijk de
// registry-domeinsleutel volgen. Gevonden in clients/demo-fictief (een
// client-demo die dateert van vóór de registry-koppeling in Stream B) en in
// de voorbeeldnamen die het bron-intake-fase in core/base/orchestrator/
// prompt.md noemt ("lessen.json"). Puur voor herkenning bij het inlezen —
// het schema zelf blijft de registry-naam.
const LEGACY_FILENAME_ALIASES = {
  "prospects": "organisaties",
  "lessen": "lessen_inzichten",
  "content-pipeline": "content_kalender",
  "content-kalender": "content_kalender",
  "sales-funnel": "sales_funnel",
};

function domainKeyFromFilename(filename) {
  const base = filename.replace(/\.[a-z0-9]+$/i, "");
  const kebab = base.toLowerCase();
  if (LEGACY_FILENAME_ALIASES[kebab]) return LEGACY_FILENAME_ALIASES[kebab];
  const schema = getSchema();
  for (const key of Object.keys(schema.datadomeinen)) {
    // normKey strips alles behalve letters en cijfers, zodat zowel
    // "lessen-inzichten" als "lessen_inzichten" op de registrysleutel
    // matcht. De registry gebruikt underscores; een met de hand gemaakte
    // export volgt vaak die sleutelnamen letterlijk.
    if (normKey(key) === normKey(base)) return key;
  }
  return null;
}

function getSchema() {
  if (typeof window !== "undefined" && window.AGENTIC_TEAM_SCHEMA) return window.AGENTIC_TEAM_SCHEMA;
  if (typeof globalThis !== "undefined" && globalThis.AGENTIC_TEAM_SCHEMA) return globalThis.AGENTIC_TEAM_SCHEMA;
  throw new Error("Schema niet geladen (window.AGENTIC_TEAM_SCHEMA ontbreekt) — schema/schema.generated.js is niet ingeladen.");
}

/** Vindt een domeinsleutel op basis van een Excel-tabbladnaam (exacte match
 * op de registry "naam", of via headerherkenning als terugval). */
function domainKeyFromSheetName(sheetName) {
  const schema = getSchema();
  for (const [key, domein] of Object.entries(schema.datadomeinen)) {
    if (domein.naam === sheetName) return key;
  }
  return null;
}

/** Als de tabbladnaam niet 1-op-1 matcht: welk domein heeft de grootste
 * overlap met deze headerrij? Nodig omdat we de parser willen baseren op
 * wat we zien, niet alleen op de verwachte tabbladnaam. */
function domainKeyFromHeaders(headers) {
  const schema = getSchema();
  const normHeaders = new Set(headers.map(normKey));
  let best = null, bestScore = 0;
  for (const [key, domein] of Object.entries(schema.datadomeinen)) {
    const velden = domein.velden.map(v => normKey(v.naam));
    const overlap = velden.filter(v => normHeaders.has(v)).length;
    const score = overlap / velden.length;
    if (score > bestScore) { bestScore = score; best = key; }
  }
  return bestScore >= 0.5 ? best : null;
}

/** Zoekt een veldwaarde op in een rij-object, eerst exact, dan genormaliseerd
 * (spaties/hoofdletters/underscores genegeerd) — zodat kleine afwijkingen in
 * kolomnamen (handmatig Excel-werk, oudere bestandsvorm) het lezen niet
 * meteen blokkeren. */
function getField(row, canonicalName) {
  if (row == null) return undefined;
  if (Object.prototype.hasOwnProperty.call(row, canonicalName)) return row[canonicalName];
  if (!row.__normCache) {
    const cache = {};
    for (const k of Object.keys(row)) cache[normKey(k)] = row[k];
    Object.defineProperty(row, "__normCache", { value: cache, enumerable: false });
  }
  return row.__normCache[normKey(canonicalName)];
}

/** Bouwt een opzoektabel van allerlei schrijfwijzen van een agent (slug,
 * naam, "emoji naam") naar de canonieke slug — Notion/Excel-select-velden
 * kunnen de weergavenaam bevatten, niet per se de slug. */
function buildAgentLookup() {
  const schema = getSchema();
  const lookup = {};
  for (const agent of schema.agents) {
    const variants = [
      agent.slug,
      agent.displayName,
      `${agent.emoji} ${agent.displayName}`,
      agent.displayName.replace(/\s+/g, "-"),
    ];
    for (const v of variants) lookup[normKey(v)] = agent.slug;
  }
  return lookup;
}

function matchAgentValue(raw, lookup) {
  if (!raw) return null;
  return lookup[normKey(raw)] || null;
}

if (typeof module !== "undefined") {
  module.exports = {
    normKey, kebabKey, domainKeyFromFilename, domainKeyFromSheetName,
    domainKeyFromHeaders, getField, buildAgentLookup, matchAgentValue, getSchema,
    LEGACY_FILENAME_ALIASES,
  };
}


/* Route 4: live uit de eigen werkruimte-instantie, via een daglink (f15/f18).
 *
 * De Coördinator geeft de klant bij de dagstart een prefilled URL:
 *   https://dashboard.agentic-team.ai#t=<token>&i=<instantie-url>

 * aan te pas. (Sinds p10 staat de CSP één extra bestemming toe: het
 * token-endpoint op www.agentic-team.ai. Daar gaat nooit klantdata langs;
 * zie het README-hoofdstuk "Eén bron".)
 *
 * Sinds 25-08-2026 is de werkruimte de enige databron: er is altijd een
 * werkruimte, dus de vroegere bestandsroutes (Excel-werkboek, data-map,
 * Notion-export-map) en het losse offline dashboard.html zijn verwijderd.
 * Deze module levert de uniforme bundelvorm (kind "rows" of "metrics") waar
 * alles stroomafwaarts (zones, metrics, render) op rekent.
 *
 * p10 fase 3 geeft die ene bron een tweede ingang: naast de daglink kun je
 * inloggen met je licentie (OAuth, zie src/oauth-client.js). Beide leveren

 * vernieuwen, een daglink niet.

 *     { aanwezig, rows, staleAt, herkomstLabel } }, bedrijfscontext,
 *     waarschuwingen: [], teamfeed, intern, metricsRaw? }

function emptyBundle(source, sourceLabel) {
  return { source, sourceLabel, kind: "rows", domains: {}, bedrijfscontext: null, waarschuwingen: [], activaties: null };
}

// (een "versie"- of "type"-veld) — de versiecontrole zelf zit in metrics.js.
function looksLikeMetricsPayload(raw) {
  return raw !== null && typeof raw === "object" && !Array.isArray(raw) && (("versie" in raw) || ("type" in raw));

/* i68 — de activatieteller uit /dashboard/overzicht, gesaneerd bij binnenkomst:

 * alleen geldige weekdata. Ontbreekt het veld, dan draait de instantie een
 * image zonder teller: null. */
const ACTIVATIE_MAX_WEKEN = 60;
function saneerActivaties(raw, schema) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const slugs = new Set(((schema && schema.agents) || []).map(a => a.slug));
  // Rondreis in plaats van Date.parse: die maakt van 31 februari stil 3 maart.
  const datumOk = v => {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    const d = new Date(v + "T00:00:00Z");
    return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === v;
  };
  const weken = (Array.isArray(raw.weken) ? raw.weken : [])
    .filter(w => w && typeof w === "object" && datumOk(w.week_start))
    .slice(-ACTIVATIE_MAX_WEKEN)
    .map(w => {
      const perAgent = {};
      const bron = w.per_agent && typeof w.per_agent === "object" && !Array.isArray(w.per_agent) ? w.per_agent : {};
      for (const [slug, n] of Object.entries(bron)) {
        if (!slugs.has(slug)) continue;
        if (typeof n !== "number" || !Number.isInteger(n) || n < 0 || n > 1e6) continue;
        perAgent[slug] = n;
      }
      return { week_start: w.week_start, per_agent: perAgent };
    });
  return { sinds: datumOk(raw.sinds) ? raw.sinds : null, weken };
}

const DAGLINK_SS_KEY = "agentic-team-dashboard:daglink";

/* Herkent de daglink-parameters in het fragment. Detailroutes ("#/detail/…")
 * beginnen met "#/" en blijven buiten schot. Geeft null bij alles wat geen
 * geldige daglink is — de pagina toont dan de lege staat met de uitleg. */
/* b32 fase 2: het dashboard praat altijd via de router op het vaste domein.
 * De router zoekt de instantie op via de sleutel-hash in het token; een link
 * kan dus nooit naar een vreemde host wijzen en de CSP staat maar één origin
 * toe. De `i`-parameter uit oudere links wordt genegeerd — behalve http://
 * localhost, voor lokaal testen tegen een mock-instantie. */
const CONNECTOR_ORIGIN = "https://connector.agentic-team.ai";

function parseDaglinkFragment(hash) {
  if (!hash || hash.startsWith("#/")) return null;
  const params = new URLSearchParams(hash.replace(/^#/, ""));
  const token = params.get("t");
  if (!token) return null;
  const instantieRaw = params.get("i");
  if (instantieRaw) {
    let url = null;
    try { url = new URL(instantieRaw); } catch (e) { url = null; }
    const isLocalhost = url && (url.hostname === "localhost" || url.hostname === "127.0.0.1");
    if (url && isLocalhost && (url.protocol === "http:" || url.protocol === "https:")) {
      return { token, instantieUrl: url.origin };
    }
  }
  return { token, instantieUrl: CONNECTOR_ORIGIN };
}

/* Fragment -> sessionStorage, en het token meteen uit de adresbalk halen
 * zodat het niet in de history of in een per ongeluk gedeelde URL belandt. */
/* Draagt het fragment iets dat op een daglink lijkt, maar er geen is? Dan is
 * "Geen daglink gevonden" het verkeerde antwoord: er wás een link, hij is
 * alleen onbruikbaar. Detailroutes ("#/…") en een lege hash tellen niet mee. */
function hashLijktOpDaglink(hash) {
  if (!hash || hash.startsWith("#/")) return false;
  return hash.replace(/^#/, "").trim().length > 0;
}

function restoreDaglink() {
  const uitFragment = parseDaglinkFragment(window.location.hash);
  if (uitFragment) {
    try { sessionStorage.setItem(DAGLINK_SS_KEY, JSON.stringify(uitFragment)); } catch (e) { /* privémodus */ }
    history.replaceState(null, "", window.location.pathname + window.location.search);
    return uitFragment;
  }
  try {
    const raw = sessionStorage.getItem(DAGLINK_SS_KEY);
    if (raw) {
      const opgeslagen = JSON.parse(raw);
      // b32 fase 2: ook de opgeslagen bestemming moet aan de invariant voldoen
      // (alleen de router, of localhost). Een sessie van vóór fase 2 draagt nog
      // een azurecontainerapps-origin — die gooien we weg i.p.v. erop vast te lopen.
      if (opgeslagen && typeof opgeslagen.token === "string" && isToegestaneBestemming(opgeslagen.instantieUrl)) return opgeslagen;
      sessionStorage.removeItem(DAGLINK_SS_KEY);
    }
  } catch (e) { /* privémodus of kapotte waarde — dan geen daglink */ }
  return null;
}

function isToegestaneBestemming(instantieUrl) {
  if (instantieUrl === CONNECTOR_ORIGIN) return true;
  try {
    const u = new URL(String(instantieUrl));
    return (u.hostname === "localhost" || u.hostname === "127.0.0.1") && (u.protocol === "http:" || u.protocol === "https:");
  } catch (e) { return false; }
}

function vergeetDaglink() {
  try { sessionStorage.removeItem(DAGLINK_SS_KEY); } catch (e) { /* zie boven */ }
}

/* Zonder tijdslimiet blijft een uitblijvend antwoord voor altijd op de
 * laadtekst staan: de browser wacht dan tot hij het zelf opgeeft, en dat kan
 * minuten duren of helemaal niet gebeuren. Precies dat gebeurde bij een
 * daglink die geen antwoord kreeg — de pagina bleef hangen op "Live gegevens
 * uit je werkruimte worden opgehaald…" zonder ooit een fout te tonen.
 *
 * 20 seconden is ruim voor een koude instantie (die kan een cold start van
 * enkele seconden hebben) en kort genoeg om niet als kapot te voelen.
 *
 * Bewust GEEN wrapper om de netwerkaanroep heen: de twee aanroepen naar de
 * eigen instantie blijven letterlijk staan zoals ze stonden, zodat de
 * telemetriecontrole op het gebouwde artefact (test/geen-telemetrie.test.js)
 * elke aanroep met naam en bestemming blijft herkennen — die controle telt op
 * de tekst van dashboard.html. Deze helper levert alleen het afbreeksignaal. */
const VERZOEK_TIMEOUT_MS = 20000;
const VERZOEK_TIMEOUT_TEKST = "Je werkruimte reageert niet — na 20 seconden was er nog geen antwoord. Probeer het zo nog eens, of vraag je Coördinator om een nieuwe daglink.";

function tijdslimiet(ms = VERZOEK_TIMEOUT_MS) {
  if (typeof AbortController === "undefined") return { signal: undefined, klaar: () => {} };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return { signal: ctrl.signal, klaar: () => clearTimeout(timer) };
}

function isAfgebroken(e) {
  return !!e && (e.name === "AbortError" || e.name === "TimeoutError");
}

/* De bron is óf een daglink óf een OAuth-sessie — in beide gevallen
 * {token, instantieUrl}, en bij OAuth met `oauth: true` erbij. Alles
 * stroomafwaarts merkt het verschil niet; alleen de 401-afhandeling hieronder
 * kent het, want alleen een JWT is te vernieuwen. */
async function doeVerzoek(bron, pad) {
  const tl = tijdslimiet();
  try {
    return await fetch(bron.instantieUrl + pad, {
      headers: { Authorization: "Bearer " + bron.token },
      signal: tl.signal,
    });
  } catch (e) {
    if (isAfgebroken(e)) throw new Error(VERZOEK_TIMEOUT_TEKST);
    throw new Error("Je werkruimte-instantie is niet bereikbaar. Controleer je verbinding en probeer het opnieuw.");
  } finally {
    tl.klaar();
  }
}

/* p10: hooguit ÉÉN refreshpoging per sessie, gedeeld over alle gelijktijdige
 * verzoeken. De loader vuurt vier verzoeken tegelijk af (metPlafond); zonder
 * deze gedeelde belofte zouden er bij een verlopen token vier refreshes
 * uitgaan, en zou refresh-rotatie (contract §4) drie daarvan als hergebruik
 * zien en de hele familie intrekken. Faalt de poging, dan is opnieuw inloggen
 * de enige uitweg — nooit een tweede ronde. */
let oauthVernieuwing = null;
let oauthVernieuwingKlaar = false;

function resetOauthVernieuwing() {
  oauthVernieuwing = null;
  oauthVernieuwingKlaar = false;
}

function eenmaligVernieuwen() {
  if (oauthVernieuwingKlaar) return Promise.resolve(null);
  if (!oauthVernieuwing) {
    oauthVernieuwing = Promise.resolve()
      .then(() => vernieuwOauthSessie())
      .then((s) => { oauthVernieuwingKlaar = true; return s; });
  }
  return oauthVernieuwing;
}

async function fetchWerkruimte(bron, pad) {
  let res = await doeVerzoek(bron, pad);

  if (res.status === 401 && bron.oauth) {
    const nieuw = await eenmaligVernieuwen();
    if (nieuw && nieuw.access_token) {
      // Het bron-object is gedeeld met alle lopende verzoeken: het nieuwe
      // token geldt meteen ook voor hen.
      bron.token = nieuw.access_token;
      res = await doeVerzoek(bron, pad);
    }
  }

  let body = null;
  try { body = await res.json(); } catch (e) { /* geen JSON — valt hieronder in de foutpaden */ }
  if (res.status === 401) {
    if (bron.oauth) {
      const err = new Error("Je sessie is verlopen. Log opnieuw in met je licentie.");
      err.oauthVerlopen = true;
      throw err;
    }
    const err = new Error((body && body.fout) || "Deze dashboardlink is verlopen. Vraag je Coördinator om een nieuwe.");
    err.daglinkVerlopen = true;
    throw err;
  }
  if (res.status === 403 && bron.oauth) {
    // insufficient_scope (contract §6): een token zonder dashboard:lees.
    // Vernieuwen helpt niet — de grant zelf klopt niet.
    const err = new Error("Deze licentie geeft geen toegang tot het dashboard.");
    err.oauthVerlopen = true;
    throw err;
  }
  if (!res.ok || body === null) {
    throw new Error((body && body.fout) || ("Je werkruimte gaf een onverwacht antwoord (status " + res.status + ")."));
  }
  return body;
}

/* f23: een schrijfverzoek (POST/PUT/DELETE) naar de instantie, met dezelfde
 * 401-vernieuwing als fetchWerkruimte. Een 403/409/422 komt als leesbare
 * Error terug (de instantie stuurt een `fout`-tekst mee), met `status` erop
 * zodat de UI extern-domein (409) anders kan tonen dan een validatiefout. */
async function schrijfWerkruimte(bron, methode, pad, payload) {
  const doe = async () => {
    const tl = tijdslimiet();
    try {
      return await fetch(bron.instantieUrl + pad, {
        method: methode,
        headers: Object.assign(
          { Authorization: "Bearer " + bron.token },
          payload === undefined ? {} : { "Content-Type": "application/json" },
        ),
        signal: tl.signal,
        ...(payload === undefined ? {} : { body: JSON.stringify(payload) }),
      });
    } catch (e) {
      if (isAfgebroken(e)) throw new Error(VERZOEK_TIMEOUT_TEKST);
      throw new Error("Je werkruimte-instantie is niet bereikbaar. Controleer je verbinding en probeer het opnieuw.");
    } finally {
      tl.klaar();
    }
  };
  let res = await doe();
  if (res.status === 401 && bron.oauth) {
    const nieuw = await eenmaligVernieuwen();
    if (nieuw && nieuw.access_token) {
      bron.token = nieuw.access_token;
      res = await doe();
    }
  }
  let body = null;
  try { body = await res.json(); } catch (e) { /* geen JSON — valt in de foutpaden */ }
  if (res.status === 401) {
    const err = new Error(bron.oauth
      ? "Je sessie is verlopen. Log opnieuw in met je licentie."
      : "Deze dashboardlink is verlopen. Vraag je Coördinator om een nieuwe.");
    if (bron.oauth) err.oauthVerlopen = true; else err.daglinkVerlopen = true;
    throw err;
  }
  if (!res.ok) {
    const err = new Error((body && body.fout) || ("Je werkruimte gaf een onverwacht antwoord (status " + res.status + ")."));
    err.status = res.status;
    throw err;
  }
  return body;
}

/**
 * f30 — de statische export ophalen en als bestand aan de gebruiker geven.
 *
 * Bewust níet via fetchWerkruimte: die verwacht JSON en zou een export van
 * tientallen megabytes eerst door JSON.parse duwen (en bij markdown meteen
 * struikelen). Wel dezelfde 401-afhandeling, want een verlopen daglink of
 * sessie moet hier dezelfde melding geven als overal elders.
 *
 * De naam komt uit de Content-Disposition van de instantie en wordt niet
 * geraden: die kant kent de klantnaam en heeft hem al door een strikte zeef
 * gehaald. Herkennen we hem niet, dan een neutrale terugval — nooit een naam
 * uit serverinvoer letterlijk in `a.download` zetten.
 */
async function downloadExport(bron, formaat) {
  let res = await doeVerzoek(bron, "/dashboard/export?formaat=" + encodeURIComponent(formaat));
  if (res.status === 401 && bron.oauth) {
    const nieuw = await eenmaligVernieuwen();
    if (nieuw && nieuw.access_token) {
      bron.token = nieuw.access_token;
      res = await doeVerzoek(bron, "/dashboard/export?formaat=" + encodeURIComponent(formaat));
    }
  }
  if (res.status === 401) {
    const err = new Error(bron.oauth
      ? "Je sessie is verlopen. Log opnieuw in met je licentie."
      : "Deze dashboardlink is verlopen. Vraag je Coördinator om een nieuwe.");
    if (bron.oauth) err.oauthVerlopen = true; else err.daglinkVerlopen = true;
    throw err;
  }
  if (!res.ok) {
    throw new Error("Je werkruimte gaf een onverwacht antwoord (status " + res.status + ").");
  }

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = bestandsnaamUitHeader(res.headers.get("content-disposition"), formaat);
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Direct vrijgeven kan de download in Safari afbreken; een tik later is genoeg.
  setTimeout(() => URL.revokeObjectURL(url), 60_000);
}

/** Alleen een naam die eruitziet als de onze; anders een neutrale terugval. */
function bestandsnaamUitHeader(kop, formaat) {
  const treffer = /filename="([A-Za-z0-9._-]{1,120})"/.exec(kop || "");
  if (treffer) return treffer[1];
  return "werkruimte-export." + (formaat === "json" ? "json" : "md");
}

/**
 * Voert `werk` uit over `items` met hooguit `plafond` tegelijk, en levert de
 * uitkomsten in dezelfde volgorde als de invoer (s26/016). Faalt er één, dan
 * faalt het geheel — net als Promise.all, zodat de foutafhandeling erboven
 * niet verandert.
 */
async function metPlafond(items, plafond, werk) {
  const uit = new Array(items.length);
  let volgende = 0;
  const werkers = new Array(Math.min(plafond, items.length)).fill(null).map(async () => {
    for (;;) {
      const i = volgende++;
      if (i >= items.length) return;
      uit[i] = await werk(items[i], i);
    }
  });
  await Promise.all(werkers);
  return uit;
}

/* Eén entry uit de instantie → één rij zoals de rest van het dashboard hem
 * leest. Staat apart omdat er twee ingangen zijn: het laden van de bundel en
 * (i81) het antwoord op een schrijfactie, dat de rij ter plekke vervangt. Twee
 * eigen vormen zouden na de eerste klik stil uit elkaar gaan lopen. */
function rijVanEntry(e) {
  // f46: de stempels van de instantie reizen mee onder één sleutel. Niet als
  // __aangemaakt/__bijgewerkt: getField() normaliseert sleutels, en dan zou
  // een schemaveld "Bijgewerkt" stil de stempel lezen.
  return Object.assign({}, e && e.data, {
    __entryId: e && e.entryId,
    __stempels: { aangemaakt: (e && e.aangemaakt) || null, bijgewerkt: (e && e.bijgewerkt) || null },
  });
}

function maxBijgewerkt(entries) {
  let laatst = null;
  for (const e of entries) {
    const dt = e && e.bijgewerkt ? new Date(e.bijgewerkt) : null;
    if (dt && !isNaN(dt.getTime()) && (!laatst || dt > laatst)) laatst = dt;
  }
  return laatst;
}

/* De werkruimte bewaart bedrijfscontext als losse entries (Onderdeel/Inhoud,
 * registry 1.24.1); zone 2 verwacht één sleutel->waarde-object met een Bron.
 * De bron ís hier de instantie zelf — de klant heeft zijn context daar staan. */
function bedrijfscontextUitEntries(entries, fallbackStaleAt) {
  if (!entries.length) return null; // geen context in de werkruimte -> zone 2 zegt "onbekend"
  const obj = { Bron: "je werkruimte-instantie (hosted)" };
  let laatst = null;
  for (const e of entries) {
    const d = e.data || {};
    if (d.Onderdeel) obj[String(d.Onderdeel)] = d.Inhoud;
    const dt = d.Bijgewerkt ? new Date(d.Bijgewerkt) : null;
    if (dt && !isNaN(dt.getTime()) && (!laatst || dt > laatst)) laatst = dt;
  }
  obj.staleAt = laatst || fallbackStaleAt;
  return obj;
}

/* f24: teams met werkdata buiten de werkruimte (Notion, eigen systeem)
 * krijgen hun cijfers via het domein dashboard_metrics — één entry met het
 * metricsbestand (contract v1) als JSON-string, dagelijks overschreven door
 * de Coördinator. Dit domein is nooit een rows-domein: het staat bewust
 * niet in het dashboard-schema (opslag=werkruimte-filter in
 * extract-schema.py) en wordt hier bij naam overgeslagen als tweede
 * vangrail. Werkgeheugen-domeinen tellen niet als werkdata voor de
 * voorrangsbeslissing: die zijn bij élke werkruimte-klant gevuld. */
const METRICS_DOMEIN = "dashboard_metrics";
// Domeinen die wél rijen hebben maar géén "werkdata" zijn in de arbitrage
// hieronder: werkgeheugen (logboek, bedrijfscontext) en sinds f33 notities.
// Zonder notities hier zou één losse notitie bij een klant met een extern
// CRM de metricsroute verdringen voor een bijna leeg rijendashboard.
const GEHEUGEN_DOMEINEN = ["logboek", "bedrijfscontext", "notities"];
const TEAMFEED_DOMEIN = "teamfeed";
const TEAMFEED_DAGEN = 30;
const TEAMFEED_LIMIET = 500;

/* f22: de teamfeed (domein `teamfeed`, opslag=werkruimte) is nooit een
 * rows-domein en telt niet mee in de voorrangsbeslissing; hij hoort bij
 * élke route (rows én metrics) op de bundle. Fail-open: een werkruimte die
 * het domein nog niet kent geeft 400 "Onbekend domein" — dan is de feed er
 * gewoon niet, met een uitleg in de feed zelf (geen waarschuwingsbalk). */
async function haalTeamfeed(bron, vandaag) {
  // b37: op lokale kalenderdag (toISOString gaf de UTC-dag: 's avonds een dag te weinig)
  const sinds = feedDagKey(dagVanIndex(kalenderDag(vandaag) - TEAMFEED_DAGEN));
  try {
    const body = await fetchWerkruimte(bron,
      "/dashboard/entries?domein=" + TEAMFEED_DOMEIN + "&limiet=" + TEAMFEED_LIMIET + "&sinds=" + sinds);
    return { entries: Array.isArray(body.entries) ? body.entries : [], opgehaaldOp: vandaag.toISOString() };
  } catch (e) {
    if (e && (e.daglinkVerlopen || e.oauthVerlopen)) throw e;
    return null;
  }
}

function isVanVandaag(isoTekst, vandaag) {
  const dt = isoTekst ? new Date(isoTekst) : null;
  if (!dt || isNaN(dt.getTime())) return false;
  return dt.getFullYear() === vandaag.getFullYear()
    && dt.getMonth() === vandaag.getMonth()
    && dt.getDate() === vandaag.getDate();
}

/* Haalt de metrics-entry op en geeft {payload, gegenereerdOp} of null.
 * Onleesbaar (geen JSON, of niet de vorm van een metricsbestand) telt als
 * "geen metrics", met een zichtbare waarschuwing — nooit stil negeren. */
async function haalMetricsEntry(bron, bundle) {
  const body = await fetchWerkruimte(bron, "/dashboard/entries?domein=" + METRICS_DOMEIN + "&limiet=10");
  const entries = body.entries || [];
  const entry = entries.find(e => e.entryId === "metrics")
    || entries.slice().sort((a, b) => String(b.bijgewerkt).localeCompare(String(a.bijgewerkt)))[0];
  if (!entry) return null;
  let payload;
  try {
    payload = JSON.parse(String(entry.data && entry.data.Inhoud));
  } catch (e) {
    bundle.waarschuwingen.push("De dashboard_metrics-entry in je werkruimte bevat geen geldige JSON — de rijenroute wordt gebruikt. Vraag je Coördinator de dagstart opnieuw te draaien.");
    return null;
  }
  if (!looksLikeMetricsPayload(payload)) {
    bundle.waarschuwingen.push("De dashboard_metrics-entry in je werkruimte heeft niet de vorm van een metricsbestand — de rijenroute wordt gebruikt.");
    return null;
  }
  return { payload, gegenereerdOp: payload.gegenereerd_op || entry.bijgewerkt };
}

/* Domeinen met opslag=werkruimte (dashboard_metrics, bronkoppeling, …)
 * zijn afgeleide/config-data en nooit rows-domeinen. Het schema levert de
 * lijst (extract-schema.py); de vaste namen hieronder blijven als vangnet
 * voor een artefact dat tegen een nieuwere registry praat. */
function werkruimteDomeinen(schema) {
  const uitSchema = schema.werkruimteDomeinen || [];
  return uitSchema.indexOf(METRICS_DOMEIN) === -1 ? uitSchema.concat([METRICS_DOMEIN]) : uitSchema;
}

async function loadWerkruimteBundle(bron) {
  const overzicht = await fetchWerkruimte(bron, "/dashboard/overzicht");
  const label = overzicht.klant ? "werkruimte van " + overzicht.klant : "je werkruimte";
  const bundle = emptyBundle("werkruimte", label);
  // f52: de bedrijfsnaam, voor de naam van het werkmoment in het stappenblad.
  bundle.klant = typeof overzicht.klant === "string" ? overzicht.klant : null;
  // Interne omgeving (DASHBOARD_INTERN=1 op de instantie): alleen dan toont
  // het dashboard de interne tegels (correctievrij / f19-gate).
  bundle.intern = overzicht.intern === true;
  const schema = getSchema();
  // i68: de activatieteller van de instantie. null = een image zonder teller.
  bundle.activaties = saneerActivaties(overzicht.activaties, schema);
  const opslagDomeinen = werkruimteDomeinen(schema);

  const gevuld = (overzicht.domeinen || []).filter(d => d && d.aantal > 0);
  // f33: welke domeinen kent de instantie überhaupt? Het overzicht noemt ze
  // allemaal, ook met aantal 0 — en dat is het enige signaal of een instantie
  // al een image draait dat een nieuw domein kent. Zonder dit zou het
  // dashboard een notitieformulier tonen dat bij een oudere instantie een
  // "Onbekend domein" oplevert, precies in het gat tussen een dashboarddeploy
  // en de vlootuitrol.
  bundle.instantieDomeinen = (overzicht.domeinen || []).map(d => d && d.domein).filter(Boolean);

  // f22: alleen ophalen als de instantie het domein kent (staat dan in het
  // overzicht, ook met aantal 0); anders blijft teamfeed null = "nog niet
  // actief op deze werkruimte".
  bundle.teamfeed = (overzicht.domeinen || []).some(d => d && d.domein === TEAMFEED_DOMEIN)
    ? await haalTeamfeed(bron, new Date())
    : null;

  // De bronkoppeling arbitreert wat "werkdata in de werkruimte" is: een
  // domein dat volgens de bronkoppeling ergens ánders woont (notion,
  // werkboek, lokaal) telt hier niet mee — één verdwaalde entry in de
  // werkruimte mag het metricsbestand niet verdringen (gezien bij FFG:
  // een welkomstpakket-actie in de werkruimte terwijl acties in Notion
  // wonen). Zonder bronkoppeling-entry geldt het oude gedrag.
  const systeemPerDomein = {};
  if (gevuld.some(d => d.domein === "bronkoppeling")) {
    try {
      const body = await fetchWerkruimte(bron, "/dashboard/entries?domein=bronkoppeling&limiet=50");
      for (const e of (body.entries || [])) {
        if (e && e.data && e.data.Systeem) systeemPerDomein[e.entryId] = e.data.Systeem;
      }
    } catch (e) { /* geen bronkoppeling leesbaar -> oude gedrag */ }
  }
  const werkdataDomeinen = gevuld.filter(d =>
    opslagDomeinen.indexOf(d.domein) === -1
    && GEHEUGEN_DOMEINEN.indexOf(d.domein) === -1
    && (!(d.domein in systeemPerDomein) || systeemPerDomein[d.domein] === "werkruimte"));

  // Voorrangsregels (f24): verse metrics winnen; oude metrics naast echte
  // werkdata-rijen worden genegeerd; oude metrics zonder werkdata worden
  // getoond mét verouderd-waarschuwing (iets ouds met stempel is beter dan
  // een leeg dashboard).
  if (gevuld.some(d => d.domein === METRICS_DOMEIN)) {
    const metrics = await haalMetricsEntry(bron, bundle);
    if (metrics) {
      const vers = isVanVandaag(metrics.gegenereerdOp, new Date());
      const datumLabel = String(metrics.gegenereerdOp).slice(0, 10);
      if (vers || werkdataDomeinen.length === 0) {
        if (vers && werkdataDomeinen.length > 0) {
          bundle.waarschuwingen.push("Je werkruimte bevat ook werkdata-rijen; het dashboard toont het vandaag aangeleverde metricsbestand.");
        }
        if (!vers) {
          bundle.waarschuwingen.push(`Deze cijfers zijn gegenereerd op ${datumLabel} en mogelijk verouderd — vraag je Coördinator om een dagstart voor verse cijfers.`);
        }
        bundle.kind = "metrics";
        bundle.metricsRaw = metrics.payload;
        // f33: de cijfers komen uit het metricsbestand, maar de Data-tab moet
        // nog steeds je rijen kunnen tonen. Tot nu toe returnde deze tak
        // meteen, waardoor detail, kanban en notities onzichtbaar waren op
        // precies de omgevingen waar 's ochtends een dagstart draait.
        await laadRijen(bron, bundle, gevuld, opslagDomeinen, schema);
        bundle.systeemPerDomein = systeemPerDomein;
        return bundle;
      }
      bundle.waarschuwingen.push(`Verouderde metrics-entry (van ${datumLabel}) genegeerd — het dashboard rekent live uit de werkdata-rijen in je werkruimte.`);
    }
  }

  await laadRijen(bron, bundle, gevuld, opslagDomeinen, schema);
  // f23: de UI moet weten welke domeinen volgens de bronkoppeling extern
  // wonen — die blijven lezen-met-uitleg, ook in een schrijfsessie.
  bundle.systeemPerDomein = systeemPerDomein;
  if (bundle.bedrijfscontext === null) bundle.bedrijfscontext = "niet-ondersteund-door-bundel";
  return bundle;
}

/* De rijen van elk gevuld domein in de bundel zetten. Sinds f33 gebeurt dit in
 * beide takken van loadWerkruimteBundle: ook naast een vers metricsbestand,
 * want de Data-tab leest hieruit. */
async function laadRijen(bron, bundle, gevuld, opslagDomeinen, schema) {
  const metInhoud = gevuld.filter(d => opslagDomeinen.indexOf(d.domein) === -1);
  // s26/016: dit was één Promise.all over álle gevulde domeinen — bij een vol
  // team zijn dat er zeventien, elk met een verzoek om 5.000 records, allemaal
  // tegelijk naar één instantie. Die instantie is een kleine container; de
  // browser knijpt zelf al af rond zes verbindingen, maar de rest staat dan in
  // de rij bij de instantie in plaats van bij de browser. Vier tegelijk houdt
  // de eerste schermvulling snel zonder de instantie plat te leggen.
  const opgehaald = await metPlafond(metInhoud, 4, async (d) => ({
    domein: d.domein,
    body: await fetchWerkruimte(bron, "/dashboard/entries?domein=" + encodeURIComponent(d.domein) + "&limiet=5000"),
  }));

  for (const { domein, body } of opgehaald) {
    const entries = body.entries || [];
    const staleAt = maxBijgewerkt(entries);
    if (domein === "bedrijfscontext") {
      bundle.bedrijfscontext = bedrijfscontextUitEntries(entries, staleAt);
      continue;
    }
    if (!schema.datadomeinen[domein]) {
      bundle.waarschuwingen.push(`Domein "${domein}" uit je werkruimte is onbekend in deze dashboardversie — genegeerd. Waarschijnlijk is het dashboard ouder dan je werkruimte.`);
      continue;
    }
    bundle.domains[domein] = {
      aanwezig: true,
      // f23: __entryId reist mee voor bewerken/verwijderen; het is geen
      // schemaveld en komt dus nooit als kolom in beeld.
      rows: entries.map(rijVanEntry),
      staleAt,
      herkomstLabel: `werkruimte — ${domein} (${entries.length} entries, live opgehaald)`,
    };
  }
}

/* p10: welke bron gebruikt deze pagina? Een verse daglink in het fragment is
 * een expliciete actie van de gebruiker en wint altijd; daarna telt een
 * lopende inlogsessie (het JWT), en pas daarna een eerder opgeslagen daglink.
 * Zonder alle drie blijft de lege staat staan. */
/* b62: voor welke licentie is een token? Een daglink is `body.handtekening`

 *   redirect_uri  https://dashboard.agentic-team.ai/                    (§5a)

const OAUTH_AUTORISATIE_URL = "https://www.agentic-team.ai/oauth/authorize";

 * geen tweede artefact. */

  try {
    return document.querySelector('meta[name="at-oauth"][content="1"]') !== null;
  } catch (e) {

/* Inloggen kan alleen op een echte http(s)-pagina: een redirect terug naar
 * https://dashboard.agentic-team.ai/ heeft geen betekenis als je het bestand

/* ── PKCE (RFC 7636, S256) ─────────────────────────────────────────────── */

function base64url(bytes) {

  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function willekeurigeBytes(n) {
  const uit = new Uint8Array(n);
  crypto.getRandomValues(uit);
  return uit;
}

/** 32 random bytes base64url = 43 tekens, ruim binnen de 43–128 van RFC 7636. */
function maakVerifier() {
  return base64url(willekeurigeBytes(32));
}

/** S256: base64url(sha256(ascii(verifier))). WebCrypto, geen eigen hash. */
async function maakChallenge(verifier) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

function bouwAutorisatieUrl({ challenge, state }) {

  p.set("client_id", OAUTH_CLIENT_ID);
  p.set("redirect_uri", OAUTH_REDIRECT_URI);
  p.set("scope", OAUTH_SCOPE);

  // de site invalid_target — dat is precies de bedoeling.
  p.set("resource", OAUTH_RESOURCE);
  p.set("code_challenge", challenge);
  p.set("code_challenge_method", "S256");
  p.set("state", state);

  // Practices). Dit stond eerst niet in de aanvraag: we lázen het fragment maar
  // vroegen er niet om, en de site stuurde dus keurig de standaard — de query.
  // Het inloggen slaagde, de code kwam terug, en dit bestand zag hem niet.
  // Gevonden bij het eerste echte gebruik; geen van beide kanten was fout, er
  // was alleen niets afgesproken.
  p.set("response_mode", "fragment");
  return OAUTH_AUTORISATIE_URL + "?" + p.toString();

/* De PKCE-verifier is de éne, bewuste uitzondering op regel 2 hierboven
 * (tokens in sessionStorage): de magic-link uit de mail opent vrijwel altijd

 * maillogin nooit afronden ("hoort niet bij dit tabblad", f23-klikproef

    if (!raw) return null;

function vergeetPkce() {
  try { localStorage.removeItem(OAUTH_PKCE_SS_KEY); } catch (e) { /* zie boven */ }
}

function bewaarOauthSessie(sessie) {
  try { sessionStorage.setItem(OAUTH_SS_KEY, JSON.stringify(sessie)); } catch (e) { /* privémodus */ }
}

function leesOauthSessie() {

    const raw = sessionStorage.getItem(OAUTH_SS_KEY);

    const s = JSON.parse(raw);
    if (s && typeof s.access_token === "string" && s.access_token) return s;

  return null;
}

  try { sessionStorage.removeItem(OAUTH_SS_KEY); } catch (e) { /* zie boven */ }
}

    code: code || null,
    state: p.get("state"),
    iss: p.get("iss"),
    fout: fout || null,
    foutTekst: p.get("error_description"),

 * geen DOM. "Vandaag" is injecteerbaar zodat dit reproduceerbaar te testen
