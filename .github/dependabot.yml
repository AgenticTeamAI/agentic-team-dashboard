# Automatische dependency-updates (backlog s28/s31). Houdt de SHA-pins van de
# Actions bij en levert het (kleine) npm-onderhoud voor de testtoolchain aan.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      klein-onderhoud:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
