    if (onbekend.length) waarschuw(ctx, `domeinen (${onbekend.length} onbekende sleutel(s))`, onbekend[0]);
  }

  // f29 (contract v2): relatie-aggregaten — alleen tellingen en top-titels,
  // nooit rijen. Spiegel van agentic-team-werkruimte src/domeinen/metrics.ts;
  // een item zonder geldig van/naar-domein valt volledig weg.
  if (Array.isArray(raw.relaties)) {
    uit.relaties = raw.relaties.filter(isObject).slice(0, METRICS_MAX.lijst).flatMap((r, i) => {
      const pad = `relaties[${i}]`;
      const van = typeof r.van === "string" && domeinSlugs.includes(r.van) ? r.van : null;
      const naar = typeof r.naar === "string" && domeinSlugs.includes(r.naar) ? r.naar : null;
      if (!van || !naar) { waarschuw(ctx, pad, r.van || r.naar); return []; }
      const top = Array.isArray(r.top) ? r.top.filter(isObject).slice(0, 3).flatMap((t, j) => {
        const titel = saneerTekstOfNull(t.titel, METRICS_MAX.tekstKort);
        if (!titel) { waarschuw(ctx, `${pad}.top[${j}].titel`, t.titel); return []; }
        return [{ titel, aantal: saneerGetal(t.aantal, ctx, `${pad}.top[${j}].aantal`) }];
      }) : [];
      return [{
        van,
        veld: saneerTekst(r.veld, METRICS_MAX.sleutel),
        naar,
        gekoppeld: saneerGetal(r.gekoppeld, ctx, `${pad}.gekoppeld`),
        totaal: saneerGetal(r.totaal, ctx, `${pad}.totaal`),
        doelen: saneerGetal(r.doelen, ctx, `${pad}.doelen`),
        top,
      }];
    });
  }

  if (isObject(raw.acties)) {
    uit.acties = {
      totaal: saneerGetal(raw.acties.totaal, ctx, "acties.totaal"),
      afgerond: saneerGetal(raw.acties.afgerond, ctx, "acties.afgerond"),
      verstreken: saneerGetal(raw.acties.verstreken, ctx, "acties.verstreken"),
      klaar_verstreken: saneerGetal(raw.acties.klaar_verstreken, ctx, "acties.klaar_verstreken"),
      opmerking: saneerTekstOfNull(raw.acties.opmerking, METRICS_MAX.tekst),
    };
  }
  // i25: correctievrij-percentage (de f19-gate). Zelfde whitelist-stijl:
  // alleen deze subsleutels, `percentage` en andere afgeleiden vallen weg —
  // het dashboard rekent die zelf (zie berekenCorrectievrij in zones.js).
  if (isObject(raw.correctievrij)) {
    const c = raw.correctievrij;
    const weken = Array.isArray(c.weken) ? c.weken.filter(isObject).slice(0, METRICS_MAX.buckets) : [];
    uit.correctievrij = {
      venster_dagen: saneerGetalOfNull(c.venster_dagen, ctx, "correctievrij.venster_dagen"),
      drempel_pct: saneerGetalOfNull(c.drempel_pct, ctx, "correctievrij.drempel_pct"),
      autonoom_afgerond: saneerGetal(c.autonoom_afgerond, ctx, "correctievrij.autonoom_afgerond"),
      gecorrigeerd: saneerGetal(c.gecorrigeerd, ctx, "correctievrij.gecorrigeerd"),
      heropend: saneerGetal(c.heropend, ctx, "correctievrij.heropend"),
      weken: weken.map((w, i) => {
        const pad = `correctievrij.weken[${i}]`;
        return {
          week_start: saneerDatum(w.week_start, ctx, `${pad}.week_start`),
          autonoom_afgerond: saneerGetal(w.autonoom_afgerond, ctx, `${pad}.autonoom_afgerond`),
          gecorrigeerd: saneerGetal(w.gecorrigeerd, ctx, `${pad}.gecorrigeerd`),
        };
      }),
      opmerking: saneerTekstOfNull(c.opmerking, METRICS_MAX.tekst),
    };
  }
  if (isObject(raw.sales_funnel)) {
    uit.sales_funnel = {
      per_fase: saneerTellingen(raw.sales_funnel.per_fase, ctx, "sales_funnel.per_fase"),
      verwachte_omzet_totaal: saneerGetal(raw.sales_funnel.verwachte_omzet_totaal, ctx, "sales_funnel.verwachte_omzet_totaal"),
      opmerking: saneerTekstOfNull(raw.sales_funnel.opmerking, METRICS_MAX.tekst),
    };
  }
  if (isObject(raw.content)) {
    uit.content = {
      gepubliceerd: saneerGetal(raw.content.gepubliceerd, ctx, "content.gepubliceerd"),
      gepland_in_periode: saneerGetal(raw.content.gepland_in_periode, ctx, "content.gepland_in_periode"),
      totaal: saneerGetal(raw.content.totaal, ctx, "content.totaal"),
    };
  }
  if (isObject(raw.klantsucces)) {
    uit.klantsucces = {
      in_onboarding: saneerGetal(raw.klantsucces.in_onboarding, ctx, "klantsucces.in_onboarding"),
      totaal: saneerGetal(raw.klantsucces.totaal, ctx, "klantsucces.totaal"),
    };
  }
  if (isObject(raw.backlog)) {
    uit.backlog = {
      besloten: saneerGetal(raw.backlog.besloten, ctx, "backlog.besloten"),
      done: saneerGetal(raw.backlog.done, ctx, "backlog.done"),
      totaal: saneerGetal(raw.backlog.totaal, ctx, "backlog.totaal"),
    };
  }
  if (isObject(raw.lessen)) {
    uit.lessen = {
      totaal: saneerGetal(raw.lessen.totaal, ctx, "lessen.totaal"),
      open: saneerGetal(raw.lessen.open, ctx, "lessen.open"),
      in_periode: saneerGetal(raw.lessen.in_periode, ctx, "lessen.in_periode"),
      per_categorie: saneerTellingen(raw.lessen.per_categorie, ctx, "lessen.per_categorie"),
    };
  }

  if (isObject(raw.weekreeks)) {
    const buckets = Array.isArray(raw.weekreeks.buckets) ? raw.weekreeks.buckets.filter(isObject).slice(0, METRICS_MAX.buckets) : [];
    uit.weekreeks = {
      bronnen: saneerTekstLijst(raw.weekreeks.bronnen, METRICS_MAX.sleutel),
      buckets: buckets.map((b, i) => {
        const w = isObject(b.waarden) ? b.waarden : {};
        const pad = `weekreeks.buckets[${i}]`;
        return {
          week_start: saneerDatum(b.week_start, ctx, `${pad}.week_start`),
          label: saneerTekstOfNull(b.label, METRICS_MAX.sleutel),
          totaal: saneerGetalOfNull(b.totaal, ctx, `${pad}.totaal`),
          waarden: {
            interacties: saneerGetal(w.interacties, ctx, `${pad}.interacties`),
            dagverslagen: saneerGetal(w.dagverslagen, ctx, `${pad}.dagverslagen`),
            lessen_inzichten: saneerGetal(w.lessen_inzichten, ctx, `${pad}.lessen_inzichten`),
            content_kalender: saneerGetal(w.content_kalender, ctx, `${pad}.content_kalender`),
          },
        };
      }),
    };
  }

  if (isObject(raw.agents)) {
    const perAgent = {};
    if (isObject(raw.agents.per_agent)) {
      for (const [sleutel, t] of Object.entries(raw.agents.per_agent).slice(0, METRICS_MAX.lijst)) {
        if (!isObject(t)) continue;
        // Sleutel mag slug óf weergavenaam zijn (de producer schrijft beide).
        const agent = agentVoorSleutel(agents, sleutel);
        if (!agent) { waarschuw(ctx, `agents.per_agent.${String(sleutel).slice(0, 40)}`, "onbekende agent"); continue; }
        perAgent[agent.slug] = {
          aantal_periode: saneerGetal(t.aantal_periode, ctx, `agents.${agent.slug}.aantal_periode`),
          aantal_totaal: saneerGetal(t.aantal_totaal, ctx, `agents.${agent.slug}.aantal_totaal`),
          laatst: saneerDatum(t.laatst, ctx, `agents.${agent.slug}.laatst`),
        };
      }
    }
    uit.agents = { veld_aanwezig: raw.agents.veld_aanwezig === false ? false : true, per_agent: perAgent };
  }

  if (isObject(raw.bedrijfscontext)) {
    const b = raw.bedrijfscontext;
    uit.bedrijfscontext = {
      bron: saneerTekstOfNull(b.bron, METRICS_MAX.tekstKort),
      placeholders_open: saneerTekstLijst(b.placeholders_open, METRICS_MAX.tekstKort),
      projectkennis_kopie_laatst_bijgewerkt: saneerDatum(b.projectkennis_kopie_laatst_bijgewerkt, ctx, "bedrijfscontext.projectkennis_kopie_laatst_bijgewerkt"),
      laatst_bijgewerkt: saneerDatum(b.laatst_bijgewerkt, ctx, "bedrijfscontext.laatst_bijgewerkt"),
    };
  }

  if ("voor_jou" in raw) uit.voor_jou = saneerVoorJouBlok(raw.voor_jou, ctx);
  if ("ritmetaken" in raw) uit.ritmetaken = saneerRitmeBlok(raw.ritmetaken, ctx);

  uit.waarschuwingen = saneerTekstLijst(raw.waarschuwingen, METRICS_MAX.tekst).concat(ctx.waarschuwingen).slice(0, METRICS_MAX.lijst);
  return uit;
}

function agentVoorSleutel(agents, sleutel) {
  const s = String(sleutel).trim().toLowerCase();
  if (!s) return null;
  return agents.find(a => a.slug === s || String(a.displayName || "").toLowerCase() === s) || null;
}

if (typeof module !== "undefined") {
  module.exports = { saneerMetricsPayload, METRICS_MAX, ERNST_TOEGESTAAN, saneerVoorJouBlok, saneerRitmeBlok };
}


/* De interne metricsvorm — dit is de enige vorm die de renderlaag (render.js,
 * homepage.js) ooit ziet. Er zijn twee manieren om hem te vullen:
 *
 *   1. buildMetricsFromRowsBundle(bundle, ...)  — werkruimte met werkdata-rijen:
 *      rekent de vijf zones, de adoptiescore, de weekreeks, de tijdwinst en de
 *      agent-ranglijst uit de rijen in de bundle, met de bestaande zones.js-
 *      functies. Dit ís de bestaande rij-berekening; hij verandert niet, hij
 *      krijgt alleen een naam en een vaste uitvoervorm.
 *
 *   2. parseNotionMetricsFile(raw, ...)         — Notion-route: leest een al
 *      kant-en-klaar metricsbestand (zie ONTWERP-wekelijkse-dashboardbijwerking.md)
 *      en zet het om in DEZELFDE vorm, zonder ooit een rij te zien.
 *
 * Beide leveren een object met exact dezelfde velden: z1..z5, activiteit,
 * adopt, tijdwinst, agentUsage, sporenTotaal, meta. app.js->buildContext()
 * kiest welke van de twee draait; render.js/homepage.js weten niet welke het
 * was.
 *
 * Versiecontrole: het metricsbestand draagt "versie" (geheel getal). Deze
 * module herkent alleen METRICS_VERSION. Bij een andere versie wordt er
 * NIETS berekend of getekend — parseNotionMetricsFile geeft een ok:false
 * terug met de reden, en de aanroeper (app.js) moet dat als een aparte
 * toestand tonen (geen dashboard, wel een duidelijke melding). Stil een
 * verkeerde grafiek tekenen is erger dan niets tekenen.
 */

const METRICS_VERSION = 2; // hoogste versie die dit dashboard kent
// f29: versie 2 = versie 1 + de `relaties`-sectie; beide blijven geldig.
const METRICS_VERSIES = [1, 2];

// ── Route 1 & 2: rijen → metrics (bestaande berekening, nu met een naam) ──
function buildMetricsFromRowsBundle(bundle, schema, agentLookup, today, periodWeeks, minutenPerActie) {
  const periodDays = periodWeeks * 7;

  const z1ruw = computeZone1(bundle, agentLookup, today);
  const z2 = computeZone2(bundle, today);
  const z1MetContext = voegContextToeAanAandacht(z1ruw, z2);
  const z3 = computeZone3(bundle, agentLookup, schema, today, periodDays);
  const z4 = computeZone4(bundle, today, periodDays);
  const z5 = computeZone5(bundle, today, periodDays);

  const activiteit = computeActiviteitPerWeek(bundle, today, periodWeeks);
  const adopt = computeAdoptiescore(bundle, schema, today, periodWeeks);
  const tijdwinst = computeTijdwinst(bundle, minutenPerActie);
  const agentUsage = computeAgentGebruikRanking(bundle, agentLookup, schema, today, periodDays);
  const sporenTotaal = activiteit.buckets.reduce((s, b) => s + b.totaal, 0);
  const correctievrij = computeCorrectievrij(bundle, today);
  // f25: het ritme (de oude adoptiescore) komt alleen omhoog in de aandachtlijst
  // als hij onder de drempel zakt — daarom pas hier, na computeAdoptiescore().
  const z1 = voegRitmeToeAanAandacht(z1MetContext, adopt);

  return {
    versie: METRICS_VERSION,
    bron: bundle.source,
    z1, z2, z3, z4, z5, activiteit, adopt, tijdwinst, agentUsage, sporenTotaal, correctievrij,
    periodWeeks, periodDays,
    meta: {
      bronLabel: bundle.sourceLabel,
      gegenereerdOp: null, // rij-routes hebben geen apart "gegenereerd_op" — het IS het moment van inlezen
      door: null,
      periode: null, // geen vaste periode in het bestand — de gebruiker kiest hem met de schakelaar
      domeinenGevonden: Object.keys(bundle.domains).length,
    },
    waarschuwingen: bundle.waarschuwingen,
    rawActies: null, // alleen relevant voor de metrics-route (live herrekenen van tijdwinst)
  };
}

// ── Route 3: kant-en-klaar metricsbestand → metrics ────────────────────
// `raw` is de al-geparste JSON van het bestand. Retourneert altijd
// { ok, ...}. Bij ok:false NOOIT een metrics-object teruggeven — de
// aanroeper mag dan niets tekenen.
function parseNotionMetricsFile(rawOnbetrouwbaar, schema, today, minutenPerActie) {
  // b32: eerst normaliseren — vanaf hier bevat `raw` uitsluitend bekende
  // velden in het verwachte type (zie metrics-sanitize.js).
  const raw = saneerMetricsPayload(rawOnbetrouwbaar, schema);
  if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
    return { ok: false, kind: "leeg-of-onherkenbaar", tekst: "Dit bestand is leeg of geen geldig metricsbestand (geen JSON-object met een \"versie\"-veld)." };
  }
  const heeftKenmerk = ("versie" in raw) || ("type" in raw);
  if (!heeftKenmerk) {
    return { ok: false, kind: "leeg-of-onherkenbaar", tekst: "Dit bestand heeft geen \"versie\"- of \"type\"-veld en wordt daarom niet als metricsbestand herkend. Is dit een leeg bestand, of een export in het oude rijenformaat?" };
  }
  if (!METRICS_VERSIES.includes(raw.versie)) {
    return {
      ok: false,
      kind: "onbekende-versie",
      versieGevonden: raw.versie ?? null,
      versieVerwacht: METRICS_VERSION,
      tekst: raw.versie == null
        ? `Dit metricsbestand heeft geen herkenbaar versienummer. Dit dashboard herkent versie ${METRICS_VERSION}.`
        : raw.versie > METRICS_VERSION
          ? `Dit metricsbestand is versie ${raw.versie} — nieuwer dan wat dit dashboard herkent (t/m versie ${METRICS_VERSION}). Werk het dashboard bij naar de laatste release, of vraag om een export in het oudere formaat.`
          : `Dit metricsbestand is versie ${raw.versie} — ouder dan wat dit dashboard verwacht (t/m versie ${METRICS_VERSION}). Vraag de Coördinator om een nieuwe export, of gebruik een oudere release van dit dashboard.`,
    };
  }

  const domeinenBlock = raw.domeinen || null;
  const weekreeksBlock = raw.weekreeks || null;
  const agentsBlock = raw.agents || null;
  const actiesBlock = raw.acties || null;

  const activiteit = buildActiviteitFromMetrics(weekreeksBlock, (raw.periode && raw.periode.weken) || 12);
  const z1 = buildZone1FromMetricsAandacht(raw.aandacht, domeinenBlock, today);
  const z2 = computeZone2({ bedrijfscontext: raw.bedrijfscontext ? mapBedrijfscontextBlock(raw.bedrijfscontext) : "niet-ondersteund-door-bundel" }, today);
  const z1MetContext = voegContextToeAanAandacht(z1, z2);
  const z3 = buildZone3FromMetrics(agentsBlock, schema);
  const z4 = buildZone4FromMetrics(raw);
  const z5 = buildZone5FromMetrics(raw.lessen);
  const adopt = buildAdoptFromMetrics(raw, activiteit, schema);
  const tijdwinst = buildTijdwinstFromMetrics(actiesBlock, minutenPerActie);
  const agentUsage = buildAgentUsageFromMetrics(agentsBlock, schema);
  const sporenTotaal = activiteit.buckets.reduce((s, b) => s + b.totaal, 0);
  const correctievrij = buildCorrectievrijFromMetrics(raw.correctievrij || null, today);
  // f25: zie de rijenroute — zelfde regel, zelfde drempel, op beide routes.
  const z1Compleet = voegRitmeToeAanAandacht(z1MetContext, adopt);

  const domeinenGevonden = domeinenBlock ? Object.keys(domeinenBlock).length : 0;

  return {
    ok: true,
    metrics: {
      versie: raw.versie,
      bron: "notion",
      // f29: relatie-aggregaten (v2) — al gesaneerd; de Data-tab tekent ze.
      relaties: Array.isArray(raw.relaties) ? raw.relaties : null,
      // f54: het werk zelf, voor wie het niet in de werkruimte heeft.
      werk: {
        voorJou: raw.voor_jou ? raw.voor_jou.items : null,
        ritmetaken: raw.ritmetaken ? raw.ritmetaken.items : null,
        gegenereerdOp: raw.gegenereerd_op || null,
      },
      z1: z1Compleet, z2, z3, z4, z5, activiteit, adopt, tijdwinst, agentUsage, sporenTotaal, correctievrij,
      periodWeeks: raw.periode ? raw.periode.weken : activiteit.weeks,
      periodDays: (raw.periode ? raw.periode.weken : activiteit.weeks) * 7,
      meta: {
        bronLabel: raw.bron_label || "Notion-export (metricsbestand)",
        gegenereerdOp: raw.gegenereerd_op ? parseDateField(raw.gegenereerd_op) : null,
        door: raw.door || null,
        periode: raw.periode || null,
        domeinenGevonden,
      },
      waarschuwingen: Array.isArray(raw.waarschuwingen) ? raw.waarschuwingen : [],
      rawActies: actiesBlock,
    },
  };
}

function mapBedrijfscontextBlock(b) {
  return {
    Bron: b.bron,
    Placeholders_open: b.placeholders_open || [],
    Projectkennis_kopie_laatst_bijgewerkt: b.projectkennis_kopie_laatst_bijgewerkt,
    staleAt: parseDateField(b.laatst_bijgewerkt),
  };
}

// ── Zone 1 uit een kant-en-klare aandachtlijst + het domeinen-blok ──────
// De Coördinator levert de inhoudelijke aandachtpunten al af (max. vijf,
// zie ontwerp); dit dashboard voegt uitsluitend de "verouderde domeinen"-
// regel toe, op dezelfde manier (STALE_DAYS) als bij de andere twee routes
// — dat is de enige aandacht-regel die het dashboard zelf mag toepassen
// zonder rijen te zien.
function buildZone1FromMetricsAandacht(aandachtRaw, domeinenBlock, today) {
  const items = (Array.isArray(aandachtRaw) ? aandachtRaw : []).map(it => ({
    type: it.type || "overig",
    ernst: it.ernst,
    label: it.label,
    link: it.link || null,
    rows: null,
  }));
  if (domeinenBlock) {
    const verouderd = Object.entries(domeinenBlock)
      .filter(([, d]) => isStale(d && d.laatst_bijgewerkt ? parseDateField(d.laatst_bijgewerkt) : null, today))
      .map(([k]) => k);
    if (verouderd.length) {
      items.push({ type: "verouderd", ernst: "grijs", label: `${verouderd.length} domein(en) met data ouder dan ${STALE_DAYS} dagen`, domeinen: verouderd, rows: null });
    }
  }
  const order = { rood: 0, grijs: 1, oranje: 2, groen: 3 };
  items.sort((a, b) => (order[a.ernst] ?? 9) - (order[b.ernst] ?? 9));
  return items;
}

// ── Zone 3 / gebruik-ranglijst uit het agents-blok ──────────────────────
function buildZone3FromMetrics(agentsBlock, schema) {
  const perModule = {};
  for (const agent of schema.agents) {
    const mod = agent.module;
    if (!perModule[mod]) perModule[mod] = [];
    const t = agentsBlock && agentsBlock.per_agent ? agentsBlock.per_agent[agent.slug] : null;
    perModule[mod].push({
      slug: agent.slug, displayName: agent.displayName, emoji: agent.emoji,
      geenSpoor: !t || !(t.aantal_totaal > 0),
      laatst: t && t.laatst ? parseDateField(t.laatst) : null,
      aantalPeriode: t ? (t.aantal_periode || 0) : 0,
      aantalTotaal: t ? (t.aantal_totaal || 0) : 0,
    });
  }
  const bronnenAanwezig = { metrics: !!agentsBlock };
  return { perModule, bronnenAanwezig, geenEnkeleBron: !agentsBlock };
}

function buildAgentUsageFromMetrics(agentsBlock, schema) {
  if (!agentsBlock) {
    return { status: "geen-bron", reden: "Dit metricsbestand bevat geen agents-blok — gebruik per agent is niet af te leiden. Bron ontbreekt." };
  }
  if (agentsBlock.veld_aanwezig === false) {
    return { status: "geen-veld", reden: "Het metricsbestand meldt dat het veld Agent niet gevuld voorkomt in de brondata. Gebruik per agent is daardoor niet af te leiden. Zodra dit veld gevuld is, verschijnt de ranglijst vanzelf." };
  }
  const perAgent = agentsBlock.per_agent || {};
  const ranking = schema.agents
    .map(a => {
      const t = perAgent[a.slug] || {};
      return { slug: a.slug, label: a.displayName, emoji: a.emoji, module: a.module, value: t.aantal_periode || 0, totaal: t.aantal_totaal || 0 };
    })
    .sort((a, b) => b.value - a.value || b.totaal - a.totaal);
  return { status: "ok", ranking };
}

// ── Zone 4 / opbrengst uit de losse blokken ─────────────────────────────
function buildZone4FromMetrics(raw) {
  const out = {};
  if (raw.acties) {
    out.acties = {
      totaal: raw.acties.totaal || 0,
      afgerond: raw.acties.afgerond || 0,
      opmerking: raw.acties.opmerking || "Aangeleverd als kant-en-klare telling door de Coördinator (Notion-route) — geen rijen ingelezen.",
    };
  }
  if (raw.sales_funnel) {
    out.salesFunnel = {
      perFase: raw.sales_funnel.per_fase || {},
      totaalVerwachteOmzet: raw.sales_funnel.verwachte_omzet_totaal || 0,
      opmerking: raw.sales_funnel.opmerking || "Aangeleverd als kant-en-klare telling door de Coördinator.",
    };
  }
  if (raw.content) {
    out.content = { gepubliceerd: raw.content.gepubliceerd || 0, geplandInPeriode: raw.content.gepland_in_periode || 0, totaal: raw.content.totaal || 0 };
  }
  if (raw.klantsucces) {
    out.klantsucces = { inOnboarding: raw.klantsucces.in_onboarding || 0, totaal: raw.klantsucces.totaal || 0 };
  }
  if (raw.backlog) {
    out.backlog = { besloten: raw.backlog.besloten || 0, done: raw.backlog.done || 0, totaal: raw.backlog.totaal || 0 };
  }
  return out;
}

// ── Zone 5 / leren uit het lessen-blok ──────────────────────────────────
function buildZone5FromMetrics(lessenBlock) {
  if (!lessenBlock) return { aanwezig: false };
  if (!lessenBlock.totaal) return { aanwezig: true, leeg: true };
  return {
    aanwezig: true, leeg: false,
    totaal: lessenBlock.totaal,
    perCategorie: lessenBlock.per_categorie || {},
    open: lessenBlock.open || 0,
    inPeriode: lessenBlock.in_periode || 0,
  };
}

// ── Weekreeks uit het weekreeks-blok ────────────────────────────────────
function buildActiviteitFromMetrics(weekreeksBlock, weeksFallback) {
  if (!weekreeksBlock || !Array.isArray(weekreeksBlock.buckets) || !weekreeksBlock.buckets.length) {
    return { buckets: [], aanwezigeBronnen: [], geenEnkeleBron: true, weeks: weeksFallback, periodStart: null };
  }
  const aanwezigeBronnen = Array.isArray(weekreeksBlock.bronnen) ? weekreeksBlock.bronnen : [];
  const buckets = weekreeksBlock.buckets.map((b, i) => {
    const waarden = b.waarden || {};
    const values = {
      interacties: waarden.interacties || 0,
      dagverslagen: waarden.dagverslagen || 0,
      lessen_inzichten: waarden.lessen_inzichten || 0,
      content_kalender: waarden.content_kalender || 0,
    };
    const totaal = typeof b.totaal === "number" ? b.totaal : Object.values(values).reduce((s, v) => s + v, 0);
    const weekStart = parseDateField(b.week_start);
    return {
      index: i, values, totaal, leeg: totaal === 0,
      weekStart,
      label: b.label || (weekStart ? weekStart.toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit" }) : "?"),
    };
  });
  return { buckets, aanwezigeBronnen, geenEnkeleBron: aanwezigeBronnen.length === 0, weeks: buckets.length, periodStart: buckets[0] ? buckets[0].weekStart : null };
}

// ── Adoptiescore uit domeinen/weekreeks/acties ──────────────────────────
// Ritme en breedte zijn hier client-side afgeleid (dezelfde formule als de
// andere twee routes, zie zones.js), omdat de bouwstenen ervoor
// (weekreeks, domeinen) toch al in het bestand staan. De breedte-noemer komt
// uit meetbareDomeinen(schema) (zones.js): bedrijfscontext staat wel in het
// schema en in het domeinen-blok van de Coördinator, maar heeft zone 2 als
// eigen meetlat — anders gaf deze route een andere score dan de rij-route
// op dezelfde data (b37 / AT-033). Opvolging kan alleen
// uit een expliciet aangeleverd acties.verstreken/klaar_verstreken komen —
// "verstreken deadline" is geen telling die uit de andere blokken is af te
// leiden zonder rijen te zien.
function buildAdoptFromMetrics(raw, activiteit, schema) {
  const weken = activiteit.weeks || (raw.periode && raw.periode.weken) || 12;

  let ritme;
  if (activiteit.geenEnkeleBron) {
    ritme = { berekenbaar: false, reden: "Geen weekreeks-blok (of een leeg blok) aanwezig in dit metricsbestand." };
  } else {
    const wekenMetSpoor = activiteit.buckets.filter(b => !b.leeg).length;
    ritme = {
      berekenbaar: true, waarde: (wekenMetSpoor / weken) * 100, wekenMetSpoor, weken,
      aanwezigeBronnen: activiteit.aanwezigeBronnen,
      ontbrekendeBronnen: RITME_BRONNEN.filter(b => !activiteit.aanwezigeBronnen.includes(b)),
    };
  }

  const domeinenSchema = meetbareDomeinen(schema);
  let breedte;
  if (!raw.domeinen) {
    breedte = { berekenbaar: false, reden: "Geen domeinen-blok aanwezig in dit metricsbestand." };
  } else {
    const metInhoud = domeinenSchema.filter(k => raw.domeinen[k] && (raw.domeinen[k].rijen || 0) > 0);
    breedte = { berekenbaar: true, waarde: (metInhoud.length / domeinenSchema.length) * 100, metInhoud: metInhoud.length, totaalDomeinen: domeinenSchema.length, domeinenLijst: metInhoud };
  }

  let opvolging;
  const acties = raw.acties;
  if (!acties || !acties.verstreken) {
    opvolging = { berekenbaar: false, reden: !acties ? "Geen acties-blok aanwezig in dit metricsbestand." : "Geen enkele actie met een verstreken deadline in dit metricsbestand — er is geen noemer om op te rekenen." };
  } else {
    opvolging = { berekenbaar: true, waarde: ((acties.klaar_verstreken || 0) / acties.verstreken) * 100, klaar: acties.klaar_verstreken || 0, verstreken: acties.verstreken };
  }

  const componenten = [
    { key: "ritme", label: "Ritme", ...ritme },
    { key: "breedte", label: "Breedte", ...breedte },
    { key: "opvolging", label: "Opvolging", ...opvolging },
  ];
  const berekenbaar = componenten.filter(c => c.berekenbaar);
  const afgerond = berekenbaar.map(c => Math.round(c.waarde));
  const adoptiescore = afgerond.length ? Math.round(afgerond.reduce((s, v) => s + v, 0) / afgerond.length) : null;
  return { componenten, adoptiescore, aantalBerekenbaar: berekenbaar.length, aantalComponenten: componenten.length, weken };
}

// ── Tijdwinst uit het acties-blok — blijft live herrekenbaar ───────────
// Geen rijen nodig: totaal/afgerond volstaan, dus de minuten-per-actie-
// instelling in de UI blijft ook voor de metrics-route direct aanpasbaar.
function buildTijdwinstFromMetrics(actiesBlock, minutenPerActie) {
  if (!actiesBlock) return { berekenbaar: false, afgerond: 0, totaal: 0, minutenPerActie, minuten: 0, uren: 0 };
  const afgerond = actiesBlock.afgerond || 0;
  const minuten = afgerond * minutenPerActie;
  return { berekenbaar: true, afgerond, totaal: actiesBlock.totaal || 0, minutenPerActie, minuten, uren: minuten / 60 };
}

// ── Correctievrij (i25) uit het correctievrij-blok ─────────────────────
// Het blok draagt de ruwe tellingen (venster + weken); percentage en gate
// worden hier NIET overgenomen maar met dezelfde helper als de rij-route
// uitgerekend (berekenCorrectievrij in zones.js) — één rekenregel, twee routes.
function buildCorrectievrijFromMetrics(block, today) {
  if (!block) {
    return { aanwezig: false, reden: "Dit metricsbestand bevat geen correctievrij-blok — de Coördinator levert dit vanaf registry 1.34.0 aan bij de dagstart." };
  }
  const weken = (Array.isArray(block.weken) ? block.weken : [])
    .map(w => ({ weekStart: parseDateField(w.week_start), autonoom: w.autonoom_afgerond || 0, gecorrigeerd: w.gecorrigeerd || 0 }))
    .filter(w => w.weekStart);
  return berekenCorrectievrij({
    vensterDagen: block.venster_dagen ?? undefined,
    drempel: block.drempel_pct ?? undefined,
    autonoom: block.autonoom_afgerond || 0,
    gecorrigeerd: block.gecorrigeerd || 0,
    heropend: block.heropend || 0,
    weken,
    opmerking: block.opmerking || null,
  }, today);
}

if (typeof module !== "undefined") {
  module.exports = {
    METRICS_VERSION,
    buildMetricsFromRowsBundle, parseNotionMetricsFile,
    buildZone1FromMetricsAandacht, buildZone3FromMetrics, buildAgentUsageFromMetrics,
    buildZone4FromMetrics, buildZone5FromMetrics, buildActiviteitFromMetrics,
    buildAdoptFromMetrics, buildTijdwinstFromMetrics, mapBedrijfscontextBlock,
    buildCorrectievrijFromMetrics,
  };
}


/* Rendering — vertaalt de pure zone-berekeningen (zones.js) naar DOM.
 * Bewust gescheiden van de berekening zelf, zodat de logica zonder browser
 * te testen is (zie test-scripts in scripts/). */

// b32: ook veilig in attribuutcontext (value="…") — textContent→innerHTML
// codeert geen aanhalingstekens, dus die doen we expliciet.
const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ESC_MAP[ch]);
}

/* ── i75: het werkstuk van een agent leesbaar maken ───────────────────
 *
 * Een veld als Toelichting draagt vaak het hele resultaat van een agent:
 * koppen, vette tussenkoppen, opsommingen, en soms een citaatblok met een
 * conceptbericht erin. Die regelovergangen staan gewoon in de werkruimte —
 * maar HTML vouwt elke \n tot een spatie, en dus kwam er vijfduizend tekens
 * als één ononderbroken blok op het scherm. Het bewijs stond in dat blok
 * zelf: "> > Beste Gerrit" kan alleen ontstaan uit twee citaatregels met
 * een lege regel ertussen.
 *
 * Dit is met opzet géén markdown-parser. Álles gaat eerst door esc(); pas
 * daarna herkennen we een kleine, vaste set blokvormen. Opmaak die we niet
 * kennen blijft leesbare tekst staan — er komt nooit HTML uit de bron mee.
 * De tekst is geschreven door een LLM-agent, dus dat is geen detail. */
const PROSA_KOP       = /^#{1,6}\s+(.*)$/;
const PROSA_VETTE_KOP = /^\*\*([^*]+)\*\*:?\s*$/;
const PROSA_STREEP    = /^([-*_])\s*\1\s*\1[\s\-*_]*$/;   // --- of *** of ___
const PROSA_BULLET    = /^[-*•]\s+(.*)$/;
const PROSA_NUMMER    = /^(\d{1,3})[.)]\s+(.*)$/;
const PROSA_CITAAT    = /^>\s?(.*)$/;

function prosaInline(tekst) {
  return esc(tekst)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

/* `regeleinden`: een werkstuk als een conceptmail (f47, het item-blad) houdt
 * zijn enkele regeleinden — "Hartelijke groet," en de naam eronder horen op
 * twee regels. Elders blijft een enkel regeleinde een spatie, omdat agents
 * lopende tekst soms hard afbreken. */
function langeTekstHtml(tekst, opties) {
  const regels = String(tekst ?? "").replace(/\r\n?/g, "\n").split("\n");
  let html = "", lijst = null, citaat = [], alinea = [];
  const lijm = opties && opties.regeleinden ? "<br>" : " ";

  const sluitAlinea = () => { if (alinea.length) html += `<p>${alinea.join(lijm)}</p>`; alinea = []; };
  const sluitLijst = () => {
    if (!lijst) return;
    const start = lijst.tag === "ol" && lijst.start > 1 ? ` start="${lijst.start}"` : "";
    html += `<${lijst.tag}${start}>${lijst.items.map(i => `<li>${i}</li>`).join("")}</${lijst.tag}>`;
    lijst = null;
  };
  const sluitCitaat = () => {
    if (citaat.length) html += `<blockquote>${citaat.map(c => `<p>${c}</p>`).join("")}</blockquote>`;
    citaat = [];
  };
  const sluitAlles = () => { sluitAlinea(); sluitLijst(); sluitCitaat(); };
  const inLijst = (tag, tekst, start) => {
    sluitAlinea();
    if (!lijst || lijst.tag !== tag) { sluitLijst(); lijst = { tag, items: [], start }; }
    lijst.items.push(prosaInline(tekst));
  };

  for (const ruw of regels) {
    const r = ruw.trim();
    if (!r) { sluitAlles(); continue; }

    // Een citaatblok loopt door over lege ">"-regels heen; dat is precies de
    // vorm waarin een agent een conceptmail in de Toelichting zet.
    const citaatM = r.match(PROSA_CITAAT);
    if (citaatM) {
      sluitAlinea(); sluitLijst();
      if (citaatM[1].trim()) citaat.push(prosaInline(citaatM[1]));
      continue;
    }
    sluitCitaat();

    if (PROSA_STREEP.test(r)) { sluitAlles(); html += "<hr>"; continue; }

    const kopM = r.match(PROSA_KOP) || r.match(PROSA_VETTE_KOP);
    if (kopM) { sluitAlles(); html += `<p class="prosa-kop">${prosaInline(kopM[1])}</p>`; continue; }

    const bulM = r.match(PROSA_BULLET);
    if (bulM) { inLijst("ul", bulM[1]); continue; }

    const numM = r.match(PROSA_NUMMER);
    if (numM) { inLijst("ol", numM[2], Number(numM[1])); continue; }

    sluitLijst();
    alinea.push(prosaInline(r));
  }
  sluitAlles();
  return html;
}

function fmtDate(dt) {
  if (!dt || isNaN(dt.getTime())) return "onbekend";
  return dt.toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function relAge(dt, today) {
  if (!dt || isNaN(dt.getTime())) return "";
  const days = daysBetween(today, dt);
  if (days === 0) return "vandaag";
  if (days > 0) return `${days} dag${days === 1 ? "" : "en"} geleden`;
  return `over ${Math.abs(days)} dag${Math.abs(days) === 1 ? "" : "en"}`;
}

const SIGNAAL_ICOON = { rood: "🚨", oranje: "⚠️", groen: "✅", grijs: "❔" };
const SIGNAAL_LABEL = { rood: "Aandacht nu", oranje: "Binnenkort aandacht", groen: "Op koers", grijs: "Onbekend / verouderd" };

// b32: class-attribuut alleen uit de vaste set — nooit een vrije waarde.
function signaalKlasse(signaal) {
  return Object.prototype.hasOwnProperty.call(SIGNAAL_ICOON, signaal) ? signaal : "grijs";
}

function badgeHtml(signaal) {
  const k = signaalKlasse(signaal);
  return `<span class="badge ${k}">${SIGNAAL_ICOON[k]} ${SIGNAAL_LABEL[k]}</span>`;
}

function stempelHtml(staleAt, today) {
  if (!staleAt) return `<div class="stempel">Geen tijdstempel bekend</div>`;
  const stale = isStale(staleAt, today);
  return `<div class="stempel${stale ? " timestamp stale" : " timestamp"}">Stand van ${fmtDate(staleAt)} (${relAge(staleAt, today)})${stale ? " — verouderd" : ""}</div>`;
}

/* f23-klikproef (1 sep): een alert hoort dóór te klikken naar de rijen waar
 * hij over gaat. Elk itemtype wijst naar zijn domein in de Data-tab; items
 * zonder rijenweergave (bedrijfscontext, ritme) blijven tekst, en een
 * metrics-item met een eigen https-link volgt die link. */
const AANDACHT_DOEL = { qc: "acties", "acties-deadline": "acties", klantsucces: "klantsucces", "deals-stil": "sales_funnel", "team-oogst": "acties" };

function aandachtDoelHref(it) {
  if (it.link) return it.link;
  if (AANDACHT_DOEL[it.type]) return "#/data/" + AANDACHT_DOEL[it.type];
  if (it.type === "verouderd") return "#/data";
  return null;
}

/* Klikproef-ronde 2 (1 sep): de doorklik hoort de gefilterde set te tonen,
 * niet de hele lijst. De rijen van het item reizen als entry-ids mee op de
 * link; app.js zet daarmee de voorselectie in de Data-tab. */
function aandachtFilterAttrs(it) {
  const doel = AANDACHT_DOEL[it.type];
  if (!doel || !it.rows || !it.rows.length) return "";
  const ids = it.rows.map(r => r && r.__entryId).filter(Boolean);
  if (!ids.length) return "";
  return ` data-filter-domein="${esc(doel)}" data-filter-label="${esc(it.label)}" data-filter-ids="${esc(ids.join(","))}"`;
}

function aandachtWrap(it, binnen) {
  const href = aandachtDoelHref(it);
  if (!href) return binnen;
  const extern = /^https:/.test(href);
  return `<a class="aandacht-link" href="${esc(href)}"${extern ? ` target="_blank" rel="noopener"` : ""}${aandachtFilterAttrs(it)}>${binnen}</a>`;
}

  const lis = items.map(it => {
    // De namen zijn zelf links naar hun rij (zoekterm = naam, zelfde

    // niet het hele item één link maar alleen het label.
    const doel = AANDACHT_DOEL[it.type];
    let detail = "";
    if (it.rows && it.rows.length) {
      const names = it.rows.slice(0, 4)

}

/* Inline SVG-grafieken, met de hand opgebouwd uit data in JS — geen
 * Chart.js, geen D3, geen canvas-library, geen extern lettertype. Elke
 * functie geeft een HTML-string terug (SVG + eventueel een HTML-legenda)
 * op basis van pure data + opties, zodat dit ook zonder DOM te testen is.
 *
 * Kleuren volgen het ontwerp: teal (je team) in twee sterktes plus twee
 * neutrale tinten voor series, NOOIT statuskleuren (rood/oranje/groen) — dit
 * zijn hoeveelheden, geen signalen. Oranje is in v2 bovendien "jij" (i86).
 * Alles loopt via de CSS-tokens, zodat licht en donker vanzelf kloppen. Dat
 * kan alleen via het style-attribuut: een SVG-presentatieattribuut als
 * fill="var(--team)" lost geen CSS-variabele op. */

const CHART_SERIE_KLEUREN = ["var(--team)", "color-mix(in srgb, var(--team) 50%, var(--surface))", "var(--muted)", "var(--line-2)"];

function svgEsc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/**
 * Gestapelde staafgrafiek. `weeks` = uitvoer van computeActiviteitPerWeek()
 * (buckets), `seriesKeys`/`seriesLabels` bepalen volgorde en kleur.
 * Weken zonder activiteit (leeg=true) worden getekend als een gedimd,
 * gestippeld streepje met het label "geen" erboven — het gat IS het
 * signaal, dus nooit gewoon leeg laten of weglaten.
 */
function buildStackedBarChart({ buckets, seriesKeys, seriesLabels, width = 760, height = 230 }) {
  const padLeft = 30, padBottom = 30, padTop = 14, padRight = 6;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const n = buckets.length;
  const gap = Math.max(2, Math.min(8, plotW / n * 0.18));
  const barW = Math.max(4, (plotW - gap * (n - 1)) / n);
  const maxTotal = Math.max(1, ...buckets.map(b => b.totaal));

  let bars = "";
  let axisLabels = "";
  buckets.forEach((b, i) => {
    const x = padLeft + i * (barW + gap);
    if (b.leeg) {
      const y = padTop + plotH - 8;
      bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="8" fill="none" style="stroke:var(--line-2)" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7" rx="2"><title>Week van ${svgEsc(b.label)}: geen activiteit</title></rect>`;
      axisLabels += `<text x="${(x + barW / 2).toFixed(1)}" y="${padTop + plotH - 14}" text-anchor="middle" font-size="8.5" style="fill:var(--muted)" font-style="italic">geen</text>`;
    } else {
      let yCursor = padTop + plotH;
      seriesKeys.forEach((k, si) => {
        const v = b.values[k] || 0;
        if (!v) return;
        const h = (v / maxTotal) * plotH;
        yCursor -= h;
        bars += `<rect x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${CHART_SERIE_KLEUREN[si]}"><title>Week van ${svgEsc(b.label)} — ${svgEsc(seriesLabels[si])}: ${v}</title></rect>`;
      });
    }
    axisLabels += `<text x="${(x + barW / 2).toFixed(1)}" y="${height - padBottom + 14}" text-anchor="middle" font-size="8.5" style="fill:var(--muted)">${svgEsc(b.label)}</text>`;
  });

  const axis = `<line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop + plotH}" style="stroke:var(--line-2)" stroke-width="1"></line>
    <line x1="${padLeft}" y1="${(padTop + plotH).toFixed(1)}" x2="${width - padRight}" y2="${(padTop + plotH).toFixed(1)}" style="stroke:var(--line-2)" stroke-width="1"></line>
    <text x="${padLeft - 5}" y="${padTop + 4}" text-anchor="end" font-size="9" style="fill:var(--muted)">${maxTotal}</text>
    <text x="${padLeft - 5}" y="${(padTop + plotH).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--muted)">0</text>`;

  const legend = seriesKeys.map((k, i) =>
    `<span class="chart-legend-item"><span class="dot" style="background:${CHART_SERIE_KLEUREN[i]}"></span>${svgEsc(seriesLabels[i])}</span>`
  ).join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Activiteit per week, gestapeld per bron">${axis}${bars}${axisLabels}</svg>
    <div class="chart-legend">${legend}</div>`;
}

/** Gerangschikte horizontale staafgrafiek. `items` = [{label, emoji, value, totaal}],
 * al gesorteerd (hoogste eerst). Gebruikt mint als hoeveelheids-kleur (geen
 * statuskleur — dit is een ranking, geen oordeel over goed/fout). */
function buildHorizontalBarChart({ items, width = 680, barHeight = 20, gap = 7 }) {
  const maxVal = Math.max(1, ...items.map(i => i.value));
  const labelW = 200;
  const valueColW = 34;
  const plotW = width - labelW - valueColW;
  const height = items.length * (barHeight + gap);
  let rowsHtml = "";
  items.forEach((it, i) => {
    const y = i * (barHeight + gap);
    const w = it.value > 0 ? Math.max(3, (it.value / maxVal) * plotW) : 0;
    const titel = it.totaal !== undefined && it.totaal !== it.value
      ? `${svgEsc(it.label)}: ${it.value} in de gekozen periode (${it.totaal} totaal in de bundel)`
      : `${svgEsc(it.label)}: ${it.value}`;
    rowsHtml += `<text x="${labelW - 8}" y="${(y + barHeight / 2 + 4).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--ink)">${svgEsc(it.emoji || "")} ${svgEsc(it.label)}</text>`;
    if (w > 0) {
      rowsHtml += `<rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${barHeight}" rx="4" style="fill:var(--team)"><title>${titel}</title></rect>`;
    } else {
      rowsHtml += `<rect x="${labelW}" y="${y + barHeight / 2 - 1}" width="10" height="2" style="fill:var(--line-2)" opacity="0.6"><title>${titel}</title></rect>`;
    }
    rowsHtml += `<text x="${labelW + w + 6}" y="${(y + barHeight / 2 + 4).toFixed(1)}" font-size="10.5" style="fill:var(--muted)">${it.value}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Gebruik per agent, gerangschikt">${rowsHtml}</svg>`;
}

if (typeof module !== "undefined") {
  module.exports = { buildStackedBarChart, buildHorizontalBarChart, CHART_SERIE_KLEUREN, svgEsc };
}


/* f22 — Teamfeed: wat het agent-team doet, nieuwste boven.
 *
 * Bron is het domein `teamfeed` in de werkruimte van de klant (één entry per
 * post_activity-aanroep), live opgehaald via de daglink door
 * werkruimte-loader.js (bundle.teamfeed). Dit bestand doet alleen
 * normaliseren + renderen; het schrijft nooit iets. Berichten zijn tekst
 * van LLM-agents: alles gaat door esc(), en van de feed-markdown worden
 * uitsluitend **vet** en `- `-regels omgezet. */

const FEED_SOORTEN = {
  rondestart:      { icoon: "🏁", label: "werkronde gestart" },
  overdracht:      { icoon: "🤝", label: "overdracht" },
  // f25: mensentaal in plaats van QC-jargon — de kleurstip (styles.css)
  // draagt het onderscheid, het label hoeft het niet te herhalen.
  qc_goedgekeurd:  { icoon: "🛡️", label: "klaar" },
  qc_review_nodig: { icoon: "🛡️", label: "wacht op jou" },
  voorstel:        { icoon: "💡", label: "voorstel" },
  afgerond:        { icoon: "✅", label: "afgerond" },
  update:          { icoon: "💬", label: "update" },
};
const FEED_OPEN_LUS_MS = 90 * 60 * 1000;
const FEED_INVOUW_TEKENS = 450;
const FEED_STROOK_INVOUW_TEKENS = 150;  // f25: strookberichten passen in twee regels
const FEED_STROOK_MAX = 3;   // f25: de Vandaag-tab toont drie, de rest op de Team-tab
const FEED_FILTER_KEY = "agentic-team-dashboard:feed-filter";

function feedDagKey(d) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* Entries uit /dashboard/entries?domein=teamfeed → platte feeditems, nieuwste
 * eerst. Onbekende soort → update; onbekende agent → 🤖 + de ruwe waarde. */
function normaliseerFeed(entries, schema, agentLookup) {
  const items = [];
  for (const e of (entries || [])) {
    if (!e || typeof e !== "object" || !e.data || typeof e.data !== "object") continue;
    const tijd = new Date(e.aangemaakt || e.bijgewerkt || NaN);
    if (isNaN(tijd.getTime())) continue;
    const soortRaw = String(getField(e.data, "Soort") || "").toLowerCase();
    const soort = FEED_SOORTEN[soortRaw] ? soortRaw : "update";
    const agentRaw = String(getField(e.data, "Agent") || "");
    const slug = matchAgentValue(agentRaw, agentLookup);
    const agent = slug ? schema.agents.find(a => a.slug === slug) : null;
    const bericht = String(getField(e.data, "Bericht") || "").slice(0, 1200);
    const actieRaw = String(getField(e.data, "Actie") || "").slice(0, 80);
    const actie = actieRaw && actieRaw !== FEED_SOORTEN[soort].label ? actieRaw : "";
    items.push({
      id: String(e.entryId || ""),
      tijd,
      dag: feedDagKey(tijd),
      agentSlug: slug,
      agentNaam: agent ? agent.displayName : (agentRaw || "onbekende agent"),
      agentEmoji: agent ? agent.emoji : "🤖",
      soort,
      actie,
      bericht,
      link: saneerHttpsUrl(getField(e.data, "Link")),
      openLus: false,
    });
  }
  items.sort((a, b) => b.tijd.getTime() - a.tijd.getTime());
  return items;
}

/* Vangnet open lussen — puur presentatie: een rondestart van dezelfde agent
 * zonder latere afronding, ouder dan 90 minuten, tonen we als "afgerond —
 * geen samenvatting". Er wordt niets geschreven. */
function markeerOpenLussen(items, now) {
  const nu = now ? now.getTime() : Date.now();
  for (const it of items) {
    if (it.soort !== "rondestart") continue;
    const t0 = it.tijd.getTime();
    // Alleen een afronding van de rónde sluit de lus — een "Dagstart
    // afgerond" van dezelfde Coördinator later die ochtend niet.
    const afgesloten = items.some(o => o.soort === "afgerond" && o.agentSlug === it.agentSlug
      && (!o.actie || /werkronde/i.test(o.actie))
      && o.tijd.getTime() > t0 && o.tijd.getTime() - t0 < 4 * 60 * 60 * 1000);
    it.openLus = !afgesloten && (nu - t0) > FEED_OPEN_LUS_MS;
  }
  return items;
}

function feedInline(tekst) {
  return esc(tekst).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

/* Feed-markdown (conventie uit post_activity): kernzin, **vette** kopregels,
 * `- `-items. Meer niet. Lange berichten worden ingevouwen. */
function feedTekstHtml(bericht, invouwVanaf = FEED_INVOUW_TEKENS, kortTot = 220) {
  const regels = String(bericht || "").split(/\r?\n/);
  let html = "", lijst = [];
  const flush = () => { if (lijst.length) { html += `<ul>${lijst.map(l => `<li>${feedInline(l)}</li>`).join("")}</ul>`; lijst = []; } };
  for (const r of regels) {
    if (/^\s*-\s+/.test(r)) { lijst.push(r.replace(/^\s*-\s+/, "")); continue; }
    flush();
    const t = r.trim();
    if (!t) continue;
    if (/^\*\*[^*]+\*\*:?$/.test(t)) html += `<p class="feed-kop">${esc(t.replace(/\*\*/g, ""))}</p>`;
    else html += `<p>${feedInline(t)}</p>`;
  }
  flush();
  if (bericht && bericht.length > invouwVanaf) {
    const eerste = regels.find(r => r.trim() && !/^\s*-\s+/.test(r)) || "";
    const kort = feedInline(eerste.slice(0, kortTot).replace(/\*\*/g, "")) + "…";
    return `<p>${kort}</p><details><summary>meer</summary>${html}</details>`;
  }
  return html || `<p class="footnote">(leeg bericht)</p>`;
}

function feedTijd(d) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function feedDagLabel(key, today) {
  const d = new Date(key + "T12:00:00");
  const t = new Date(feedDagKey(today) + "T12:00:00");
  const diff = Math.round((t.getTime() - d.getTime()) / 864e5);
  const rel = diff === 0 ? "Vandaag" : diff === 1 ? "Gisteren" : `${diff} dagen geleden`;
  const dagen = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  const mnd = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
  return { rel, dat: `${dagen[d.getDay()]} ${d.getDate()} ${mnd[d.getMonth()]}` };
}

function feedRijHtml(it, kort) {
  const so = FEED_SOORTEN[it.soort];
  const agentHtml = it.agentSlug
    ? `<a class="agent" href="#/detail/agent/${esc(it.agentSlug)}">${it.agentEmoji} ${esc(it.agentNaam)}</a>`
    : `<span class="agent">${it.agentEmoji} ${esc(it.agentNaam)}</span>`;
  const actieHtml = it.actie
    ? `<span class="sep">·</span><span class="actie">${esc(it.actie)}</span><span class="label">${esc(so.label)}</span>`
    : `<span class="sep">·</span><span class="actie">${esc(so.label)}</span>`;
  // f25: op de Vandaag-strook maximaal twee regels, de rest achter "meer";
  // op de Team-tab het bestaande, ruimere invouwpunt.
  const bericht = it.openLus ? "<p>afgerond — geen samenvatting</p>"
    : (kort ? feedTekstHtml(it.bericht, FEED_STROOK_INVOUW_TEKENS, FEED_STROOK_INVOUW_TEKENS) : feedTekstHtml(it.bericht));
  const icoon = it.openLus ? "⏱" : so.icoon;
  const title = it.openLus ? ` title="Gestart om ${feedTijd(it.tijd)}, geen afronding gemeld"` : "";
  const link = it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">🔗 bron</a>` : "";
  return `<li class="feed-rij${it.openLus ? " open-lus" : ""}" data-soort="${it.soort}"${title}>
    <span class="icoon" aria-hidden="true">${icoon}</span>
    <span class="tijd">${feedTijd(it.tijd)}</span>
    <div><div class="kop">${agentHtml}${actieHtml}</div><div class="bericht">${bericht}</div></div>
    <span class="link">${link}</span></li>`;
}

/* Wat de feed kan tonen hangt af van de route: alleen een daglink levert
 * hem. Geeft null als er items zijn, anders de degradatie-html. */
function feedDegradatieHtml(ctx) {
  const bundle = ctx.bundle || {};
  if (bundle.source !== "werkruimte") {
    return `<div class="grijs-blok"><div class="grijs-tekst">De teamfeed is alleen beschikbaar via de <strong>daglink van je Coördinator</strong> — zonder daglink is er geen live activiteit.</div></div>`;
  }
  if (!bundle.teamfeed) {
    return `<div class="grijs-blok"><div class="grijs-tekst">Je werkruimte kent de teamfeed nog niet. Vraag je Coördinator om de <strong>werkruimte-update</strong>; daarna verschijnt hier wat het team doet.</div></div>`;
  }
  return null;
}

function feedItemsUit(ctx) {
  const bundle = ctx.bundle || {};
  if (!bundle.teamfeed || !Array.isArray(bundle.teamfeed.entries)) return [];
  return markeerOpenLussen(normaliseerFeed(bundle.teamfeed.entries, ctx.schema, ctx.agentLookup), ctx.today);
}

// ── Homepage-strook ───────────────────────────────────────────────────
function renderFeedPanel(el, ctx) {
  const kopEl = el.parentElement ? el.parentElement.querySelector("[data-feed-kop]") : null;
  const degradatie = feedDegradatieHtml(ctx);
  if (degradatie) { el.innerHTML = degradatie; if (kopEl) kopEl.textContent = "Vandaag in het team"; return; }
  const items = feedItemsUit(ctx);
  if (!items.length) {
    if (kopEl) kopEl.textContent = "Vandaag in het team";
    el.innerHTML = `<p class="aandacht-leeg">Nog geen teamactiviteit.</p><p class="footnote">De feed vult zich zodra je werkronde of dagstart draait.</p>`;
    return;
  }
  const vandaag = feedDagKey(ctx.today);
  if (kopEl) kopEl.textContent = items[0].dag === vandaag ? "Vandaag in het team" : "Laatste activiteit in het team";
  el.innerHTML = `<ul class="feed feed-strook">${items.slice(0, FEED_STROOK_MAX).map(it => feedRijHtml(it, true)).join("")}</ul>
    <a class="detail-link" href="#/team">Alle ${items.length} berichten →</a>`;
}

// ── Detail-tab ────────────────────────────────────────────────────────
function leesFeedFilter() {
  try { return sessionStorage.getItem(FEED_FILTER_KEY) || "alle"; } catch (e) { return "alle"; }
}
function bewaarFeedFilter(v) {
  try { sessionStorage.setItem(FEED_FILTER_KEY, v); } catch (e) { /* privé-venster: geen state */ }
}

function renderDetailFeed(el, ctx) {
  const degradatie = feedDegradatieHtml(ctx);
  if (degradatie) { el.innerHTML = degradatie; return; }
  const items = feedItemsUit(ctx);
  let filter = leesFeedFilter();
  const telling = {};
  for (const it of items) { const k = it.agentSlug || "?"; telling[k] = (telling[k] || 0) + 1; }
  if (filter !== "alle" && !telling[filter]) filter = "alle";

  function pillen() {
    const slugs = Object.keys(telling).sort((a, b) => telling[b] - telling[a]);
    const pil = (key, tekst, n) => `<button type="button" class="feed-pil${filter === key ? " actief" : ""}" data-feed-filter="${esc(key)}" aria-pressed="${filter === key}">${tekst}<span class="n">${n}</span></button>`;
    return `<span class="lbl">Agent:</span>` + pil("alle", "Alle", items.length) + slugs.map(s => {
      const it = items.find(i => (i.agentSlug || "?") === s);
      return pil(s, `${it.agentEmoji} ${esc(it.agentNaam)}`, telling[s]);
    }).join("");
  }
  function lijst() {
    const zicht = items.filter(it => filter === "alle" || (it.agentSlug || "?") === filter);
    if (!items.length) return `<p class="aandacht-leeg">Nog geen teamactiviteit.</p><p class="footnote">De feed vult zich zodra je werkronde of dagstart draait.</p>`;
    if (!zicht.length) return `<p class="footnote">Geen berichten van deze agent in de laatste 30 dagen.</p>`;
    const perDag = {};
    for (const it of zicht) perDag[it.dag] = (perDag[it.dag] || 0) + 1;
    let html = "", vorige = null;
    for (const it of zicht) {
      if (it.dag !== vorige) {
        if (vorige) html += "</ul>";
        const l = feedDagLabel(it.dag, ctx.today);
        html += `<div class="feed-dag"><h3>${l.rel}</h3><span class="rel">· ${l.dat}</span><span class="lijn"></span><span class="n">${perDag[it.dag]}</span></div><ul class="feed">`;
        vorige = it.dag;
      }
      html += feedRijHtml(it);
    }
    return html + (vorige ? "</ul>" : "");
  }

  el.innerHTML = `
    <p class="footnote" style="margin-top:0">Wat je agent-team doet, nieuwste boven — laatste 30 dagen, ${items.length} berichten. Signalering, geen archief: het resultaat zelf staat bij de actie.</p>
    <div class="feed-filter" data-feed-pillen>${pillen()}</div>
    <div data-feed-lijst>${lijst()}</div>
    <div class="grijs-blok" style="margin-top:1.2rem"><div class="grijs-tekst">ℹ️ ${esc(PRIVACY_FEED)} Een <strong>werkronde gestart</strong> zonder afronding binnen 90 minuten tonen we als "afgerond — geen samenvatting".</div></div>`;

  el.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-feed-filter]");
    if (!b) return;
    filter = b.getAttribute("data-feed-filter");
    bewaarFeedFilter(filter);
    el.querySelector("[data-feed-pillen]").innerHTML = pillen();
    el.querySelector("[data-feed-lijst]").innerHTML = lijst();
  });
}

if (typeof module !== "undefined") {
  module.exports = { normaliseerFeed, markeerOpenLussen, feedTekstHtml, renderFeedPanel, renderDetailFeed, FEED_SOORTEN };
}


/* Homepage: de vier tabs (Vandaag · Team · Data · Prestaties), hun tegels en
 * panelen, plus de doorklik naar het detail (de volledige, uitgeschreven
 * zone-inhoud). Rendering only; de berekeningen zelf staan in zones.js
 * (puur, geen DOM) zodat ze zonder browser te testen zijn.

 * f25 — de indeling volgt één vraag per zone: Vandaag = "wat moet ik nu

 * Prestaties = "hoe staat mijn team ervoor?". De adoptiescore heet naar de

/* i71: de `uitleg` beantwoordt "wat vind ik waar?" vóór je klikt. Dat was een

 * of in data?"). De panelen op de tabs zelf zeggen het al; wat ontbrak was

const TABS = [

/* f48: vier tabs, nooit een vijfde. Prestaties is een deel van Team

const TAB_ROUTES = TABS.map(t => t.key).concat(Object.keys(TAB_DEEL_VAN));

const DETAIL_VOLGORDE = [
  { key: "feed", titel: "Teamfeed", emoji: "📣" },
  { key: "aandacht", titel: "Vraagt je aandacht", emoji: "🎯" },

// Onder welke tab hoort een detailpagina? Zo blijft de tabbar staan (en de

function nlGetal(n, decimals = 0) {
  return Number(n).toLocaleString("nl-NL", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

// ── Tabbar ────────────────────────────────────────────────────────────
// Gewone links: toetsenbordnavigatie en "open in nieuw tabblad" gratis, en
// de hash-router doet de rest. Op mobiel plakt deze balk onderaan (styles.css).
/* Kan de Data-tab iets tonen? Een kant-en-klaar metricsbestand draagt geen
 * rijen: dan bleef er een tab over die alleen uitlegde waarom hij leeg was.
 * Uitzondering: de relatiekaarten (f29) worden wél uit zo'n bestand
 * afgeleid — draagt het die, dan is er inhoud en blijft de tab staan. */
function dataTabBeschikbaar(ctx) {
  if (!ctx || !ctx.bundle) return false;
  // Zijn er domeinen opgehaald, dan valt er iets te tonen — ook op de
  // metricsroute, want sinds f33 haalt de loader daar óók de rijen op.
  if (Object.keys(ctx.bundle.domains || {}).length > 0) return true;
  return Array.isArray(ctx.relaties) && ctx.relaties.length > 0;
}

function zichtbareTabs(ctx) {
  return TABS.filter(t => (t.key !== "data" || dataTabBeschikbaar(ctx))
    && (t.key !== "acties" || (typeof actiesTabBeschikbaar === "function" && actiesTabBeschikbaar(ctx))));
}

function renderTabbar(el, activeTab, ctx) {
  // De korte kop (zichtbaar op mobiel en bij scroll) noemt waar je bent —
  // "Agentic Team · vandaag" leest raar boven de Prestaties-tab.
  activeTab = TAB_DEEL_VAN[activeTab] || activeTab;
  const kort = document.querySelector(".kop-kort");
  const actief = TABS.find(t => t.key === activeTab);
  if (kort) kort.textContent = `Agentic Team · ${activeTab === "hulp" ? "hulp" : actief ? actief.titel.toLowerCase() : "vandaag"}`;
  // f46: de badge telt met dezelfde functie als de werkbak zelf.
  const aantal = typeof voorJouAantal === "function" && ctx ? voorJouAantal(ctx) : null;
  el.innerHTML = zichtbareTabs(ctx).map(t => {
    const badge = t.key === "vandaag" && aantal ? `<span class="tab-badge" aria-label="${aantal} voor jou">${aantal}</span>` : "";
    return `<a href="${t.route}" class="tab${t.key === activeTab ? " actief" : ""}"${t.key === activeTab ? ' aria-current="page"' : ""} title="${esc(t.uitleg)}">
      <span class="tab-emoji" aria-hidden="true">${t.emoji}</span><span class="tab-titel">${esc(t.titel)}</span>${badge}
    </a>`;
  }).join("");
}

// ── Vandaag · statusregel ─────────────────────────────────────────────
// Antwoordt op "draaide mijn team eigenlijk?" vóór welk cijfer dan ook.
// Leest alleen wat er al is: de nieuwste teamfeed-post, anders de nieuwste
// tijdstempel van de opgehaalde domeinen, anders het moment waarop het
// metricsbestand is gemaakt. Nooit een tijd verzinnen.
function laatsteActiviteit(ctx) {
  let nieuwste = null;
  const bump = (d) => { if (d && !isNaN(d.getTime()) && (!nieuwste || d > nieuwste)) nieuwste = d; };
  const feed = ctx.bundle && ctx.bundle.teamfeed;
  if (feed && Array.isArray(feed.entries)) {
    for (const e of feed.entries) bump(new Date(e && (e.aangemaakt || e.bijgewerkt)));
  }
  const domains = (ctx.bundle && ctx.bundle.domains) || {};
  for (const d of Object.values(domains)) bump(d && d.staleAt);
  if (ctx.metricsMeta) bump(ctx.metricsMeta.gegenereerdOp);
  return nieuwste;
}

function renderStatusregel(el, ctx) {
  const dt = laatsteActiviteit(ctx);
  if (!dt) { el.textContent = "Nog geen activiteit gevonden in deze bundel."; return; }
  const dagen = daysBetween(ctx.today, dt);
  const tijd = `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
  // f52: een wijziging van jezelf zet de stempel ook op vandaag. Zijn er vaste
  // taken, dan zeggen we "je team werkte" alleen op een spoor van een
  // werkmoment — anders stond hier "draaide vandaag" boven "je team staat stil".
  if (typeof werkmomentSporen === "function" && rows(ctx.bundle, "ritmetaken")) {
    const sporen = werkmomentSporen(ctx);
    const recent = sporen.length ? new Date(Math.max(...sporen)) : null;
    el.textContent = recent ? `Je team werkte laatst ${vtWanneer(recent, ctx.today)}.`
      : `Laatst bijgewerkt ${dagen === 0 ? tijd : fmtDate(dt)}.`;
    return;
  }
  el.textContent = dagen === 0
    ? `Je team draaide vandaag — laatst bijgewerkt ${tijd}.`
    : `Laatste activiteit: ${fmtDate(dt)} (${relAge(dt, ctx.today)}).`;
}

// ── Kanttekeningen bij de cijfers ─────────────────────────────────────
// Stond hier eerder als geel kader met de kop "Niet alles kon gelezen
// worden", altijd open, op alle vier de tabs — het eerste wat een klant zag
// was dus dat er iets stuk leek. De informatie blijft volledig staan, maar
// dichtgeklapt achter één regel, en dit blok deelt niet meer de alarmkleur
// met echte fouten.
//
// De volgorde is niet willekeurig: waarschuwingen over de bundel zelf
// (verouderd, onleesbaar, onbekend domein) vragen om actie en staan boven de
// veldwaarschuwingen, die vooral beheerdersinformatie zijn.
function renderWaarschuwingen(el, ctx) {
  const bundel = (ctx && ctx.bundelWaarschuwingen) || [];
  const veld = (ctx && ctx.veldWaarschuwingen) || [];
  const alles = bundel.concat(veld);
  if (!alles.length) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }
  el.style.display = "";
  const aantal = alles.length === 1 ? "1 kanttekening" : `${alles.length} kanttekeningen`;
  // Alleen als er iets over de bundel zelf mis is, verdient de samenvatting
  // een "let op" — anders leest elke ontbrekende veldnaam als een storing.
  const kop = bundel.length ? `Let op: ${aantal} bij deze cijfers` : `${aantal} bij deze cijfers`;
  el.innerHTML = `<details class="kanttekeningen"${bundel.length ? ' data-let-op="1"' : ""}>
    <summary>${esc(kop)}</summary>
    <ul>${alles.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
  </details>`;
}

// ── Vandaag · privacybelofte ──────────────────────────────────────────
// De één-regelversie is de samenvatting, de uitklap is de juridische tekst
// (toets 26-08-2026). De uitklap moet hier staan — in de UI, op het moment
// dat de belofte wordt gedaan — en mag niet naar een andere pagina
// verhuizen. Zie src/teksten.js.
function renderPrivacyBlok(el) {
  // Eén <p> per alinea (art. 12 lid 1 AVG: beknopt en begrijpelijk). De tekst
  // zelf is onveranderd; alleen de opmaak is anders dan het blok van tien
  // zinnen dat het was.
  const alineas = PRIVACY_UITKLAP_ALINEAS.map((a) => `<p class="privacy-volledig">${esc(a)}</p>`).join("");
  el.innerHTML = `<details class="privacy-uitklap">
    <summary><span class="privacy-regel-tekst">${esc(PRIVACY_REGEL)}</span><span class="privacy-info" aria-hidden="true">ⓘ</span></summary>
    ${alineas}
  </details>`;
}

// ── Vandaag · Opbrengst — twee metingen en één rekenhulp ──────────────
// De tijdwinst stond hier als grootste getal op de pagina, terwijl het het
// enige getal is dat niets aantoont: een aanname die je zelf invoert, maal
// een telling. Een sceptische lezer prikt daar in één zin doorheen en neemt
// dan de rest ook niet meer serieus. Dus staat nu vooraan wat wél gemeten
// is — afgeronde acties en hoeveel daarvan op tijd waren — en volgt de
// schatting als expliciet gemarkeerde rekenhulp.
//
// "Correctievrij" hoort hier bewust NIET bij, hoe goed het cijfer ook staat:
// die meting is intern (DASHBOARD_INTERN=1) en niet elke klant heeft hem.
function renderOpbrengstKpis(el, ctx) {
  const { tijdwinst } = ctx;
  const uren = nlGetal(tijdwinst.uren, 1);
  const actiesGetal = tijdwinst.berekenbaar ? tijdwinst.afgerond : "n.v.t.";
  const actiesLabel = tijdwinst.berekenbaar
    ? `van ${tijdwinst.totaal} acties in de bundel`
    : "Geen Acties-domein aanwezig in deze bundel.";

  // Dezelfde Opvolging-subscore die de Prestaties-tab toont — hier omdat dit
  // een gemeten opbrengst is. Eén berekening, twee plaatsen: nooit een tweede
  // formule voor hetzelfde getal.
  const opvolging = ((ctx.adopt && ctx.adopt.componenten) || []).find(c => c.key === "opvolging")
    || { berekenbaar: false, reden: "Opvolging is in deze bundel niet te berekenen." };
  const opvolgingGetal = opvolging.berekenbaar ? `${Math.round(opvolging.waarde)}%` : "n.v.t.";
  const opvolgingLabel = opvolging.berekenbaar
    ? `${opvolging.klaar} van ${opvolging.verstreken} acties met een verstreken deadline zijn alsnog afgerond`
    : opvolging.reden;

  const tijdwinstGetal = tijdwinst.berekenbaar ? `${uren} uur` : "n.v.t.";
  const som = tijdwinst.berekenbaar
    ? `${tijdwinst.afgerond} × ${tijdwinst.minutenPerActie} min = ${nlGetal(tijdwinst.minuten)} min ≈ ${uren} uur`
    : "Geen Acties-domein aanwezig in deze bundel — er is niets om op te tellen.";

  el.innerHTML = `
    <div class="kpi-tile" data-goto="opbrengst" tabindex="0" role="button"${tijdwinst.berekenbaar ? "" : ' data-nvt="1"'}>
      <div class="kpi-getal">${esc(actiesGetal)}</div>
      <div class="kpi-kop">Acties afgerond</div>
      <div class="kpi-label">${esc(actiesLabel)}</div>
    </div>
    <div class="kpi-tile" data-goto="adoptiescore" tabindex="0" role="button"${opvolging.berekenbaar ? "" : ' data-nvt="1"'}>
      <div class="kpi-getal">${esc(opvolgingGetal)}</div>
      <div class="kpi-kop">Op tijd afgerond</div>
      <div class="kpi-label">${esc(opvolgingLabel)}</div>
    </div>
    <div class="kpi-tile kpi-zacht" data-goto="tijdwinst" tabindex="0" role="button">
      <div class="kpi-getal">${esc(tijdwinstGetal)}</div>
      <div class="kpi-kop">Rekenhulp · geschatte tijdwinst</div>
      <div class="kpi-aanname">schatting op basis van jouw aanname, geen meting</div>
      <div class="kpi-instelling" data-stop-nav="1">
        <label class="minuten-input-label">min/actie
          <input type="number" id="input-minuten" min="1" max="480" step="1" value="${esc(ctx.minutenPerActie)}">
        </label>
      </div>
      <div class="kpi-som">${esc(som)}</div>
    </div>`;
}

// ── Prestaties · tegels ───────────────────────────────────────────────
// De adoptiescore heet hier "Ritme van je team". De berekening verandert
// niet: het is exact dezelfde score, met dezelfde narekenbare herkomst.
function renderPrestatieKpis(el, ctx) {
  const { adopt, sporenTotaal, periodWeeks } = ctx;
  const cv = ctx.correctievrij || { aanwezig: false, reden: "Correctievrij-percentage niet beschikbaar in deze bundel." };
  const cvKpi = correctievrijKpi(cv);

  const ritmeWaarde = adopt.adoptiescore === null ? "n.v.t." : `${adopt.adoptiescore}%`;
  const ritmeLabel = adopt.adoptiescore === null
    ? "Geen enkele subscore is te berekenen in deze bundel"
    : `Gemiddelde van ${adopt.aantalBerekenbaar}/${adopt.aantalComponenten} subscores (ritme · breedte · opvolging)`;

  el.innerHTML = `
    <div class="kpi-tile" data-goto="adoptiescore" tabindex="0" role="button"${adopt.adoptiescore === null ? ' data-nvt="1"' : ""}>
      <div class="kpi-getal">${esc(ritmeWaarde)}</div>
      <div class="kpi-kop">Ritme van je team</div>
      <div class="kpi-label">${esc(ritmeLabel)}</div>
    </div>
    <div class="kpi-tile" data-goto="activiteit" tabindex="0" role="button">
      <div class="kpi-getal">${esc(sporenTotaal)}</div>
      <div class="kpi-kop">Sporen in de periode</div>
      <div class="kpi-label">dagverslagen, lessen, interacties en content — laatste ${periodWeeks} weken</div>
    </div>
    ${ctx.intern ? `<div class="kpi-tile kpi-intern" data-goto="correctievrij" tabindex="0" role="button"${cvKpi.getal === "n.v.t." ? ' data-nvt="1"' : ""}>
      <div class="kpi-getal">${esc(cvKpi.getal)}</div>
      <div class="kpi-kop">Correctievrij (4 wk)</div>
      <div class="kpi-som">${esc(cvKpi.gate)}</div>
      <div class="kpi-label">${esc(cvKpi.label)}</div>
    </div>` : ""}`;
}

// ── Prestaties · "Waar komen deze cijfers vandaan?" ───────────────────
// Alle dataherkomst, bundelinfo en "niet in deze bundel"-waarschuwingen op
// één plek. Uit de tegels weg: daar stond de voetnoot in bijna dezelfde
// weging als het cijfer zelf.
function renderHerkomst(el, ctx) {
  const regels = [];

  if (ctx.bundle.kind === "metrics") {
    const meta = ctx.metricsMeta;
    const gen = meta.gegenereerdOp && !isNaN(meta.gegenereerdOp.getTime()) ? meta.gegenereerdOp.toLocaleString("nl-NL") : "onbekend moment";
    regels.push(`<strong>Bundel:</strong> ${esc(meta.bronLabel)} — kant-en-klaar metricsbestand v${METRICS_VERSION}, gegenereerd op ${esc(gen)}${meta.door ? ` door ${esc(meta.door)}` : ""}, ${esc(meta.domeinenGevonden)} domein(en) met tellingen. De periode ligt vast in dat bestand en is hier niet aanpasbaar.`);
  } else {
    regels.push(`<strong>Bundel:</strong> ${esc(ctx.bundle.sourceLabel)} — live opgehaald uit je werkruimte-instantie, ${esc(Object.keys(ctx.bundle.domains).length)} domein(en) gevonden.`);
  }

  const ontbrekend = RITME_BRONNEN.filter(b => !ctx.activiteit.aanwezigeBronnen.includes(b));
  if (ontbrekend.length) {
    regels.push(`<strong>Niet in deze bundel:</strong> ${ontbrekend.map(esc).join(", ")} — die series tonen daardoor altijd 0, niet omdat er geen activiteit was maar omdat de bron ontbreekt.`);
  }

  const nvt = ctx.adopt.componenten.filter(c => !c.berekenbaar).map(c => `${esc(c.label)}: ${esc(c.reden)}`);
  if (!ctx.tijdwinst.berekenbaar) nvt.push("Acties afgerond en geschatte tijdwinst: geen Acties-domein aanwezig in deze bundel.");
  if (ctx.intern && ctx.correctievrij && !ctx.correctievrij.aanwezig) nvt.push(`Correctievrij: ${esc(ctx.correctievrij.reden || "niet beschikbaar in deze bundel")}`);
  if (nvt.length) regels.push(`<strong>Waarom staat er n.v.t.:</strong><br>${nvt.join("<br>")}`);

  regels.push(`<strong>Ritme van je team</strong> is het ongewogen gemiddelde van drie subscores (ritme · breedte · opvolging), elk 0–100, over de gekozen periode. Ontbreekt de bron voor een subscore, dan telt hij niet mee — nooit als 0.`);
  regels.push(`<strong>Activiteit per week</strong> komt per serie uit het eigen datumveld (Interacties·Datum, Dagverslagen·Dag, Lessen &amp; Inzichten·Datum, Content Kalender·Publicatiedatum). Een week zonder spoor blijft zichtbaar met het label "geen" — het gat is het signaal, geen weggelaten balk.`);
  if (ctx.agentUsage && ctx.agentUsage.bron === "activaties") {
    regels.push(`<strong>Gebruik per agent</strong> telt inzet: elke keer dat een agent in een gesprek aan de slag ging (zijn playbook ophaalde), ook als hij daarna niets wegschreef. Je werkruimte telt dat zelf, per week${ctx.agentUsage.sinds ? `, sinds ${esc(fmtDate(parseDateField(ctx.agentUsage.sinds)))}` : ""}; er gaat geen gesprek of inhoud mee, alleen per agent een aantal. Vervolgstappen binnen hetzelfde werk tellen niet opnieuw.`);
  } else if (ctx.agentUsage && ctx.agentUsage.bron === "teamfeed") {
    regels.push(`<strong>Gebruik per agent</strong> is hier geteld uit de <em>teamfeed</em>: één telling per bericht dat een agent zelf plaatste. Dat is dezelfde bron als de Team-tab, dus beide tabs noemen hetzelfde aantal. De gebruikelijke bron — het veld Agent op je acties en lessen — is in deze bundel nergens gevuld; zonder deze terugval zou hier een ranglijst van nullen staan naast een volle feed.`);
  } else {
    regels.push(`<strong>Gebruik per agent</strong> komt uit Acties (veld Agent, tijdstip via Deadline) en Lessen &amp; Inzichten (veld Agent, veld Datum). "0" betekent geen spoor in deze bundel — niet noodzakelijk "nooit ingezet": een agent die wél draaide maar niets wegschreef, is hiermee niet te onderscheiden van een agent die stilstond.`);
  }
  regels.push(`<strong>Geschatte tijdwinst</strong> is een schatting op basis van jouw eigen aanname, geen meting: afgeronde acties × de minuten-per-actie die je op de Vandaag-tab instelt.`);
  if (!dataTabBeschikbaar(ctx)) {
    regels.push(`<strong>Waarom is er geen Data-tab?</strong> Je werkgegevens zelf staan niet in je werkruimte maar in een ander systeem; je dagstart zet hier de cijfers neer en de openstaande items met een link naar dat systeem, niet de volledige regels. Je Coördinator weet welk systeem dat is.`);
  }
  regels.push(`Dit dashboard kan niet zien welke modules je hebt aangeschaft. Toont een module nergens een spoor, dan kan dat betekenen dat hij niet gebruikt wordt — of dat je hem niet hebt.`);

  // De kanttekeningen staan bovenaan de pagina dichtgeklapt, maar dit is de
  // plek waar iemand ze zoekt die wíl weten waar een getal vandaan komt.
  const veld = (ctx.veldWaarschuwingen || []);
  if (veld.length) {
    regels.push(`<strong>Niet elk veld kon gelezen worden:</strong><br>${veld.map(esc).join("<br>")}`);
  }

  const laatst = leesLaatstGebruikt();
  if (laatst) regels.push(`<strong>Laatst geladen:</strong> ${esc(laatst)}`);

  el.innerHTML = regels.map(r => `<p class="footnote">${r}</p>`).join("");
}

// ── Activiteit per week (gestapelde staafgrafiek) ───────────────────────
function renderActiviteitPanel(el, activiteit, periodWeeks) {
  if (activiteit.geenEnkeleBron) {
    el.innerHTML = `<div class="grijs-blok">
      <div class="grijs-kop">❔ Geen van de brondomeinen aanwezig</div>
      <div class="grijs-tekst">Geen van Dagverslagen, Lessen &amp; Inzichten, Interacties of Content Kalender is aanwezig in deze bundel — er is niets om per week te tonen.</div>
    </div>`;
    return;
  }
  const seriesKeys = ["interacties", "dagverslagen", "lessen_inzichten", "content_kalender"];
  const seriesLabels = seriesKeys.map(k => RITME_SERIE_LABEL[k]);
  const chart = buildStackedBarChart({ buckets: activiteit.buckets, seriesKeys, seriesLabels });
  const ontbrekend = RITME_BRONNEN.filter(b => !activiteit.aanwezigeBronnen.includes(b));
  el.innerHTML = `<div class="chart-scroll">${chart}</div>
    ${ontbrekend.length ? `<p class="footnote warn">Niet in deze bundel: ${ontbrekend.map(esc).join(", ")}.</p>` : ""}
    <a class="detail-link" data-goto="activiteit">Bekijk per week in detail →</a>`;
}

// ── Ritme — drie balken naast elkaar ────────────────────────────────────
function renderAdoptieSubscores(el, adopt) {
  const kolommen = adopt.componenten.map(c => {
    if (!c.berekenbaar) {
      return `<div class="subscore-col">
        <div class="subscore-naam">${esc(c.label)}</div>
        <div class="subscore-bar-track subscore-onbekend"><div class="subscore-bar-stub"></div></div>
        <div class="subscore-waarde subscore-waarde-onbekend">niet te berekenen</div>
        <div class="subscore-reden">${esc(c.reden)}</div>
      </div>`;
    }
    const pct = Math.round(c.waarde);
    return `<div class="subscore-col">
      <div class="subscore-naam">${esc(c.label)}</div>
      <div class="subscore-bar-track"><div class="subscore-bar-fill" style="width:${Math.min(100, pct)}%"></div></div>
      <div class="subscore-waarde">${pct}%</div>
      <div class="subscore-reden">${subscoreDetail(c)}</div>
    </div>`;
  }).join("");

  const berekenbaar = adopt.componenten.filter(c => c.berekenbaar);
  const som = berekenbaar.map(c => Math.round(c.waarde)).join(" + ");
  // De narekenbaarheid blijft bij het cijfer staan — dat is geen herkomst-
  // voetnoot maar de belofte zelf: je moet het met de hand kunnen volgen.
  const rekenregel = berekenbaar.length
    ? `Met de hand na te rekenen: (${som}) / ${berekenbaar.length} = ${adopt.adoptiescore}%.`
    : "Geen van de drie subscores is in deze bundel te berekenen — het ritme blijft daarom leeg (n.v.t.), nooit 0%.";

  el.innerHTML = `<div class="subscore-grid">${kolommen}</div>
    <p class="footnote">${esc(rekenregel)}</p>
    <a class="detail-link" data-goto="adoptiescore">Volledige herkomst per subscore →</a>`;
}

function subscoreDetail(c) {
  if (c.key === "ritme") return esc(`${c.wekenMetSpoor} van ${c.weken} weken met minstens één spoor`);
  if (c.key === "breedte") return esc(`${c.metInhoud} van ${c.totaalDomeinen} domeinen met inhoud`);
  if (c.key === "opvolging") return esc(`${c.klaar} van ${c.verstreken} verlopen acties op tijd afgerond`);
  return "";
}

// ── Vraagt je aandacht — top 5 ───────────────────────────────────────────
function renderAandachtTop5(el, items) {
  if (!items.length) {
    el.innerHTML = `<p class="aandacht-leeg">✅ Niets vraagt vandaag om aandacht in de aangesloten domeinen.</p>
      <p class="footnote">Samenvatting van rood/grijs/oranje uit de andere zones — geen eigen databron.</p>`;
    return;
  }
  const top5 = items.slice(0, 5);
  const lis = top5.map(it => `<li class="${signaalKlasse(it.ernst)}"><span class="signaal-icoon">${SIGNAAL_ICOON[signaalKlasse(it.ernst)]}</span>${aandachtWrap(it, `<div>${esc(it.label)}</div>`)}</li>`).join("");
  const meer = items.length > 5 ? `<a class="detail-link" data-goto="aandacht">+${items.length - 5} meer — bekijk alles →</a>` : `<a class="detail-link" data-goto="aandacht">Bekijk in detail →</a>`;
  el.innerHTML = `<ul class="attention-list">${lis}</ul>${meer}`;
}

// ── Gebruik per agent ─────────────────────────────────────────────────
function renderGebruikPanel(el, agentUsage, ctx) {
  if (agentUsage.status !== "ok") {
    el.innerHTML = `<div class="grijs-blok">
      <div class="grijs-kop">❔ Niet af te leiden</div>
      <div class="grijs-tekst">${esc(agentUsage.reden)}</div>
    </div>
    ${ctx ? agentSuggestiesHtml(ctx) : ""}
    <a class="detail-link" data-goto="gebruik">Meer over gebruik per agent →</a>`;
    return;
  }
  const MAX_TONEN = 10;
  const gebruikt = agentUsage.ranking.filter(a => a.totaal > 0);
  const top = agentUsage.ranking.slice(0, MAX_TONEN);
  const chart = buildHorizontalBarChart({ items: top });
  // Komt de telling uit de teamfeed, dan hóórt dat erbij te staan: anders
  // staat hier een ander getal dan op de Team-tab zonder dat iemand kan zien
  // waarom (zie kiesAgentGebruik in zones.js).
  const sinds = agentUsage.sinds ? fmtDate(parseDateField(agentUsage.sinds)) : null;
  const telling = agentUsage.bron === "activaties"
    ? `${gebruikt.length} van ${agentUsage.ranking.length} agents is minstens één keer ingezet${sinds ? ` sinds ${esc(sinds)}` : ""}. Geteld als inzet: elke keer dat een agent aan de slag ging, ook zonder iets weg te schrijven.`
    : `${gebruikt.length} van ${agentUsage.ranking.length} agents heeft minstens één spoor in de bundel.` + (agentUsage.bron === "teamfeed"
      ? ` Geteld uit de teamfeed — berichten van je agents — omdat je acties en lessen in deze bundel geen agentnaam dragen.`
      : ` Geteld uit Acties en Lessen &amp; Inzichten.`);
  el.innerHTML = `<div class="chart-scroll chart-scroll-smal">${chart}</div>
    <p class="footnote">${telling}</p>
    ${ctx ? agentSuggestiesHtml(ctx) : ""}
    <a class="detail-link" data-goto="gebruik">Alle ${agentUsage.ranking.length} agents, per module →</a>`;
}

/* i71 — een uitnodiging in plaats van een tekortkoming.
 *
 * De breedte-subscore rekent "domeinen met inhoud ÷ 25": wie vijf agents
 * gebruikt en daar prima mee draait, krijgt daar een laag cijfer voor. De
 * formule blijft zoals hij is — hij is narekenbaar en vergelijkbaar met
 * eerdere weken, en dat is meer waard dan een prettiger getal. Wat erbij komt
 * is het antwoord op de vraag die de tegel al stelde: welke agent laat ik
 * links liggen? Drie namen zeggen daar meer over dan een percentage.
 *
 * Alleen agents uit modules die de klant écht heeft — een suggestie voor iets
 * dat je niet hebt is een verkooppraatje op de verkeerde plek. Weten we het
 * niet (een daglink, of een licentie buiten de f34-allowlist), dan leiden we
 * het af uit de data zelf: core heeft iedereen, en een module waarin al
 * gewerkt is, heb je aantoonbaar. */
function agentSuggesties(ctx, max = 3) {
  const gezien = new Set();
  const modulesMetSpoor = new Set(["core"]);
  const usage = ctx && ctx.agentUsage;
  const perSlug = {};
  for (const a of ((ctx && ctx.schema && ctx.schema.agents) || [])) perSlug[a.slug] = a;
  if (usage && usage.status === "ok" && Array.isArray(usage.ranking)) {
    for (const r of usage.ranking) {
      if (!((r.totaal || 0) > 0 || (r.value || 0) > 0)) continue;
      gezien.add(r.slug);
      const agent = perSlug[r.slug];
      if (agent && agent.module) modulesMetSpoor.add(agent.module);
    }
  }
  const bekend = typeof actieveModuleKeys === "function" ? actieveModuleKeys() : null;
  const modules = bekend || [...modulesMetSpoor];
  return ((ctx && ctx.schema && ctx.schema.agents) || [])
    // Cross-cutting rollen (Coördinator, Quality Control, Gids) doen altijd
    // mee zonder dat ze zelf een rij wegschrijven. Ze hier voorstellen als
    // "nog niet ingezet" is bijna altijd onwaar — en het is precies de
    // blinde vlek die i68 structureel oplost.
    .filter(a => a.rol !== "cross-cutting")
    .filter(a => !gezien.has(a.slug))
    .filter(a => modules.indexOf(a.module) !== -1)
    .filter(a => a.description)
    .slice(0, max);
}

// Eerste zin van de menukaart-tekst: genoeg om te kiezen, kort genoeg om te
// lezen. De volledige tekst staat op de agentpagina achter de doorklik.
function eersteZin(tekst) {
  const t = String(tekst || "").trim();
  const punt = t.indexOf(". ");
  return punt === -1 ? t : t.slice(0, punt + 1);
}

function agentSuggestiesHtml(ctx) {
  const suggesties = agentSuggesties(ctx);
  if (!suggesties.length) return "";
  return `<div class="suggesties">
    <p class="suggesties-kop">Nog niet ingezet</p>
    <ul class="suggesties-lijst">${suggesties.map(a =>
      `<li><a href="#/detail/agent/${esc(a.slug)}"><span class="suggestie-naam">${esc(a.emoji)} ${esc(a.displayName)}</span>
        <span class="suggestie-waarvoor">${esc(eersteZin(a.description))}</span></a></li>`
    ).join("")}</ul>
  </div>`;
}
